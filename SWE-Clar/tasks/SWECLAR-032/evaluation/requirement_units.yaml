- ru_id: RU-003
  name: Centre staff PIN and role access
  content: Centre login accepts only a known user assigned to the selected centre with a matching PIN.
    Return a nonempty unpredictable session token and safe user/centre/role data. Store salted PIN verifiers,
    not plaintext PINs, and derive authorization from the server session rather than caller role or centre
    claims. Invalid credentials/centre combinations create no usable session.
  requirement_category: refinement
  source_visibility: visible
