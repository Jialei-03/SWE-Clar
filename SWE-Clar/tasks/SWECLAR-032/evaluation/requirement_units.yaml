- ru_id: RU-005
  name: Parent daily view and retained chat
  content: A parent view requires a linked child in the selected centre. Chat messages may be exchanged
    only with a known recipient connected to the sender’s current centre; derive the sender from the session.
    Deduplicate matching message IDs, reject conflicts, and expose stored chat only to sender/recipient.
    Unknown or unrelated children/users are denied without writing data.
  requirement_category: refinement
