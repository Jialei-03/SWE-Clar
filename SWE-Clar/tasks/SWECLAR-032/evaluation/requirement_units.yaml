- ru_id: RU-004
  name: Scoped operational modules
  content: Staff may create and list supported operational module records only in their signed-in centre;
    admins may access all centres. Parents cannot create operational rows and see only their linked-child
    daily_chart/curriculum records in the selected centre. Render actual records in the React portal and
    preserve access restrictions in direct API calls, filters and reloaded pages.
