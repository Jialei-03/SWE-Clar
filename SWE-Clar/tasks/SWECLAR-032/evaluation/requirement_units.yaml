requirement_units:
- ru_id: RU-001
  name: Portal workflow entry point
  content: Complete the supplied React/Express/MongoDB component. Preserve input objects and existing
    records, authenticate protected APIs from server sessions, and persist real records across restart.
    Private PIN/verifier/session material and server/bootstrap/database files must not be served as portal
    records. The README defines the independently reconstructed operational schema.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for portal workflow entry point.
  test_interface:
    type: api
    entry:
      language: javascript
      file: server.cjs
    inputs:
      protocol: See raw/starter_code/README.md
    output:
      type: dict
      meaning: Actual HTTP responses, MongoDB persistence and rendered portal behavior
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/test_solution.py
  notes: Independent React/Express/MongoDB operational-record component with synthetic identities and
    linked children. No original WordPress source, plugin dumps, personal records, names or private credentials
    are distributed; normalized schema is disclosed as a benchmark choice.
- ru_id: RU-002
  name: Idempotent legacy migration
  content: Migrate valid normalized legacy operational rows in a real MongoDB transaction, retaining legacy
    IDs, record types, centre ownership, child IDs, relationship IDs and data. Relationships must refer
    to existing or same-batch records/children of that centre. Skip identical replayed records; reject
    conflicting or duplicate batch IDs, invalid fields, unknown/cross-centre relationships and orphan
    children atomically without losing earlier records. Migrated operational rows appear in their actual
    module views.
  requirement_category: core
  source_visibility: visible
