requirement_units:
- ru_id: RU-001
  name: Presave workflow entry point
  content: Complete the supplied Python project and MusicClient to perform actual authorization and library
    HTTP calls. Preserve the existing artist/release/campaign workflow, do not mutate state/action inputs,
    and never include raw access tokens or client secrets in returned JSON. Error codes are nonempty strings;
    no exact wording is required. Additional result metadata is allowed. On business failure preserve
    all six business collections. Inputs are credential-free state and workflow actions; authorization
    grants and client configuration must not be copied into returned state. Work is one in-process client
    session; refreshing or durable credential storage is outside scope.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for presave workflow entry point.
  test_interface:
    type: function
    entry:
      language: python
      file: solution.py
      function: process_presave_action
      signature: process_presave_action(state, action, service=None) -> dict
    inputs:
      state: Artist/release/campaign/listener/presave state without raw credentials
      action: Workflow action, with authorization_code for listener authorization
      service: MusicClient configured for the synthetic local provider
    output:
      type: dict
      meaning: New state plus actual token/profile/library HTTP operations, without raw access tokens
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/test_solution.py
  notes: Benchmark-owned local provider protocol. No claim of live service compatibility, approval or
    production deployment.
- ru_id: RU-002
  name: Artist and release management
  content: 'Create unique artist accounts and unreleased tracks owned by an existing artist. Release timestamps
    and the supplied current time must be finite numeric values, not booleans; release_at must be in the
    future. Require a spotify:track: URI with a 22-character alphanumeric track ID. The default now is
    0 if omitted. Trim IDs and URI strings. Do not otherwise coerce invalid timestamps. Boolean, NaN and
    infinity are invalid.'
