- ru_id: RU-005
  name: Release fulfillment
  content: At or after release_at, perform an authenticated PUT /me/library?uris=<encoded track URI> for
    every authorized consenting unfulfilled listener, and mark fulfilled/library state only after HTTP
    200. Keep failed listeners unfulfilled and report failed IDs so a later call can retry; isolate each
    listener failure. Successful repeats must skip already fulfilled tracks. Recheck consent and required
    scope at fulfillment time. Return fulfilled, skipped, failed and track fields. now must be finite
    numeric, not boolean. Unknown campaign or invalid time returns an error. At exact release_at fulfillment
    is allowed. Result listener arrays have no required order; each eligible listener occurs once. Skipped
    includes already fulfilled or currently nonconsenting/missing-scope listeners; failed includes attempted
    saves without HTTP 200 acknowledgement. A missing service credential counts as failed. Libraries contain
    each successfully saved URI at most once.
  requirement_category: refinement
