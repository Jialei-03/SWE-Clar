- ru_id: RU-003
  name: Listener authorization and consent
  content: Authorize a listener only after a successful authorization-code token exchange and authenticated
    profile lookup. Read user-library-modify from the provider grant; a caller-supplied scopes flag is
    insufficient. Exchange with grant_type=authorization_code, code and configured redirect_uri using
    HTTP Basic client authentication. Reject missing scope or failed authorization without adding a listener.
    A presave also requires explicit campaign consent. Store provider_user_id and scopes for successful
    listeners, with credentials only in the service object. An unknown listener cannot presave; consent
    must be boolean true, not truthy data. Token or profile failure must not create or overwrite listener
    business state.
  requirement_category: refinement
