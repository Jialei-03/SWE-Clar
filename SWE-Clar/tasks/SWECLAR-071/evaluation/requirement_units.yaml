- ru_id: RU-005
  name: Conflict-safe reservations and order administration
  content: reserve requires unique nonempty reservation_id, nonempty slot and positive integer party_size
    excluding booleans. One reservation occupies a slot exclusively; conflicts or invalid input reject
    atomically. Store reservation slot and party_size. advance_order requires actor_id in the trusted
    state.admins list, known order and exactly one forward transition in pending,accepted,preparing,ready,completed.
    Same-state retries may be successful no-ops or reject; backward/skipped transitions reject. Supplied
    actor IDs are trusted upstream context, not a network identity implementation.
  requirement_category: refinement
