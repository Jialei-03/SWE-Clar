- ru_id: RU-004
  name: Coupon and coin-point accounting
  content: The chosen coupon percentage is applied once per order when pricing; it is not reapplied during
    payment. Points are not consumed until mark_paid(order_id,payment_event_id). Before first payment
    ensure current customer balance still covers the order's redeemed_points, then atomically subtract
    them and add floor(order.total) points once; set paid=true, keeping fulfillment status separate. A
    nonempty payment_event_id can belong to only one order. Same-event/same-order replay succeeds without
    changes to orders/customers/payment bookkeeping; changed response metadata is allowed. Same event
    on another order or new event on an already paid order rejects. Keep enough internal association to
    detect conflicts; its format is free. Payment is supplied synthetic event ingestion, not real settlement
    or POS integration.
  requirement_category: refinement
