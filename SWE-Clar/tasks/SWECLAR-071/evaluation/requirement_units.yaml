- ru_id: RU-001
  name: Pizzeria workflow entry point
  content: 'process_pizzeria_action(state,action) returns the entire new chainable state at top level,
    with result for the action summary, without mutating inputs. Invalid/unknown operations return nonempty
    error.code and preserve business collections. Preserve supplied SQLite init/show/act interface: successful
    state survives separate processes; init cannot overwrite existing state; rejected actions leave stored
    business state intact. Extra metadata and alternate error wording are allowed. This is a local transactional
    backend component, not a complete site, external payment service or POS system.'
  requirement_category: core
  source_visibility: visible
