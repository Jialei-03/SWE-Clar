- ru_id: RU-003
  name: Validated preorder, pickup, and delivery checkout
  content: checkout requires known customer, existing nonempty top-level cart and unique nonempty order_id.
    Revalidate current active products/quantities and recompute prices. Accept pickup,preorder,delivery;
    delivery needs known zone with enabled=true and subtotal>=nonnegative minimum, tested before discounts.
    If coupon_code is provided it must identify active=true coupon with finite percent in [0,100]. redeem_points
    defaults0 and must be a nonnegative integer within customer's balance. Total=max(0,subtotal*(1-percent/100)-redeem_points/100),
    rounded to two decimals with half-up ties. Store an order exposing customer_id,mode,subtotal,total,coupon_code,redeemed_points,status=pending,paid=false
    and return result.order_id. No scheduling/dispatch or external charge is claimed.
