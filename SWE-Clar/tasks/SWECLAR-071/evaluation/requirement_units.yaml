- ru_id: RU-002
  name: Bilingual catalogue and deterministic cart
  content: products maps product IDs to names.de/names.en, price and active. Active products need nonempty
    German and English strings and finite nonnegative numeric price (not boolean). catalog accepts de/en
    and returns active product_id,name,price rows in any order, selected names; invalid active definitions
    or unsupported language reject. set_cart requires an existing customer and items list of product_id
    plus positive integer quantity (not boolean), using only valid active products. Combine repeated product
    IDs or preserve equivalent lines; recompute subtotal from configured prices, ignoring supplied prices/totals/discounts.
    Store items and subtotal at carts[customer_id] and return result.subtotal. An empty cart can clear
    items but cannot checkout.
  requirement_category: core
