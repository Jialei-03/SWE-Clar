- ru_id: RU-004
  name: Matching and chat access
  content: express_interest requires two distinct existing users and records directed interest at most
    once. A match becomes active only after reciprocal interest and only when neither has blocked the
    other. Repeated interest cannot create duplicate active matches. Internal match keys are free; match
    records expose users (the pair of IDs) and active. send_message requires two distinct existing users
    in an active unblocked match and nonempty string text. Append exactly one message with sender_id,recipient_id,text.
    Otherwise reject without appending. list_matches(user_id) returns result.matches containing only that
    user's active unblocked match records, preserving the users/active fields. Existing users can use
    these commands; only profile editing specifically requires verified=true. Supplied IDs represent trusted
    upstream actors, not a network authentication implementation.
  requirement_category: refinement
