- ru_id: RU-005
  name: Blocking and reporting
  content: block requires distinct existing user_id/target_id, is repeat-safe, prevents interest from
    creating a new match in either direction, deactivates/removes any mutual match and disallows chat
    and list_matches visibility in both directions. Other pairs remain unaffected. report requires distinct
    existing users and nonempty string reason; append one audit record to reports and one corresponding
    admin_alerts record containing reporter_id,target_id,reason. Blocking does not prevent reporting.
    Both records and all returned public data must exclude stored phone/OTP credentials. Alerts are internal
    records, not external delivery.
  requirement_category: refinement
