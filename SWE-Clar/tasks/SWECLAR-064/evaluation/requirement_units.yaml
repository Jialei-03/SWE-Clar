- ru_id: RU-003
  name: Approved-organizer events
  content: Only a known user whose approved_organizer is boolean true can create a unique nonempty event_id.
    Capacity contains nonnegative integer lead/follow limits, excluding booleans. Event records store
    organizer_id, capacity, attendees and waitlist arrays; entries have user_id and role. Existing users
    may register once per event as lead/follow; available capacity confirms, otherwise waitlists. Duplicate
    registration may reject or return the unchanged existing registration. registration_status is confirmed
    or waitlisted. Only that event's still-approved organizer may override an existing attendee/waitlisted
    role. A confirmed attendee can move only if destination capacity (excluding self) allows; otherwise
    reject atomically. An overridden waitlisted entry moves to attendees if the requested role has space,
    otherwise remains waitlisted with its updated role. No automatic waitlist promotion is required when
    another entry moves; use explicit override. Capacity can never be exceeded.
  requirement_category: refinement
