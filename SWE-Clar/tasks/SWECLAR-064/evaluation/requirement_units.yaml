requirement_units:
- ru_id: RU-001
  name: MVP domain entry point
  content: process_matchmaker_command(state,command) returns a new JSON-compatible state without mutating
    inputs. No returned user record, result, message, report or alert may expose stored phone or OTP credentials.
    The supplied SQLite CLI keeps local synthetic credentials separately, exposes a sanitized state, and
    injects credentials for command processing. Preserve init/show/act persistence and atomic rejection.
    Unknown/malformed commands reject with a nonempty error.code and leave existing business state intact,
    except required credential stripping from returned snapshots. Extra metadata, alternate error wording
    and internal key choices are allowed.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for mvp domain entry point.
  test_interface:
    type: function
    entry:
      language: python
      file: solution.py
      function: process_matchmaker_command
      signature: process_matchmaker_command(state,command) -> dict
    inputs:
      state: Synthetic local records
      command: Public command schema in README
    output:
      type: dict
      meaning: New sanitized state and result/error; actual CLI persistence
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/test_solution.py
  notes: Bounded backend component, no external SMS/Firebase/full dating application. Mutual-interest-only
    matching and exact waitlist transitions are reconstruction choices.
- ru_id: RU-002
  name: Phone authentication and profiles
  content: verify_otp requires an existing user and a nonempty string OTP exactly matching that user's
    supplied local otp; set verified=true and result.verified=true. A missing/incorrect code rejects without
    changing verification state. Only a verified user may update_profile. Store dance_style, skill_level
    and preferred_role as profile fields and return result.profile; the first two are nonempty strings
    and preferred_role is lead or follow. Do not allow additional command fields to overwrite identity,
    phone, OTP, approval or verified status. Phone/OTP values are private local authentication fixtures,
    never public profile fields or emitted delivery records. This module does not send SMS.
  requirement_category: core
