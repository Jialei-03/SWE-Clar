requirement_units:
- ru_id: RU-001
  name: Community and street context
  content: In the actual inspection form, choosing a community updates the street dropdown to exactly
    that community’s streets. Creation is allowed only for a street belonging to the selected community,
    and the server must independently reject mismatched addresses. Provide the supplied PHP web interface
    and JSON API with authenticated access-code roles.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Describe the required behavior for community and street context.
  test_interface:
    type: command
    entry:
      language: PHP and JavaScript
      file: router.php
      command: php -S 127.0.0.1:8000 -t web router.php
    inputs:
      transport: Authenticated HTTP JSON and actual browser form
      contract: README.md
    output:
      type: inspection_records
      meaning: Community and street context
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/inspection_contract.py
  notes: Independent inspection-record component. Private source supports community/street selection,
    inspection creation and accidental deletion; exact roles, status policies, JSON errors and summary
    reports are retained benchmark conventions. Original documents, screenshots and source identifiers
    excluded.
- ru_id: RU-002
  name: Inspection creation
  content: A valid create command from admin or inspector writes one open inspection with a unique supplied
    nonempty string ID, residence, community and street into SQLite. The browser displays the new record
    after submission. Preserve records across service restart and prevent duplicate insertion, including
    competing requests. Caller objects and supplied fixture files remain unchanged.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
