- ru_id: RU-003
  name: Accidental inspection deletion
  content: Only an authenticated admin may delete an open inspection entered by mistake; action-supplied
    role is ignored. Inspectors and office users cannot delete. Closed inspections cannot be deleted by
    any role. Preserve all other records. Successful deletion must change the actual database and browser
    listing.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
