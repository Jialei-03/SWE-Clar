- ru_id: RU-005
  name: Atomic command failures
  content: Reject duplicate IDs, empty/whitespace ID or residence, unknown community, street/community
    mismatch, missing inspections, unauthorized commands and invalid authentication with structured error
    codes and no partial database changes. Unknown commands return unknown_command. Authentication failures
    return HTTP 401; operation errors return error.code. The API must not return configured access codes
    or trust a caller-supplied role.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
