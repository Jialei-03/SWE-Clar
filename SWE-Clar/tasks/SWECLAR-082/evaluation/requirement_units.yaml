- ru_id: RU-004
  name: Post-class transcript and understanding history
  content: transcribe requires the owning teacher, a started class, unique segment_id, nonnegative elapsed
    and a valid 16 kHz mono 16-bit PCM WAV segment of at most 30 seconds. Reject silent/missing/malformed/outside-root
    audio without changing state. Run actual speech recognition and append recognized text with timestamp
    and audio SHA256; exact segment replay is deduplicated and conflicting ID/audio/timestamp reuse is
    rejected. After completion, students and teacher retain transcript/questions; each student sees only
    their own questions, the teacher sees all class students/questions. The understanding rate uses each
    student’s latest up/down feedback. Transcribe permits running or paused class; exact stored replay
    after completion also permitted. Compare audio SHA256 and elapsed for segment ID. Store id,text,timestamp,audio_sha256
    and return text,duplicate. Replay must not run recognition again. Nonnegative elapsed integer excludes
    bool. Audio validator requires PCM16 mono16kHz,1..480000 frames with peak sample magnitude>=20; paths
    cannot escape root, including symlinks. feedback from joined students accepts up/down, overwrites
    their prior vote; understanding_rate is up votes / students who voted, or0 when empty. post_class_view
    allowed in any status for owning teacher/joined students, exposes transcript,questions,notes,documents
    and rate; teacher additionally students; student sees own questions only. No original recording or
    child data is used.
