- ru_id: RU-003
  name: Pause-aware timer and question-click timestamp
  content: A created class is stopped at zero elapsed. start from created and resume from paused begin
    an interval at the supplied nonnegative integer clock. pause/complete add only max(0,clock-last_clock)
    while running and stop the interval; completed classes cannot restart. question_click records a joined
    student’s nonnegative clicked elapsed under a unique question ID; later question_submit updates text
    only and must preserve that original timestamp, even if another elapsed value is supplied. clocks
    and clicked elapsed are nonnegative integers excluding bool. pause requires running, resume requires
    paused, start requires created; complete accepts running or paused. Only owning teacher controls them.
    Clock regression contributes zero elapsed; it does not subtract time. question_click requires running
    class, joined student, unique nonempty class-wide question_id; stores id,student_id,timestamp,text(empty).
    Submit requires that question's student and nonblank text, running or paused class. Submit changes
    only text, not timestamp. Completed class disallows new questions.
  requirement_category: refinement
