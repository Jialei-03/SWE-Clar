- ru_id: RU-005
  name: Class-bound materials and translation reuse
  content: Teacher notes and document references remain tied to their class and visible in joined-student/teacher
    views; unrelated users cannot view or add them. translate(text,language) for a class member must POST
    actual text/language to the configured TranslationClient provider and validate matching source_text/language
    in its translated_text response. Cache by exact source text and language; replays reuse the cache
    without another request. Failed or mismatched translations leave no cache entry. The caller’s translated_text
    field is not a provider response. add_material permits owning teacher with kind note/document, unique
    nonempty material_id per kind, nonblank content; entries id/content. Document content is a local reference
    string, not fetched. translate requires nonblank text/language from class member; POST JSON {text,language}
    to configured local provider, accept only 2xx JSON with matching source_text/language and nonblank
    translated_text. Cache exact text+language globally in internal translations (key format free); cache
    result text/cache_hit. Provider error/mismatch cannot change cache. Translation HTTP and CLI/service
    workers run as ordinary user. No external provider credentials or requests.
  requirement_category: refinement
