requirement_units:
- ru_id: RU-001
  name: Classroom workflow entry point
  content: Complete the supplied Python audio/session service and adapters. process_class_action returns
    a new state without mutating inputs. cli.py reads an action, persists successful state changes atomically
    and returns only its result/error. transcribe reads actual PCM WAV bytes through LocalWhisper; caller-supplied
    transcript text is ignored. Audio is isolated under the configured asset root and processed locally
    with whisper.cpp 1.7.6 and tiny.en. Preserve SQLite CLI --db PATH --assets DIR init/show/act. init
    accepts initial state once, show is trusted operator inspection, act emits only result/error and persists
    successes across processes atomically. Invalid/unknown actions return nonempty error.code preserving
    all business state. Extra metadata and alternate error wording are accepted. Prepared dependencies
    and synthetic English audio reside under /opt/sweclar; no runtime downloads.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for classroom workflow entry point.
  test_interface:
    type: function
    entry:
      language: python
      file: solution.py
      function: process_class_action
      signature: process_class_action(state,action,transcriber=None,translator=None) -> dict
    inputs:
      state: Private session state with users/classes/translations
      action: Supported action with trusted actor_id
      transcriber: LocalWhisper(binary,model,asset_root)
      translator: TranslationClient(url)
    output:
      type: dict
      meaning: Next session state backed by actual audio transcription or translation I/O where required.
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/test_solution.py
  notes: The source requests voice-to-text classroom feedback. Local English Whisper inference, synthetic
    audio, trusted CLI actor identity and normalized translation HTTP contract are reconstruction choices.
    No source classroom recordings, names, document contents or cloud credentials are distributed.
- ru_id: RU-002
  name: Unambiguous case-insensitive class join
  content: A class code contains ASCII letters only, is unique case-insensitively, and joins ignore letter
    case. A known teacher creates the class, a known student joins it once, and only that class teacher
    controls its timer. Roles come from state.users and actor_id is a trusted application identity. Unknown
    identities and other class teachers are denied. create_class requires unique nonempty class_id and
    nonempty ASCII-letter code; store uppercase code, teacher_id, students=[], status=created, elapsed=0,last_clock=None,
    questions=[],transcript=[],feedback={},notes=[],documents=[]. Return class_id/code. join returns class_id
    and adds student once. IDs come from trusted state.users; this local component is not a public authentication
    endpoint.
  requirement_category: core
