- ru_id: RU-003
  name: Promotion ownership, schedule and eligible audience
  content: 'Only owning merchant creates/cancels a shop promotion. branch_ids must contain1..20distinct
    existing branches of the chosen shop; unknown/foreign branch404, empty/duplicate/malformed400. due_at/expires_at
    are integers0..2000000000 with due_at<expires_at; invalid400. Past due times are allowed. Store schedule
    and normalized title/body with no immediate messages. Preferences start empty (opt-in required), category
    and mall arrays both matter. Cancel sets status cancelled and retains existing messages; no refunds
    or point effects.


    At dispatch time now, candidate promotion is scheduled and due_at<=now<expires_at. Consumer must be
    active, include shop.category in categories and include at least one selected currently participating
    branch''s mall_id in mall_ids. No demographics or real geolocation are involved. Eligible branch IDs
    in the delivered message are only matching participating branches, preserving promotion branch order;
    duplicate malls do not duplicate consumer messages. Inactive/nonparticipating branches never count.
    If no matching branch remains, no delivery. Messages copy title/body/shop/eligible branches at delivery
    time and retain that content thereafter. Merchant sees only own promotion aggregate delivered_count
    and no consumer identities. Administrator dispatch does not depend on any merchant browser being open.
    Preference updates apply to subsequent delivery, not retroactive message deletion.'
