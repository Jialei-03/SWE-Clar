- ru_id: RU-005
  name: Receipt uniqueness, review and points ledger
  content: 'Consumer request_id is scoped to that consumer and operation receipt. Validate syntax and
    owned image/branch lookup, then replay: same key and same normalized submitted payload returns200
    original Receipt even after review or branch participation changes; altered payload409 request_conflict.
    Request keys are durable and not consumed by invalid attempts. For a new request, branch must currently
    participate. Active receipt uniqueness is (branch_id,trimmed receipt_number,date) across all consumers
    for pending/approved statuses, not just image hash or receipt number. A collision gives409 duplicate_receipt
    without revealing owner. Rejected receipts release this key, allowing a new request_id to submit corrected
    data; old request_id still replays its rejected record. Same number with different date or branch
    is distinct. Concurrency reserves the unique key atomically.


    Only administrator reviews. Pending→approved requires branch still participating, otherwise422 not_participating
    with no changes. Points are floor(amount_cents/250) per receipt, using exact nonnegative integers;
    even zero-point approval records one ledger entry. Pending→rejected credits nothing and releases uniqueness.
    Approved/rejected review replay with identical decision returns200 same record without another ledger
    entry. Opposite decision after final review409 review_conflict. Approved rows cannot later be rejected
    or clawed back in this task. Review records actual authenticated administrator and does not trust
    supplied points/operator/status. Receipt status, awarded points, wallet balance and one ledger credit
    commit atomically and survive restart. Duplicate/concurrent approval creates exactly one credit. Rejected
    images remain visible to owning consumer/admin as part of retained audit record.'
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
