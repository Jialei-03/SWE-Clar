- ru_id: RU-004
  name: Per-consumer cooldown, scheduling order and idempotency
  content: 'For each consumer, deliver at most one new promotion message during a dispatch. Across dispatches,
    minimum interval is120seconds since that consumer''s latest message, across all merchants/categories;
    equality120 is allowed. Consider due eligible promotions by ascending due_at then original creation
    order (IDs are not tie-breakers). Skip promotions already delivered to that consumer, cancelled, expired
    or currently ineligible. Pick first remaining promotion if cooldown allows. Others remain scheduled
    for potential later dispatch until expiry; no auto-cancellation after another promotion wins.


    Lifetime uniqueness is (consumer,promotion), so preference changes, retry, restart or reactivation
    never resend the same promotion. Only actual new messages advance cooldown and delivered_count. Suppressed/expired/cancelled/no-audience
    candidates do not change either. Repeat dispatch at unchanged clock yields zero if no new eligible
    consumer can receive. Store message, per-consumer last delivery and promotion count atomically. Concurrent
    dispatches/cancels obey transactional ordering; cannot duplicate or exceed cooldown. Return new total
    across consumers for this call. Inbox reads real stored messages in delivery order; no state field
    alone certifies notification delivery.'
