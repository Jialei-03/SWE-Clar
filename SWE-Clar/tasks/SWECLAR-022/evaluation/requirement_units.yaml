- ru_id: RU-006
  name: Reward reservation and atomic debit
  content: 'Consumers redeem a known reward by own request_id, scoped to redemption separately from receipt
    keys. Validate IDs; existing key/same reward returns200 original reservation without checking current
    balance/stock, even if stock now0; changed reward409 request_conflict. For new request unknown reward404.
    Check current stock first: zero409 out_of_stock; otherwise insufficient balance409 insufficient_points.
    Failed requests consume no key, points or stock. Success atomically deducts current reward.cost, decreases
    shared stock by1, creates reserved Redemption with copied cost, and appends one negative ledger delta/balance.
    First success201. No actual external payment or fulfillment is implied.


    Balance equals the sum of all ledger deltas; consumers cannot read another wallet or force owner/cost/status
    with extra fields. Ledger order is commit order, with exact historical post-entry balance. Concurrent
    requests, including different consumers competing for final stock, cannot overspend or over-reserve.
    Matching retries retain original ID/cost/status and make no extra debit. Wallet and redemption lists
    persist across restart. Actual browser workflow must show approved receipt credit, successful redemption,
    reduced reward stock/balance and the stored reservation after refresh/login; errors display without
    false balance changes. Lost-response retry uses the explicit same request key and reconciles the committed
    result.'
