requirement_units:
- ru_id: RU-001
  name: Deterministic directory planning API
  content: Provide plan_directory_update(records, changed_ids, query=None, immediate_ids=None) in directory_planner.py.
    Offline deterministic return includes pages,suggestions,cache_queue; extra metadata allowed. Do not
    mutate inputs. Records list requires unique nonempty string id, business_name,country_code,state_name,state_code,main_city;
    other_cities/services lists of nonempty strings; sponsored boolean. Empty records/lists allowed. changed_ids
    and immediate_ids are lists of known IDs (duplicates allowed); immediate_ids defaults empty; query
    string or None. Invalid input raises ValueError without partial result. Preserve supplied CLI reading
    one JSON request from stdin and returning JSON output; --offset>=0 and --limit>=1 paginate only pages,
    return total_pages and retain complete suggestions/cache_queue. CLI pagination is local viewing, not
    publication.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Describe the public function, required record fields, validation rules, and top-level
    result fields.
  matching_keywords: []
  test_interface:
    type: function
    entry:
      language: python
      file: directory_planner.py
      function: plan_directory_update
    inputs:
      request: records,changed_ids,query,immediate_ids
    output:
      type: dict
      meaning: Offline page content/search/cache plan
    operations: []
  evaluation: executable
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/test_solution.py
  pass_rule: all_tests_pass
  notes: null
- ru_id: RU-002
  name: Aggregate state, city, and service pages
  content: Generate state, state_service, city, city_service and one business page per record. Include
    main and all other cities and every service; deduplicate normalized repeats and business membership.
    Each page exposes route,kind,label,business_ids. Labels are state+' Movers', state+' '+service+' Movers',
    city+' '+state_code+' Movers', city+' '+state_code+' '+service+' Movers', or business_name. For equivalent
    normalized labels choose lexicographically smallest trimmed label. Membership sorts sponsored first,
    then original ID lexicographically. Pages sort by route. CLI renders html for each returned page containing
    escaped label and each matching business_name in membership order. HTML structure/style is free; actual
    text and safe escaping required. All records and output are synthetic; no full WordPress website required.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain every page kind that must be generated, which cities and services contribute,
    and how business IDs are deduplicated and ordered.
  matching_keywords: []
  test_interface:
    type: function
    entry:
      language: python
      file: directory_planner.py
      function: plan_directory_update
    inputs:
      request: records,changed_ids,query,immediate_ids
    output:
      type: dict
      meaning: Offline page content/search/cache plan
    operations: []
  evaluation: executable
  tests:
  - test_id: RU-002-T01
    file: evaluation/tests/test_solution.py
  pass_rule: all_tests_pass
  notes: null
- ru_id: RU-003
  name: Collision-safe canonical routes
  content: 'Canonical slug: Unicode NFKD, remove non-ASCII characters, lowercase, replace each run outside
    a-z0-9 with one hyphen, trim hyphens. Components that become empty reject. State routes /{state-name}-movers
    and /{state-name}-{service}-movers; city routes /{city}-{state-code}-movers and /{city}-{state-code}-{service}-movers;
    business /business/{business-name}-{id}. Same named cities in distinct state codes remain distinct.
    Reject route collisions between distinct semantic keys rather than silently merging. Semantic keys
    include kind,country_code,state_name,state_code,city/service as relevant (all normalized), business
    key original ID; supported data has consistent country/state associations. No inferred disambiguation
    suffixes.'
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: State the exact canonical route shape for every page kind and explain how same-named
    cities remain distinct.
  matching_keywords: []
  test_interface:
