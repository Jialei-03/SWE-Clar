  pass_rule: all_tests_pass
  notes: null
- ru_id: RU-004
  name: Ranked search suggestions
  content: Search generated page labels, including business pages. Normalize query/label by the same ASCII
    token normalization as slugs, with spaces replacing hyphens. None/empty normalized query gives no
    suggestions. Exact match score300, prefix200, substring100, otherwise excluded. Return unique targets
    (page routes), fields target,kind,label,score, sort descending score then ascending target, cap10.
    These exact scores/cap are synthetic conventions; other metadata allowed.
  requirement_category: core
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
