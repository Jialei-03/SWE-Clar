- ru_id: RU-006
  name: Immediate sponsorship cache priority
  content: 'immediate_ids independently contributes affected routes even absent from changed_ids. Every
    route contributed by an immediate ID has mode immediate; other changed-ID routes mode nightly. Immediate
    wins for shared routes. Queue sorts by route. Sponsorship flag controls page membership ordering,
    not automatic queue priority: caller supplies immediate_ids for the synthetic urgent trigger. No external
    CDN deployment.'
  requirement_category: refinement
  source_visibility: hidden
