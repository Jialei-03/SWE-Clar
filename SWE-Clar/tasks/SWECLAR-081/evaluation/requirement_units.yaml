- ru_id: RU-005
  name: Targeted cache invalidation
  content: cache_queue includes every generated page contributed by any changed_ids record and excludes
    unrelated routes. Dedupe shared routes. Empty changed and immediate lists give empty queue. Route
    contribution follows current supplied records; deleted records/prior memberships are outside this
    slice. Queue entries expose route and mode; this is a work plan, not external cache execution.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Describe precisely which routes enter the cache queue after records change and which
    routes must stay out.
