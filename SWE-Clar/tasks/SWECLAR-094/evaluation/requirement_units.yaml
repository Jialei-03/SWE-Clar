- ru_id: RU-005
  name: Safe retrieval and idempotency
  content: 'GET /transactions/{id} returns the transaction with active_notes and immutable notes history.
    Use the optional Idempotency-Key header as request_id: replay returns the saved original status/body
    without applying a new operation, including after process restart. Unknown routes return a structured
    HTTP error. Commit each mutation and its saved response atomically. Retrieval HTTP 200 JSON includes
    transaction_id, amount, type, notes (all notes in insertion order, with note_id/text/active), and
    active_notes (only active entries). Missing IDs return a structured 404 error. For syntactically valid
    JSON POST requests with a nonempty Idempotency-Key, cache the first status and JSON body, including
    business errors, globally across POST routes. Replay precedes business validation and preserves the
    saved body even if later payload/path differs. GET ignores this header; malformed JSON is rejected
    by the host without caching. Mutation and response-cache insertion form one SQLite transaction: cache-storage
    failure must leave no partial mutation. Concurrent same-key submissions apply at most once. No external
    financial operation occurs.'
  requirement_category: refinement
  source_visibility: hidden
