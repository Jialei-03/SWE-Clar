- ru_id: RU-001
  name: REST request entry point
  content: Complete the supplied ASP.NET Core project as an actual HTTP service with JSON request/response
    bodies and persistent SQLite storage. Keep /health and startup working; unknown routes return HTTP
    404 with error=route_not_found. Store transaction, note and request-response records so they survive
    process restarts. A Python function returning HTTP-shaped dictionaries is not an implementation of
    this interface. This is a synthetic local API exercise within the source .NET maintenance task, not
    a recovered financial workflow. Use the supplied SQLite transactions, notes and responses tables.
    The host health endpoint and invalid-JSON handling are public foundation regressions.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for rest request entry point.
  test_interface:
    type: api
    entry:
      language: csharp
      file: TransactionsApi.csproj
      command: dotnet run --project TransactionsApi.csproj -- --urls http://127.0.0.1:5080
    inputs:
      transport: Real HTTP JSON
      storage: TRANSACTIONS_DB SQLite path
      configuration: AUTO_REMOVE_NOTE_TYPES comma-separated type tokens
      request_id: Optional Idempotency-Key header
    output:
      type: http
      meaning: Actual status/body plus persistent transactions, notes and response cache
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/test_solution.py
  notes: ASP.NET Core 8, the local SQLite schema and configuration/header interfaces are explicit benchmark
    reconstruction choices. No customer database or code is used.
- ru_id: RU-002
  name: Transaction creation
  content: POST /transactions accepts a unique non-empty transaction ID, a finite numeric amount, and
    a non-empty type; creation returns HTTP 201, while duplicate IDs return HTTP 409 conflict without
    overwriting the original. Required JSON fields are transaction_id, amount and type. IDs and types
    must be strings containing a non-whitespace character; amount must be a finite JSON number (booleans
    and numeric strings are invalid). Invalid input returns a structured HTTP 400 error. Successful JSON
    includes transaction_id, amount, type and empty notes; additional metadata is allowed. Duplicate creation
    must preserve all stored fields. Concurrent creates must produce exactly one successful creation.
  requirement_category: core
