- ru_id: RU-003
  name: Transaction note maintenance
  content: POST /transactions/{id}/notes appends a uniquely identified non-empty note to an existing transaction,
    while unknown transactions and duplicate note IDs fail without partial changes. Required fields are
    note_id and text, both nonblank strings. Return HTTP 201 with note_id, text and boolean active. Unknown
    transaction returns a structured 404 error, invalid note a structured 400 error, duplicate note_id
    within the same transaction a structured 409 error. Reusing a note ID in another transaction is allowed.
    Preserve submission order; reject invalid operations without changing existing data. Extra response
    metadata/error wording is unrestricted.
