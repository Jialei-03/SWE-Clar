- ru_id: RU-004
  name: Configured automatic note removal
  content: When a transaction type is configured for automatic note removal, newly submitted notes are
    retained in audit history but marked inactive and omitted from active_notes. Configuration comes from
    AUTO_REMOVE_NOTE_TYPES, a comma-separated exact type-token list at process startup (not caller state).
    Configured types retain newly added notes with active=false; other types use active=true. Existing
    history and flags survive restart and are not rewritten by later configuration changes.
