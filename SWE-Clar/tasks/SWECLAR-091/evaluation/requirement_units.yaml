- ru_id: RU-005
  name: wxAUI docking and default perspective
  content: Manage the workspace areas with wxAUI across left, top, center, right, and bottom dock positions.
    The project/code/property/message/property- manager workspace panes must be dockable and closeable,
    with maximize controls for the main content panes; the compact command area and toolbars may remain
    fixed where appropriate. Capture a non-empty default perspective after constructing the window and
    provide MainWindowV::reset_default_perspective() to restore the actual wxAUI layout after it has been
    changed.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: How are the workspace areas docked and what must restoring the default perspective do
    after the live layout changes?
  matching_keywords: []
  test_interface:
    type: command
    entry:
      language: cpp
      class: workspace::MainWindowV
      method: void reset_default_perspective()
    inputs:
      mutation: evaluator changes a native wxAUI pane before calling reset
    output:
      type: native_wxaui_state
      meaning: actual pane placement and visibility return to the captured default
    operations: []
  evaluation: executable
  tests:
