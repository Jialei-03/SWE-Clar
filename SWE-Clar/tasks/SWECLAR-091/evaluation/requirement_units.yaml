- ru_id: RU-006
  name: In-session custom perspective save and load
  content: The Windows menu must let the user create a named custom perspective and switch between the
    default startup perspective and saved custom perspectives during the current session. Provide MainWindowV::save_perspective()
    and MainWindowV::load_perspective(const wxString&) so the evaluator can mutate a native wxAUI pane,
    save the actual manager state, alter it again, and verify that loading restores the saved state. Disk
    persistence is not required.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: How does the accepted in-session custom-perspective workflow save and restore the actual
    wxAUI workspace state?
  matching_keywords: []
  test_interface:
    type: command
    entry:
      language: cpp
      class: workspace::MainWindowV
      methods:
      - wxString save_perspective()
      - bool load_perspective(const wxString&)
    inputs:
      layout_mutations: evaluator-owned changes to native wxAUI panes
    output:
      type: native_wxaui_state
      meaning: loading a saved non-empty perspective restores the exact native manager state
    operations: []
  evaluation: executable
  tests:
  - test_id: RU-006-T01
