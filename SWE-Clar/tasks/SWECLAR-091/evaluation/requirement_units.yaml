- ru_id: RU-004
  name: Menu bar and populated toolbars
  content: Add a menu bar and populate the toolbar rather than leaving either as an empty placeholder.
    The accepted first-stage shell uses the top-level menus File, Edit, Verify, Tools, Windows, and Help.
    It has two populated toolbars whose controls are Update, Select, Unselect and Cancel, Lint, Analyze,
    Verify, Auto-Verify. Each toolbar control has non-empty tooltip text sourced from MainWindowG.h.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
