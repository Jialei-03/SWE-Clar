schema_version: 1
task_id: SWECLAR-091
registry_version: swe-clar
registry_status: annotation_complete
disclosure_design: controlled_requirement_disclosure
selected_scope: Independently reconstructed Linux C++11 wxWidgets workspace shell
requirement_units:
- ru_id: RU-001
  name: Reproducible C++11 wxWidgets build
  content: Deliver a C++11 wxWidgets project that CMake builds on Linux into build/workspace_gui. The
    executable must launch a real top-level window under an X11-compatible display and close cleanly in
    --smoke mode. The evaluator links a protected public native observation adapter against the delivered
    MainWindow source; private tests assert the observed native state; candidate build and GUI execution
    remain at the candidate UID.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: How is the project built and what real GUI artifact must the executable launch?
  matching_keywords: []
  test_interface:
    type: command
    entry:
      language: cpp
      file: CMakeLists.txt
      executable: build/workspace_gui
      command: xvfb-run -a ./build/workspace_gui --smoke
    inputs:
      display: X11-compatible display supplied by the evaluator
    output:
      type: native_window_and_exit_status
      meaning: a real wxWidgets frame and a clean smoke exit
      asserted_field_paths:
      - cmake_entry_present
      - build_succeeded
      - executable_present
      exact_values:
        cmake_entry_present: true
        build_succeeded: true
        executable_present: true
    operations: []
  evaluation: executable
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/test_gui.py
  pass_rule: all_tests_pass
  notes: Independent reconstruction uses Linux/GCC and synthetic labels/layout/API choices. The original
    VS2013 client requirement is retained in private provenance but is not claimed as validated by this
    Linux task.
