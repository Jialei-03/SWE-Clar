- ru_id: RU-003
  name: MVC visual shell with portable model
  content: Keep this stage to the requested visual shell, without dialogs or business operations. Put
    the main-window model, view, controller, and constants in MainWindowM.h/.cpp, MainWindowV.h/.cpp,
    MainWindowC.h/.cpp, and MainWindowG.h under src. Keep the model standard C++ without wxWidgets headers.
    Put event handling in the controller and bind it at runtime rather than with static event-table macros.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: How must the source be divided, and what portability, scope, and event-binding rules
    apply?
  matching_keywords: []
  test_interface:
    type: command
    entry:
      language: cpp
      directory: src
      classes:
      - workspace::MainWindowM
      - workspace::MainWindowV
      - workspace::MainWindowC
    inputs:
      source_tree: src directory
    output:
      type: compile_time_and_runtime_observations
      meaning: portable MVC visual shell with controller-owned dynamic bindings
      asserted_field_paths:
      - source_directory_present
      - required_files_present
      exact_values:
        source_directory_present: true
        required_files_present: true
    operations: []
  evaluation: executable
  tests:
  - test_id: RU-003-T01
