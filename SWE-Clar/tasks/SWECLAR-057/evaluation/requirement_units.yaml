- ru_id: RU-003
  name: Service and appointment flow
  content: Service catalog entries have id, title and available_slots (string array). Render each service
    and actionable slot controls. For an authenticated user, booking a known available service/slot calls
    ServiceApi.book; HttpServiceApi actually POSTs /appointments JSON {service_id,slot}. Accept a response
    only with a nonempty unique id and the same service_id/slot, store it under that id and visibly open
    the appointments page. Book at most once per service/slot and avoid concurrent duplicate requests
    while busy.
  requirement_category: refinement
