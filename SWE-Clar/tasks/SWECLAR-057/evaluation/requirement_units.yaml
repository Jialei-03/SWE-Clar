- ru_id: RU-004
  name: API-style failure handling
  content: Unknown services, unavailable slots and duplicates return unknown_service, unavailable_slot
    or duplicate_appointment respectively before sending requests. Transport failures, non-2xx responses
    or malformed appointment responses show api_failed without inserting an appointment or navigating
    away. Inputs and existing successful appointments must remain intact; failed requests can be retried.
