- ru_id: RU-002
  name: Coach services and discovery
  content: publish_service requires users[coach_id].role=coach, unique nonempty service_id, nonblank specialty,
    modality online/in_person/hybrid, finite nonnegative numeric nonboolean price, nonempty list of nonblank
    slot strings. Trim specialty/slots, dedupe slots preserving first occurrence, store coach_id,specialty,modality,price,slots,active=true.
    discover returns result.services rows with service_id plus service fields, only active=true. Optional
    specialty is case-insensitive trimmed substring filter; optional modality must be supported and matches
    exactly. Sort by casefolded specialty then service_id. Empty specialty filter matches all. No original
    coach profiles or broad marketplace UI.
  requirement_category: core
