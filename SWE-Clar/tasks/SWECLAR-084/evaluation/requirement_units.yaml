- ru_id: RU-003
  name: Conflict-safe session booking
  content: book needs role athlete, unique nonempty session_id, active service, slot from normalized service
    slots and purchase_type one_time/subscription. One service/slot admits only one booked or completed
    session. Repeated session ID rejects without another debit; conflicting/unknown/invalid booking rejects
    atomically. Subscription requires strictly positive integer credit excluding bool; debit exactly1
    on successful booking. one_time consumes no credit and means locally accepted purchase intent, not
    external billing. Store athlete_id,coach_id,service_id,slot,purchase_type,status=booked,price from
    service. Ignore supplied price/credit overrides.
  requirement_category: refinement
