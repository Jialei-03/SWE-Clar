- ru_id: RU-005
  name: Completed-session reviews and participant chat
  content: complete_session requires session's coach and status=booked, sets completed. review requires
    that session's athlete, status=completed, nonempty unique review_id and integer rating1..5 excluding
    bool; only one review per session; store review_id,session_id,rating (extra fields allowed). message
    requires booked/completed session and its two distinct coach/athlete participants as sender_id/recipient_id,
    nonempty message_id, nonblank text trimmed for storage. Store message_id,session_id,sender_id,recipient_id,text.
    Same ID with identical normalized fields returns duplicate=true without another message; conflicting
    reuse rejects. view_session(actor_id,session_id) requires a participant and returns the session's
    messages/reviews only; unrelated users denied. Chat/history remain available after completion.
