- ru_id: RU-004
  name: Plans and weekly check-ins
  content: assign_plan requires known coach and athlete, at least one status=booked session between them,
    unique nonempty plan_id, plan_type training/meal/supplement and nonempty content (string/list/dictionary).
    Store coach_id,athlete_id,plan_type,content unchanged. No advice or nutrition content is generated.
    checkin requires plan's assigned athlete, nonblank week string and nonempty content; trim week and
    allow at most one entry per plan+athlete+week, storing plan_id,athlete_id,week,content. Week is caller's
    canonical week identifier; no calendar parsing required. Completed/cancelled sessions alone do not
    authorize a new plan; existing plan check-ins remain allowed.
