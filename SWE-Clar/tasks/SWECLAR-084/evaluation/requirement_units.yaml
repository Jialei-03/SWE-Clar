- ru_id: RU-001
  name: Coaching workflow entry point
  content: 'process_coaching_action(state,action) returns entire new internal state with result or nonempty
    error.code, deterministic and without mutating inputs. Invalid/unknown actions preserve business collections.
    Known dictionary collections users,credits,services,sessions,plans and list collections checkins,reviews,messages
    must have correct collection type when present; initialize missing collections as needed. Preserve
    SQLite CLI init/show/act: init once, successful state survives separate processes, rejected action
    leaves stored state intact. act emits only result/error; show is trusted local operator inspection.
    User IDs in operation fields are trusted upstream identity context, not a public authentication implementation.
    Extra metadata and alternate error wording accepted.'
