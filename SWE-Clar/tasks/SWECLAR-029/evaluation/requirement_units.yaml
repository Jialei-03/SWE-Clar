- ru_id: RU-005
  name: Footer status and secure logout
  content: Status returns online, last_up, last_down and pending while preserving chainable collection
    types. Logout removes the user session, queued work, offline metadata and actual stored encrypted
    files, preserving other users' files and state. On storage deletion failure return logout_failed without
    reporting successful logout.
