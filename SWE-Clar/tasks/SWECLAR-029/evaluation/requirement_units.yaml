- ru_id: RU-004
  name: Offline background action queue and reconnect flush
  content: Enqueue save, email and upload intents once per action_id. An exact replay is idempotent; conflicting
    user/kind/payload reuse returns queue_conflict. An authenticated online flush sends only that user's
    pending entries in insertion order as JSON {action_id,user_id,kind,payload} to the configured endpoint
    with Idempotency-Key=action_id. Mark applied and update last_up only after a successful HTTP response
    with accepted=true and matching action_id. Stop at the first failed delivery, return sync_failed and
    retain it and later entries pending; already acknowledged entries remain applied. Retry must not resend
    applied entries. Offline flush returns offline. The endpoint accepts intents; it does not claim real
    email delivery or cloud upload.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
