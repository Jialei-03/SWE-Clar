  notes: Python storage/sync reconstruction. Fixture authentication is not a production credential store.
    AES-GCM format, byte capacity and local HTTP acknowledgement are explicit benchmark engineering choices.
- ru_id: RU-003
  name: Assigned-job offline download
  content: An online authenticated user may download only a job listed in assignments[user_id] and present
    in remote_jobs. Each remote job has data. Serialize data as compact UTF-8 JSON with sorted keys and
    ensure_ascii=false; enforce capacity_bytes against total plaintext byte sizes for that user, replacing
    rather than double-counting a redownload. Persist a real AES-GCM encrypted file via OfflineStore.write_bundle
    and support authenticated read_bundle after constructing a new store with the same root/key. Use a
    fresh 12-byte nonce, file format FS1 + nonce + ciphertext/tag, and the same compact JSON encoding
    of [user_id,job_id] as associated data. Tampering, the wrong key and copying a bundle to another user/job
    must fail authentication. Metadata contains size_bytes, plaintext SHA-256 digest, encrypted=true and
    root-relative file path, never plaintext or key. Set last_down only after success; denied downloads
    create no file.
  requirement_category: refinement
