requirement_units:
- ru_id: RU-001
  name: Field workflow entry point
  content: Process one authentication, connectivity, download, queued field action, synchronization, status,
    or logout operation without mutating inputs. Return the entire chainable next state at the top level;
    result contains only the current action summary. Complete real local file persistence and HTTP synchronization
    through the supplied store/transport interfaces. Keep the supplied encryption key outside returned
    state.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for field workflow entry point.
  test_interface:
    type: function
    entry:
      language: python
      file: solution.py
      function: process_field_action
      signature: process_field_action(state, action, store=None, transport=None) -> dict
    inputs:
      state: Chainable field-work state
      action: Authentication, connection, download, enqueue, flush, status or logout action
      store: OfflineStore(root,key)
      transport: SyncTransport(endpoint)
    output:
      type: dict
      meaning: Next state and real local persistence/network effects
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/offline_contract.py
  notes: Python storage/sync reconstruction. Fixture authentication is not a production credential store.
    AES-GCM format, byte capacity and local HTTP acknowledgement are explicit benchmark engineering choices.
- ru_id: RU-002
  name: Password and fourteen-day 2FA session
  content: state.users is keyed by user_id; each record stores password_hash as the lowercase SHA-256
    hex digest of the submitted UTF-8 password, two_factor_code, and optional last_2fa timestamp. Authentication
    requires the matching digest and additionally requires the exact two_factor_code when last_2fa is
    absent or at least 14 days old. A successful authentication stores sessions[user_id].last_active.
    An action more than 1800 seconds after last_active returns session_expired; each valid authenticated
    action updates it. Download, enqueue, flush and logout require that user's valid session; a flush
    may process only that user's entries.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for password and fourteen-day 2fa session.
  test_interface:
    type: function
    entry:
      language: python
      file: solution.py
      function: process_field_action
      signature: process_field_action(state, action, store=None, transport=None) -> dict
    inputs:
      state: Chainable field-work state
      action: Authentication, connection, download, enqueue, flush, status or logout action
      store: OfflineStore(root,key)
      transport: SyncTransport(endpoint)
    output:
      type: dict
      meaning: Next state and real local persistence/network effects
      authentication_result:
        required_fields:
          two_factor_used: boolean
        error_codes:
        - auth_denied
        - session_expired
    operations: []
