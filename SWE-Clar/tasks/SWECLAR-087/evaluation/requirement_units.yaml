- ru_id: RU-004
  name: Post-processing action
  content: After an eligible workbook is saved without row lookup errors, call post_processor(workbook_path,
    action_name) exactly once if configured in sync.json. The callback must see the updated workbook.
    Do not call it for malformed, ineligible or partially updated workbooks. Record callback failures
    and continue with later files.
  requirement_category: refinement
  source_visibility: visible
