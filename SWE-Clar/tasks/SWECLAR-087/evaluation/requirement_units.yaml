      meaning: Run report plus observable saved XLSX cells and copied generated files
      error_record:
        required_fields:
          workbook: workspace-relative workbook path
          stage: parse (open/validate workbook), lookup (inventory adapter), save (persist workbook),
            or post_process (callback)
          error: nonempty human-readable error description
        additional_properties: true
    operations: []
  evaluation: executable
  tests:
  - test_id: RU-002-T01
    file: evaluation/tests/test_inventory_sync.py
  pass_rule: all_tests_pass
  notes: The local XLSX format and callback/configuration interfaces are explicit benchmark reconstruction
    choices. No original workbook, customer data or live service is included.
- ru_id: RU-003
  name: Cin7 stock update
  content: For every non-empty SKU cell in Inventory, call cin7_client.lookup once per row and write the
    returned values to the soh and ots columns, adding missing headers as needed. Preserve unrelated cells,
    formulas, formatting and sheets, and leave empty-SKU rows unchanged. Save the actual workbook so the
    updated values can be read by a separate reader.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: What stock-update behavior is required for each inventory row?
