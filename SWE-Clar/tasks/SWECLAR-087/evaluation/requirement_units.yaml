- ru_id: RU-005
  name: To Order output collection
  content: After processing and any successful callback, copy each associated generated output listed
    in sync.json into run_output without overwriting an existing collected file. Read the actual generated
    file after the callback, use collision-safe names, warn on missing outputs, and collect no output
    from workbooks with lookup or post-processing errors.
