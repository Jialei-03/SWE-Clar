- ru_id: RU-003
  name: Confirmed signup state and retries
  content: Confirm the triggering signup only after all signup notifications succeed. Temporary delivery
    failures must be reported without marking the step complete. Retry with stable idempotency keys and
    avoid duplicate delivered messages. A repeated signup must preserve a later reminder state instead
    of resetting it to Confirmed.
  requirement_category: core
  source_visibility: hidden
