- ru_id: RU-005
  name: Manager rosters and full-capacity alerts
  content: At or after 06:00 in the configured local timezone, send one same-day roster per assigned manager,
    once per local date. Earlier ticks do not send the daily roster. Separate managers receive only their
    own shifts. Use the publicly specified structured report fields, with total capacity, filled signup
    count and remaining capacity. Independently, an Open shift with remaining capacity <= 0 sends one
    full-capacity email to its assigned manager and becomes Full after successful delivery. Failed delivery
    does not complete the step; repeated ticks do not resend successful reports or alerts.
  requirement_category: refinement
  source_visibility: hidden
