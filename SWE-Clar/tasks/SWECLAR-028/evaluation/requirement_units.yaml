- ru_id: RU-006
  name: Manual attendance
  content: Signup and scheduled automation must not mark attendance as checked in. New signups retain
    false/0 or unset attendance; existing attendance is preserved. Managers handle attendance separately.
    This is a preimplemented regression requirement and does not represent wholly new hidden information.
  requirement_category: refinement
