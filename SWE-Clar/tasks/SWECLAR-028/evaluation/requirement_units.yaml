- ru_id: RU-004
  name: Two-stage reminders
  content: Use the configured IANA timezone and explicit offset-aware now supplied to /tick. The 24h stage
    selects Confirmed signups whose future shift starts on the next local calendar day, sends SMS and
    email and advances to Reminder Sent 24h. The 2h stage selects only Reminder Sent 24h signups with
    0 < starts_at-now <= 2 hours, sends both channels and advances to Reminder Sent 2h. Failed delivery
    does not advance a stage; retry uses stable delivery keys. Past shifts and completed stages are not
    resent.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
