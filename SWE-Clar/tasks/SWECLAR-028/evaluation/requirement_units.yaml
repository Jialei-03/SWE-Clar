requirement_units:
- ru_id: RU-001
  name: Connected scheduling records
  content: Implement the local scheduling service and preserve the public HTTP/configuration contract.
    A signup resolves an existing employee by email or creates one, links the selected shift and employee
    in a persisted signup, and preserves dynamic multi-location shifts. Repeated identical signup requests
    do not create duplicate employees or signups; conflicting signup ID reuse is rejected.
  requirement_category: core
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the required behavior and relevant boundaries for connected scheduling records.
  matching_keywords: []
  test_interface:
    type: command
    entry:
      language: Python
      file: server.py
      command: python server.py --config runtime/config.json --port 8080
    inputs:
      transport: HTTP JSON
      contract: README.md
    output:
      type: persisted_state_and_http_delivery
      meaning: Connected scheduling records
    operations: []
  evaluation: executable
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/scheduling_contract.py
  pass_rule: all_tests_pass
  notes: Business workflow supported by privately reviewed source; Python/SQLite replacement, local notification
    protocol, exact time and retry semantics and report serialization are benchmark reconstruction conventions.
    No n8n compatibility, live account integration or original customer materials are claimed.
- ru_id: RU-002
  name: Dynamic signup notifications
  content: A valid signup sends one SMS and one email to the employee and one email to the selected shift
    manager through the prepared local notification endpoint. Every body includes worker name, offset-aware
    shift timestamp, location, address and map URL. Recipients are derived from the linked records, not
    fixed fixtures.
  requirement_category: core
