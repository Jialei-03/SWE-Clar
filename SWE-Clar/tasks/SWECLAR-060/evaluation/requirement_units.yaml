- ru_id: RU-005
  name: POC fusion encyclopedia
  content: recipes maps IDs to level, exactly two input creature types and one result type. encyclopedia
    lists level-one recipes in ascending recipe-ID order, adding recipe_id for the UI selector and preserving
    configured fields. fuse accepts any valid configured recipe_id (the level-one filter applies only
    to encyclopedia), requires an existing owned-creature list with both input occurrences, consumes each
    required occurrence once and appends one result. Identical inputs require two owned copies. Missing
    recipe, invalid recipe or insufficient ownership rejects atomically. Other users and recipe definitions
    remain unchanged; successful fusion updates the creature panel.
  requirement_category: refinement
