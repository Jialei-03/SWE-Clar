- ru_id: RU-003
  name: Fixed-slot stackable inventory
  content: Existing inventory capacity is fixed. add_item requires a positive integer quantity and item_id,
    boolean stackable (default false), and a positive integer stack_limit when stackable. Fill existing
    slots for the same item up to that supplied limit, then allocate new stacks up to capacity. Nonstackable
    items occupy one slot per unit. Reject invalid items/users/quantities and capacity overflow atomically.
    Slot and response metadata may be retained; acceptance depends on required fields, not exact dictionary
    formatting.
  requirement_category: refinement
