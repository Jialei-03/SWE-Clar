requirement_units:
- ru_id: RU-001
  name: Game workflow entry point
  content: Preserve the supplied real HTTP/canvas game. process_game_action(state,action) returns a new
    JSON state with result or nonempty error.code, without mutating either input. Errors preserve existing
    business collections. Existing movement/rendering, /health, /state, /action and /reset must remain
    usable. Successful combat, inventory, loot and fusion actions appear in actual health, world loot
    and panels. Extra metadata and alternative nonempty error codes are accepted. Finite numeric values
    exclude booleans; quantities/capacities/stack limits are integers. Unknown/malformed actions reject
    without corrupting state.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for game workflow entry point.
  test_interface:
    type: function
    entry:
      language: python
      file: solution.py
      function: process_game_action
      signature: process_game_action(state,action) -> dict
    inputs:
      state: Synthetic scenario mapping
      action: Public operation schema in README
    output:
      type: dict
      meaning: New JSON state and actual browser/HTTP effects
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/test_solution.py
  notes: Browser slice, not an original commercial 3D game. Supplied probability/time inputs make offline
    checks deterministic.
- ru_id: RU-002
  name: POC creatures and real-time skills
  content: A skill needs known source, target and skill, finite numeric hp/level/defense/power and positive
    hp for both combatants. Compute damage=max(0,power+source.level-target.defense), report this computed
    damage before hp clamp, set target_hp=max(0,old_hp-damage), and append exactly one event for accepted
    actions (including zero damage). Rejection leaves hp/events unchanged. Preserve other combatants and
    skills. Successful gestures update the visible scene.
  requirement_category: core
