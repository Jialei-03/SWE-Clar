- ru_id: RU-004
  name: Deterministic percentage drop and ownership window
  content: roll_drop requires a defeated known enemy (hp<=0), a unique nonempty drop_id, existing owner
    inventory, valid item description, finite now and supplied roll/chance in [0,1]. It creates one item
    drop iff roll<chance; a nonwinning valid roll returns dropped=false without changing world drops.
    The owner's exclusive window is [created,created+60); during [created+60,created+120) any player with
    an existing inventory may pick up. At created+120 it is unavailable. Earlier-than-created pickup rejects.
    Successful pickup atomically inserts exactly one item according to the same inventory rules and removes
    the world drop or marks it picked. Full inventory, unknown user/drop, expired/picked drops or invalid
    time reject without consuming loot or changing inventory. Repeated pickup cannot duplicate an item.
    expire(now) removes/marks unpicked drops whose expiry is <=now; other drops remain available. Results
    expose dropped/picked booleans; internal timestamp field names are not prescribed.
  requirement_category: refinement
