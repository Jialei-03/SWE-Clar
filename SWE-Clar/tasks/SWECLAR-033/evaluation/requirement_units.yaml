- ru_id: RU-004
  name: Feed fallback
  content: Parse actual RSS, ICS, JSON and HTML source text. RSS uses rss/channel/item with title, link,
    start_date, end_date and optional image child text. ICS uses VCALENDAR/VEVENT with SUMMARY, URL, DTSTART;VALUE=DATE
    and DTEND;VALUE=DATE (exclusive end, convert to inclusive end_date), optional IMAGE; unfold continued
    lines and decode escaped text. HTML uses article.exhibition containing h2 title text, a.details href,
    time[data-field=start_date/end_date] datetime and optional img src. JSON uses the public array schema.
    Unsupported/manual feed types return manual_entry_required=true and updated=0 without fetching or
    inventing records.
  requirement_category: refinement
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
