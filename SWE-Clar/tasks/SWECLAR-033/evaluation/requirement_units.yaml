- ru_id: RU-005
  name: City and closing views
  content: 'Project timeline, calendar, gallery, museum, and closing-soon views for a requested city;
    closing-soon includes ongoing exhibitions ending within seven days of the supplied current date. Match
    city names case-insensitively. Recompute statuses on each view request: upcoming before start, closed
    after end, closing_soon from start through end when end is at most seven days after current_date,
    and ongoing otherwise. Timeline, calendar and gallery are lists of full exhibition records sorted
    by start_date, title, then URL. museums is the sorted unique museum-name list. closing_soon contains
    the matching ongoing records, including exhibitions ending today or exactly seven days away. Empty-city
    views return empty lists.'
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for city and closing views.
