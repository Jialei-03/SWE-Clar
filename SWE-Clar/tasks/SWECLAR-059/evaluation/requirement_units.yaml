- ru_id: RU-003
  name: Role-based status review
  content: Only authenticated review-role users may transition a submitted staff row once to approved
    or rejected. Derive audit actor from the authenticated token and timestamp from the server clock,
    never caller role/actor/time fields. Every committed transition records staff, old/new status, actor
    and time in the database; rejected actions leave row and audit unchanged. The page must reflect review
    outcomes.
  requirement_category: refinement
