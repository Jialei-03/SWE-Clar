- ru_id: RU-004
  name: Photo integrity
  content: Upload actual PNG/JPEG bytes to a supplier-owned image record, validate format and bounds,
    decode then re-encode to PNG without source metadata. Attach only a known image of the same supplier
    to a known authorized staff record; replacement preserves previous photo IDs in ordered history, and
    repeating the same attachment is idempotent. Return actual stored image bytes only to authorized users.
    Missing/malformed/foreign images fail without changing staff/history.
  requirement_category: refinement
  source_visibility: hidden
