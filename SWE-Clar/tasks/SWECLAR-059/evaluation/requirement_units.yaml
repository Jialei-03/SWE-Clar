- ru_id: RU-005
  name: Complete deterministic export/import
  content: Authorized reviewers export a real CSV containing staff_id,supplier_id,name,birth_city,status,photo_id
    in stable staff-ID order. Import a CSV with exactly those columns into existing suppliers; validate
    all rows, non-conflicting IDs, statuses and supplier-owned photo references in one transaction. Preserve
    all existing rows on malformed/conflicting imports. Round-trip quoted names and cities correctly and
    do not allow supplier users to export/import the full dataset. Import column order may vary; duplicate/missing/extra
    columns are invalid.
  requirement_category: refinement
