- ru_id: RU-004
  name: Synchronized visible timer and stale snapshot handling
  content: After accepting a state, anchor its server_now_ms to local performance.now(). Between responses
    estimate server time as that anchor plus nonnegative monotonic elapsed milliseconds; do not use Date.now()
    or the browser's timezone/wall-clock offset. Remaining seconds is max(0, ceil((protected_until_ms
    - estimated_server_time)/1000)) for a live local player, otherwise 0. The visible integer, indicator
    and actual drawn protection appearance must update together without requiring a network poll. A response's
    seq must be strictly newer than the last accepted seq; ignore duplicate/older responses completely,
    including their time anchors, coordinates, health and generations. Within one player generation the
    displayed protection countdown may not increase, even if a newer response is delayed. A genuinely
    newer generation resets its countdown from the new spawn. Room leave/session invalidation clears the
    state/anchors. Rendering must depict the new state, not only store an internal field. Long background
    elapsed time must expire the timer on the next rendered frame; no frame-count-based timer.
