- ru_id: RU-005
  name: Death/respawn, command replay and client retry
  content: 'Respawn requires a dead authenticated player, matching current generation and a valid command_id.
    It selects the first free spawn point, resets hp=3/alive=true, increments generation exactly once,
    and assigns the new clock/deadline. Live respawn, full spawn area or stale generation -> 409 and no
    mutation.


    Within an actor and generation, move and respawn share one command_id namespace. An identical already
    committed request (same operation and original payload) returns a fresh current state without repeating
    movement, health loss or respawn. Changed reuse -> 409. A successful respawn request may replay using
    its original generation only while the actor is still in the generation produced by that respawn;
    it returns current state, not the old spawn snapshot. Once a later respawn advances again, that old
    request is stale -> 409. Other stale-generation commands are 409. Rejected requests do not reserve
    command IDs. Different actors may use the same command ID independently. Validate types/identity before
    replay; commit the operation and replay entry atomically. Concurrent identical commands commit once.


    The browser generates a command ID per intent. On a lost HTTP reply, retrying the same pending action
    reuses its original ID/generation/payload; do not repeat a successful movement or respawn. While a
    request is pending, double clicks create no competing intents. An explicitly different action or leave
    abandons the previous retry intent. After conflict refresh authoritative state before allowing another
    action. Show errors and current health/position without fake success; clear retry state on success.
    No requirement to persist intents across a fresh browser process.'
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
