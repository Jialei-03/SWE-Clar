- ru_id: RU-003
  name: Authoritative temporary protection and collision
  content: 'Each successful initial spawn or respawn has exactly 6000 ms protection: protected_until_ms
    = spawn_ms + 6000. Protection holds iff alive and server_now_ms < protected_until_ms; at the deadline
    it is off. A protected moving player may pass through another player''s cell, and anyone may pass
    through a protected stationary player''s cell: if either live participant is protected, contact does
    not block or reduce either player''s health. Walls still block. Overlapping players when protection
    expires are not retroactively harmed or relocated; later movement follows the normal rule. Client
    timestamps, protection flags, deadlines, coordinates and actor IDs cannot alter this policy. Simultaneous
    actions must still follow one serialized server order.'
