- ru_id: RU-002
  name: Normal movement and contact regression
  content: For a live unprotected player, a valid movement command proposes exactly one cell in the requested
    direction. A wall/out-of-bounds move is blocked with 200 and no health loss. Entering a cell occupied
    by another live unprotected player is blocked; the moving player loses one hp, the stationary player
    is unchanged. Reaching hp=0 sets alive=false; dead players remain in the roster but occupy/draw no
    board cell. Empty-cell movement commits the new coordinate with unchanged health. Queries, polls,
    rendering and clock advancement alone never move, harm or respawn players. Server mutations are synchronized
    so simultaneous moves see a legal serial order. Preserve the real visual movement, wall geometry and
    health feedback for these disclosed behaviors.
