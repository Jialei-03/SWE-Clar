requirement_units:
- ru_id: RU-001
  name: Executable event-driven controller
  content: Preserve the buildable C++ application, declared serial grammar/output, real loopback registration
    service and virtual-board/bus byte formats from README. Process serial input and registration connections
    while the telemetry handshake is pending; never block the event loop waiting for an acknowledgement
    or sleep to simulate virtual time. Bus readiness requires the complete actual OK01 acknowledgement;
    handle fragmented data and remote closure. Keep startup state and deterministic clock bounds, and
    launch from the prepared environment without setup work.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: What are the rules for executable event-driven controller?
  matching_keywords:
  - firmware
  - build
  - event loop
  - interface
  - protocol
  test_interface:
    type: api
    entry:
      command: make && build/firmware --board-port <prepared UDP board> --bus-port <prepared TCP bus>
      protocol: Serial JSON responses and actual peripheral wire formats in README
    inputs: Virtual link inputs, clock advances, sensor values and prepared loopback peripherals
    output: Actual registration endpoint behavior, GPIO/beacon datagrams and health frames
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  notes: Exact timings, serial commands, native host target and binary protocol are independently designed
    benchmark conventions. No original identifiers, code, topics or device compatibility claim.
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/firmware_contract.py
- ru_id: RU-002
  name: Actual registration shutdown
  content: Initially send the documented registration beacon at time 0 and each 1000ms boundary and serve
    SETUP newline on the real registration TCP socket. The registered command closes the actual listener
    and disables all future beacons. Preserve network, bus connection, pending handshake, current GPIO
    level and its LED phase schedule. Repeated registration completion has no additional side effects.
    This is a virtual registration service, not a claim of original radio compatibility.
  requirement_category: core
  source_visibility: visible
