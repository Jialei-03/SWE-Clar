- ru_id: RU-003
  name: GPIO connectivity timing
  content: Emit initial GPIO high at time 0. When network is down, toggle the output every 100ms (200ms
    full blink period). When network is up but the bus is not acknowledged, toggle every 500ms. When both
    are ready, hold high. On a change between these three modes, start the new mode high and anchor its
    next edge to the current virtual time plus its half-period; emit a GPIO record only if the physical
    level changes. Repeated inputs that leave the mode unchanged must not reset phase or create duplicate
    edges. Advancing time emits every crossed edge at the exact scheduled time, including an edge exactly
    at the target time. Preserve chronological order and the public GPIO-before-beacon tie rule.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
