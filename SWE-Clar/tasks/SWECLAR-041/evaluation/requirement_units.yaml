- ru_id: RU-005
  name: Idempotent controls and safe errors
  content: 'Repeated network/broker status inputs and repeated registered commands are idempotent: preserve
    the LED phase if mode did not change, do not open duplicate connections/handshakes, and do not duplicate
    registration side effects. network 0 closes any ready or pending bus connection; network 1 alone does
    not connect it. broker 1 while network is down returns {ok:false,error:network_down} without changing
    state or I/O; otherwise it requests asynchronous connection and is a no-op if already ready/pending.
    Reject every unknown, empty, malformed, oversized or out-of-range command with {ok:false,error:invalid_command},
    no state change and no peripheral output. Consume a complete oversized line before accepting the next
    line. Invalid commands cannot move the clock, close registration, alter connectivity or publish. Advancing
    to the same time is valid and has no extra timed output.'
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
