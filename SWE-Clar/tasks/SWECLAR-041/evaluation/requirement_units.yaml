- ru_id: RU-004
  name: Health frames on the real bus
  content: For each valid health command, emit exactly one documented HT01 binary frame with the current
    virtual timestamp and supplied RSSI/channel/bandwidth, only while network is up and the bus handshake
    is fully acknowledged. Drop samples when network is down, connection is pending, bus is disconnected
    or acknowledgement was rejected; do not buffer those samples for later. Preserve signed RSSI and all
    field values. Repeated valid health commands are separate measurements and each eligible call publishes
    once. The registered command must not stop eligible health publication. On bus closure or cancellation
    discard unsent old-connection data; reconnection must not replay it.
  requirement_category: refinement
