requirement_units:
- ru_id: RU-001
  name: Navigation workflow entry point
  content: Implement the supplied local routing web component and process_navigation_action(state,action,client=None)
    without mutating inputs. Read the directed road graph through the actual configured GraphClient HTTP
    POST, compute routes and persist successful actions atomically. Serve the existing page, script and
    stylesheet only; a rejected request leaves the saved state unchanged. The README defines the small
    synthetic loop-network boundary.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for navigation workflow entry point.
  test_interface:
    type: function
    entry:
      language: python
      file: solution.py
      function: process_navigation_action
      signature: process_navigation_action(state,action,client=None) -> dict
    inputs:
      state: local workflow state
      action: routing/navigation action
      client: GraphClient
    output:
      type: dict
      meaning: new state
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/navigation_contract.py
  notes: Independent local directed-graph routing, HTTP provider and SVG UI are disclosed reconstruction
    choices. No original app identity, credentials, routes, customer design or external map account is
    included.
- ru_id: RU-002
  name: Distance-constrained alternative routes
  content: generate_alternatives(start_node,requested_miles,tolerance) enumerates unique simple directed
    loops returning to start with 3–10 distinct nodes from the fetched graph. Sum haversine segment lengths
    using Earth radius 6371008.8 metres and 1609.344 metres per mile. Accept only distances within inclusive
    tolerance; order by absolute distance delta then stable route ID. Ignore supplied candidates and edge
    distance labels. Reject empty/invalid results and clear prior selection/navigation only on successful
    regeneration. Use at most 100000 traversal states and the documented network limits.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
