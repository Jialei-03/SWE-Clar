- ru_id: RU-004
  name: Navigation progress and off-route feedback
  content: Starting navigation requires a selected route. For progress, use the actual position to compute
    minimum distance to the selected polyline with the documented local tangent-plane projection; ignore
    action.off_route_meters. An event strictly beyond a finite nonnegative threshold adds one deduplicated
    off_route alert with vibration intent per event_id. Record valid positions, reject malformed coordinates
    atomically. This component does not assert background GPS capture or actual device vibration.
