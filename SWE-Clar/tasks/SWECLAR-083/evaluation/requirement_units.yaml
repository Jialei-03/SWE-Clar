- ru_id: RU-003
  name: Map point and alternative selection
  content: Validate latitude/longitude as finite nonboolean numbers in geographic ranges. Store placed
    points. Route selection requires a currently generated ID, copies its geometry/distance and clears
    prior navigation. Render route polylines from actual coordinates and let page controls select a displayed
    alternative. Never return an invented geometry or unsupported route ID.
