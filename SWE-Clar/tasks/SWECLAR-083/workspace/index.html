<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Local route planner</title><link rel="stylesheet" href="/style.css"><main><h1>Local route planner</h1><p>Explore distance-matched loops on a synthetic road network.</p><form><label>Start node <input name="start_node" value="s" required></label><label>Distance (miles) <input name="requested_miles" type="number" step="0.01" value="2.75" required></label><label>Tolerance (miles) <input name="tolerance" type="number" step="0.01" value="0.05" required></label><button>Find routes</button></form><p id="error" role="alert"></p><label>Theme <select id="theme"><option>dark</option><option>light</option></select></label><svg id="map" viewBox="0 0 600 360" role="img" aria-label="Synthetic route map"></svg><div id="routes"></div><p id="selected"></p><button id="navigate">Start navigation</button><p id="status"></p></main><script src="/app.js"></script></html>
