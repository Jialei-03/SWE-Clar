- ru_id: RU-003
  name: Countdown capture, response timing, and expiry
  content: Open a recipient's request before accepting a photo and enforce the configured server-time
    countdown. Decode and re-encode actual images, preserving picture content while removing source metadata.
    Store one photo per request/recipient with elapsed server response time and the request caption. In
    the selected source version, photos after the response window remain ordinary timeline photos but
    are excluded from the group challenge result. Use actual timestamps; callers cannot forge elapsed
    time. The 3-second countdown and 60-second window have source support, and are the selected reconstruction
    version.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for countdown capture, response timing, and expiry.
