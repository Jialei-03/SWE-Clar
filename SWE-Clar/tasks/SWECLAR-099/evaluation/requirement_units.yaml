- ru_id: RU-005
  name: Registered-contact flow and group moment layout
  content: Match only the selected contact's supplied phone numbers using the documented synthetic normalization
    convention; persist matching registered contacts idempotently or return a local invitation action.
    Do not sync a whole device directory or send invitations automatically. Display group images in an
    actual browser two-column grid with an odd last image centered. Retain real decoded image content.
    Physical Contacts picker and SMS delivery are outside this component acceptance.
