schema_version: 1
task_id: SWECLAR-099
registry_version: swe-clar
registry_status: annotation_complete
disclosure_design: controlled_requirement_disclosure
selected_scope: Browser photo request, authenticated image upload/timeline, exact routing and selected-contact
  component with selected timing version and Linux-only browser scope
requirement_units:
- ru_id: RU-001
  name: Moment workflow entry point
  content: Build and run the supplied browser photo-chat component and HTTP/SQLite service. Preserve browser
    room selection, request creation, real JPEG upload/download/decode and timeline display. Accounts
    and room membership come from synthetic server fixtures; persist accepted requests/photos across restart.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for moment workflow entry point.
  test_interface:
    type: function
    entry:
      language: python
      file: server.py
      function: Store.act
      signature: Store.act(authenticated_user,path,action) -> persisted record
    inputs:
      authenticated_user: server-owned session identity
      path: documented HTTP endpoint
      action: synthetic request body
    output:
      type: dict
      meaning: Actual persisted result observed through HTTP, storage and rendered browser interfaces
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/test_solution.py
  notes: Reviewed source supports browser photo requests, Duo including the sender and late ordinary photos.
    Exact HTTP schemas, selected-number normalization and two-column odd-center layout are reconstruction
    conventions rather than additional direct client quotations. The selected version uses a 3-second
    server countdown and 60-second response window. Synthetic JPEG inputs, supplied selected contact numbers
    and local route resolution replace physical camera/Contacts/APNs testing. Existing authentication,
    image processing, countdown, late-photo and route behavior remains public regression work.
- ru_id: RU-002
  name: Room-based one-to-one and group requests
  content: Create one idempotent request per stable ID within an authenticated member's room. Ask and
    single Challenge target other members; Duo includes all room members, including the sender. A replay
    cannot create another request, and conflicting reuse must fail. Source explicitly says Duo includes
    the asking person; no state-only fake delivery is sufficient.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
