- ru_id: RU-005
  name: Durable preferences and atomic errors
  content: Persist active tab, globally tracked expanded folder IDs, sidebar width and wrap preference
    in the database, restoring them after page reload and process restart. Width must be an integer 180..480;
    wrap must be boolean; expanded must contain distinct IDs of existing folders. Invalid view values
    return invalid_command (invalid_parent for an existing nonfolder); missing IDs use missing_item. UI
    resize uses pointer movement and clamps width to the range. The right-click menu changes actual wrapping
    of label text, not only a status flag. All invalid bookmark/host/domain commands return HTTP 400 and
    an error object without partial state, document or view mutations; duplicate global IDs use duplicate_id
    and unknown host objects missing_target. Preserve the notebook host when sidebar data changes. Concurrent
    disjoint mutations must both survive.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
