- ru_id: RU-004
  name: Selection, sorting and keyboard workflow
  content: 'A plain tree-row click selects only that item and sets the anchor. Ctrl/Meta toggles an item;
    newly included IDs append in selection order and set the anchor. Shift selects the inclusive visible-row
    range between the anchor and target in visual order, replacing the previous selection. Dragging a
    selected row moves the whole selection; an unselected row starts a one-item selection. Dropping onto
    a folder appends there, onto a tab appends to that root, onto a bookmark inserts immediately before
    it after source removals. Sorting affects only direct children at the chosen parent: folders first,
    stable case-insensitive label order, then bookmarks in their existing order; it does not recursively
    sort. Arrow Up/Down focus and select the previous/next visible row, clamped at ends, respecting Shift
    range selection. Arrow Right expands a collapsed focused folder; Arrow Left collapses an expanded
    focused folder. F2 opens in-cell rename; Enter confirms rename or opens the focused bookmark/toggles
    its folder; Escape cancels rename. No host navigation may occur from rename alone.'
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
