- ru_id: RU-003
  name: Independent tabs and ordered subtree moves
  content: Tabs are independent ordered roots. Creating a tab appends it and does not activate it. Activation
    changes only active_tab. A move takes a nonempty ordered list of distinct IDs, removes each selected
    item once from wherever it currently is, and inserts complete subtrees into the requested tab/folder
    in the supplied ID order. An omitted index appends; a supplied index is an integer 0..remaining destination
    length after removals, including same-parent reordering. A move does not implicitly activate the destination
    tab or discard view state. Reject duplicate IDs in a selection (duplicate_selection), selection containing
    an ancestor and its descendant (overlapping_selection), moving into self/descendant (cyclic_move),
    a missing item/tab, a nonfolder or wrong-tab parent, or invalid index. Every rejection leaves all
    stored data unchanged.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
