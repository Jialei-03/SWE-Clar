requirement_units:
- ru_id: RU-001
  name: Working notebook host and bookmarks
  content: Preserve the public README host, HTTP and UI contracts. Support bookmarking actual notebook/group/section/page/paragraph
    objects, deriving type and default label from the host. Distinct bookmark IDs may target the same
    object. Opening a bookmark navigates the current host, renders the correct page and focuses a target
    paragraph. Keep paragraph editing, stored content and bookmarks durable across navigation and process
    restart. All synthetic labels/content render as text, not HTML. Keep the ribbon toggle, insertion
    staying open, and outside-click dismissal functional.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: What are the rules for working notebook host and bookmarks?
  matching_keywords:
  - bookmark
  - host
  - paragraph
  - navigation
  - target
  test_interface:
    type: api
    entry:
      command: python server.py --port 0 --db <isolated database>
      protocol: HTTP/JSON and real browser controls in README
    inputs: Synthetic notebook objects, bookmark commands and browser actions
    output: Persisted SQLite workspace, rendered tree/editor, focus and real navigation
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  notes: Source supplies the notebook-bookmark workflow. Host, fixtures, technical stack and exact rules
    are independently reconstructed; no original platform compatibility claim.
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/notebook_contract.py
- ru_id: RU-002
  name: Nested folder editing
  content: Create nested folders and bookmarks at their declared parent or tab root. Rename edits only
    an item label. Deleting any item requires confirmed=true; deleting a nonempty folder additionally
    requires recursive=true, otherwise return confirmation_required or folder_not_empty. Delete the complete
    chosen subtree and remove its folder IDs from expanded state. Keep other items and host nodes unchanged.
    Provide real tree expansion, visible folder CRUD and in-cell rename. See README for schemas, ID uniqueness
    and labels.
  requirement_category: core
