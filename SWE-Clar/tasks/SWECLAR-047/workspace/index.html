<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notebook workshop</title><link rel="stylesheet" href="/styles.css"></head>
<body><header><strong>Notebook workshop</strong><button id="toggle-sidebar">Bookmarks</button><span id="message" role="status"></span></header>
<main><aside id="sidebar"><div class="toolbar"><select id="target-kind" aria-label="Bookmark object type"><option value="notebook">Notebook</option><option value="group">Group</option><option value="section">Section</option><option value="page" selected>Page</option><option value="paragraph">Paragraph</option></select><button id="add-bookmark">Save current</button><button id="new-folder">New folder</button><button id="new-tab">New tab</button></div>
<nav id="tabs" aria-label="Bookmark tabs"></nav><div id="tree" role="tree" aria-label="Bookmarks"></div><button id="delete-item">Delete selected</button><button id="sort-items">Sort folders</button><div id="wrap-menu" hidden><label><input type="checkbox" id="word-wrap">Wrap labels</label></div><div id="resize" role="separator" aria-label="Resize bookmarks"></div></aside>
<section id="host"><nav id="document-nav" aria-label="Notebook objects"></nav><article><h1 id="document-title"></h1><div id="breadcrumbs"></div><div id="editor"></div></article></section></main>
<script type="module" src="/sidebar.js"></script></body></html>
