- ru_id: RU-004
  name: Heartbeat expiry
  content: A heartbeat JSON frame updates that active session timestamp using the server clock and receives
    an acknowledgment. sweep(timeout) closes and returns the sorted IDs of active connections whose last
    heartbeat age is strictly greater than a positive timeout, preserving fresh connections.
