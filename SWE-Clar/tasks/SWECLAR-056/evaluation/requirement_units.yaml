selected_scope: Real WebSocket device-session routing with signed JWTs and controlled heartbeat timing
requirement_units:
- ru_id: RU-001
  name: Protocol entry point
  content: Complete the supplied Node.js WebSocket service while preserving its HTTP health endpoint,
    actual connection handling and startServer interface. Successful connections receive a ready frame
    with a non-empty server-generated connection_id and their device_id. Malformed JSON or a JSON value
    that is not an object returns error.code=invalid_message without stopping the server.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for protocol entry point.
  test_interface:
    type: api
    entry:
      language: javascript
      file: server.cjs
      function: startServer
    inputs:
      transport: loopback HTTP and WebSocket
      configuration: secret, clock callback, port, host
    output:
      type: network_behavior
      meaning: Observed handshake, socket frames, connection closure and metrics
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/socket_contract.cjs
  notes: Independent exercise derived from a device communication scenario. Exact wire protocol, signature
    algorithm, timing boundaries and routing counters are benchmark conventions; production capacity and
    original device compatibility are not certified.
- ru_id: RU-002
  name: JWT-gated connections
  content: Admit a WebSocket connection only after verifying the bearer JWT signature with the configured
    HS256 secret. Require a non-empty string sub and device_id and a finite numeric exp strictly later
    than the server clock. Invalid, forged, unsigned, malformed or expired credentials fail the HTTP upgrade
    with status 401. A device already active cannot connect again in ordinary connect mode.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
