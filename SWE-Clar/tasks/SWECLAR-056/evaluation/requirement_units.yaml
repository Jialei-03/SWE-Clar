- ru_id: RU-005
  name: Authorized routing and monitoring
  content: A publish frame contains target_device and payload. Deliver exactly one actual WebSocket message
    to the active target, with a sequence beginning at 1 and the correct source_device, target_device
    and unchanged payload; acknowledge the sender. Unknown or inactive targets return target_unavailable.
    A status frame reports integer active, disconnected, routed_messages and reconnects counts. Closed
    sessions cannot send new routed messages.
  requirement_category: refinement
