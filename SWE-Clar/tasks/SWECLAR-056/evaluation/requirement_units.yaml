- ru_id: RU-003
  name: Resilient reconnection
  content: 'A connection using mode=reconnect for an active device replaces that device session: close
    the old socket, preserve its inactive historical record, create a new connection ID for the same device,
    and increment reconnects once for that successful replacement.'
  requirement_category: refinement
