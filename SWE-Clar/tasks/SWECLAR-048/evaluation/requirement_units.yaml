disclosure_design: controlled_requirement_disclosure
selected_scope: Independent synthetic video capture, pixel transformation and dual-input display application.
requirement_units:
- ru_id: RU-001
  name: Actual capture and decoded preview
  content: Preserve the README pipeline and public source/HTTP/browser interfaces. Open real loopback
    connections, parse complete source catalogs/frames, capture from explicitly chosen devices and emit
    valid PNG bytes. Preserve the source sequence in the frame header; display actual pixels on the browser
    canvas and keep live requests advancing as source sequences change. Startup may work with the supplied
    port or the included synthetic source. Render names/content as text. A source flag, prebuilt image
    or saved status is not a substitute for capture.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: What are the rules for actual capture and decoded preview?
  matching_keywords:
  - capture
  - frame
  - preview
  - PNG
  - source
  test_interface:
    type: api
    entry:
      command: python server.py --port 0 --db <isolated database> --camera-port <prepared source>
      protocol: HTTP/JSON, actual PNG frames and browser controls from README
    inputs: Synthetic RGB streams, device catalogs and DOM/API events
    output: Decoded image pixels, source interactions and persisted/runtime control behavior
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  notes: Source establishes multi-source capture and external input switching; host, video patterns, protocol
    and exact rules are independent benchmark designs, without original hardware compatibility claims.
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/camera_contract.py
- ru_id: RU-002
  name: Resolution and image geometry
  content: Accept exactly 640x480, 1280x720 and 1920x1080; changing resolution changes each subsequent
    frame and canvas intrinsic dimensions. Use the public nearest-neighbor centered-crop formula for every
    pixel. Preserve current device, zoom, input and kiosk values when resolution changes; reject other
    values with invalid_resolution and no state mutation. Frame data comes from the source and remains
    correct across non-square sizes and more than one source.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
