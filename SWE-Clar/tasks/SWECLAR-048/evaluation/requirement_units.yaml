- ru_id: RU-004
  name: Keyboard, controller and display behavior
  content: 'Keyboard codes Enter/Escape/Equal/Minus and virtual controller buttons 0/1/4/5 map respectively
    to select/back/zoom_in/zoom_out. Select toggles kiosk; back exits kiosk and selects preview while
    preserving zoom, device and resolution. Zoom in/out step through 1,2,4 and clamp at the endpoints.
    Both input routes set last_action to the canonical action and produce identical effects. Unknown codes/buttons
    or boolean button IDs fail without changes. Display events select preview or auxiliary and preserve
    other values. Auxiliary must capture its separate input stream and visibly replace preview pixels;
    switching back resumes the selected camera. Kiosk really hides #controls and expands the monitor to
    the viewport; it must not stop capture or require browser fullscreen permissions.'
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
