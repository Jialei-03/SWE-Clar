- ru_id: RU-005
  name: Safe failures, persistence and recovery
  content: Malformed/truncated frames, wrong magic, invalid dimensions or payload lengths, invalid catalogs
    and timeouts return HTTP 502 and do not replace application state. Invalid controls return HTTP 400
    with an error object and no partial changes. No-device preview returns 409. On a failed live frame
    the browser clears the entire old canvas and shows a text error; it must not leave stale pixels that
    could be mistaken for current video. Continue polling and resume fresh decoded content after the source
    recovers. Persist only resolution and kiosk across process restart; reset zoom=1, display_input=preview
    and last_action=null, and rediscover devices. Concurrent successful controls must preserve each other's
    disjoint settings. Do not silently reload stale cached frames on failure.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: What are the rules for safe failures, persistence and recovery?
  matching_keywords:
  - failure
  - malformed
  - timeout
  - stale
  - recover
  - persist
  - restart
