- ru_id: RU-003
  name: Preferred source selection and reconnect
  content: 'Discovery preserves the supplied device order. If the previously selected ID still exists,
    preserve that choice even if a preferred device appears or the list is reordered. Otherwise choose
    the lexicographically smallest ID among preferred=true sources; if none are preferred, choose the
    first source in the catalog; if empty, select null. Preference is a validated field, never inferred
    from display name or fixed list position. Explicit selection overrides the default until it disappears.
    A successful rescan does not change resolution/zoom/display/kiosk. Invalid catalogs and source failures
    retain the entire previous state. Selection is transient across process restart: rediscover and apply
    the default.'
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
