- ru_id: RU-003
  name: Configuration authority and competing edits
  content: 'Only authenticated admins may change field settings, upload images or change placements. Editors
    may read all shared profiles, template, image library, generated documents and audit, edit profiles,
    and render documents. Enforce on the server for every request, independently of hidden/disabled controls.
    An authenticated editor''s restricted mutation returns 403 configuration_denied with no change; authentication
    precedes all feature validation. Actor identity and role come from the active stored session/account.


    Field `values` is a nonempty patch containing only color (#RRGGBB), background (#RRGGBB or null),
    font_size (integer 6 through 12), weight (normal/bold), border (boolean), visible (boolean). Unknown
    fields/keys and wrong types/ranges return 400 invalid_style. Merge only after validating the whole
    patch. Defaults: color #000000, background null, font_size 10, weight normal, border false, visible
    true. Color syntax is case-insensitive; normalize to uppercase. No automatic reset of unspecified
    properties. Apply value color, font size/weight to real PDF text; apply background across the panel
    and a border around it when selected. Labels stay black 8 pt; field invisibility removes both labels
    and value from all PDF text/drawing operations, without shifting other panels. Defaults/background-null
    are transparent, allowing a background watermark to be visible.


    Both configuration endpoints require integer expected_revision >=0, representing the last fetched
    global template revision. Bad/missing type gives 400 invalid_revision. Compare against current revision
    atomically; mismatch is 409 revision_conflict, even if requested values equal current ones. A successful
    effective change increments revision by exactly one; a valid no-op returns the unchanged template
    without incrementing or appending an audit event. Two changes submitted with the same expected revision
    cannot both apply; one succeeds and one conflicts. Asset uploads do not change the template revision.
    On conflict the browser shows the conflict and refreshes saved template/revision, retaining any draft
    visibly without claiming it was saved; a subsequent explicit retry can use the new revision. Do not
    silently overwrite another admin''s edit.'
