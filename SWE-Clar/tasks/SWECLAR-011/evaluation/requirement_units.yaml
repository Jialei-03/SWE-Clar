requirement_units:
- ru_id: RU-001
  name: Authenticated persistent profile application
  content: 'Profile `php-document`, Linux AMD64, PHP 8.3.28, TCPDF 6.8.2 with DejaVu Sans fonts, SQLite,
    GD, mbstring and bcmath; Python 3.12.3, Chromium/Playwright, pypdf 6.10.0, pypdfium2 5.13.0, Pillow
    12.3.0 and zxing-cpp 3.0.0 are preinstalled. TCPDF_ROOT=/opt/sweclar/tcpdf. No Composer install, server
    download, external account, original file or network access is needed. The image is prepared and its
    protected preflight completed before agent work starts.


    Workdir /workspace. Writable application data lives under DOCUMENT_DATA_DIR (default /workspace/data);
    the app creates it as the candidate UID. `php init.php --reset` resets only this selected application''s
    database and initializes synthetic accounts/profiles. `php -S 0.0.0.0:8000 router.php` starts the
    app; visit http://127.0.0.1:8000/. Ctrl-C stops it. Set DOCUMENT_DATA_DIR to a fresh writable directory
    to isolate a separate attempt. `python /public_tests/test_public.py` owns a separate temporary data
    directory and an ephemeral loopback server, exercises the app, terminates its server and leaves a
    manually started app untouched. `php -l router.php` is a basic syntax check; the public tests check
    all supplied PHP files. Errors go to the server terminal. Resources: 2 CPU, 2 GiB memory/swap ceiling,
    256 PIDs, 512 MiB workspace, 1 GiB /tmp; loopback-only execution, unprivileged UID 1000, zero capabilities.
    Dependencies and evaluator files are protected.


    ## Existing foundation (public RU-001)


    The shared workspace has accounts `admin-a`, `admin-b` (admin) and `editor-a` (editor); all demo passwords
    are `demo-pass`. These are synthetic local credentials. Store password hashes and opaque session tokens
    server-side. Authentication is established by login and the HttpOnly, SameSite=Strict `document_session`
    cookie; neither request actor/role fields nor role-like headers grant authority. Logout invalidates
    the session. Every /api route except login requires an active session. Static UI is readable without
    login and shows the login form. No app data is embedded into static assets. Request bodies are data,
    never executable paths or code. Persist profiles and sessions in SQLite; restart preserves completed
    changes. Database schema is supplied as maintainable starter context, but equivalent schemas are accepted
    if behavior and actual persistence match.


    Profiles are shared synthetic records. Both roles can list, create and update them. Each profile has
    an `id` matching `[a-z][a-z0-9-]{0,39}` and a `values` object with exactly these six keys: document_id,
    name, group, contact, reviewer, reference. Values must be nonempty valid UTF-8 strings, at most 160
    UTF-8 bytes each, using printable codepoints listed in the supplied `fixtures/supported_codepoints.json`
    inclusive ranges; whitespace-only is invalid, but accepted values are preserved verbatim. The public
    range file is derived from the intersection of glyphs in both preinstalled DejaVu Sans regular and
    bold fonts; it includes Latin and Arabic for this bilingual application. Unsupported codepoints (for
    example CJK or emoji absent from these fonts), control characters and invalid UTF-8 return invalid_profile
    rather than a misleading successful PDF with missing glyphs. Input alphabet validation is provided
    in the existing foundation and public tests; it is not a clarification puzzle. IDs are immutable.
    Reject invalid input before saving, return 409 for duplicate creation, 404 for unknown update. The
    demo includes two independently written records. This baseline is implemented in the starter and protected
    by public regression tests.


    Routes and success shapes, all public:


    - POST /api/login `{username,password}` -> 200 `{user:{id,role}}`, sets cookie; invalid credentials
    401.

    - POST /api/logout `{}` -> 200 `{ok:true}`, expires cookie and invalidates token.

    - GET /api/session -> 200 `{user:{id,role}}`.

    - GET /api/profiles -> 200 `{profiles:[{id,values},...]}` sorted by id.

    - POST /api/profiles `{id,values}` -> 201 `{profile:{id,values}}`.

    - PUT /api/profiles/{id} `{values}` -> 200 `{profile:{id,values}}`.

    - GET /api/template -> 200 `{revision,styles,placements}`. One global template, shared by both document
    kinds. Default revision 0, no placements, defaults for every field.

    - PATCH /api/template/fields/{field} `{expected_revision,values}` -> 200 `{revision,styles,placements}`.

    - POST /api/assets multipart field `image` -> 201 `{asset:{id,sha256,width,height}}`.

    - GET /api/assets -> 200 `{assets:[{id,sha256,width,height},...]}` ordered by id; GET /api/assets/{id}
    returns the actual uploaded PNG bytes.

    - PUT /api/template/placements/{slot} `{expected_revision,asset_id}` -> 200 `{revision,styles,placements}`.
    `asset_id:null` is the public representation for clearing a slot.

    - POST /api/render `{profile_id,kind,filename}` -> 201 `{document:{filename,kind,profile_id,bytes,sha256,revision}}`.
    `revision` is the template snapshot used. The response supplies a `/api/documents/{filename}` download
    URL implicitly through this public route.

    - GET /api/documents -> 200 `{documents:[{filename,kind,profile_id,bytes,sha256,revision},...]}` sorted
    by filename.

    - GET /api/documents/{filename} -> 200 application/pdf, Content-Disposition attachment with safe filename,
    actual stored PDF bytes.

    - GET /api/audit -> 200 `{events:[{id,actor_id,type,target,revision,timestamp},...]}` in increasing
    integer id order.


    Errors: JSON `{error:{code,message}}`, no stack trace or partial success. Public general errors are
    400 invalid_json/invalid_profile/invalid_request, 401 authentication_required/invalid_credentials,
    404 not_found and 409 profile_exists. The full contract specifies other feature errors below; callers
    need not guess undocumented routes. Unknown route is 404. Do not accept path separators, traversal
    or arbitrary local/remote URLs as asset or document inputs.'
