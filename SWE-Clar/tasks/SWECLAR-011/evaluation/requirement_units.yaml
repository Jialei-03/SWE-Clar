- ru_id: RU-002
  name: Real bilingual sample PDFs and browser downloads
  content: '`kind` is sample_card or sample_pass (no native/official semantics). `filename` matches `[A-Za-z0-9_-]{1,64}\.pdf`;
    valid profile_id selects the current persisted profile. Produce exactly two landscape A5 pages, 210
    by 148 mm, front then back; both prominently display SAMPLE / NOT VALID. Do not substitute HTML, an
    image of a whole page, a status manifest or a blank PDF. Text remains extractable and is rendered
    with an embedded DejaVu Sans family supporting Latin and Arabic. Preserve every visible field value,
    including accents, Arabic and long values; wrap rather than shrink below the configured font size
    or clip/overlap. Arabic labels use joined glyphs and right-to-left direction. Test normalization permits
    equivalent Unicode presentation forms, font subsets and extraction order; it does not require one
    PDF byte sequence.


    Public layout envelope: 10 mm side margins; three field panels per page at y=25,54,83 mm, each 190
    by 29 mm. Labels occupy the first 5 mm (French left, Arabic right, 8 pt), and values the remaining
    24 mm with 6 mm line spacing, at most 12 pt. Front: document_id, name, group. Back: contact, reviewer,
    reference. Labels respectively: Identifiant / المعرّف; Nom / الاسم; Groupe / المجموعة; Contact / جهة
    الاتصال; Révision / المراجعة; Référence / المرجع. Values may be Latin or Arabic; preserve readable
    direction. Equivalent flow within these nonoverlapping public envelopes is valid; exact internal API
    or text-object ordering is not required.


    Reserved image slots are public geometry: front_left=(10,5,20,18), front_right=(180,5,20,18), back=(180,5,20,18),
    watermark=(60,30,90,80), in mm. Fit source images within their slot preserving aspect ratio and center
    them; do not fill with a surrogate color or filename. Space at x=20,y=113,width=170,height=28 on the
    back is reserved for machine-readable reference output; its business encoding is discoverable. SAMPLE
    marking stays visible regardless of field/asset configuration.


    The browser must support login/logout, browsing and editing profiles, choosing a profile/kind/filename
    and generating/downloading a PDF, field settings, image upload/preview and placement, and readable
    audit. Publicly documented form labels/roles should be used for accessibility; testing accepts equivalent
    DOM structure. Features requiring a policy decision can show unfinished feedback in the starter. After
    successful mutations, browser views use returned/refetched persisted state; after rejection they show
    the server''s readable error and preserve the saved state. No success banner before the server accepts
    an operation. Reload must restore saved data. A PDF download triggered from the browser must contain
    actual PDF bytes. A PDF embed or link can supply preview; no proprietary browser plugin is required
    for acceptance.'
