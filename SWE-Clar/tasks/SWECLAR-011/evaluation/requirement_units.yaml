- ru_id: RU-004
  name: Uploaded images, watermark and PDF417
  content: 'Only admins upload; accept a single genuine PNG image from multipart `image`. The actual image
    decoder must confirm PNG format (not just filename or MIME), width and height each 8..1024 inclusive
    and at most 262144 uploaded bytes. Ignore supplied filename as a storage location. Reject malformed/truncated
    image data, disguised JPEG/text, missing image or out-of-range size/dimensions with 400 invalid_asset.
    Valid images are stored as their exact original bytes, addressed by generated opaque ids, with independently
    correct SHA256, width and height; different uploads receive different ids even if bytes repeat. No
    metadata or source identity is supplied in official synthetic fixtures. Storage may be a SQLite BLOB
    or managed files under the selected data directory, but it must survive restart and never expose unrelated
    files.


    Slot must be one of the four public names and asset_id must be a currently stored id or null (clear).
    Invalid slot/id gives 400 invalid_asset with no revision, placement or audit change. Apply the RU-003
    revision check and admin policy. Persist placements and embed the actual corresponding PNG on the
    correct page when rendering; replacement and clearing take effect on future exports, not existing
    PDF downloads. Front_left/front_right appear on the front and back on the back for both kinds. Watermark
    appears on both sample_pass pages at opacity 0.15 behind field content; never on sample_card. Existing
    opaque field backgrounds may cover watermark in their own panel; an uncovered watermark must remain
    visibly present. Do not leak hidden field text under the watermark or in invisible layers.


    Every back page includes a real decodable PDF417 barcode containing the selected profile''s reference
    UTF-8 bytes verbatim, without normalization, prefix, JSON wrapper or newline. It is independent of
    whether the reference text field is visible. Do not encode an asset id or display a textual barcode
    placeholder. Preserve a light quiet zone so it decodes with the provided independent decoder at ordinary
    rendering resolution. Same logic applies to both kinds.'
