- ru_id: RU-005
  name: Transactional document publication and audit
  content: 'All accepted effective configure_field and place_asset changes, each successful upload_asset,
    and each successful render append exactly one durable audit event in the same logical commit as their
    effect. Event actor_id is the trusted session user''s id, type is one of these four names, target
    is respectively field/slot/generated asset id/filename, revision is the resulting template revision
    for configuration, current revision for upload, and the snapshot revision used for render. Timestamp
    is integer UTC Unix seconds obtained server-side at commit, never a body-supplied value; monotonic
    ids preserve order even within one second. User-supplied actor_id/type/timestamp extra fields do not
    control attribution. Invalid attempts, forbidden attempts, conflicts, no-op patches and reads create
    no audit events. Profile CRUD and auth do not enter this document-feature audit.


    Rendering is allowed for both roles and uses a consistent snapshot of current profile, template and
    PNG content. Profile field validation also runs when loading the selected profile: absent/invalid/empty/overlong
    values produce 400 invalid_profile before publication. Bad kind or filename is 400 invalid_request;
    unknown profile is 404 not_found. Output validation happens on the actual generated bytes. A success
    commits a complete PDF and its matching metadata/audit, replacing a previous document with the same
    filename atomically. Existing downloads remain byte-for-byte unchanged when later profiles/templates
    change or when rendering fails. Output bytes and SHA are computed from the actual stored PDF, not
    self-reported placeholders. Missing/corrupt backing asset bytes cause 422 asset_unavailable; unexpected
    generation/storage failure is 500 render_failed. Neither failure reports a successful document nor
    publishes a partial file, replacement, output metadata or audit event. No dangling files from failed
    operations may remain in the application data directory. Temporary work may be cleaned from /tmp.
    Failed style/asset validation never partially applies the rest of a patch.


    Serialize updates sufficiently to preserve revisions, PDF snapshot and audit consistency. A SQLite
    transaction with PDF BLOB storage is one valid implementation, not a mandated schema. Local data backing-store
    fault injection in hidden evaluation is performed only on isolated evaluator-created data with a fresh
    process; it tests recovery/atomicity, not malicious access to benchmark files or candidate source
    pattern matching.'
