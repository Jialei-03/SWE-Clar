- ru_id: RU-005
  name: Atomic rescheduling, revisions and retry behavior
  content: 'The owning patient or staff in the same clinic may move an appointment; all other authenticated
    callers receive 404. Input includes a valid operation_id, existing target slot id and positive integer
    expected_revision (booleans excluded).


    For a NEW move operation, the appointment must be active, its current start and target start must
    both be strictly greater than now_ms, and expected_revision must equal its current revision. The target
    must be a different unoccupied slot for the SAME provider and clinic. Unknown target is 404; same
    slot, foreign provider, nonfuture, occupied, cancelled appointment or stale revision is 409. Rejected
    operations reserve neither an operation_id nor a slot.


    Release old occupancy, claim target occupancy, update the appointment''s slot/start/end, increment
    revision exactly once, set updated_at_ms to now_ms and write the replay record in one transaction.
    Preserve appointment id, patient, clinic/provider, created_at_ms and null cancel_reason.


    Replay keys are scoped to authenticated actor plus operation_id, across that actor''s appointments.
    Record the original appointment id, target slot and expected revision. An exact authorized replay
    returns the same appointment''s CURRENT fields with 200, even if a later move/cancel/time change occurred.
    Reuse with a different appointment, target or original expected_revision is 409. Different actors
    may use the same operation_id independently; authorization is checked before lookup or disclosure.


    Concurrent move attempts with the same expected revision permit at most one new commit. Concurrent
    move/book to the same target leaves at most one occupant. A move racing a cancellation must yield
    a state consistent with one legal serial order: cancelled appointments occupy no slot, active appointments
    occupy exactly their current slot. Lost replies, restarts and retries do not duplicate revision increments
    or reapply an old move.


    Storage failure must leave old occupancy, new occupancy, appointment revision/timestamps and replay
    records unchanged. The same failed operation may be retried successfully once storage recovers.


    The Flutter move dialog lists available slots for the appointment''s provider, submits the displayed
    revision and a generated operation_id, shows updated times on success and preserves the prior displayed
    appointment on failure. Reuse the operation_id and original payload for a retry after a lost response;
    double taps while pending do not create competing intents. After a conflict, refresh the appointment
    before allowing a newly selected action. No persistent device intent storage is required across a
    fresh client process.'
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the requirements for atomic rescheduling, revisions and retry behavior.
  test_interface:
