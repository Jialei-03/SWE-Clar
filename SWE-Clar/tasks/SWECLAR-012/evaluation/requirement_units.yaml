- ru_id: RU-003
  name: Atomic booking, request replay and private histories
  content: 'Only a patient can create a booking, always for that authenticated patient. A new request
    requires an existing future unoccupied slot. Unknown slot is 404; nonfuture or occupied slot is 409.
    Staff booking is 403. No additional patient-overlap or clinic-membership restriction applies.


    Creation, occupancy and the patient''s request_id replay record commit in one SQLite transaction.
    Concurrent attempts for one slot produce exactly one active booking. Repeated identical requests by
    the same patient return the same appointment with its CURRENT fields and 200, including after move/cancel
    or after the slot becomes past. A request_id reused by that patient for a different ORIGINAL slot
    receives 409 even if that slot is available. Different patients may use the same request_id independently.


    New appointments have status active, revision 1, cancel_reason null, creation/update times equal to
    the transaction''s now_ms and the selected slot''s clinic/provider/time. Appointment IDs are globally
    unique and opaque.


    Patient list/detail exposes only that patient''s appointments. Staff list/detail exposes all appointments
    in the staff member''s own clinic. Other authenticated users receive the same 404 for a foreign appointment
    as for an unknown appointment. Lists include cancelled/past appointments, ordered by current start_ms
    then id. No list/query/body parameter can widen the session''s scope.


    Real Flutter booking and appointment cards must reflect committed server state, including errors and
    status. The booking intent''s generated request_id is reused when an HTTP response is lost and the
    user retries the same pending action, until success or explicit abandonment/selection of another action.
    Double taps while pending must not create multiple intents. No requirement to persist an unacknowledged
    intent across a fresh client process.


    Storage failures must return a non-success response and retain the pre-operation state; no partial
    booking or replay key may remain. Durable booking, replay behavior and private history survive service
    restart.'
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
