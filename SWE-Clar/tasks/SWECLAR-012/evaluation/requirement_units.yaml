- ru_id: RU-004
  name: Authorized cancellation and slot reopening
  content: 'The owning patient or staff in the appointment''s clinic may cancel. Other authenticated callers
    receive 404 not_found. Syntactically valid but unknown appointment IDs also receive 404.


    Reason must be a JSON string; strip leading/trailing Unicode whitespace and require 1..200 Unicode
    codepoints after trimming, otherwise 400. Validate the supplied reason before applying or replaying
    cancellation.


    First cancellation of an active appointment requires current start_ms > now_ms, sets status cancelled,
    stores the trimmed reason, increments revision once and sets updated_at_ms to now_ms. The appointment
    remains in history and its slot becomes available if still future. Creation time and current slot
    are unchanged.


    Cancellation of an already cancelled appointment with another VALID reason is an idempotent 200 replay:
    preserve the first reason, revision, timestamps and state even after the slot becomes past. Cancellation
    of an active appointment at or after start is 409. Replay must not accidentally free a slot occupied
    by a later different booking.


    Commit cancellation and release of occupancy atomically. Concurrent cancellations preserve exactly
    one first reason/revision increment. Storage failure leaves all appointment/availability data unchanged;
    successful behavior persists across restart.


    The Flutter cancel dialog is reachable for authorized active appointments, requires a reason and refreshes
    status/availability on success. Rejection leaves the prior displayed record intact and displays the
    error. Cancelled records remain visible in the appointment list.'
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
