- ru_id: RU-005
  name: Owned location edits and live shared geometry
  content: 'Only the waypoint owner with a complete profile may edit coordinates; preserve its name, owner
    and ordered photo_ids regardless of caller extras. Validate coordinates/revision and enforce exact
    current revision; stale requests return409 with no mutation. For a changed coordinate pair, atomically
    save both values and increment revision once. An identical pair with matching revision is a successful
    no-op preserving revision. Unknown waypoint404; another user''s known waypoint403. An unsuccessful
    edit changes no comments, route references or other waypoint.


    Every route detail resolves the edited current coordinates, including routes created by other users.
    Refreshing the browser updates the map marker, selected route line and stop-coordinate display without
    a page/server restart. The edit control sends the last-read revision; on409 reload the current waypoint
    and geometry, report the conflict, and allow a deliberate retry. A coordinate edit never renames the
    waypoint or starts touring.'
