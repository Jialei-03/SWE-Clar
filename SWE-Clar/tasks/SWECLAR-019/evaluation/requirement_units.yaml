- ru_id: RU-004
  name: Personal pins and explicit touring-status submission
  content: 'Pin is a set membership for the current user/route pair. Setting true twice or false twice
    succeeds without duplicates; pinning one route does not unpin others. Pin changes persist across restart
    and affect only that user''s catalog grouping. The actual pin control updates membership/catalog without
    opening or switching the route; enforce the public clickable-area requirement.


    Touring status belongs to the current profile. Choosing a select option changes only the pending UI
    choice; do not send a status mutation until Submit. Submit persists exactly the selected allowed value
    for that user, while preserving name/photo, other users, routes, pins and waypoints. Invalid status
    returns400 without mutation. Signing out without submitting discards the pending selection. Repeated
    submission of the same status is harmless. Profile updates and waypoint/route creation never overwrite
    a saved touring status.'
