- ru_id: RU-006
  name: Immediate durable comments and semantic retries
  content: 'Comments append to the targeted waypoint and are immediately readable by the author and other
    authenticated users after the successful response. Keep append order and trimmed-but-interior-preserving
    text; no HTML execution. request_id is an idempotency key scoped to the current user across all waypoints.
    A first valid request creates one comment and returns201. Repeating the same key with the same waypoint
    and normalized text returns200 with the same persisted comment ID, without another comment or reordered
    history. Same key with different target or normalized text returns409; no partial mutation or key
    consumption on invalid/failed requests. Another user may independently use the same key. This successful
    replay survives server restart, and concurrent identical requests commit exactly one comment. Ignore
    caller author/ID/state fields.


    The visible Send control generates a new key for a new intentional comment and keeps that key for
    retrying the same submitted target/text after a transport failure. An explicit change of target or
    normalized text is a new intent with a new key. A successful send refreshes actual comments and clears
    the draft; repeating the same text as a later intentional submission is allowed to create a new comment.
    A lost success response followed by a retry must not duplicate the stored comment. A delayed response
    cannot restore an old account or selected waypoint; request cancellation and promise-return choices
    are free if current visible behavior is correct.'
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
