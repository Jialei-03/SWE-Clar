- ru_id: RU-003
  name: Stable alphabetic catalog ordering
  content: After filtering, list the requesting user's pinned routes first, then unpinned routes. Within
    each group sort title by ASCII case-folded Unicode code-point order, ascending forasc and descending
    fordesc. Equal folded titles retain route creation order in both directions; do not reverse ties when
    descending. Do not change stored route waypoint order or pin records when sorting/searching. Another
    user's pins have no influence. The browser Apply control submits the chosen sort/query and replaces
    the visible catalog accordingly, while retaining a selected route's detail even when a filter hides
    it. Catalog reordering is not route traversal reversal. Pin-precedence checks depend on the pin mutation
    in RU-004.
