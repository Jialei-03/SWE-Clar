  name: Existing waypoint, ordered-route and map foundation
  content: Preserve real waypoint and route creation, public authenticated lists/details, validated coordinate/photo/waypoint
    inputs, stable IDs and ordered references. Filter route titles using the public ASCII case-insensitive
    substring rule. Creating a route preserves the explicitly supplied unique waypoint order; actual map/stop
    output follows that order using current coordinates. Display actual selected waypoint photos and literal
    names. No created waypoint starts a ride or changes touring status. Reset selected photos after successful
    waypoint creation so the next waypoint does not inherit them. Existing map markers/selection, image
    controls and HTTP/SQLite records must remain functional; a tiny state-only replacement is not a complete
    solution.
