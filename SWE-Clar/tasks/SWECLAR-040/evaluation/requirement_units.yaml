- ru_id: RU-005
  name: Browse and search
  content: Browse every group with named status and all associated image keys; search assigned names case-insensitively
    and show actual stored image previews. Refresh/restart retains labels and memberships. Unnamed groups
    do not appear in a nonempty name search. Fixture images contain only synthetic geometry, never customer
    or personal photographs.
