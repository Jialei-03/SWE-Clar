- ru_id: RU-003
  name: Review submission attachments
  content: The accepted reviewer may submit a review with zero to five supplied image references from
    gallery or camera, while the optional URL may be omitted without blocking the workflow. Submission
    requires the accepted review to be active and its listing payment to be held. Submission changes the
    review to submitted; this is required before approval.
