- ru_id: RU-004
  name: Linked payment and approval payout
  content: A payment records the listing, payer, reviewer, gross amount, eligible reviewer amount, and
    platform fee using the supplied fee rate; approval releases the eligible amount exactly once and preserves
    the transaction linkage. Only the owning lister may pay the agreed listing price or approve its submitted
    review. Payment moves the listing to in_review. Approval moves it to completed and releases the linked
    held payment into one local payout record. A duplicate identical payment event is a no-op; a reused
    event ID with different payment details is rejected. Round the platform fee to two decimal places
    using decimal half-up rounding, then subtract from gross for the eligible amount. Repeated completed
    approval creates no additional payout.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
