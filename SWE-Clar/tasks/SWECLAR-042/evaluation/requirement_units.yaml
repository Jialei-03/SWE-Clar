selected_scope: Review assignment, fee allocation and approval-ledger module
requirement_units:
- ru_id: RU-001
  name: Review workflow entry point
  content: Process one listing, review application, acceptance, submission, payment, approval, profile-image,
    or deletion action into a new state without mutating inputs or exposing payment credentials. Preserve
    the provided SQLite console adapter, which commits each successful state transition atomically and
    restores it on the next invocation. The JSON interface and all field names are specified in the public
    README. Rejected actions return an error.code and do not change saved state. This is a local ledger,
    not an external money-transfer or authentication service. Actor identity fields are trusted upstream
    identity inputs. An acting user must exist in users and sessions; inactive or unknown actors are rejected.
    This check does not implement authentication itself.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for review workflow entry point.
  test_interface:
    type: function
    entry:
      language: python
      file: solution.py
      function: process_review_action
      signature: 'process_review_action(state: dict, action: dict) -> dict'
    inputs:
      arguments:
      - state
      - action
      action_variants:
        profile_image:
          fields:
          - image_ref
          - type
          - user_id
      protocol_fields:
      - fee_rate
      - image_ref
      - sessions
      - type
      - user_id
      - users
    output:
      type: dict
      meaning: Next workflow state or error.code; public README defines record keys and envelopes. Additional
        nonconflicting metadata is allowed.
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/test_solution.py
  notes: Source-grounded workflow with independent synthetic IDs, state schema, configurable fee, decimal
    rounding and replay policy. Image references and payment records are local domain data, not evidence
    of photo storage or real transfers. No client records or original code are supplied.
- ru_id: RU-002
  name: Listing and review state flow
  content: A reviewer may apply to an open listing; only the lister may accept one pending application,
    after which the listing waits for payment and the accepted review becomes the active review for that
    listing. The lister cannot apply as the reviewer of their own listing. Creation produces an open listing;
    applications are pending until accepted. Acceptance creates the associated review with the application
    ID and records active_review_id on the listing.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for listing and review state flow.
  test_interface:
    type: function
    entry:
      language: python
      file: solution.py
      function: process_review_action
      signature: 'process_review_action(state: dict, action: dict) -> dict'
    inputs:
