- ru_id: RU-005
  name: Run audit and secret safety
  content: Record processed,created,updated,skipped,failed counts and run_id per completed operation.
    Reject malformed source/destination service responses as service_failed. Recursively remove credential
    fields from returned state and outbound destination records, including token,secret,credential,credentials,webhook_url,api_key,connection,private_connection,password,authorization,access_token,refresh_token
    and client_secret, matching case-insensitively after trimming key whitespace. Client transport credentials
    remain outside returned state. A failed or invalid run must not report successful delivery.
