  name: Operational-field preservation
  content: A synchronization update must preserve destination-owned workflow fields, including status,
    assignee, notes, first-contact date (first_contact_date), estimated students (estimated_students),
    and annual license value (annual_license_value). Read existing destination fields from the HTTP service
    before merging; a stale caller state must not overwrite newer workflow-owned values.
