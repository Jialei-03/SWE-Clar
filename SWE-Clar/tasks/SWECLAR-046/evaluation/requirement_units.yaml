requirement_units:
- ru_id: RU-001
  name: Pipeline entry point
  content: Complete the existing data-layer project with actual HTTP source reads, destination reads/writes
    and outreach connector requests through PipelineClient. Preserve input objects and report actual outcomes
    instead of trusting caller-supplied rows or accepted flags. Validate a supplied run_id as a nonempty
    string before any request; missing run_id uses the next local run number.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for pipeline entry point.
  test_interface:
    type: function
    entry:
      language: python
      file: solution.py
      function: process_pipeline_event
      signature: process_pipeline_event(state,event,service=None) -> dict
    inputs:
      arguments:
      - state
      - event
      action_variants:
        pipeline_event:
          fields:
          - type
      protocol_fields:
      - type
      service: PipelineClient(source_urls,destination_urls,outreach_url,token=None)
    output:
      type: dict
      meaning: State, result/run summary or error.code as defined in public README. Extra nonconflicting
        metadata is allowed.
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/test_solution.py
  notes: Independently reconstructed local HTTP integration. Vendor names and business-specific fields
    generalized; exact acknowledgement, idempotency, run accounting and credential-key rules are synthetic
    conventions. No original workspace or actual outreach delivery is included.
- ru_id: RU-002
  name: Idempotent source synchronization
  content: For sync, GET the configured source URL (JSON array) and destination URL (JSON object keyed
    by source ID). Normalize nonempty string/integer source_id to a string, reject bool/invalid IDs per
    row, and PUT each valid merged row to destination_url/<URL-encoded source_id>. Count a write only
    after a 2xx JSON response with accepted=true and matching source_id. Create new rows with status=new
    and update existing rows without duplication. Transport/acknowledgement failure leaves that locally
    confirmed destination row unchanged, counts failed and does not prevent later rows.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for idempotent source synchronization.
