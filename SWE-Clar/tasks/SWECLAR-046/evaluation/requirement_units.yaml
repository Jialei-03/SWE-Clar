- ru_id: RU-004
  name: Outreach delivery guard
  content: For queue_outreach, refresh the destination from HTTP. Only a new row with a nonempty email
    on channel=email is eligible. POST {delivery_id,email} to outreach_url with Idempotency-Key=outreach:<destination>:<source_id>;
    require a 2xx response with accepted=true and matching delivery_id, then persist status=queued through
    the destination PUT contract before recording success/outbox. Failures leave the row locally unqueued
    and retry uses the same delivery ID. The connector honors idempotency when a prior delivery succeeded
    but status persistence failed. LinkedIn or missing-email rows remain manual and are never submitted.
    Already queued rows are skipped.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for outreach delivery guard.
