- ru_id: RU-004
  name: archive lifecycle and in-flight boundaries
  content: 'POST archive with archived=true hides the competitor from active listing and blocks new snapshots
    with 409 for an account with active full access, without fetching or deleting URLs, snapshots or history. For a new snapshot initiated while both the account is nonwritable and the competitor is archived, return 403 before the archive check, with no upstream fetch or mutation. Exact successful snapshot replay remains a read, and the in-flight transition rules below still return 409. Repeating the same archive action
    is idempotent. archived=false restores an archived competitor without changing its saved monitoring
    state; restore needs an active full subscription (403 otherwise). Archive is permitted while inactive
    so an account can stop monitoring. Archived history/detail and CSV remain readable by their owner.


    If a competitor is archived at any time after a snapshot begins and before it commits, discard the
    fetched result and return 409, even if it was restored before the fetch ended. If the account loses
    active full access at any point in that interval, also discard with 409, even after reactivation.
    These transitions must be visible to pending operations; an idempotent repeated archive or an exact
    receipt replay is not a transition. A failed/stale operation leaves no snapshot, event or new baseline
    and does not consume its snapshot ID. Retry after restoration uses current state normally. Provider
    request observations will establish that denied new operations do not contact the upstream.'
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
