selected_scope: Independent competitor-monitoring web application with static HTML change history and
  local provider-backed subscriptions
requirement_units:
- ru_id: RU-001
  name: runnable authenticated workspace
  content: 'Maintain a real browser/HTTP/SQLite project with a working sign-in flow and competitor directory.
    Python 3.12, SQLite, Chromium and Playwright are prepared before development. A benchmark-owned synthetic
    page and subscription receipt provider is already running on loopback. The application process is
    normal development work; preparing the provider or installing tools is not.


    Authentication uses fixture account IDs and passwords, opaque unguessable bearer sessions and server-side
    account authority. Invalid credentials or sessions return 401; logout invalidates that session. A
    session never authorizes another account. Passwords and session collections must never appear in public
    API responses. Fixture passwords are synthetic local credentials, not real secrets. The interface
    displays literal user/competitor/page text, works at 390x844 and 1280x900 without horizontal overflow,
    and has pending/error/empty states and retry controls. Switching accounts clears all previous account
    detail immediately; late responses cannot repopulate it. Persist business state across application
    restarts using the same database; a new database imports fresh fixtures.


    Public commands, API/data shapes, selectors, resource limits, service contracts and the complete foundation
    rules are in raw/starter_code/README.md. The starter implements this foundation and RU-002. The unfinished
    monitoring, archive and subscription workflows must require real application work, not label changes
    or ready flags. Hidden workflow buttons may already communicate their broad purpose; their detailed
    business decisions are not initial information.'
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the decisions for runnable authenticated workspace.
  test_interface:
    type: command
    entry:
      language: python
      file: server.py
      command: python server.py --port 8000 --db monitor.sqlite --fixtures fixtures/demo.json
    inputs:
      transport: Browser and authenticated HTTP against actual local provider
    output:
      type: web_application
      meaning: Persistent SQLite state, live browser behavior and real downloaded CSV
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/monitor_contract.py
  notes: Business-scenario-derived independent reconstruction. No original application, screenshot or
    customer account is required.
- ru_id: RU-002
  name: account-owned competitor directory
  content: 'Each competitor belongs to the authenticated account and has an account-scoped unique competitor_id,
    trimmed nonempty name of at most 120 Unicode characters, and one through ten distinct normalized tracking
    URLs. URL IDs are unique within the account, generated by the app, opaque to clients and stable across
    restart. IDs in public commands/fixtures match [A-Za-z0-9_-]{1,64}. Duplicate competitor IDs are 409;
    invalid fields/duplicate URLs are 400. A normalized URL may be monitored by different competitors
    or accounts independently.


    Creation accepts URLs on the configured page provider''s exact HTTP origin only, with a /pages/ path
    and one following slug matching [A-Za-z0-9_-]{1,64}. Reject userinfo, whitespace, malformed port,
    percent-encoded path segments, other origins, other protocols and non-page paths. Normalize the scheme/host
    to lowercase, strip the fragment, and preserve path and query bytes (an empty query marker may be
    dropped). Input length is at most 2048 characters. Query strings do not affect the fixture provider''s
    page body but remain distinct tracking URLs. URL order on creation is retained by an ordinal column.
    The provider may be on a different loopback port in independent tests. No external network is available.


    List own competitors, with status active/archive/all (default active) and optional casefolded substring
    name search q. Sort by name.casefold(), then competitor_id. A detail response includes its URLs in
    ordinal order, current normalized text/hash, and last successful observation time or null. Foundation
    fixtures may contain archived competitors and existing subscription state. Missing and other-account
    resources both return 404. No create/update request may choose an owner, initial archive flag, subscription
    state or stored snapshot content. Competitor renaming and deleting/removing tracked URLs are outside
    this delivery; archive/restore manages lifecycle. Reload/list selection must not mix details from
    an older selected competitor.'
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
