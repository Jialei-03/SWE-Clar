- ru_id: RU-005
  name: provider-backed subscription and ordering
  content: 'The configured local provider represents independent synthetic subscription receipts, not
    a live commercial payment gateway. POST subscription accepts only receipt_id. Fetch its canonical
    record with actual HTTP from the configured receipt endpoint; never accept account, plan, status,
    sequence or provider URL from the caller. The provider''s receipt has id, account_id, sequence, plan,
    status. IDs are constrained as above; sequence is integer 1..2147483647 excluding booleans; plan is
    full or basic; status is active, cancelled or payment_failed. Unknown receipt is 404, malformed/unavailable
    provider response is 502, and a receipt belonging to another account is 403 without changing any account
    state. Reject redirects, non-JSON content types, non-identity content encoding, oversized responses
    above 16384 bytes, duplicate JSON object keys and extra/missing receipt fields. All provider response
    validation is part of the deliverable; infrastructure already serves the documented protocol.


    Within an account, record accepted receipts persistently. An exact canonical replay of a known ID
    returns duplicate=true and does not reinstate an old state; still obtain the provider record so conflicting
    reuse is detectable. Conflicting reuse of a known ID or a previously used sequence is 409. An unseen
    receipt with sequence below or equal to the current accepted sequence is 409, with no mutation. A
    new greater sequence atomically stores the receipt and updates account state. Concurrent delivery
    must leave the greatest successfully accepted sequence authoritative; an earlier receipt arriving
    afterwards is rejected as stale. No response may expose other accounts'' receipt data.


    Writable access is exactly plan=full and status=active. Inactive/basic/cancelled/payment_failed accounts
    may sign in, inspect subscription, read their directory/detail/history/downloads, archive competitors,
    and submit receipts to reactivate. They may not create competitors, initiate new snapshots or restore
    archived ones (403 and no upstream page fetch/mutation). Revocation preserves all monitoring data.
    An initial fixture may set valid subscription state with sequence=0 and no receipts; absent subscriptions
    default to basic/cancelled/0. A new account never gains access from an untrusted UI checkbox or client-supplied
    status. A transition from full-active to any nonwritable state invalidates in-flight snapshots as
    described in RU-004; higher-sequence full-active renewal does not invalidate them.


    The browser displays the actual current plan/status/sequence and read-only versus writable state,
    submits the receipt ID through the app, refreshes permitted controls and subscription state after
    success, and shows failures without falsely changing local access. Browser account/selection changes
    must not apply a previous account''s late subscription/snapshot responses. Server authorization remains
    authoritative even if UI buttons are manipulated. All transitions and replay/conflict handling survive
    restart.'
  requirement_category: refinement
