- ru_id: RU-003
  name: actual page snapshots and change history
  content: 'A new snapshot accepts exactly snapshot_id, url_id and observed_at_ms. Timestamps are JSON
    integers in [0,253402300799999], excluding booleans. The server actually GETs the registered normalized
    URL from the configured provider; it does not accept client-supplied HTML, hashes or extracted text.
    URL ownership is checked before any HTTP fetch. A successful observation needs active full subscription
    and an active competitor. See RU-004/005 for denial and concurrency rules.


    Accept only HTTP 200, media type text/html (case-insensitive, parameters allowed), no non-identity
    Content-Encoding, and 1 through 262144 raw body bytes. Decode strict UTF-8 with an optional leading
    BOM and reject NUL. Fetches use a finite timeout of 5 seconds; reject redirects without following
    them. HTTP/connection/timeout/invalid body failures return 502 and leave all business rows unchanged.
    Empty extracted text is valid when raw HTML is nonempty. The provider is available before the attempt;
    deliberate fixture HTTP errors and malformed bodies test candidate error handling.


    Normalize static HTML using parsed text, not JavaScript execution or CSS layout. Exclude all descendants
    of head, script, style, template and noscript, HTML comments and declarations; decode HTML character
    references. Add whitespace separators at start/end of address, article, aside, blockquote, br, dd,
    div, dl, dt, fieldset, figcaption, figure, footer, form, h1 through h6, header, hr, li, main, nav,
    ol, p, pre, section, table, tbody, td, tfoot, th, thead, tr and ul. Other inline elements concatenate
    their surrounding text. Collapse all Unicode whitespace to single ASCII spaces and trim. The hidden
    attribute and CSS display properties do not change this static-text algorithm. Compute lowercase SHA-256
    over normalized text encoded as UTF-8.


    First successful snapshot establishes a baseline with no change event. A later different normalized
    text creates exactly one content change event containing snapshot_id, url_id, observed_at_ms, before_text,
    after_text, before_sha256 and after_sha256. Identical normalized text adds a successful snapshot record
    and advances last observation time but produces no change event. Retain normalized snapshot text and
    hash for each success. Each new successful observation time must be strictly greater than that URL''s
    previous successful observation; otherwise 409 without another fetch if already known stale. Never
    roll state backwards when concurrent requests complete out of order: recheck this condition before
    commit.


    Snapshot IDs are scoped to the account. An exact successful replay of ID, URL and observation time
    returns the original snapshot and duplicate=true, performs no HTTP fetch or state mutation, and remains
    available as a read even after archive or subscription revocation. Reuse with different URL/time is
    409. Concurrent exact repeats yield one successful snapshot/event and consistent duplicate results;
    a second fetch while the first is in flight is acceptable, but duplicate commits are not. Failed requests
    do not consume their ID. Revalidate all commit eligibility after the fetch. No database-wide write
    lock may be held during a slow upstream response: archive and subscription operations must be able
    to complete while it is in flight.


    GET history returns own URL change events in observation time then snapshot_id order. CSV download
    uses UTF-8 and csv-compatible quoting, a header snapshot_id,observed_at_ms,before_text,after_text,before_sha256,after_sha256,
    and exactly these events in the same order. Actual CSV bytes must reparse correctly, including Unicode,
    commas, quotes and newlines represented in IDs/text where their input constraints permit. The browser
    can take a snapshot with a supplied ID and UTC time, shows the current normalized text/hash and ordered
    before/after history, and downloads an actual file. Render content literally, including strings that
    resemble markup. After a failed snapshot, retain the last successful view, show a failure, and allow
    retry with the same input ID/time. Selection/account changes invalidate pending detail/history results.'
  requirement_category: refinement
