- ru_id: RU-004
  name: Confirmed purchase and playback
  content: Credit tokens only once from a server-verified, paid synthetic receipt bound to the authenticated
    payment account and transaction. Update the displayed balance after purchase without reloading. Use
    server-owned track costs; atomically deduct tokens once when licensing a track. Only the licensed
    user may obtain its actual audio bytes. Actual audio advances, pauses, resumes and rejects backward
    seeking in the supplied player. Local signed receipts and license accounting are benchmark conventions;
    native DRM remains pending.
  requirement_category: refinement
