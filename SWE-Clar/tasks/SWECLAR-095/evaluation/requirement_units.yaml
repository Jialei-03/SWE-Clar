  name: Catalog search
  content: Search the supplied catalog by case-insensitive title or artist and return title/ID order;
    render the returned actual records and keep controls reachable at mobile and desktop widths. This
    exact search/order is a disclosed reconstruction choice for this independent component; do not claim
    a specific original search algorithm.
