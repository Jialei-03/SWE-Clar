requirement_units:
- ru_id: RU-001
  name: Streaming action entry point
  content: Run the supplied real React web application with HTTP/SQLite storage. Preserve working sign-in,
    account display, catalog and media controls. Persist accounts, balances and licenses across service
    restart; do not replace the website with a pure action-state function.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for streaming action entry point.
  test_interface:
    type: function
    entry:
      language: python
      file: server.py
      function: Store.act
      signature: Store.act(authenticated_user,path,action) -> persisted record
    inputs:
      authenticated_user: server-owned session identity
      path: documented HTTP endpoint
      action: synthetic request body
    output:
      type: dict
      meaning: Actual persisted result observed through HTTP, storage and rendered native/web interfaces
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/streaming_contract.py
  notes: Independent synthetic web component. Exact normalization, catalog, receipt and playback conventions
    are stated contracts; no native DRM or complete security certification is claimed.
- ru_id: RU-002
  name: Modular user registration
  content: Normalize registration email by trimming and case-folding. Query the independent local payment
    API, reuse its account if present, otherwise create it, and persist exactly one linked app account.
    Repeated or concurrent registration cannot duplicate the local user or payment account. Exact normalization
    and local account schema are benchmark conventions supporting the client-requested modular registration.
