- ru_id: RU-005
  name: Release acceptance
  content: Reject forged or mismatched receipts, unknown tracks, insufficient balances, unauthorized media
    and revoked sessions without partial writes. Do not expose the configured provider key or receipt
    key in frontend assets, HTTP records or static file paths. Test real controls and service boundaries;
    no ready/security-approved flags certify OWASP, SAST/DAST or complete accessibility compliance.
