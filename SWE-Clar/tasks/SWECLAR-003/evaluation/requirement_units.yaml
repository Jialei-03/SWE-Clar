- ru_id: RU-003
  name: Literal content and asset publication
  content: 'Use supplied locale, title and description in html lang, page title, meta description and
    visible hero content. Render each campaign''s literal name and its specified image in order, assigning
    unique nonempty card IDs. Treat all text as text: markup, quotes, ampersands and template-like tokens
    must not execute or substitute other content. Every referenced hero/card image must be declared in
    available_assets and be a real regular nonsymlink file in asset_root matching the public filename
    syntax; otherwise return invalid_asset. Unreferenced catalog entries do not need files. Copy only
    required images, preserving their bytes, and make them actually load in the generated page. Build
    failures for invalid_spec or invalid_asset leave any existing output unchanged and create no partial
    output on a fresh path. A successful rebuild replaces the entire dedicated output tree, removing stale
    generated files. Keep source and assets untouched. These exact publication rules are independently
    designed.'
