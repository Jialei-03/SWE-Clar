requirement_units:
- ru_id: RU-001
  name: Actual static-site build
  content: Complete the supplied independent Python/HTML/CSS/JavaScript project using the public README
    interfaces. build_campaign_site must write a usable index.html and local resources and return the
    declared result; the CLI consumes JSON stdin. Do not mutate the input. Identical input and assets
    produce identical file names and bytes. Preserve the real hero, cards, contact form and footer and
    use manager-prepared Python/Chromium. No install, external account, original code or customer asset
    is needed. Respect the public input shape, string limits, filenames, legal fragment syntax (including reserved accept/decline control IDs) and error
    interface. Validate input shape before asset resolution. Source/output trees use regular files and
    directories only.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: What rules govern actual static-site build?
  matching_keywords: []
  test_interface:
    type: command
    entry:
      command: python solution.py OUTPUT ASSETS < spec.json
      runtime: Prepared Python 3.12 and Chromium; no external network
    inputs:
      spec: JSON object defined in starter README
      output: Dedicated disposable output directory, disjoint from source and input assets
      assets: Benchmark-owned local image directory
    output:
      build: index_file index.html or error.code invalid_spec/invalid_asset
      browser: Actual static DOM, local image loading, localStorage consent/outbox and contact interactions
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  notes: Website development category is supported by privately inspected delivered artifacts. All code,
    styles, images, labels, exact layout/storage/validation policies and inputs are independently authored.
    No original file, brand, message, source identifier or archive is distributed.
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/campaign_contract.py
- ru_id: RU-002
  name: Responsive page layout
  content: Render the actual hero, one campaign card per input campaign, contact form and footer. Cards
    have three columns at viewport widths >=1024, two columns from 600 through 1023, and one column below
    600. Keep original input order and keep core text, images and controls visible without horizontal
    overflow, including long valid text. CSS breakpoints are independent benchmark conventions. Visual
    style and exact dimensions are free within these layout and usability constraints.
