- ru_id: RU-005
  name: Offline contact requests
  content: 'Never request external scripts, styles, images or form endpoints. Valid contact submission
    requires trimmed name length 1..80, trimmed message length 1..2000, and trimmed email length <=254
    matching ^[^\s@]+@[^\s@]+\.[^\s@]+$. Lowercase the entire email. Each valid submit appends one record
    with a new nonempty unique request_id and exactly name/email/message to this site''s persistent outbox,
    clears the three fields, shows saved_locally and updates Requests: N. Identical valid submissions
    count independently. Invalid input shows invalid_contact, preserves the existing outbox and does not
    reset the entered fields. Do not rely on native form validation that prevents the required feedback.
    Restore the outbox after reload; an absent, malformed JSON, non-array or record array lacking string
    request_id/name/email/message is treated as empty. Storage is separate per site_id. Both consent choices
    allow this explicitly initiated local form action. Observe real form events, browser storage and network
    activity, not self-reported window APIs.'
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
