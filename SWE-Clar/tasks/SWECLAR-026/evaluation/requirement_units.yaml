- ru_id: RU-003
  name: Terminal rotation using Shift
  content: Shift applies only to the final point. Rotate the terminal segment around the previous point,
    preserving its original Euclidean length; the vector from that pivot to the requested pointer coordinates
    defines the new direction. Leave all earlier points fixed. A pointer exactly at the pivot has undefined
    direction and is rejected. Reject Shift on other points, or a projected endpoint outside 0..100 or
    not strictly after the preceding X, with HTTP 400 and no state change. Do not clamp the projection
    or use the raw pointer as the endpoint. Recompute terminal_angle_degrees from the resulting segment.
    Use the same rule for browser Shift drags and the API.
  requirement_category: refinement
