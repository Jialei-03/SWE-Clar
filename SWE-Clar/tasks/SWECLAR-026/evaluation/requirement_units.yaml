- ru_id: RU-005
  name: Synthetic entitlement rules
  content: Trim surrounding whitespace from the submitted UUID and product key. UUID matching is case-insensitive
    but requires the hyphenated 8-4-4-4-12 hexadecimal shape; other forms are invalid. Product-key comparison
    is exact and case-sensitive after trimming. Return valid true only when the same record has the matching
    UUID/key pair and active is the boolean true. Unknown IDs, wrong keys, inactive records and malformed
    UUID strings return HTTP 200 with valid false. Missing/nonstring input fields are HTTP 400. The only
    returned field is valid; do not expose the stored key, entitlement file, other records or diagnostic
    matching details through API or browser.
  requirement_category: refinement
