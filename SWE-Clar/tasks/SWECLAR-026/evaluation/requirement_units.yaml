- ru_id: RU-002
  name: Ordinary point editing
  content: 'Ordinary point moves and curve replacement obey the public coordinate and ordering contract:
    finite numbers in 0..100, 2..32 curve points with strictly increasing X. Reject negative, out-of-range,
    duplicate-X, crossing or malformed edits with HTTP 400 and no curve/revision change. Do not silently
    sort, clamp or reorder an invalid edit. Successful changed curves increment revision once; unchanged
    requests do not increment it. Keep nonselected points unchanged and compute the actual terminal angle
    in degrees. Browser dragging and direct API edits must agree.'
