  name: Working curve application
  content: 'Preserve the documented HTTP/browser application: render actual curve segments and draggable
    points; load curve JSON; edit with pointer actions; show the computed terminal angle; send to the
    local driver and display its actual samples and receipt; expose the license-check controls. Preserve
    all public data formats, input validation, error status codes and initial state from README. Persist
    curve points, revision and sequence/acknowledgement state in the selected SQLite database across restart,
    with independent databases isolated.'
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: What are the rules for working curve application?
