- ru_id: RU-004
  name: Ordered driver exchange and recovery
  content: Actually send each sampling request to the prepared local TCP driver, with a snapshot of the
    current curve and the requested sample positions in original order. Serialize sends so the driver
    observes increasing sequence numbers starting at 1. Consume one persistent sequence number for every
    valid send attempt, including protocol failure; malformed HTTP inputs consume none. Update last_acknowledged
    only after a valid response for that exact sequence. A valid response is a JSON object with an integer
    sequence equal to the request, a string receipt, and exactly one {x,y} sample per requested position
    in the same order; each x must equal the requested value, and y must be a finite number in 0..100
    (booleans are invalid). Return only the specified response fields and preserve driver-produced samples/receipt
    rather than computing replacements locally. Incomplete/oversized lines, invalid JSON or schema, mismatched
    acknowledgement, disconnect or socket timeout return HTTP 503 {error:driver_failure,sequence:<allocated
    number>}; preserve curve/revision and previous acknowledgement. A later send must recover with the
    next number and a fresh usable connection. Unknown extra response fields may be ignored. Sequence/acknowledgement
    state survives application restart.
  requirement_category: refinement
