<!doctype html><html lang="en"><meta charset="utf-8"><title>Local curve editor</title>
<style>body{font:16px system-ui;max-width:900px;margin:30px auto;color:#203040;padding:0 20px}section{border:1px solid #cbd4dc;padding:18px;margin:20px 0;border-radius:8px}svg{width:100%;max-width:600px;background:#f6f9fc;touch-action:none}circle{cursor:grab;fill:#2773ba;stroke:white;stroke-width:2}polyline{fill:none;stroke:#2773ba;stroke-width:2}label{display:block;margin:8px 0}#status{white-space:pre-wrap}input{padding:6px}table td,table th{text-align:left;padding:5px 12px}</style>
<h1>Local curve editor</h1><p>Drag points to edit the curve. Hold Shift to adjust the terminal segment.</p>
<section><svg id="plot" viewBox="0 0 600 400" aria-label="Editable curve"><path d="M20 20V380H580" fill="none" stroke="#9caebb"/><polyline id="curve-line"/><g id="points"></g></svg><p id="angle"></p><label>Curve JSON <input id="curve-file" type="file" accept=".json"></label><p id="status" role="status"></p></section>
<section><h2>Local driver</h2><label>Sample positions <input id="positions" value="0,25,50,75,100"></label><button id="send">Send curve</button><p id="receipt"></p><table><thead><tr><th>X</th><th>Y</th></tr></thead><tbody id="samples"></tbody></table></section>
<section><h2>Synthetic license check</h2><label>UUID <input id="license-uuid"></label><label>Demo product key <input id="license-key" type="password"></label><button id="check-license">Check license</button><p id="license-result"></p></section>
<script>
const $=s=>document.querySelector(s);let current=null,drag=null;
async function request(path,body){const response=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const value=await response.json();if(!response.ok)throw Error(value.error);return value;}
const px=p=>[20+p.x*5.6,380-p.y*3.6];
function render(curve){current=curve;$('#curve-line').setAttribute('points',curve.points.map(p=>px(p).join(',')).join(' '));$('#points').replaceChildren();curve.points.forEach((p,index)=>{const circle=document.createElementNS('http://www.w3.org/2000/svg','circle');const [x,y]=px(p);for(const [k,v] of Object.entries({id:`point-${index}`,cx:x,cy:y,r:7,'data-index':index}))circle.setAttribute(k,v);$('#points').append(circle);});$('#angle').textContent=`Terminal angle: ${curve.terminal_angle_degrees.toFixed(3)}°`;}
$('#plot').addEventListener('pointerdown',event=>{if(event.target.matches('circle')){drag={index:Number(event.target.dataset.index),shift:event.shiftKey};$('#plot').setPointerCapture(event.pointerId);}});
$('#plot').addEventListener('pointerup',async event=>{if(!drag)return;const chosen=drag;drag=null;const point=new DOMPoint(event.clientX,event.clientY).matrixTransform($('#plot').getScreenCTM().inverse());try{render(await request('/api/move',{index:chosen.index,x:(point.x-20)/5.6,y:(380-point.y)/3.6,shift:chosen.shift}));$('#status').textContent='Curve saved';}catch(error){$('#status').textContent=error.message;render(current);}});
$('#curve-file').addEventListener('change',async event=>{try{render(await request('/api/curve',JSON.parse(await event.target.files[0].text())));$('#status').textContent='Curve loaded';}catch(error){$('#status').textContent=error.message;}});
$('#send').addEventListener('click',async()=>{try{const positions=$('#positions').value.split(',').map(x=>Number(x.trim()));const response=await request('/api/send',{positions});$('#receipt').textContent=`${response.sequence}: ${response.receipt}`;$('#samples').replaceChildren();for(const sample of response.samples){const row=document.createElement('tr');for(const v of [sample.x,sample.y]){const cell=document.createElement('td');cell.textContent=v;row.append(cell);}$('#samples').append(row);}}catch(error){$('#status').textContent=error.message;}});
$('#check-license').addEventListener('click',async()=>{try{const result=await request('/api/license',{uuid:$('#license-uuid').value,product_key:$('#license-key').value});$('#license-result').textContent=result.valid?'Valid':'Invalid';}catch(error){$('#status').textContent=error.message;}});
request('/api/curve').then(render).catch(error=>$('#status').textContent=error.message);
</script></html>
