- ru_id: RU-006
  name: Latest-request and failure behavior
  content: 'Every Run action is a new intent and the latest issued request alone may update result, error
    and selection. Users may submit a second request while the first is pending. Ignore any older response
    or failure after a newer request has been issued, regardless of network completion order. It must
    not restore old geometry, reset newer selection, or change error status. Request cancellation is allowed
    if the same latest-intent behavior is preserved.


    A failure of the current request displays an error, keeps the last accepted result and its selection/export
    unchanged, and permits another submission. Successful current response clears the error, replaces
    the result and selects all new families. Invalid form values may be rejected locally or by HTTP but
    must follow this failure rule. Form edits alone do not change accepted data or exports. dispose()
    prevents in-flight completion from changing controller state or UI. No retry persistence across a
    fresh page is required.'
  requirement_category: refinement
  source_visibility: hidden
