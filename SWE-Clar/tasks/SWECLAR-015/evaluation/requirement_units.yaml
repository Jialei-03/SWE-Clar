- ru_id: RU-005
  name: Shared-scale comparison and faithful CSV export
  content: 'After each successful run select all returned families, replacing the previous selection.
    Selecting a subset keeps the successful result in memory and draws exactly the selected families.
    Unknown keys passed to select are ignored; duplicated keys select a family once. No selection is valid
    and produces zero points. Selection does not issue another geometry request.


    For project(), collect selected families'' actual transformed points. Bounds are shared across the
    whole selection, with each minimum fixed at 0; maxima are max(1, maximum observed coordinate) per
    axis. Empty selection uses both axes 0..1. Coordinates project to px=48+624*u/x_max and py=432-384*v/y_max.
    The pixel margins and projection interface are initially disclosed infrastructure; they determine
    point location while visual style remains free. Draw each selected point at its projected position,
    with axes and visibly different families. Do not normalize each family separately or draw points from
    deselected families. Counts agree with selected points, including coincident points (do not silently
    deduplicate them).


    CSV header is exactly `a,b,n,u,v` and rows contain one row per selected solution in increasing b,
    then n, then original x order. Do not collapse coincident points or use raw coordinates when a normalized
    mode is selected. Allow standard CSV newline conventions and equivalent numeric spelling within tolerance.
    No extra columns. Empty selection yields header only. No successful result means exportCSV returns
    null and Export is disabled. A successful empty result permits header-only export. Export is based
    on the last accepted result/selection and does not recompute with current unsubmitted form values.'
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
