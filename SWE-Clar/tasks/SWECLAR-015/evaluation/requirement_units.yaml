- ru_id: RU-004
  name: Normalized coordinate views
  content: For a valid raw solution (x,y) on level n, raw=(x,y), by_total=(x/n,y/n), weighted=(a*x/n,b*y/n).
    Apply the requested transform to every point, while preserving original-x ordering and raw equation
    level n. The weighted view has u+v=1 up to numeric tolerance. Counts and family membership never change
    solely because coordinates change. Compute from the actual integers, not rounded display labels. Never
    divide by a fixed problem limit or by a+b in place of n. The direct transform API also accepts the
    valid smallest diagonal point x=y=1, n=a+b.
