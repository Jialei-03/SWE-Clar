- ru_id: RU-002
  name: Complete positive lattice enumeration
  content: The all policy includes every a+b=total, a>b>=1 family, ordered by b. Compute every positive
    integer solution of a*x+b*y=n for total+1<=n<=limit inclusive, including diagonal x=y, respecting
    noncoprime coefficients and emitting no impossible n. Keep n and point ordering, empty family records
    and correct point counts. Raw coordinates are (x,y). Arithmetic and numeric interfaces remain correct
    throughout declared ranges. Results must reflect inputs rather than fixed fixture examples. No mandated
    algorithm, exact container type for coordinate pairs, or irrelevant response key order.
