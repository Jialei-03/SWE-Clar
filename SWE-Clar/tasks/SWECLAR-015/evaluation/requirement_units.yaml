- ru_id: RU-003
  name: Family selection policies
  content: The coprime policy includes exactly families with gcd(a,b)=1. The opposite_parity policy includes
    exactly families where one coefficient is odd and the other even; it does not additionally require
    coprimality. The all policy applies no additional filter. Recompute the geometry only for accepted
    pairs, preserving b order and keeping zero-solution accepted families. A policy with no accepted family
    produces a valid empty result and empty plot; it is not a request error. These are independent generic
    benchmark policies, not inherited names or a customer's classification.
