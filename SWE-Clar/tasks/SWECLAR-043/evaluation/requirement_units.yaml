- ru_id: RU-005
  name: Atomic validation errors
  content: Invalid events return a structured error without changing status, history, proof, or rejection
    data. All calls leave input objects unchanged and preserve unrelated order metadata. A subsequent
    valid action clears any prior error. Unknown states and illegal transitions are rejected.
  requirement_category: refinement
