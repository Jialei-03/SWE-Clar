- ru_id: RU-003
  name: MVP scope boundary
  content: The MVP quote flow has no manual-boundary editor. Derive quote area from a saved detection
    belonging to the current session; ignore caller area, roof records and authorized-override flags.
    Preserve successful data when a provider fails, and ignore stale page responses after input changes.
    Map bounds are for orientation and must not be described as an exact roof polygon.
