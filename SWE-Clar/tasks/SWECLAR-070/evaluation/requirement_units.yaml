- ru_id: RU-005
  name: Lead capture and idempotency
  content: Save an enquiry only with nonempty name,email,phone,address and a stored quote owned by the
    same browser session; contact address must match that quote. Preserve the full stored quote and make
    repeated lead IDs idempotent for their owning session. A foreign session cannot retrieve an existing
    lead or use another session’s detection/quote ID. Never accept caller-invented quote totals as the
    stored estimate.
