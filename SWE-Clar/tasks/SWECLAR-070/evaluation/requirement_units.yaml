requirement_units:
- ru_id: RU-001
  name: Calculator entry point
  content: Complete the supplied web/provider/database component and preserve caller inputs. Persist real
    detection, quote and enquiry records in SQLite; isolate browser sessions and protect provider keys/server
    files. Reject failed operations without partial records. The README defines the independently reconstructed
    Google response shapes and pricing/schema boundary.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for calculator entry point.
  test_interface:
    type: function
    entry:
      language: python
      file: store.py
      function: Store.quote
      signature: Store.quote(session_id,action) -> dict
    inputs:
      session_id: private browser session
      action: quote selection
    output:
      type: dict
      meaning: persisted quote
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/roof_contract.py
  notes: Independent Python/SQLite/Leaflet reconstruction. API fixtures, addresses, coordinates, area
    values, prices and contact information are synthetic; original customer data, keys and imagery are
    excluded. Solar-reported modelled area is not a claim of complete roof coverage.
- ru_id: RU-002
  name: Address roof lookup
  content: Resolve an address through the configured Geocoding HTTP endpoint, require one unambiguous
    OK result, then request Solar buildingInsights:findClosest with its latitude/longitude. Validate a
    finite positive wholeRoofStats.areaMeters2 plus geographic centre/bounds; save only the necessary
    address/area/location fields. Missing, ambiguous, malformed or failed provider results reject the
    operation. Draw the returned building bounds with actual Leaflet geometry. Synthetic protocol tests
    do not prove remote roof recognition quality.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
