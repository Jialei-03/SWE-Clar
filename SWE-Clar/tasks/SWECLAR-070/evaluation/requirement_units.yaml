- ru_id: RU-004
  name: Dynamic price calculation
  content: Calculate one line for roof_type, one for material and one per unique extra using server-configured
    per-square-metre rates and stored area. Round each line half-up to two decimals, then sum rounded
    lines; return canonical two-decimal strings. Unknown choices, duplicate extras, invalid rates and
    missing/foreign detections fail without saving a quote. Display the actual line amounts and total.
  requirement_category: refinement
