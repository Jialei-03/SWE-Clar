- ru_id: RU-002
  name: Capture capability gate
  content: After validating the capture object, config and frame headers, accept capture processing only
    when fps is at least 10 and both dimensions are at least 16. A lower capability returns verdict not_measurable,
    reason capability and an empty measurement list, without parsing PGM contents. Values outside the
    published input ranges are malformed requests (400), not capability failures. Preview is independent
    of this gate.
  requirement_category: core
  source_visibility: visible
