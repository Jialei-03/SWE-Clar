- ru_id: RU-005
  name: Deterministic optical decision
  content: Only after all quality gates pass, compute the light-phase relative area change as (maximum
    area minus minimum area) divided by minimum area, and the maximum gaze_error over gaze-phase frames.
    Return deviation with reason threshold when either value is strictly greater than its configured max_area_change
    or max_gaze_px; equality is stable. Otherwise return stable with reason within_limits. Do not use
    light-phase target error for gaze classification or gaze-phase area for area-change classification.
    These are synthetic calibration rules, with no biometric or clinical interpretation.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
