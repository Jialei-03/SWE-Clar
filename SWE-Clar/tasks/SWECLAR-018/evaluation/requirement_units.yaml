- ru_id: RU-001
  name: Preserve the image application
  content: 'Preserve the documented HTTP/browser workflow, strict P2 parsing and input constraints: preview
    actual pixels, upload capture JSON, display returned measurements, download exactly the latest report,
    retain it across restart and isolate databases. Invalid requests return 400 without replacing the
    previous report; unknown routes and absent reports return 404. Preserve all public interface constraints
    in the starter README.'
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: What are the rules for preserve the image application?
  matching_keywords:
  - image
  - browser
  - input
  - report
  test_interface:
    type: api
    entry:
      command: python server.py --port 0 --db <isolated database>
      protocol: HTTP endpoints and browser workflow documented in starter README
    inputs: Synthetic P2 grayscale images and capture JSON
    output: Actual pixels, measured coordinates and areas, browser table and persisted JSON report
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
