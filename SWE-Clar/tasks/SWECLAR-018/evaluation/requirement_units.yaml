- ru_id: RU-004
  name: Quality rejection before decisions
  content: A capture is measurable only if both phases contain at least two frames, every frame has a
    valid target, no gap exceeds max_gap_ms (include zero to first frame, consecutive frames, and last
    frame to 2*phase_ms), and every consecutive pair stays within max_motion_px Euclidean centroid displacement
    and max_lighting_delta absolute difference of whole-image mean grayscale brightness. These quality
    limits are inclusive. Any failure yields verdict not_measurable and reason quality, before considering
    a deviation. Preserve the full measurement series including null rows. No quality state is accepted
    from supplied metadata; derive these properties from image content and timestamps.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
