- ru_id: RU-003
  name: Pixel extraction and two phases
  content: 'For each frame threshold the actual grayscale samples inclusively: a pixel is dark when its
    value is at most config.threshold. Find four-neighbor connected components; select the uniquely largest
    by pixel count. Equal largest components, no components, area outside inclusive min_area/max_area,
    or any selected pixel on the image border make the measurement unavailable (area, cx, cy and gaze_error
    all null). Otherwise area is its pixel count, cx/cy are the arithmetic means of its integer pixel
    coordinates, and gaze_error is Euclidean distance from this center to the supplied target. Keep every
    frame in input order. Frames with t_ms strictly below phase_ms have phase light; frames at or above
    it have phase gaze. Phase assignment follows replay timestamps, not wall time. Unrelated smaller dark
    components do not affect the target.'
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: What are the rules for pixel extraction and two phases?
  matching_keywords:
