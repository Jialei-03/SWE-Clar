- ru_id: RU-005
  name: Queue CSV export
  content: Export exactly the current eligible queue in its defined order, with the documented header.
    Preserve integer cents, age, status and trimmed note; use correct CSV quoting for commas, quotes,
    Unicode and multiline notes. For notes beginning with =, +, - or @ after trimming, prefix a single
    apostrophe in the exported cell to prevent spreadsheet formula interpretation; do not alter the stored
    note. The export is a real downloadable UTF-8 CSV. An empty queue still exports the header.
  requirement_category: refinement
