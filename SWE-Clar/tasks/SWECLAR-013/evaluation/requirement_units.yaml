requirement_units:
- ru_id: RU-001
  name: Working account application
  content: 'Preserve the real HTTP/browser application: upload the documented CSV, display all accounts
    ordered by account ID, inspect an account, select accounts and submit status/notes, and download CSV.
    New accounts have open status and empty note. Retain all data and operation history across restart.
    Unknown detail IDs return 404. Both the API and actual browser controls must perform these operations.'
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: What are the rules for working account application?
  matching_keywords:
  - application
  - interface
  test_interface:
    type: api
    entry:
      command: python server.py --host 127.0.0.1 --port 0 --db <isolated database>
      protocol: HTTP endpoints and browser workflow documented in starter README
    inputs: Synthetic CSV, account IDs, statuses and notes
    output: Observable HTTP responses, browser behavior, exported CSV and persisted records
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  notes: All exact software behavior is a benchmark reconstruction convention, not a quotation or confirmed
    original software commission. Source visibility is the synthetic initial-disclosure label for runtime
    compatibility.
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/receivables_contract.py
- ru_id: RU-002
  name: Atomic repeated imports
  content: Validate the entire CSV before making changes. Reject an empty file, incorrect columns, malformed
    IDs, noninteger or out-of-range numbers, and duplicate IDs within the upload with HTTP 400 and no
    changes. On repeat import, update balance and age for existing accounts but preserve their status,
    note and history. Retain accounts absent from the upload. Repeating an identical file is idempotent.
    Do not create follow-up audit events for imports.
  requirement_category: refinement
