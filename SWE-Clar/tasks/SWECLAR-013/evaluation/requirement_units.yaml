- ru_id: RU-004
  name: Atomic audited follow-ups
  content: Allow any transition among open, contacted, disputed and resolved, including reopening. Trim
    notes; require a nonempty note for every non-open status and at most 2000 characters after trimming.
    Reject empty selections, duplicate IDs, unknown IDs, invalid statuses or invalid notes with HTTP 400,
    without changing any selected account or its history. A valid batch updates every selected account
    atomically. The note field is required and must be a string; missing, null, numeric, boolean, array
    or object notes are invalid, including for open status. Replace the current note with the trimmed
    submitted note, rather than appending it. An empty string clears the current note when status is open.
    Append one persistent before/after history record for each account whose status or trimmed note actually
    changes. Unchanged submissions return updated=0 and add no record. Updated counts changed accounts,
    not submitted IDs. Concurrent retries must not duplicate an unchanged event.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
