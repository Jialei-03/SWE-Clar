- ru_id: RU-003
  name: Follow-up eligibility
  content: Include only accounts aged strictly more than 60 days, with positive balance_cents, whose status
    is not resolved. Recompute after imports and updates. Order the queue by age_days descending and then
    account_id ascending, without silently limiting the list. The threshold and tie-break are synthetic
    business decisions.
