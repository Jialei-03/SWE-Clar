- ru_id: RU-004
  name: Blocked-attempt evidence and reports
  content: "Each denied event produces one activity with fields event_id/device_id/target_type/target/reason; parent-child devices additionally produce notifications with fields event_id/device_id/parent_id/reason, representing a local notification queue that does not require external delivery. event_id is globally unique across denial records; a retry with the same device/target_type/normalized target/used_minutes is not appended again and returns the original decision; the same ID with different content is event_conflict and leaves state unchanged. Allowed events are not recorded. report(parent_id,device_id) returns that device's activity only to the parent linked to the device; otherwise report_denied. Do not reject additional fields by requiring exact dictionary equality."
  requirement_category: refinement
