- ru_id: RU-002
  name: Self-protect and parent-child modes
  content: "configure_mode(user_id,device_id,mode[,child_id]). self binds the user's own device; parent_child requires a parent identity, a child identity and a matching child.parent_id. A device cannot be bound twice, each child may own at most one device, and cross-family linking is rejected with link_denied. A successfully configured device includes owner_id/mode, and parent-child mode also includes parent_id. The existing starter behavior is a regression requirement."
  requirement_category: core
