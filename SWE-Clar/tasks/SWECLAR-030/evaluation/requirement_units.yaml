- ru_id: RU-005
  name: Account deletion
  content: "delete_account(user_id); a nonexistent user returns account_missing. Delete the user's profile, the devices the user owns or controls together with those devices' policies/activity/notifications, and family links pointing to the user; keep the profiles of the user's child users but remove their parent_id. Other family data is retained. Remove existing audit records whose subject equals the deleted user_id, and append type=account_deleted,subject=redacted with no user/device identifiers. Both the returned state and the storage after restart must reflect the deletion. Forensic-level erasure of SQLite free pages is not required; the database file is not published customer data."
  requirement_category: refinement
