- ru_id: RU-003
  name: Website and application restrictions
  content: "set_policy(actor_id,device_id,blocked_domains,blocked_apps,app_daily_limits) fully replaces that device's policy; for self only the owner, and for parent-child only the parent, may set it; anyone else gets policy_denied. Domains are ASCII hosts without a URL/path; matching ignores case and one trailing dot and matches the domain itself or subdomains at a dot boundary; near-miss strings do not match. App IDs are case-sensitive. Limits and used_minutes are finite non-negative numbers (bool is not accepted). A blocked app or used_minutes >= the limit is denied, everything else is allowed; a missing policy allows by default. check_access(device_id,event_id,target_type,target[,used_minutes]) supports the two types domain/app; an app with no supplied usage is treated as 0. Invalid input returns invalid_policy/invalid_access_check, and an unknown device returns invalid_access_check. allowed is a boolean, and reason is blocked_domain/blocked_app/daily_limit/allowed. The basic field types and error codes are in the public README; they are not hidden business puzzles."
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
