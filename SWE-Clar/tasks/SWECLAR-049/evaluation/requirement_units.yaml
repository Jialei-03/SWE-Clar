- ru_id: RU-004
  name: Automation consolidation
  content: stabilize_automations disables the configured synthetic legacy_mentor, legacy_mentee, duplicate_match
    and duplicate_notice routes while preserving canonical_intake, canonical_matching, canonical_communication
    and unrelated settings. These labels replace original private automation identifiers. Update existing
    redundant routes only, do not insert absent settings, and preserve each canonical or unrelated enabled
    value, including disabled canonical routes. Repeated calls are idempotent. The result object is informational;
    stored settings are authoritative.
