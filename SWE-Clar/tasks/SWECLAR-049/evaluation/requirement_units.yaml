- ru_id: RU-003
  name: Duplicate prevention and cleanup
  content: Normal and legacy_mentor_intake/legacy_mentee_intake paths must share idempotent intake. cleanup_duplicates
    keeps the earliest profiles.sequence for each user/role, rewires match foreign keys before removing
    duplicate profiles, collapses duplicate mentor/mentee matches to their earliest sequence and rewires/deduplicates
    the corresponding outbox rows. Keep canonical IDs and all unrelated users/profiles. Invalid or orphan
    profiles/match links make cleanup fail atomically. Keep the lowest outbox.sequence after rewiring
    each surviving match; preserve its notice_id. Preserve the earliest match status. Empty/already-clean
    cleanup succeeds with result.status=deduplicated. Missing users, wrong profile roles, orphan match/outbox
    links reject without any business-row changes. Legacy intake remains supported even after route stabilization.
    Error codes may be any nonempty string.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
