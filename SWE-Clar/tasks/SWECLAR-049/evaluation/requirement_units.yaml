- ru_id: RU-005
  name: Idempotent matching and notification
  content: create_match stores at most one matches row per valid mentor/mentee profile pair, requiring
    existing linked users and correct roles. notify_match queues one durable outbox row per existing valid
    match. Both preserve IDs on exact replay, including across server restarts, and reject missing users/profiles/matches
    without creating partial rows. Notifications here are stored intents, not delivery to an external
    person.
  requirement_category: core
