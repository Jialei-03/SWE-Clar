requirement_units:
- ru_id: RU-001
  name: Automation entry point
  content: Repair the supplied durable SQLite workflow and actual local HTTP event server. Preserve caller
    events and use the supplied normalized tables, not a serialized state blob. Return result/error.code
    through process_mentor_event(database_path,event) and POST /events. Valid operations persist across
    process restarts; error responses leave prior business rows unchanged. An event is a JSON object.
    Malformed JSON/non-object HTTP input receives HTTP 400 and a nonempty error.code; unknown types also
    return an error. Successful HTTP responses use 200. Additional result metadata and alternative nonempty
    error codes are allowed.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for automation entry point.
  test_interface:
    type: function
    entry:
      language: python
      file: solution.py
      function: process_mentor_event
      signature: process_mentor_event(database_path,event) -> dict
    inputs:
      database_path: Dedicated SQLite file using supplied schema
      event: Intake, cleanup, stabilization, match, notice or snapshot event
    output:
      type: dict
      meaning: result/error and real database effects; same events supported through POST /events
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/test_solution.py
  notes: Synthetic benchmark convention grounded in intake workflow repair; no external notification delivery.
- ru_id: RU-002
  name: Single-source intake
  content: Mentor or mentee intake trims and case-folds a valid email (one @, nonempty sides, no whitespace),
    upserts exactly one users row and links one profiles row for that user and role. Return user_id/profile_id/role.
    Preserve the existing user ID and profile ID on replay, updating only a supplied string name after
    trimming. Concurrent identical intake requests must not create duplicates. Non-string or omitted names
    leave the stored name unchanged; a supplied blank string sets an empty name. Do not alter unrelated
    users/profiles.
  requirement_category: core
