- ru_id: RU-002
  name: Modernized usable Flutter browsing and repair controls
  content: Retain actual Clinics, Providers and Bookings navigation, record cards, a refresh button and
    a provider-relation repair button. Render view rows with their literal record ID and name, and any
    returned relation label. Use the public widget keys to support actual taps, scrolling and inspection.
    Each page refresh queries the selected collection through the repository. At 360x950 and 768x950 logical
    pixels, controls and long record lists are reachable without render exceptions or layout overflow;
    scrolling is permitted. Show an empty-state message for a successful empty result. Do not display
    records from an earlier section after navigation or let an earlier slow response replace a newer selected-page
    result. A read failure displays a visible failure state; refresh permits a retry. Rendering must not
    interpret document labels as markup or executable content. Styling and extra wording are free. The
    fixed SDK compatibility is verified by actual compilation and widget rendering, not a caller-provided
    readiness flag. This is a local Flutter component and database maintenance target; native store distribution,
    production Firebase projects, push and crash ingestion are outside its independently selected scope.
