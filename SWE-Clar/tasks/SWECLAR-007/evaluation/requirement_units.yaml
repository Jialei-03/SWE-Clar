requirement_units:
- ru_id: RU-001
  name: Preserve the application and real datastore interface
  content: Maintain the independently authored Flutter appointment-maintenance application and the public
    README interfaces. Clinics, Providers and Bookings remain working pages backed by real Firestore REST
    documents in the supplied local demo emulator. Compile and render with the prepared Flutter/Dart toolchain;
    dependencies and the emulator are benchmark infrastructure. Retain FixtureRepository.getDocument,
    list, view and normalize; use actual HTTP and persisted database records. getDocument returns null
    on 404 and throws on other failed responses. list follows every nextPageToken, returns typed document
    objects including name, fields and updateTime, and returns an empty list for an empty collection.
    It must not alter records while reading. Collection, field and target configuration identifiers must
    match [A-Za-z_][A-Za-z0-9_]*; invalid normalization configuration throws before issuing any write.
    The local origin is an http loopback URL and the project is a demo project; production access is not
    part of the task. Preserve unrelated document fields and collections. The benchmark supplies valid
    Firestore typed values and at most 200 source documents per migration; source and target IDs use letters,
    digits, underscores and hyphens. Externally imposed read/write failures must not be converted into
    success. All essential formats, commands and services are public.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
