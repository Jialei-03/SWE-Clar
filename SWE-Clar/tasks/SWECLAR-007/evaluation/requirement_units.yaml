- ru_id: RU-004
  name: Field-preserving atomic relation normalization
  content: 'normalize(collection,field,targetCollection) resolves each present relation by the same accepted
    formats and target-existence rule as compatible reading. A valid legacy reference or map becomes a
    stringValue ID. A valid existing string relation is unchanged. An invalid or dangling present relation
    is removed, with one report row {document: source ID, field: configured field, reason: dangling_relation}.
    Missing relation fields are unchanged and produce no report. Reports are sorted by document ID and
    tolerate harmless additional metadata. Preserve all other typed fields, entire source documents and
    unrelated collections, including nested maps, arrays, timestamps and booking records. Follow source
    pagination. Submit all required changes in one atomic Firestore commit with updateTime preconditions
    for every changed source; no writes when already normalized. If any changed source was concurrently
    edited, reject the entire migration and preserve the concurrent edit and every other source. Do not
    silently overwrite, partially commit, retry against new source versions or claim success. No automatic
    retry is required; the user may explicitly retry. Target documents remain stable during a migration
    in this benchmark; target deletion races and datasets exceeding 200 source documents are out of scope.
    A repeat after success performs no writes and returns an empty report. These are independently specified
    data-integrity policies, not recovered customer schema.'
