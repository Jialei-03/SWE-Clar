- ru_id: RU-005
  name: Honest repair progress, refresh and failure recovery
  content: 'The repair button normalizes providers.clinic against clinics. While it is pending show visible
    progress, disable further repair triggers and keep navigation usable; repeated clicks must not start
    a second migration. On success show the numeric count of dangling fields removed, retain the selected
    section and reload that section from the database so relation labels reflect committed data. Zero-count
    success is still shown. On any failed read/commit during repair show failure, never a success count;
    restore the enabled repair control and allow an explicit retry. Failed repairs must not fabricate
    normalized displayed records: reloading the actual database is permitted, but the app must not synthesize
    the proposed result. If navigation happens during a pending operation, completion must not switch
    the page back or overwrite the current page with the old page rows. Late responses are applied only
    to their still-current request. Old success/error feedback must not mask the active attempt; show
    progress during a retry and the new result afterwards. Use the public status/count/progress widget
    keys; exact additional text is free. Operation failure is distinct from a legitimate successful migration
    that removes dangling fields. These workflow choices are synthetic clarification requirements.'
  requirement_category: refinement
