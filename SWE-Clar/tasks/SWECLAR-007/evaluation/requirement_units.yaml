- ru_id: RU-003
  name: Read compatible legacy document relationships
  content: Resolve provider.clinic against clinics and booking.provider against providers, before and
    after migration. A relation is either a stringValue ID, an exact local project/database document reference
    to that target collection, or mapValue.fields.id.stringValue. Accept it only when the ID matches the
    public ID alphabet and the target exists. Do not trim, case-fold, coerce or extract the last segment
    of a reference to another project/database/collection. A missing field, null/wrong typed value, absent
    target or malformed identifier is unlinked. Reading must not repair or mutate the database. Each view
    row contains id, name, relation_id and relation_name; unlinked rows return null relation_id and the
    literal label Unlinked. Clinics have null relation_id and relation_name. A record name uses its stringValue
    name when present, otherwise its ID; an empty string name is a valid literal name. Linked labels use
    the same target-name rule. Sort all view rows by document ID ascending, case-sensitive Unicode codepoint
    order. Never omit an unlinked provider or booking. Harmless additional row metadata is permitted.
    These exact compatibility, fallback and ordering rules are synthetic benchmark decisions available
    by clarification.
