requirement_units:
- ru_id: RU-001
  name: Setup action entry point
  content: Preserve the supplied ASP.NET Core 8 HTTP scaffold and public README contract. The benchmark
    preconfigures a restricted local MariaDB connection, offline dependencies and fresh synthetic TLS
    certificates. Preserve existing HTTPS with optional client-certificate request and validation against
    CLIENT_CA_PEM using client-authentication purpose, without modifying system trust. Never expose connection
    strings, passwords or private keys in responses.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for setup action entry point.
  test_interface:
    type: api
    entry:
      language: csharp
      file: SetupApi.csproj
      command: python start.py
    inputs:
      configuration: Benchmark-prepared runtime/connection.json and synthetic TLS materials; launcher
        loads configuration automatically
      requests: Actual HTTPS requests
    output:
      type: http
      meaning: HTTP responses and actual MariaDB schema/history
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/setup_contract.py
  notes: Independent reconstruction of local API/database setup. Schema, routes, fixed runtime and TLS
    plumbing are public integration choices; exact migration/authorization behavior is a synthetic benchmark
    specification, not quoted client instruction. Raw source and certificates are excluded.
- ru_id: RU-002
  name: MariaDB connection
  content: POST /connect accepts only provider=MariaDB (case-insensitive), opens the configured database
    connection, and verifies the server version identifies MariaDB before returning connected=true. Ignore
    caller-supplied connection_ok. Failed credentials or unreachable databases return database_connection_failed
    without claiming success.
  requirement_category: core
