- ru_id: RU-004
  name: Certificate-gated API verification
  content: GET /secure requires a valid client certificate presented during TLS. Without a certificate
    return certificate_required with HTTP 403. Do not accept caller headers or certificate-ID flags in
    place of a valid TLS certificate. An untrusted certificate must not receive a successful response.
    The successful response uses the public message and migration_count schema. TLS setup and chain validation
    are public baseline facilities, not hidden information.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
