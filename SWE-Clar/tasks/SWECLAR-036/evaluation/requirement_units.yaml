- ru_id: RU-005
  name: Health and safe failures
  content: GET /health reports actual database_connected, durable migration_count and tls_configured.
    GET /samples reads current id/name/category rows from MariaDB in ID order and reports api_not_ready
    before schema readiness. GET /secure returns message=certificate accepted plus migration_count after
    certificate validation. Unknown endpoints return unknown_endpoint/404 and malformed requests return
    structured errors without exposing configuration secrets.
  requirement_category: refinement
