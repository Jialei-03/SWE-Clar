- ru_id: RU-003
  name: Ordered idempotent migrations
  content: 'POST /migrations accepts an array from the ordered IDs 001_create_samples, 002_add_category,
    003_index_category. Apply these as real SQL: create samples(id VARCHAR(80) primary key,name VARCHAR(160)
    not null), add category VARCHAR(80) not null default general, then index sample_category on category.
    Record unique migration IDs in schema_migrations in applied order. Skip IDs already applied and persist
    history across process restarts. New IDs must follow the next contiguous migration prefix. Reject
    null, unknown, duplicate or out-of-order IDs as invalid_migrations before changing schema/history.
    Preserve sample rows when applying later migrations. The supplied SQL is idempotent so successful
    DDL can be resumed after interruption.'
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
