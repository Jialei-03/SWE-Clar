- ru_id: RU-002
  name: Deliberate simulated reading and pending preview
  content: 'Only teachers/administrators may create/read scans; parents403 `forbidden`. New scan must
    actually retrieve a reading from the configured prepared HTTP reader. Unknown/inactive devices give422
    `inactive_device`; unknown/inactive tags give422 `inactive_tag`; a mapped student outside staff scope
    gives404 `not_found`. Non-tap interaction gives422 `intentional_tap_required`. Error priority follows
    the public contract. A valid tap creates one pending scan with exact immutable reading metadata and
    mapped student, never a completed attendance or inbox message. Direction is explicitly supplied, never
    inferred from proximity or current presence. The existing reading/same direction replay returns its
    existing scan and current student at200, retaining original creator; a different direction conflicts409.
    Both replay and first creation require current viewer scope. Repeated/concurrent requests must create
    at most one scan per reading. Different reading IDs may create separate pending scans for the same
    student, including identical timestamps; confirmation sequence is a separate policy.


    Teachers see pending/completed scans for their classes, administrators see all; scan list order is
    creation order. Restart preserves scans and reading replay mapping. The real UI shows a pending preview
    after a deliberate Scan click and requires a separate Confirm action. Merely scanning, selecting recipient
    or changing direction never confirms. The starter provides this full baseline.'
