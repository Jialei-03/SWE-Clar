- ru_id: RU-006
  name: Actual scoped parent inbox and retry-safe UI
  content: 'On completion, create exactly one persistent inbox entry for each active parent account whose
    student_ids contains the student. A parent with multiple linked students receives only those children''s
    records; two parents for one student each get a distinct independently readable entry. Staff/administrators/inactive
    parents receive none. No eligible parent is a valid completion with no inbox entries. Content is derived
    from the committed attendance, never user-supplied message fields. This is an actual authenticated
    application inbox, not a notification intent placeholder, external SMS or mobile push claim.


    Inbox entries are immutable except each owner''s read flag. Setting read=true/false idempotently preserves
    record identity/order and all other fields. A parent cannot list/read/update another parent''s entry
    even if linked to the same child, nor disclose other students'' rows through roster or attendance.
    Marking one parent''s entry read does not affect another. State survives restart. Failed/replayed/concurrent
    confirmations never duplicate entries. Inbox order is attendance completion order, not scan creation
    time.


    The actual staff browser must recover after a lost successful confirmation response: refresh or retry
    the same scan, display exactly one attendance result and remove its pending row. It must not silently
    create a replacement reading/scan on confirm retry. The parent browser''s refresh shows actual new
    inbox entries and real read checkboxes whose state round-trips and remains after login/restart. Responses
    completing after logout/account switch must not restore old inbox or roster data; stale errors must
    not clear a newer session. Display names remain literal text even when containing markup-like characters.'
