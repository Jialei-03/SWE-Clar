- ru_id: RU-004
  name: Authorized collection recipient
  content: 'Check-in requires recipient_id null or omitted; a non-null recipient gives400 `invalid_request`.
    Check-out requires a nonempty string recipient_id; absent/null gives422 `recipient_required`, malformed
    type/empty string400 `invalid_request`. The ID must reference a currently active guardian whose student_ids
    include this exact student; otherwise422 `unauthorized_recipient`, without revealing another student''s
    guardian details. Evaluate after operator/tag/device checks and before sequence changes. A revoked
    guardian after scanning cannot authorize collection. An administrator can reactivate the guardian
    and retry. Successful check-out stores the chosen guardian ID. Other request fields such as `verified:true`
    or a guardian name cannot bypass membership checks. Failed collection keeps the scan pending and existing
    presence unchanged.


    This benchmark verifies application authorization only; it neither performs a real identity verification
    nor certifies physical custody transfer. Exact membership/activity/null rules are independent benchmark
    decisions and must be disclosed when asked.'
