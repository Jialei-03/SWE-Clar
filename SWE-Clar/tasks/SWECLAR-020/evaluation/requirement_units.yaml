- ru_id: RU-003
  name: Confirmation operator and current tag authorization
  content: 'Only active teacher/administrator accounts may confirm. Parent attempts403 `forbidden`, even
    with a known scan ID. Teachers may confirm any in-scope scan, not only ones they created; outside-scope/unknown
    scan404 `not_found`. Reject forged operator/student/direction/time fields by ignoring them; actor
    derives from authentication, immutable metadata from stored scan.


    For an unresolved scan, re-check that its stored device and tag are still active and still map to
    its stored student: invalid device422 `inactive_device`, invalid tag422 `inactive_tag`. This prevents
    a pending scan from bypassing later tag revocation. These checks run before recipient/sequence checks.
    Administrators may reactivate a tag and legitimately retry the same pending scan. Failures keep the
    scan pending and cannot change attendance/presence/inbox. Completion records the actual confirming
    actor, possibly another authorized staff user. Only administrative tag activity editing is in scope;
    no general record/class/device mutation API is required.


    For completed-scan replay, require current role and scope, then RU-005 replay validation; do not retroactively
    reject a previously completed result because tag/guardian activity has changed. No new completion
    occurs on replay.'
