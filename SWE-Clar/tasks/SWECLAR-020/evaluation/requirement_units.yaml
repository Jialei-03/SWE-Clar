- ru_id: RU-005
  name: Atomic attendance sequence and replay
  content: 'Each student starts out. A first/new check-in is permitted only while out, check-out only
    while in; otherwise409 `attendance_conflict`. A completion''s reading at must be at least the student''s
    last completed attendance at; older readings409 `stale_reading`, checked before presence transition.
    Equal timestamps are allowed if directions alternate. Different students have independent timelines.
    Scan creation does not enforce these confirmation rules, allowing separate pending scans to be adjudicated
    safely.


    After role/scope, unresolved device/tag, and recipient validation, check stale time, then direction/presence.
    Successful completion atomically creates one attendance record, changes presence, marks exactly that
    scan completed with attendance_id, and creates RU-006 inbox entries. Failure rolls back everything.
    Concurrent confirmations of the same scan yield one201 and remaining200 replays; competing scans for
    the same student/direction yield one success and other409 without double attendance. No candidate-specific
    lock/schema is required.


    For a completed scan, authorized in-scope repeat with the same normalized recipient (null/omitted
    for in; same string for out) returns200 the existing attendance regardless of which authorized staff
    member retried, retaining original confirmed_by/time/ID. A different valid recipient intent gives409
    `confirmation_conflict` even if the proposed guardian is unauthorized or since revoked; syntax errors
    remain400. A completed check-out replay with null/omitted recipient gives422 `recipient_required`.
    A completed check-in with a non-null recipient gives400. Never re-check presence, current tag/guardian
    activity or old reading time on matching replay. Other submitted immutable fields are ignored. All
    scan/attendance/presence/replay behavior survives application restart; tokens do not.'
  requirement_category: refinement
