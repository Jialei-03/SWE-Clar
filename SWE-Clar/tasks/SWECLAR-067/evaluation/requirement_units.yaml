schema_version: 1
task_id: SWECLAR-067
registry_version: swe-clar
registry_status: annotation_complete
disclosure_design: controlled_requirement_disclosure
selected_scope: Actual browser conversation restoration, readable tips, navigation and report delivery
requirement_units:
- ru_id: RU-001
  name: Interaction entry point
  content: Repair the supplied browser project while preserving actual page controls and input objects.
    Render user text literally without interpreting markup. window.assistantApp.dispatch(event) returns
    the new state asynchronously and snapshot() returns an independent copy.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for interaction entry point.
  test_interface:
    type: web_ui
    entry:
      language: javascript
      file: index.html
      signature: window.assistantApp.dispatch(event) -> Promise<state>; snapshot() -> state
    inputs:
      seed: window.ASSISTANT_DATA synthetic conversations/routes/report_endpoint
      event: Conversation, tip, navigation, report or feedback action
    output:
      type: browser
      meaning: Actual DOM, navigation, persistence and local HTTP report delivery
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/conversation_contract.py
  notes: Independent browser reconstruction with local storage and synthetic report HTTP contract. The
    original chat service, medical data, customer URLs and model responses are not distributed.
- ru_id: RU-002
  name: Conversation continuity
  content: Opening a known conversation through its button or open_chat event must visibly restore its
    saved transcript and pending question. Persist the chosen conversation in localStorage so a reload
    returns to the same chat instead of the home screen. Unknown conversation IDs return unknown_conversation
    without replacing the current conversation.
