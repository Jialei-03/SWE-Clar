- ru_id: RU-005
  name: Feedback and bug reporting
  content: Report bug posts {report_id,conversation_id,transcript} as JSON to configured report_endpoint
    with Idempotency-Key=report_id. Store the report and show acknowledgement only after a successful
    HTTP response with accepted=true and matching report_id. Failed delivery returns report_failed and
    may be retried; completed report IDs are idempotent across reloads. The Report bug button uses report:<conversation_id>.
    Feedback ticks require nonnegative integer day, positive integer interval_days and nonempty user_id;
    render at most one feedback prompt per user and interval bucket, persisting deduplication across reloads.
    This local HTTP contract and interval bucketing are benchmark reconstruction choices. Concurrent submissions
    with the same report ID share one delivery; a delayed success must preserve the page selected while
    the request was in flight.
  requirement_category: refinement
