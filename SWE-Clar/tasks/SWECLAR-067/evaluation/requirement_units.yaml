- ru_id: RU-004
  name: Website CTA routing
  content: The input state stores configured route strings at routes.chat, routes.chat_prefill, and routes.schedule.
    A main-page Chat with Assistant action returns navigation containing exactly destination=routes.chat
    and prefill=routes.chat_prefill. Clinic-page Schedule Demo, Request a Demo, and Pre-Onboard Patients
    actions return navigation containing exactly destination=routes.schedule. Any unsupported page/action
    pair returns error code unknown_cta. Wire actual anchor controls to the configured destination. The
    chat link carries the prefill in a URL query parameter named text, preserving other query parameters;
    scheduling links navigate directly to the configured schedule route. Use URL encoding for prefill
    content.
  requirement_category: refinement
  source_visibility: hidden
