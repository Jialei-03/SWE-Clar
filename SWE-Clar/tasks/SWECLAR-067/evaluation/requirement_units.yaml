- ru_id: RU-003
  name: Readable tip formatting
  content: Accept a non-empty list only when every item is a non-empty string after trimming. Return formatted_tip
    by trimming each item and joining the supplied sentences in order with exactly one blank line between
    paragraphs; otherwise return error code invalid_tip. Render each trimmed sentence in its own paragraph
    with visible vertical separation; markup-like content is literal text.
  requirement_category: refinement
