- ru_id: RU-006
  name: Immutable queue and idempotent real connector delivery
  content: 'Queue captures the currently selected report in an immutable envelope and persists it before
    any delivery. No network access at queue time. request_id is global across targets within this pipeline.
    First queue creates status pending, attempts0,last_error null. Repeating request_id with the same
    target and normalized filters returns the original Delivery, including its original report/snapshot
    version, even if the current snapshot changed. Reusing it with another target or different normalized
    filters gives `request_conflict` without modifying the original or making a request. Validate target/request
    ID/filters before applying replay. Missing filters and explicit null are equivalent. Queue order is
    first successful creation, never moved by retries.


    Deliver a pending row with exactly one POST of its stored Envelope, appropriate target path and Idempotency-Key.
    A response counts as success only if HTTP200or201 and JSON is an object with accepted strictly true
    and matching request_id and target. Extra acknowledgement metadata is allowed; malformed JSON, false/missing/mismatched
    fields, network error, timeout, other status (including409or503) yields delivery_failed. After each
    actual attempt increment attempts by1. Failure retains pending and sets last_error=delivery_failed;
    success sets delivered and last_error null. Never mark delivered on a self-reported candidate success
    without a valid acknowledgement. The manager verifies actual receipts and request logs.


    A delivered row replay returns unchanged without another HTTP request or attempts increment. Retrying
    after a lost successful response resends the exact old envelope/key; the adapter deduplicates it and
    the valid replay acknowledgement completes delivery. New refresh/records must not silently change
    queued content. Concurrent deliver calls for the same request_id must serialize, yielding at most
    one HTTP attempt after a successful response and identical stored delivered result to waiters. Different
    request IDs remain independently addressable. Persist failure metadata and success state across CLI
    restart. Do not claim exactly-once external execution under arbitrary process crashes; the required
    protocol is retry with idempotent receiver and durable application state under tested command/restart
    boundaries.'
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
