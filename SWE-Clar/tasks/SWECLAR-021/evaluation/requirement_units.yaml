- ru_id: RU-004
  name: Snapshot version, explicit refresh and cache consistency
  content: 'Refresh compares the complete ordered normalized live Event sequence to the existing snapshot,
    including every field/revision. If content changes, copy all records atomically, increment version
    by exactly1, set record_count to the copied count, and store supplied watermark (including null).
    If content is unchanged, do not increment version or change watermark; return the existing Snapshot.
    This includes an empty initial refresh: version remains0 and watermark remains null. An update with
    unchanged record_count but changed amount/customer/date/revision must trigger a new snapshot on refresh.
    Repeated exact ingestion replay alone cannot change the next refresh result.


    Validate the watermark before comparing/no-op: any non-null invalid value gives `invalid_request`,
    even if content is unchanged. Reports and queued envelopes never mutate watermark/version. Snapshot
    and all rows are committed together; concurrent reporting/export/queue observes one complete snapshot,
    never mixed versions or partial rows. An exported/queued report retains its observed version if later
    refresh occurs. Restart preserves the snapshot independently of live records. No automatic refresh,
    time-based expiry, implicit watermark advancement or count-only cache invalidation.'
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
