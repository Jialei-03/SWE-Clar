- ru_id: RU-003
  name: Atomic revision-aware ingestion
  content: 'Validate all records completely before changing anything; invalid input anywhere, including
    invalid boolean amount/revision, nonexistent date, empty required ID, oversized batch or extra missing
    field, gives `invalid_batch` and leaves records/snapshot/deliveries unchanged. Input arrays may be
    empty: succeeds with zero counters and current record_count. Unknown extra fields are ignored and
    never become persisted Event fields.


    Identity is the ordered pair(source,event_id), not event_id alone. Existing identity with higher revision
    replaces its customer_id,booking_id,amount_cents,date,revision; identity/first-insertion position
    remain fixed. Equal revision plus exactly matching normalized Event data is an unchanged replay. Lower
    revision, or equal revision with different persisted data, gives `revision_conflict` and rolls back
    the whole batch, including earlier inserts/updates. Normalize only by selecting required fields; do
    not coerce numbers/strings, strip text, or change case.


    Process within-batch duplicates in array order against the provisional state: insert then higher revision
    counts one inserted and one updated; exact replay occurrence counts one unchanged. Subsequent conflict
    rolls back every change. Each record occurrence increments exactly one result counter on a successful
    batch. Concurrent CLI writers serialize these transactions: higher-revision final contents cannot
    be overwritten by older revisions, and equal/conflicting replays have the same policy. All writes
    commit atomically; live-record updates do not change the existing report snapshot until explicit refresh.'
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
