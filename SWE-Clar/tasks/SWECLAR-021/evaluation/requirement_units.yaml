- ru_id: RU-005
  name: Filtered cross-booking reports and faithful CSV
  content: 'Reports include snapshot events whose customer_id matches exact requested customer when non-null
    and whose date lies inclusively between non-null start/end. Null filters are unbounded. Validate filters
    before reading or writing outputs. Unknown but syntactically valid customer returns an empty report
    with that exact requested ID and current snapshot version. Group by ordered pair(customer_id,booking_id),
    so two customers sharing a booking ID remain distinct. Count events, not unique booking IDs; sum signed
    integer cents exactly, including zeros and refunds. Result total_cents/event_count aggregate all selected
    events. Sort booking rows by Unicode codepoint customer_id then booking_id, case-sensitive and locale-independent.
    No rounding/floating conversion or truncation.


    Report echoes normalized filter fields: supplied valid string or null, with no unrelated source/event
    data exposed in aggregate rows. CSV uses the same filtered booking aggregates/order and header. Values
    are actual raw IDs and base10 integer count/cents; no formula-escaping prefix, thousands separators,
    currency symbols or precision loss. CSV is a machine interchange artifact in a synthetic benchmark,
    not a spreadsheet-view safety claim. Quoting must preserve commas, quotes, newlines and Unicode when
    re-parsed by a standard CSV parser. A header-only CSV is a valid empty report. Export errors cannot
    overwrite prior contents or mutate database state. Concurrent exports to the same valid path may leave
    either complete valid file, never a partial mixed file. Atomic temporary output must be created in
    the destination directory and cleaned after failure.'
