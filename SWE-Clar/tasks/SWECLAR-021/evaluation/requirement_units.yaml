- ru_id: RU-002
  name: Existing snapshot/report/export chain
  content: Provide actual snapshot reads and CSV production through the disclosed command chain. Ingest
    does not implicitly refresh the report snapshot. Before the first refresh, report reads the empty
    version0 snapshot even if live records exist. A nonempty refresh copies current events; records and
    snapshot are distinct durable states. Reports/export use the same snapshot_version and return actual
    numbers. The baseline nonempty one-customer/one-booking chain must work in a single CLI process and
    after restart. Valid export writes a real CSV with header `customer_id,booking_id,event_count,total_cents`,
    one row per booking in the report, and no fabricated success if the file is absent. Standard CSV quoting
    is required for delimiters/newlines/quotes in IDs, UTF-8 preserved; LF or CRLF line terminators and
    optional UTF-8 BOM are accepted. UI/browser is not required. Hidden RUs add exact revision, snapshot
    no-op and multi-record filtering/aggregation semantics rather than forcing an empty-project implementation.
