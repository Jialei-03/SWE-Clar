  content: Render only supplied numeric metric values and chart-series arrays; preserve zeros and fractional
    values in visible cards and chart labels. Numeric arrays must produce actual chart marks, not a JSON
    placeholder. Reject non-numeric or non-finite values with invalid_metrics while retaining previously
    valid content.
