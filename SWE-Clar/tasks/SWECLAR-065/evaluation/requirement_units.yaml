- ru_id: RU-005
  name: Sequential onboarding
  content: Start an ordered non-empty onboarding flow from supplied text steps at index 0, complete=false.
    Display the current step and completed-step count; clicking Next step advances exactly once. At index=number
    of steps show completion and remove the Next control. Keep steps/index/complete in state and the action
    result; further advances are idempotent. Reject empty or invalid flows.
  requirement_category: refinement
