  name: Responsive dashboard layout
  content: Render metric cards as one column below 600 CSS pixels, two columns from 600 through 1023 and
    three columns at 1024 or above. Use actual responsive geometry with no horizontal page overflow, and
    keep navigation and controls usable at all three sizes.
