registry_version: swe-clar
registry_status: annotation_complete
disclosure_design: controlled_requirement_disclosure
selected_scope: Actual React dashboard rendering, responsive geometry, navigation and onboarding interactions
requirement_units:
- ru_id: RU-001
  name: Dashboard action entry point
  content: Complete the supplied React project while preserving the working dashboard shell and supplied
    metric rendering. Actions must update real browser content; keep input data and action objects unchanged.
    No customer records or external requests are needed.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for dashboard action entry point.
  test_interface:
    type: web_ui
    entry:
      language: javascript
      file: index.html
    inputs:
      data: window.DASHBOARD_DATA supplies synthetic metrics and onboarding_steps
      actions: Actual buttons plus window.dashboard.dispatch(action)
    output:
      type: dom
      meaning: Rendered cards, chart bars, section content and onboarding steps; snapshot() exposes a
        copy of state
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/test_solution.py
  notes: Client supported broad UI redesign and onboarding improvements; patient dashboard content, exact
    breakpoints and action rules are synthetic conventions. Existing React/metric rendering stays public;
    claims processing is outside scope.
