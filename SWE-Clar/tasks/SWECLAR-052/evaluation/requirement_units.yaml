- ru_id: RU-004
  name: Post-click stream attribution
  content: Attribute a stream to a recorded click only when the Spotify user is authorized and the stream
    occurs no earlier than the click and within the configured attribution window. An unauthorized, pre-click,
    or out-of-window stream is rejected with unattributed_stream and must not be inserted into the streams
    mapping. Timestamps must be finite numbers, excluding booleans; the configured window is inclusive
    at its upper boundary. Incoming stream observations are trusted synthetic inputs, not live listening
    verification.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
