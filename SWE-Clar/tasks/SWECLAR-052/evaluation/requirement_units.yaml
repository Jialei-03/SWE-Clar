          - event_id
          - platform
          - stream_id
          - type
        oauth_complete:
          fields:
          - code
          - state_token
          - type
        oauth_start:
          fields:
          - state_token
          - type
          - user_id
        status:
          fields:
          - type
        stream:
          fields:
          - click_id
          - stream_id
          - timestamp
          - type
          - user_id
      protocol_fields:
      - attribution_window
      - click_id
      - code
      - destination
      - event_id
      - platform
      - smartlink_id
      - smartlinks
      - state_token
      - stream_id
      - timestamp
      - type
      - user_id
      service: SmartlinkClient with local HTTP provider and connector configuration
    output:
      type: dict
      meaning: New state without input mutation or raw credentials; HTTP operations occur when required.
      asserted_field_paths:
      - clicks
