- ru_id: RU-002
  name: Spotify OAuth state validation
  content: Start authorization with a unique caller-generated state token. Reject a missing, mismatched
    or consumed state, or a non-string/blank code before network access. Complete authorization only after
    a successful form-encoded authorization-code token exchange using HTTP Basic client authentication
    and configured redirect_uri, then an authenticated profile lookup with a nonempty id. Only then consume
    the state and record authorized and provider_user_id. Failed exchanges or profiles leave the state
    unconsumed and the user unauthorized.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for spotify oauth state validation.
  test_interface:
    type: function
    entry:
      language: python
      file: solution.py
      function: process_smartlink_event
      signature: process_smartlink_event(state, event, service=None) -> dict
    inputs:
      arguments:
      - state
      - event
      action_variants:
        oauth_complete:
          fields:
          - code
          - state_token
          - type
        oauth_start:
          fields:
          - state_token
          - type
          - user_id
      protocol_fields:
      - attribution_window
      - code
      - smartlinks
      - state_token
      - type
      - user_id
      service: SmartlinkClient with local HTTP provider and connector configuration
    output:
      type: dict
      meaning: New state without input mutation or raw credentials; HTTP operations occur when required.
