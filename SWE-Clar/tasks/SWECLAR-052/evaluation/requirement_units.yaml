- ru_id: RU-005
  name: Meta and TikTok conversions
  content: Emit at most one conversion per normalized platform and external event ID for an attributed
    stream, support only Meta and TikTok, and expose click, attributed-stream, and conversion totals.
    Normalize platform by trimming surrounding whitespace and applying Unicode case-folding, so Meta and
    meta identify the same platform and the same idempotency key. Actually POST JSON {event_id, platform,
    stream_id, click_id} to the configured conversion_urls[platform] with Idempotency-Key=<normalized
    platform>:<event_id>. Record conversion only after a successful HTTP response with accepted=true and
    the same event_id. On transport or acknowledgement failure return conversion_failed and keep conversions
    unchanged so retry can send again. A successful replay must not send again. This normalized connector
    contract is a benchmark choice, not either platform's native API.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for meta and tiktok conversions.
  test_interface:
    type: function
    entry:
