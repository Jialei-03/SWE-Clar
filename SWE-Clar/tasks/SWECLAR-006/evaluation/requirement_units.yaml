requirement_units:
- ru_id: RU-001
  name: Application state and real local persistence
  content: Retain the complete public README interfaces and state/action shapes, synthetic Flutter application,
    real widget operation adapter and actual FileBookingStorage. Isolate constructor input, action input,
    snapshots, screen results and storage-call arguments. Persist an isolated proposed state before publishing
    it; a retained storage argument cannot later mutate the controller. Accepted actions return true,
    clear prior error and notify widgets. A failed save returns false with storage_failed and preserves
    prior state and displayed records. busy is true while a save is pending, concurrent act returns false
    without another save, and completion resets busy. File saves use a temporary sibling followed by atomic
    rename; loads reopen actual JSON, missing files preserve current state, and no temporary file is left
    after successful save. Valid saved state is restored in full. The evaluator supplies valid JSON or
    a controlled save failure; corrupt-state repair and multiple processes sharing a file are outside
    scope. Basic creation requires a known actor, distinct known peer and unused nonblank string ID; create
    two participants, zero minutes, extended=false, confirmed=false, status=draft. Invalid creation reports
    invalid_booking; unknown actor/action report unknown_actor/unknown_action. IDs are literal strings,
    not trimmed or normalized; all required ID values must be nonblank. Preserve required fields and existing
    records, allowing harmless extra metadata. All infrastructure and public regression obligations are
    disclosed initially.
  requirement_category: core
