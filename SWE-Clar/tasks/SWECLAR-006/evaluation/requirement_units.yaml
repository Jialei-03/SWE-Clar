- ru_id: RU-003
  name: Persistent supported-screen Back history
  content: Navigating to a different registered supported screen appends the prior route to history, then
    selects the target. Navigating to the current screen leaves route/history unchanged and is accepted.
    Back pops history from newest to oldest until a currently registered, supported screen is found, then
    selects it; discard missing or platform-incompatible entries encountered along the way. If none remains,
    retain the current route and leave history empty. Empty-history Back is an accepted no-op. Store the
    resulting route/history through the same atomic save protocol, and restore them on reopen. Invalid
    navigation and failed saves must preserve both route and history. History may contain entries from
    earlier screen/platform configurations. No-op acceptance does not require avoiding an otherwise valid
    storage call. Actual Back/navigation widgets must use this policy. These precise history decisions
    are independently constructed benchmark rules.
