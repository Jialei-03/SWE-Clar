- ru_id: RU-005
  name: Participant messages and audited administrative overrides
  content: 'Saving a message requires an existing booking, a participant sender from the trusted constructor,
    a different participant recipient, and nonblank string message ID and text; otherwise return false
    with message_denied. Preserve body whitespace and literal markup/Unicode; do not normalize IDs/text.
    Store booking_id, sender_id, recipient_id and text under the global message ID. A repeated message
    ID with the same four business values is accepted without adding or changing the message; a different
    value reports message_conflict and preserves state. Key order and harmless metadata do not create
    conflicts. Messages can be composed at any booking lifecycle status. Only sender or recipient sees
    a message row; an unrelated user, including an unrelated admin, sees none. Saved messages reappear
    when the recipient opens the component using the same state.


    Only an actor whose trusted user registry role is admin can issue admin_status; reject other actors
    with admin_required regardless of action-supplied identity/role fields. Require an existing booking,
    a nonblank string event ID and status in draft, confirmed, cancelled, completed; invalid inputs report
    invalid_status. For a new event, add an audit row containing booking_id, actor_id and status, set
    the booking status, and set confirmed=true for confirmed/completed or false for draft/cancelled. Preserve
    participants, extension_minutes, extended and all other records. The same event ID and three business
    values is an accepted replay with no new audit row and no reapplication of an old status after later
    events. Reusing an event ID with different values reports event_conflict. Field order and harmless
    metadata do not affect replay matching. The administrative UI can mark an accessible booking completed
    using a fresh event ID. All state changes use the common save-before-publish protocol and visible
    UI; a storage failure commits neither booking nor message/audit changes. These permissions and override/replay
    rules are synthetic benchmark conventions.'
