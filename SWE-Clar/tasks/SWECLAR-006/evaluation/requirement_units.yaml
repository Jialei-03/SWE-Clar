- ru_id: RU-004
  name: Booking extension and confirmation lifecycle
  content: Only a booking participant can extend or confirm that booking. Extension requires an existing
    booking in draft status with confirmed=false and extended=false, and an integer number of minutes
    from 1 through 30 inclusive; set extension_minutes to that number and extended=true. Reject all other
    extension requests with extension_denied, including repeats, nonintegers, nonparticipants, missing
    bookings and non-draft bookings. Confirmation requires an existing draft booking with confirmed=false
    and a participant actor; set confirmed=true and status=confirmed, preserving extension information.
    Otherwise reject with confirmation_denied. Confirmation does not require a prior extension. Unknown
    event-supplied role/actor fields confer no authority. Persist and render accepted changes; rejection
    or save failure leaves the previous booking unchanged. A member sees only booking cards containing
    their actor ID; an admin may see every booking card, but administrative role alone does not grant
    participant extension/confirmation. Users and IDs can vary. The numeric range and lifecycle policy
    are independently authored.
