- ru_id: RU-002
  name: Real registered pages and usable controls
  content: Render actual Home, Bookings and Messages widgets with the README keys and editable controls;
    retain booking creation, status/minutes display, message composition and role-appropriate administrative
    controls. Screen choices include exactly the registry entries whose platform list contains the constructor
    platform, sorted by screen ID. Titles and registry insertion order can vary; the three page IDs remain
    home, bookings and messages. Do not mutate registry data through returned rows. Reject unregistered
    or unsupported navigation with unknown_screen and unchanged state. At 360x950 and 768x950 logical
    pixels, pages have no render exceptions, controls can be reached by scrolling, and real taps/text
    input execute controller operations. Show literal saved message body and sender/recipient, booking
    ID/status/extension minutes, and controller error text. Refresh from accepted controller state; a
    rejected operation must retain prior records and values. New message/admin button intents create distinct
    operation IDs, including after reopening. Styling and unrelated wording are free. Platform labels
    select this tested component and do not claim native build, mobile signing, remote delivery or device
    authentication. Remaining navigation, lifecycle, idempotency and record-visibility decisions are available
    by clarification.
