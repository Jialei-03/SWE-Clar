    Local protocol fixture verifies actual traffic; production broker deployment and visual dashboard
    are not claimed.
- ru_id: RU-005
  name: Threshold alarms and role dashboard
  content: State rules and alarms are mappings keyed by rule ID and alarm ID. Each rule supplies key,
    operator (gt or lt), and numeric threshold; after ingestion evaluate the payload value against every
    rule and create at most one alarm for each device/rule pair. Alarm IDs are the deterministic string
    "<device_id>:<rule_id>". Acknowledge changes the alarm status to acknowledged and clear changes it
    to cleared. Dashboard returns devices and non-cleared alarms as arrays; tenant administrators see
    all companies while company administrators see only their own company. Only a tenant administrator
    or an administrator of that device's company may acknowledge or clear an alarm; other actors get alarm_denied
    without changing it. Boolean values do not trigger numeric rules. Other roles cannot gain dashboard
    access merely by sharing company_id. Other-role dashboard denial may be a nonempty error or empty
    device/alarm arrays; no exact denial code is required.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for threshold alarms and role dashboard.
  test_interface:
    type: function
    entry:
      language: python
      file: solution.py
      function: process_iot_action
      signature: 'process_iot_action(state: dict, action: dict) -> dict'
    inputs:
      arguments:
      - state
      - action
      action_variants:
        ack_alarm:
          fields:
          - actor_id
          - alarm_id
          - type
        clear_alarm:
          fields:
          - actor_id
          - alarm_id
          - type
        dashboard:
          fields:
          - type
          - user_id
        ingest:
          fields:
          - payload
          - timestamp
          - topic
          - type
      protocol_fields:
      - actor_id
      - alarm_id
      - devices
      - entities
      - payload
      - rules
      - timestamp
      - topic
      - topics
      - type
      - user_id
      - users
      mqtt_entry: ingest_mqtt(state,host,port,max_messages=1,timeout=2)
    output:
      type: dict
      meaning: A deterministic JSON-compatible result; input objects are not mutated.
      asserted_field_paths:
      - alarms
      - result
      - result.alarms
      - result.devices
      field_schemas:
        alarms:
          type: object
        result.alarms:
          type: array
          items:
            type: object
        result.devices:
          type: array
          items:
            type: object
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-005-T01
    file: evaluation/tests/test_solution.py
  notes: MQTT 3.1.1 QoS 0 subscription and synthetic JSON envelope are explicit reconstruction choices.
    Local protocol fixture verifies actual traffic; production broker deployment and visual dashboard
    are not claimed.
