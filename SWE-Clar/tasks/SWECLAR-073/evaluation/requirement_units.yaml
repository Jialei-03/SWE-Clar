      source_root: Read-only synthetic asset tree
      destination_root: Local repository output tree
    output:
      type: dict
      meaning: Migration report plus actual copied files and JSON sidecars
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-002-T01
    file: evaluation/tests/test_solution.py
  notes: The local repository directory and JSON sidecars are benchmark reconstruction choices. dynamic_media
    is an export intent, not evidence of remote publication.
- ru_id: RU-003
  name: Per-record validation
  content: 'Validate each record independently: missing/empty id,filename,folder => missing_fields; absent
    folder mapping => unmapped_folder; absent source file => missing_asset; unsafe relative folder, non-basename
    filename, paths outside roots or mappings outside /content/dam => invalid_path. Reject . or .. components,
    absolute source folders, separators in basenames and symlink paths; roots may not overlap. A conflicting
    existing asset or sidecar, including an incomplete pair, returns target_conflict without changing
    either. Identical existing bytes and required sidecar fields succeed; extra sidecar fields/JSON formatting
    need not match. On serialization/I/O failure return a nonempty error code, clean partial new output
    files, and continue later records. Atomicity is per record at function return, not crash/concurrent-reader
    atomicity and not all-or-nothing for the batch.'
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Describe the required behavior for per-record validation.
  test_interface:
