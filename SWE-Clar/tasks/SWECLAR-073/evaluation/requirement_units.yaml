- ru_id: RU-005
  name: Batch summary and immutability
  content: Return migrated,errors,summary. Preserve relative input order separately for successes and
    failures; each error has zero-based index and code, with id when available. summary.input equals input
    length, summary.migrated equals successes and summary.failed equals errors. Do not mutate assets or
    taxonomy, including nested metadata. Source files remain unchanged even after failures. Repeating
    identical records may produce repeated report successes but never duplicate output files.
  requirement_category: refinement
