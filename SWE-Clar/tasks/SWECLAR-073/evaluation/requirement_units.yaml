schema_version: 1
task_id: SWECLAR-073
registry_version: swe-clar
registry_status: annotation_complete
disclosure_design: controlled_requirement_disclosure
selected_scope: Actual asset-byte migration and metadata export into a local content repository
requirement_units:
- ru_id: RU-001
  name: Folder and taxonomy mapping
  content: migrate_asset_batch(assets,taxonomy,source_root,destination_root) transfers actual bytes from
    source_root/folder/filename to destination_root plus the mapped /content/dam path and filename. Every
    success preserves source bytes and maps aem_path/taxonomy. Keep the supplied CLI usable. Source and
    destination roots must be disjoint; never write into the source tree. This is a local reconstructed
    repository migration, not a cloud/AEM connection or a manifest-only transformation.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Describe the required behavior for folder and taxonomy mapping.
  test_interface:
    type: function
    entry:
      language: python
      file: solution.py
      function: migrate_asset_batch
      signature: migrate_asset_batch(assets, taxonomy, source_root, destination_root) -> dict
    inputs:
      assets: Source descriptors, with actual bytes in source_root/folder/filename
      taxonomy: Folder mapping to /content/dam path, taxonomy and optional dynamic_media intent
      source_root: Read-only synthetic asset tree
      destination_root: Local repository output tree
    output:
      type: dict
      meaning: Migration report plus actual copied files and JSON sidecars
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/test_solution.py
  notes: The local repository directory and JSON sidecars are benchmark reconstruction choices. dynamic_media
    is an export intent, not evidence of remote publication.
- ru_id: RU-002
  name: Metadata preservation
  content: Each migrated result and adjacent filename.metadata.json sidecar must preserve id,filename,title
    (default empty string),metadata (default empty object, including nested values) and include aem_path,taxonomy,dynamic_media,sha256.
    SHA-256 is over the actual bytes and destination must be byte-identical. Sidecar JSON format/key order
    and extra top-level metadata are free; compare required fields semantically. Input nested metadata
    is JSON-compatible and must be preserved, not flattened.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Describe the required behavior for metadata preservation.
  test_interface:
    type: function
    entry:
