selected_scope: Independently reconstructed piano MIDI performance batch application with actual VST3
  audio delivery.
requirement_units:
- ru_id: RU-001
  name: MIDI application and public input contract
  content: Preserve the public README command-line and Standard MIDI File contracts. Invalid arguments,
    a missing input directory, non-directory output or overlapping input/output directory trees exit 2
    before processing or creating outputs, with an explanation on stderr. Support type 0/1, positive PPQN/tempo,
    1–10000 notes and up to 120 seconds, multiple tracks, channels, polyphony, tempo changes and note-on-zero
    releases. Pair within original track/channel/pitch without same-key overlap. Keep file type, track
    count, PPQN, note count, pitch/channel and all non-note events at their original ticks. Reject unsupported
    percussion channel 9, type 2, SMPTE, unmatched/cross-track pairing or unterminated notes. Produce
    the public per-file result schema and real self-contained MIDI/WAV deliverables; implementation organization
    is free.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: What are the rules for midi application and public input contract?
  matching_keywords:
  - MIDI
  - format
  - input
  - command
  - track
  - validation
  test_interface:
    type: command
    entry:
      command: python app.py INPUT_DIRECTORY OUTPUT_DIRECTORY --seed INTEGER --articulation normal|staccato
      runtime: Prepared Python/Mido/VST3 environment described in README
    inputs: Synthetic Standard MIDI Files and CLI options
    output: Per-input transformed SMF and actual PCM WAV, plus the public JSON result list
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  notes: Business scenario motivates piano MIDI performance processing and VST3 audio delivery. Exact
    seeded transformations, batch policy, instrument and Linux execution are independent benchmark design;
    no customer code/media or commercial platform compatibility claim.
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/audio_contract.py
- ru_id: RU-002
  name: Reproducible attack timing
  content: For each original positive-velocity note-on, use its zero-based track index and its original
    zero-based note-on ordinal within that track. SHA-256 the UTF-8 string seed:track:ordinal, using decimal
    integers with colon separators. Byte 0 modulo 25 minus 12 gives onset jitter in ticks. New start is
    original start plus jitter, clamped to [lower,original end-1], where lower is max(0,the previous original
    end for the same track/channel/pitch). Pair all original notes first and use original, not transformed,
    previous ends. Move attacks only; normal articulation keeps the original note-off tick. Keep tempo
    and other messages at original ticks. The same input and seed must produce the same performance regardless
    of file name, absolute path, surrounding files or their failures. Chord notes can receive different
    jitter. Same-tick releases precede attacks, and original non-note events retain their relative order.
  requirement_category: refinement
