- ru_id: RU-003
  name: Velocity and articulation
  content: Use the same SHA-256 digest of decimal seed:track:ordinal. Byte 1 modulo 17 minus 8 is the
    velocity delta; clamp the new velocity to 1–127. Keep note pitch, channel, track and count, including
    very quiet notes. normal retains original end. staccato uses duration=max(1,floor((original end-new
    start)/2)) ticks after the attack timing transformation, and end=new start+duration. Do not change
    tempo to emulate articulation or only report the selected mode. Serialize valid paired notes; equivalent
    note-off encoding is allowed.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
