- ru_id: RU-004
  name: Independent batch publication and recovery
  content: Recursively discover regular .mid/.midi files, case-insensitive by extension, in sorted POSIX
    relative-path order. Ignore other files and all symbolic links, including linked directories. An empty
    batch yields results=[] and exit 0. Each input gets one result. Invalid MIDI gets invalid_midi, renderer
    failure gets render_failed, and an already-existing result path gets existing_output without changing
    existing content. Continue later inputs after any per-file error. A successful pair of performance.mid
    and render.wav is published in OUTPUT/<relative input path including extension>/ only after both files
    are fully written and decodable; no failed input leaves a final result directory or partial artifacts.
    Other successful files remain committed. Exit 0 for a wholly successful or empty batch, 1 if any input
    fails. Keep input paths relative in the summary; do not expose absolute host locations. The public
    CLARSWE_AUDIO_RENDER_ERROR=1 switch simulates the renderer returning failure and is subject to these
    same rules.
  requirement_category: refinement
