- ru_id: RU-005
  name: Real tempo-aware VST3 audio
  content: Use transformed performance.mid events and its original tempo map to drive the prepared offline
    host and independently synthesized VST3 instrument. Output stereo 16-bit PCM at 44100 Hz, preserving
    the supplied instrument waveform. Map exact tempo-map event times to nearest sample frame with half-frame
    upward rounding; retain at least one sample for a positive tick-duration note. End at the last quantized
    note-off plus 22050 frames, ignoring trailing end-of-track silence. Sound must reflect the produced
    note pitches, velocities, attacks and release durations. Empty/silent WAVs, copying unrelated or pre-transformation
    audio, and self-reported rendered flags do not meet delivery. WAV metadata or serialization may differ
    without changing the PCM signal. The protected host, MIDI dependencies and public render-failure simulator
    are supplied before candidate execution; no commercial plugin, SDK installation, customer audio or
    platform account is required.
  requirement_category: core
