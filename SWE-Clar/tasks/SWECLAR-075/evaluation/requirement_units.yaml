schema_version: 1
task_id: SWECLAR-075
registry_version: swe-clar
registry_status: annotation_complete
disclosure_design: controlled_requirement_disclosure
selected_scope: Limited local web account/GPS attendance and central Plans navigation; native iOS excluded
requirement_units:
- ru_id: RU-001
  name: Check-in workflow entry point
  content: Repair the actual account/attendance HTTP service and browser UI using private synthetic fixture
    configuration. Preserve server-owned sessions, encrypted email/history payloads and persisted records
    across restart. Never return salts, password verifiers, encryption keys or session hashes in public
    data. Actual HTTP requests, SQLite storage and browser location interaction are required.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for check-in workflow entry point.
  test_interface:
    type: function
    entry:
      language: python
      file: store.py
      function: Store.checkin
      signature: Store.checkin(user_id,action) -> record
    inputs:
      user_id: server-authenticated actor
      action: id,site_id,latitude,longitude
    output:
      type: dict
      meaning: persisted attendance record
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/checkin_contract.py
  notes: Client passages support GPS check-in and prominent central Plans. Web adaptation and exact password/encryption/session/radius/interval
    rules are synthetic benchmark conventions, not directly confirmed client requirements.
- ru_id: RU-002
  name: Secure account and login
  content: Normalize email by trimming surrounding whitespace and lowercasing for both registration and
    login; reject duplicate normalized accounts. Store a salted scrypt verifier, never plaintext or a
    bare unsalted hash. Only active users with matching credentials may obtain a fresh HttpOnly session;
    sign-out revokes it. These concrete security choices are benchmark conventions supporting the source
    account-safety request.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
