- ru_id: RU-004
  name: One open attendance interval
  content: Allow at most one open interval per actor, including concurrent requests. Checkout closes it
    using trusted server time, preserving history and a non-negative duration. A regressing clock must
    fail without rewriting the interval. Query history only for the authenticated actor and survive service
    restart. This interval/checkout policy is an independently selected benchmark convention.
  requirement_category: refinement
