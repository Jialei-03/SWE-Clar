- ru_id: RU-003
  name: GPS-radius check-in
  content: An authenticated actor can check into an active synthetic site only when independently computed
    great-circle distance from finite latitude/longitude is at most the configured radius. Use sphere
    radius 6371008.8 m. Do not trust caller-supplied distance, user identity or clock. A repeated event
    id for the same actor/site returns its existing record; conflicting reuse fails. GPS permission denial
    must show location_unavailable without recording attendance. Exact radius/idempotency policies are
    independently selected benchmark conventions.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
