- ru_id: RU-003
  name: One-time lifetime entitlement
  content: stripe_event is trusted local ingestion of an already verified synthetic webhook, not a public
    payment endpoint. It requires known user, nonempty event_id and stripe_session_id, confirmed exactly
    true and purchase_type lifetime. Store payment event by ID for audit and entitlements[user_id]=lifetime;
    result event_id,duplicate=false,granted=true. Exact replay of the same user/session/purchase/confirmation
    returns duplicate=true,granted=false without changing payment or entitlement business state. Reusing
    event ID with changed fields rejects. Other purchase types, unconfirmed events and unknown users reject.
    Account lifetime status reads persisted entitlements, ignoring client action lifetime/payment flags;
    no real charge is made.
