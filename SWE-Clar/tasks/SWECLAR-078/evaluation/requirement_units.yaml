      language: python
      file: solution.py
      function: process_investor_action
      signature: process_investor_action(state, action) -> dict
    inputs:
      state: Internal synthetic application state
      action: Operation schema in README
    output:
      type: dict
      meaning: Entire internal next state with result/error; CLI act only emits public result/error
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
