    service events and output intents do not prove external operations. No original application repository
    is distributed.
- ru_id: RU-002
  name: Persistent protected accounts
  content: register needs unique nonempty user_id, normalized lowercase/trimmed unique email with one
    @ and nonempty whitespace-free parts, and nonblank string password; name optional. Store users[id].email/name/password_hash
    using the explicit stdlib verifier boundary in the public README — PBKDF2-HMAC-SHA256/SHA512 with
    100000..1000000 iterations, or scrypt n in {16384,32768,65536}, r=8, integer p in 1..4; fresh random
    salt >=16 bytes and verifier 32..64 bytes. Floors provide 128-bit salt space and >=256-bit verifier;
    upper work bounds keep independent derivation within the prepared CPU/memory budget. Accept the documented
    delimited hex forms or JSON string with hex/base64/base64url salt/digest and optional none/NFC/NFKC
    normalization then UTF-8 and none/sha256/sha512 raw-digest prehash. JSON permits only documented fields,
    no duplicate keys; integer costs exclude bool. Verify stored derivation against the supplied password,
    not merely a reported KDF call. This is an explicit bounded acceptance-profile clarification, not
    universal secure-KDF equivalence. Never store plaintext, reversible copies elsewhere in user records,
    or unsalted fast digests. login checks credentials with the declared preprocessing and creates unpredictable
    nonempty session token, persisted in sessions[token]=user_id; login result token and user_id. account(token)
    requires live session and returns user_id,email,name,lifetime based on entitlements; no password_hash
    or other users' data. logout revokes only that token and preserves account. Login failure must not
    create a session.
  requirement_category: core
  source_visibility: visible
