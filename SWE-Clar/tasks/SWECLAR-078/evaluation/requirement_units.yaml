- ru_id: RU-004
  name: Structured beginner report
  content: 'generate_report requires curated_stocks symbol, strict valid calendar YYYY-MM-DD date, finite
    numeric nonboolean movement_pct, and nonblank string sections reason,movement,risk_boundary,watch_next.
    Language validation is deliberately finite: reject case-insensitive substring guaranteed return or
    institutional-grade in any required section; otherwise accept wording without subjective readability/hype
    judging. Store reports[date+'':''+symbol] exposing supplied four sections, symbol,date and illustration
    {allocation:1000,change:1000*movement_pct/100}; return report fields in result. Negative and zero
    changes are valid. This component stores supplied educational text, not live investment advice or
    generated forecasts.'
