- ru_id: RU-001
  name: Investor action entry point
  content: 'process_investor_action(state,action) returns entire next internal state with result or nonempty
    error.code, without mutating inputs. On rejection preserve business state. Random password salts/session
    tokens are permitted; business semantics must be stable. Preserve supplied SQLite CLI init/show/act:
    successful changes survive separate processes; init cannot overwrite existing database. show is local
    operator-only inspection, not a public endpoint. act prints only result/error, never internal users,
    password hashes, sessions or screening scores. No external payment/data provider or full investment
    application is required. Extra metadata and alternate error wording allowed.'
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for investor action entry point.
