- ru_id: RU-005
  name: Closed beta and behavioral tracking
  content: screen requires registered user, exactly four distinct known question IDs mapped to boolean
    answers, finite nonnegative nonboolean timestamp. Sum configured question_pool[id].weight for true
    answers; weights are finite nonnegative numbers. Score >=8 yields Pro Beta, >=4 Basic Beta, otherwise
    Waitlist. Store screening[user_id] including tier,timestamp (internal scoring format otherwise free),
    and return tier plus score_hidden=true without score, answers or per-question weights. An existing
    Waitlist user may retake at timestamp >= prior timestamp+604800; an admitted user may not retake.
    track requires known user, nonempty event and metro strings, finite nonnegative nonboolean timestamp,
    appends events row user_id,event,metro,timestamp; zero accepted. Supplied user_id here is trusted
    local service context; only account/login/logout are session-facing. No random question sampling or
    external tracking service required.
