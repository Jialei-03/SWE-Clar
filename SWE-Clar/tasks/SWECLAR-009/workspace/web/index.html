<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hiring workspace</title><link rel="stylesheet" href="/style.css"></head><body><header><div><p class="eyebrow">LOCAL HIRING WORKSPACE</p><h1>Find work. Build a team.</h1><p>Independent demo · synthetic accounts and records</p></div><button id="logout" hidden>Sign out</button></header><main>
<section id="login-panel" class="card"><h2>Sign in</h2><form id="login-form"><label>Account<input id="account" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form><p id="login-status" role="status"></p></section>
<div id="application" hidden><div class="workspace-bar"><strong id="identity"></strong><button id="refresh">Refresh workspace</button><span id="status" role="status"></span></div>
<div class="columns"><section class="card"><h2>Your profile</h2><form id="profile-form"><label>Name<input id="profile-name" maxlength="120" required></label><label>Biography<textarea id="profile-bio" maxlength="2000"></textarea></label><button id="profile-save">Save profile</button></form><h3>People and teams</h3><div id="profiles"></div></section>
<section class="card"><h2>Contacts</h2><form id="relationship-form"><label>Target<select id="relation-target"></select></label><label>Relationship<select id="relation-kind"><option value="follow">Follow</option><option value="connect">Connect</option></select></label><label class="check"><input id="relation-enabled" type="checkbox" checked>Enabled</label><button id="relationship-save">Save relationship</button></form><div id="relationships"></div></section></div>
<section class="card"><h2>Jobs</h2><form id="search-form" class="row"><label>Search<input id="search-q"></label><label>Category<input id="search-category"></label><label>Location<input id="search-location"></label><button id="search">Search</button></form><p id="job-status" role="status"></p><div id="jobs" class="job-grid"></div><div id="job-detail"></div><button id="bookmark" disabled>Toggle bookmark</button><p id="view-status" role="status"></p><button id="view-retry" disabled>Retry view recording</button><h3>Bookmarks</h3><div id="bookmarks"></div>
<form id="job-form"><h3>Create or edit a job</h3><label>Job ID <small>(clear for a new ID)</small><input id="job-id"></label><label>Title<input id="job-title" maxlength="160" required></label><label>Description<textarea id="job-description" maxlength="10000" required></textarea></label><div class="row"><label>Category<input id="job-category" maxlength="80" required></label><label>Location<input id="job-location" maxlength="80" required></label><label class="check"><input id="job-active" type="checkbox" checked>Active</label></div><button id="job-save">Save job</button></form></section>
<div class="columns"><section class="card"><h2>Resume and application</h2><label>Resume text file<input id="resume-file" type="file" accept=".txt,text/plain"></label><label>Resume ID (optional when applying)<input id="resume-id"></label><button id="upload-resume">Upload resume</button><p id="resume-status" role="status"></p><label>Application ID<input id="application-id"></label><button id="apply" disabled>Apply to selected job</button><p id="application-status" role="status"></p><h3>Applications</h3><div id="applications"></div><button id="download-resume" disabled>Download selected resume</button></section>
<section class="card"><h2>Interview agenda</h2><label>Interview ID<input id="interview-id"></label><label>Start (UTC ISO)<input id="interview-start" placeholder="2024-01-03T10:00:00.000Z"></label><label>End (UTC ISO)<input id="interview-end" placeholder="2024-01-03T11:00:00.000Z"></label><button id="schedule" disabled>Schedule selected application</button><button id="reject" disabled>Reject selected application</button><p id="interview-status" role="status"></p><div id="calendar"></div></section></div>
<section class="card" id="analytics-panel"><h2>Job views</h2><div class="row"><label>Job<select id="analytics-job"></select></label><label>Start UTC (blank = all time)<input id="analytics-start"></label><label>End UTC<input id="analytics-end"></label></div><button id="analytics-load">Load analytics</button><button id="analytics-download">Download CSV</button><p id="analytics-status" role="status"></p><div id="analytics-summary"></div><div class="chart-scroll"><svg id="view-chart" viewBox="0 0 640 240" role="img" aria-label="Daily job views"></svg></div></section>
</div></main><script src="/ui.js"></script></body></html>
