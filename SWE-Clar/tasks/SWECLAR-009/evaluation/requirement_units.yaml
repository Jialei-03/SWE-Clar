requirement_units:
- ru_id: RU-001
  name: Working web application and trusted sessions
  content: Maintain a real local hiring web application using the public Python server command, SQLite
    database, fixture schema, HTTP endpoints and browser controls. The benchmark preinstalls Python, SQLite
    and Chromium; there are no production accounts, remote APIs or original customer materials. Initialize
    fixtures only for a new database, preserve existing data on restart and use database transactions
    for atomic changes. Login validates a seeded password and creates an opaque server-stored session;
    wrong credentials, missing/forged/revoked tokens return 401. Logout revokes only that session. Actor
    identity and role come from the session, never from supplied user/owner/role claims. Expose only documented
    public user fields, never passwords/hashes or any other session token. Reject malformed JSON, extra/missing
    request fields and invalid public formats with 400; errors are real HTTP error statuses with JSON
    error.code. All successful JSON objects may contain harmless extra metadata. Preserve actual browser
    login/logout, profile browsing/editing and relationship controls, plus the published integration controls
    for job, application, interview and analytics work. Render names, biographies, descriptions and feedback
    as literal text, keep controls usable at 390x844 and 1280x900 without horizontal overflow or script
    errors, and distinguish empty data from visible errors with a retry path. Logout/account changes clear
    old DOM and pending responses; late successful responses from an earlier account must never restore
    previous account content. Keep all business state in the actual SQLite database, not self-reported
    persistence flags. These foundation obligations are initially public.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: What behavior is required for working web application and trusted sessions?
  matching_keywords: []
  test_interface:
    type: command
    entry:
      command: python server.py --port 8000 --db hiring.sqlite --fixtures fixtures/demo.json
      runtime: Prepared Python/SQLite/Chromium local application
    inputs:
      http: Published session-authenticated HTTP/JSON endpoints and base64 file upload
      browser: Published profile, relationship, job/application, interview/agenda and analytics controls
    output:
      application: Real browser UI, HTTP responses, SQLite rows/blobs and downloaded files
      evaluation: Independent hidden checks mapped to five RUs
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  notes: The original job privately supports a hiring web marketplace with authentication and database
    work. All exact workflows, identities, schemas, code, files and policies are independently constructed,
    not customer quotations.
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/hiring_contract.py
- ru_id: RU-002
  name: Public profiles and role-aware relationships
  content: Authenticated users may list and read all synthetic profiles, exposing only id, name, role
    and bio, sorted by ID. A user may edit only their own display name and biography through the session-bound
    profile endpoint; name is trimmed nonempty text of at most 120 characters and bio is literal text
    of at most 2000 characters. Roles and user IDs are immutable through this endpoint. Display edited
    content immediately and preserve it after restart. For a relationship target, missing users return
    404, self-relations return 400, and invalid role combinations return 403 without changing existing
    data. Follow is directional and allowed from either employer or employee to another employer. Connect
    is symmetric and allowed only between two employees; this synthetic contact-list operation takes effect
    immediately, with no invitation workflow. enabled=true creates the relation once and enabled=false
    removes it idempotently. Follow and connect records are distinct. Return only relations involving
    the current actor, with actor_id,target_id,kind; serialize connect with the lexicographically smaller
    ID as actor_id, then sort rows by kind,actor_id,target_id. Relationship and profile edits operate
    through actual authenticated HTTP and browser forms. The relationship matrix and immediate-contact
    convention are public baseline behavior, not undisclosed requirements.
  requirement_category: core
