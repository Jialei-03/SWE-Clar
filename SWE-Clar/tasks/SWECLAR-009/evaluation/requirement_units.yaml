- ru_id: RU-005
  name: Idempotent view events, period analytics and rendered charts
  content: Only an employee may POST a job view event. Derive viewer_id from the session; event_id is
    unique per viewer, not globally. A new event requires an active existing job (missing or inactive
    returns 404); an employer receives 403. Each event stores its provided integer timestamp_ms, permitting
    out-of-order and future events within the public range. An identical event_id/job/timestamp replay
    by that viewer is accepted with duplicate=true, including after job closure; conflicting reuse returns
    409 without altering the earlier event. Another employee using the same event_id is independent. Only
    the owning employer may read a job's analytics, including closed jobs; others or nonexistent jobs
    return 403. With neither start_ms nor end_ms, aggregate all stored views. Otherwise require both valid
    timestamps with start_ms<=end_ms and include both period endpoints; malformed or partial periods return
    400. Return total views, total distinct viewer IDs and by_day rows sorted by UTC date, including only
    dates with matching events. Each by_day row has day (YYYY-MM-DD), views and unique_viewers. The sum
    of daily views equals the period total; period unique viewers is a union across days, not the sum
    of daily distinct counts. Replaying events never inflates counts and data survive restart. Browser
    opening a job as an employee submits a real view event, preserving its event ID on an explicit retry
    after failure; a new opening is a new event. Use the fixture clock_ms for ordinary UI view timestamps
    so runs do not depend on wall time. An employer can select a job, choose all-time or an inclusive
    period, and render an actual SVG column chart from returned by_day counts plus readable day/count
    labels. Positive column heights are proportional to views on one common scale; equal counts have equal
    heights, and an empty result has a visible empty state. Include one rect with data-day per nonempty
    day in svg#view-chart; styling, colors and dimensions are free. The CSV download uses the same authorized
    query and exactly day,views,unique_viewers columns in the same order as by_day, with real counts and
    CSV escaping. Failed reads/downloads show an error and allow retry; late responses for a prior job/period/account
    must not overwrite the current chart or expose a previous account's data. All event and analytics
    policies are independent synthetic requirements.
