- ru_id: RU-004
  name: Atomic interview scheduling, rejection and participant agendas
  content: 'Only the owning employer may reject or schedule an application; forbidden access, including
    unknown application IDs, returns 403 without exposing its contents. Scheduling supplies interview_id,
    application_id, start_ms and end_ms in the public timestamp format. Require start_ms at or after the
    fixed fixture clock_ms, end_ms strictly later, and duration at most eight hours; invalid slots return
    400. An application can have at most one scheduled interview. An identical interview ID/application/start/end
    replay succeeds with duplicate=true; conflicting interview ID reuse or another interview for an already
    scheduled application returns 409. A rejected application cannot be scheduled (409). Appointment intervals
    are half-open: end equal to another start is allowed. Reject a slot with 409 if it overlaps an existing
    interview involving either the owning employer or the applicant, even on a different job or across
    different employers for that applicant. Perform the interview insert, application status change to
    scheduled and conflict decision in one transaction so concurrent conflicts cannot both succeed. Rejection
    sets status=rejected and removes any scheduled interview atomically, freeing its slot and removing
    it from both agendas; repeated rejection is idempotent. Closing a job does not invalidate its existing
    applications or prevent an authorized interview. GET calendar returns only interviews involving the
    current actor, sorted by start_ms then interview_id, with real participant IDs, job/application IDs
    and start/end times. Participants are [employer_id,employee_id]. Both participants see the same persisted
    event and a nonparticipant sees none. The browser must provide scheduling/rejection controls and an
    actual chronological agenda showing job, participants and UTC start/end times. Show pending/failure
    feedback, preserve a prior event on a rejected scheduling attempt, allow retry, and remove cancelled
    events after refresh. Role-ineligible controls are hidden or disabled and permissions also hold on
    the server. Rescheduling and external calendar services are outside this independently designed local
    agenda workflow.'
