- ru_id: RU-003
  name: Owned jobs, discovery, applications and private resume files
  content: Only employers create jobs. A new job receives the session actor as employer_id and active=true;
    duplicate job_id returns 409 and never overwrites a job. An employer may update only its own job,
    including closing or reopening it; unauthorized updates return 403 and missing jobs return 404. Required
    job title, description, category and location are trimmed nonempty Unicode strings with the public
    length bounds; active is an actual boolean. GET jobs returns employees only active jobs and employers
    only their own jobs, including closed ones. Optional q matches a casefolded substring of title or
    description; category and location use casefolded exact comparison after trimming. Combine filters
    with AND, blank filters mean no restriction, and sort by job_id. A job-detail read allows its owner
    or any employee when active; other access returns 403, and a missing job returns 404. Employee bookmarks
    may be enabled only on active jobs, with duplicates idempotent; disabling an existing bookmark is
    allowed after closure. Bookmark lists contain only that employee's saved jobs, including closed ones,
    sorted by job_id. Employers may not bookmark or apply. Each employee may apply only once to an active
    job; application_id is globally unique and the job/employee pair is unique even after rejection. The
    identical application_id/job/employee/resume_id replay succeeds with duplicate=true without adding
    rows; a conflicting reuse or a second ID for that pair returns 409. A previously accepted identical
    replay still succeeds after the job closes. A new application starts applied. An optional resume_id
    must belong to the applying employee, otherwise return 403 (including nonexistent references) without
    creating an application. Only employees upload resumes, using the public base64 UTF-8 .txt file format
    and limits. Persist and return the exact decoded bytes on download. A resume ID is globally unique;
    identical owner/filename/bytes replay is idempotent, and conflicting reuse returns 409 without replacing
    bytes. Resume download is allowed only to its uploader and employers owning an application that references
    it, including a rejected application; all other or nonexistent resume IDs return 403. A resume uploaded
    but never attached to an application is private to its uploader. Download retains its safe basename
    and text/plain media type. Application lists reveal only the current employee's applications or current
    employer's owned-job applications, sorted by application_id. Provide real job forms/filter results,
    bookmark actions, file upload, application submission and authorized resume download; show server
    rejection, preserve saved data and permit retry. Simultaneous duplicate operations must remain atomic.
    All account, ownership, lifecycle and attachment decisions here are independent benchmark conventions.
