- ru_id: RU-005
  name: Trial and administration
  content: trial needs unique license_id/key (key string at least8 characters), normalized valid email/shop
    and finite numeric now(default0),expires_at with expires_at>now>=0, excluding bool. Store status=trial
    and expiry; no paid event or email outbox required. Verification rejects exactly at/after expiry even
    if administrator later sets active. set_status requires admin_id in state.admins, known license and
    status active/frozen/revoked, changes status only. search requires administrator; query defaults empty,
    string case-insensitive trimmed substring across license_id,email,shop. Return result.licenses sorted
    by license_id, with those fields,status,key_suffix and expiry when present; never raw key/hash. Unauthorized
    search/status change rejects without business effects. Identity is trusted upstream local context,
    not public login.
