- ru_id: RU-003
  name: Store and IP verification
  content: verify requires known key hash, nonblank normalized shop/IP and finite nonnegative numeric
    timestamp excluding bool (default0). Active/trial license only; any expires_at bound requires finite
    nonnegative now excluding bool and now<expires_at. Store successful ping license_id,shop(trim+casefold),ip(trim),timestamp;
    return valid=true,license_id,key_suffix, never key/hash. Unknown/frozen/revoked/expired rejects without
    ping. Shop mismatch follows secondary-use audit rule. Binding never changes during verification.
