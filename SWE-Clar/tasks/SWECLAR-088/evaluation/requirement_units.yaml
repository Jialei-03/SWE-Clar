- ru_id: RU-004
  name: Abuse warning and freeze
  content: For an otherwise active/unexpired known license verified from a different normalized shop,
    deny verification, add one warnings row per license_id+secondary-shop exposing license_id,shop,status=frozen,
    and persist that audit even though response has error. Repeated attempts/case variants do not add
    warnings; a different secondary shop may add its own. Do not freeze the license or legitimate shop,
    change binding, or append success ping. The warning is a local abuse record, not external enforcement.
  requirement_category: refinement
