    service events and output intents do not prove external operations. No original application repository
    is distributed.
- ru_id: RU-002
  name: Idempotent purchase and delivery
  content: purchase requires paid exactly true, nonempty event_id,license_id,email,shop and license_key
    string of at least8 characters. Normalize email/shop by trim+casefold; email must have one @, nonempty
    whitespace-free parts. New license ID/key must be unique. Store licenses[id] email,shop,status=active,key_hash=SHA256(key),key_suffix=last4.
    Record one event mapping and one deliveries outbox entry with event_id,license_id,email,body including
    intended key,status=queued. Return license_id and no raw key. Replay event with same normalized email/shop/key
    succeeds returning original license_id, no new license/outbox, even if requested license_id differs.
    Changed event email/shop/key or unpaid replay rejects atomically. Purchase is trusted local confirmed-event
    ingestion, not payment processing.
  requirement_category: core
