requirement_units:
- ru_id: RU-001
  name: License workflow entry point
  content: process_license_action(state,action) returns complete next internal state with result or nonempty
    error.code without input mutation. Preserve business state on invalid actions except explicitly required
    secondary-shop audit. Missing collections may initialize. SQLite CLI init/show/act persists actual
    state across processes; init once, show trusted operator only, act result/error only. Persist audited
    verification denials too; transient result/error are excluded from stored state. List/admin/verification
    results must not expose raw keys or hashes. The local deliveries outbox is private operator data and
    intentionally contains the synthetic key intended for its recipient. No live email/Shopify action
    is claimed. CLI show reads admin_id from stdin JSON, checks persisted state.admins, and returns complete
    persisted state only to a listed operator; other identities receive a nonempty error.code without
    storage changes. This synthetic local identity is not network authentication.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for license workflow entry point.
  test_interface:
    type: function
