- ru_id: RU-001
  name: Navigation state entry point
  content: Repair the supplied React Native component and preserve actual browser rendering, route pages
    and immutable model transitions. transition(state,event,config) returns new state without mutating
    any supplied object. Config and visual fixtures are synthetic; route changes must render the corresponding
    screen.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for navigation state entry point.
  test_interface:
    type: command
    entry:
      language: JavaScript
      file: build.mjs
      command: node build.mjs runtime/dist
    inputs:
      transport: Actual browser controls and immutable transition(state,event,config)
      contract: README.md
    output:
      type: rendered_ui
      meaning: Navigation state entry point
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/ui_contract.py
  notes: Navigation and interaction behavior has source support. Generic facility terminology, web file
    adapter, privacy re-encoding and deterministic host-session config are benchmark reconstruction choices;
    native Expo/device execution is not verified.
- ru_id: RU-002
  name: Tab navigation and route guard
  content: Clicking configured tabs navigates to their rendered screens. Unknown routes preserve the active
    screen and show unknown_route. Protected routes require the host-supplied authenticated boolean, otherwise
    preserve the screen and show auth_required. This is a UI route guard fixture, not a real authentication
    backend.
