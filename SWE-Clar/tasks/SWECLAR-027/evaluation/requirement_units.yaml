- ru_id: RU-005
  name: Profile image selection
  content: 'Choosing an actual local PNG/JPEG in the facility profile editor must decode and display the
    image only for that facility; the account avatar stays unchanged. Missing, cancelled or unsupported/corrupt
    selections preserve the previous image; unsupported input shows unsupported_asset. Re-encode accepted
    pixels to a fresh PNG without original metadata. A stale earlier decode must not replace a newer selection.
    Resource limits are benchmark conventions: reject files larger than 5 MiB or decoded width/height
    above 4096 pixels with unsupported_asset, preserving the prior image.'
  requirement_category: refinement
  source_visibility: hidden
