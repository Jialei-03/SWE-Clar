<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Local radio</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <h1>Local radio</h1>
      <p>Independent synthetic broadcast player</p>
      <section>
        <h2>Schedule</h2>
        <button id="refresh-schedule">Refresh schedule</button>
        <div id="schedule"></div>
      </section>
      <section>
        <h2>Recent programmes</h2>
        <button id="refresh-recent">Refresh recent</button>
        <div id="recent"></div>
      </section>
      <section>
        <h2>Playback</h2>
        <p id="selected">No selection</p>
        <audio id="audio" controls></audio>
        <button id="pause">Pause</button>
        <button id="resume">Resume</button>
      </section>
      <section>
        <h2>Sleep timer</h2>
        <input id="seconds" type="number" min="0.1" step="0.1" value="30">
        <button id="set-timer">Start timer</button>
        <button id="cancel-timer">Cancel timer</button>
        <button id="show-timer">Show remaining</button>
        <output id="remaining"></output>
      </section>
      <p id="error" role="alert"></p>
    </main>
    <script src="app.js"></script>
  </body>
</html>
