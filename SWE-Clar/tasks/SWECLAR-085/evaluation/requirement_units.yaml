- ru_id: RU-004
  name: Sleep timer
  content: A positive finite sleep interval uses a monotonic elapsed-time deadline. Showing remaining
    time does not restart the deadline; expiry actually pauses audio. Cancellation removes the deadline.
    Remaining time decreases during real execution.
  requirement_category: refinement
  source_visibility: visible
