- ru_id: RU-003
  name: Browser Media Session metadata
  content: Publish title, artist and album of the current programme through navigator.mediaSession.metadata
    using MediaMetadata. Replace stale fields on every selection change. Publish playing or paused through
    navigator.mediaSession.playbackState according to actual audio playback. The browser playback panel
    and metadata share the selected programme. No native CarPlay behavior is required.
  requirement_category: refinement
  source_visibility: hidden
