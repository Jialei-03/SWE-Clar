requirement_units:
- ru_id: RU-001
  name: Linear programme playback
  content: Play the synthetic linear programme through the real HTML audio element. On first play and
    resume, fetch /api/live and seek within 1 second of its current offset. Recent programmes start at
    zero. Only one audio player may advance at a time.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact behavior required for linear programme playback.
  test_interface:
    type: web_ui
    entry:
      language: javascript
      file: app.js
      function: browser UI
      signature: HTTP and documented DOM
    inputs:
      programme: synthetic HTTP record
    output:
      type: object
      meaning: actual audio, browser metadata and rendered DOM
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/test_solution.py
  notes: Independent Linux browser adaptation of the existing radio-component scope. Synthetic media only;
    browser APIs replace native system integration.
