- ru_id: RU-005
  name: Map and safe failure behavior
  content: Initial map center and Return to my location use the authenticated synthetic user coordinates.
    Unknown match/place/product, invalid signatures, failed provider calls, cross-user replay or conflicting
    ID reuse must not add dates or credits. Successful identical replay returns the original date without
    a second provider confirmation. Persist transactions across service restart. The browser and provider
    fixture do not establish real device/Apple Pay integration.
  requirement_category: refinement
