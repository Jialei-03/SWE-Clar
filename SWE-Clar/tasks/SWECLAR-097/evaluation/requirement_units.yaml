- ru_id: RU-003
  name: Date-credit eligibility
  content: Use Credit is enabled after choosing a venue when the actor has at least one credit. A successful
    request creates one date and decrements the ledger exactly once, including concurrent requests and
    repeated IDs. Insufficient credit preserves the ledger. At least one credit is the explicit reconstruction
    rule resolving conflicting source phrasing, not an exact client quotation.
  requirement_category: refinement
