- ru_id: RU-004
  name: Date package purchase
  content: Packages contain 1, 3 or 5 dates at synthetic benchmark prices EUR 10, 27 or 40. A server-verified
    paid receipt creates the current date immediately and adds quantity minus one to the existing balance.
    Validate signature, transaction/user/product/amount/currency and paid status against server-owned
    values; do not trust caller payment flags, price or identity. Confirm through the real local provider
    HTTP interface, not a supplied paid=true record. These amounts/protocols are independent privacy-preserving
    benchmark conventions.
  requirement_category: refinement
  source_visibility: hidden
