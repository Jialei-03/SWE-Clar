selected_scope: Offline top-N lineup generation over synthetic player projections
requirement_units:
- ru_id: RU-001
  name: Optimizer entry point
  content: Implement optimize_lineups(players, limit, mode) and preserve the supplied JSON console interface.
    Accept a list of records with id (nonempty string), position (QB, RB, WR or TE), and projected_points
    (finite number, excluding booleans). Extra record metadata may occur. Return a JSON object with lineups
    (records containing player_ids and numeric score), considered (integer), and unused_player_ids (list
    of strings), or an error object with a nonempty code. Additional nonconflicting metadata is allowed.
    Do not mutate the caller inputs. Required output fields are deterministic for the same request. Supported
    workloads contain at most 600 players and request at most 10,000 results. A call has 15 CPU seconds
    on the provided environment; environment setup and process startup are excluded. The resource budget
    is a reconstruction constraint, not a source-client latency promise. Modes, exact result count and
    error policies can be clarified.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for optimizer entry point.
  test_interface:
    type: function
    entry:
      language: python
      file: solution.py
      function: optimize_lineups
      signature: 'optimize_lineups(players: list[dict], limit: int, mode: str) -> dict'
    inputs:
      players: List of records; public README defines fields
      limit: Requested output count
      mode: String mode; policy may be clarified
    output:
      type: dict
      meaning: Public result envelope; semantics defined by the applicable requirements
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
