    file: evaluation/tests/test_solution.py
  notes: Independently reconstructed projection-only component. Source scenario supports five-slot optimization;
    normalized schemas, exact tie/count/error/coverage semantics and resource budget are benchmark design
    choices, not verbatim customer specifications. No original player records, implementation or attachments
    are included.
- ru_id: RU-002
  name: Lineup slot rules
  content: 'Each lineup has five distinct player IDs in the ordered slots QB, RB, WR, WR-or-TE, FLEX.
    FLEX accepts RB, WR or TE. A lineup is an ordered assignment: swapping players between eligible slots
    can produce a distinct lineup, even if it uses the same five players. An ID may occur in multiple
    different output lineups; it may not occur twice in one lineup.'
  requirement_category: core
  source_visibility: visible
