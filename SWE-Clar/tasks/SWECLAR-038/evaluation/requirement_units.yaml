- ru_id: RU-005
  name: Input and coverage reporting
  content: Reject malformed player records (including non-list input, missing fields, empty/non-string
    ID, unknown position or non-finite/non-numeric/Boolean projection) with a nonempty error.code and
    without lineups. Check record validity before duplicate IDs. Duplicate valid IDs produce error.code
    duplicate_player_id without lineups. An empty player list is valid. For successful requests, unused_player_ids
    contains each supplied ID that occurs in no returned lineup, once, sorted in ascending Python string
    order. Extra input metadata is ignored.
  requirement_category: refinement
