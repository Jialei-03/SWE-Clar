- ru_id: RU-003
  name: Projection ranking
  content: For each valid ordered assignment, score is the sum of projected_points. Return the globally
    highest-scoring assignments first, using the ordered tuple of player IDs in ascending Python string
    order to break equal-score ties. Do not repeat an ordered assignment. Negative and tied projections
    are supported. Floating-point score comparison allows absolute error 1e-9 or relative error 1e-9,
    whichever is larger; this does not relax lineup selection or tie ordering.
  requirement_category: refinement
  source_visibility: hidden
