- ru_id: RU-004
  name: Deep and realtime output
  content: Both deep and realtime modes have identical exact-result semantics; neither is an approximate
    mode. Return exactly min(limit, total valid ordered assignments) lineups. considered is the total
    number of valid ordered assignments, regardless of how many the algorithm enumerates or returns. With
    no valid assignment, lineups is empty and considered is zero. limit must be a positive integer excluding
    booleans, and mode must be deep or realtime; otherwise return error.code invalid_request and omit
    lineups. Invalid request parameters are checked before player data.
  requirement_category: refinement
