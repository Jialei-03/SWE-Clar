selected_scope: Working synthetic property listing and offer-review web application
requirement_units:
- ru_id: RU-001
  name: Runnable property workspace
  content: Complete the existing HTTP/SQLite/browser application and preserve the public README interfaces.
    Work with only synthetic fixture identities and properties, using the already prepared loopback offer
    service; no installation, accounts or remote models are required. Persist committed drafts, offers,
    notifications and integration checkpoints across process restart. The published UI selectors must
    support actual record selection, editing, analysis, synchronization and offer review. Use real HTTP
    requests for provider operations and render results in the browser. The X-Actor header is an already-authenticated
    fixture identity, not a user-supplied role; unknown identities return 401. Collections are sorted
    by listing ID; unavailable single records return 404; identified read-only writes return 403; invalid
    input returns 400 with an errors object; failed provider operations return 502. Successful operations
    return 200 and creation 201. Rejected operations never partially change stored state. A fresh database
    initializes from seed.json or --seed once; generated listing IDs must be unique and filesystem paths,
    original identities or source records are not API output.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: What rules govern runnable property workspace?
  matching_keywords: []
  test_interface:
    type: command
    entry:
      command: python server.py --host 127.0.0.1 --port PORT --db PATH [--seed FILE] [--offer-service
        URL]
      runtime: Prepared Python/SQLite/Chromium and loopback offer-service environment
    inputs:
      identity: X-Actor synthetic fixture ID for user routes
      routes: GET /api/actors; GET/POST /api/listings; GET/PUT /api/listings/<id>; POST /api/listings/<id>/analysis;
        POST /api/sync {now}; POST /api/offer-events {events}; POST /api/offers/<id>/review {}
      provider: GET /health {ready:true}; GET /capabilities {webhook_supported:boolean}; POST /subscriptions
        {callback_url} -> {subscribed:true}; GET /offers?after=N -> {events,cursor}; GET /review/<encoded
        id> -> HTML. Callbacks deliver {events}. Only loopback HTTP is available.
    output:
      listing: id,owner_id,agent_id,label,property_type,bedrooms,bathrooms,floor_area,asking_price,features,state
      detail: '{listing,offers,notifications}'
      notice: sequence,kind,actor,offer_id,revision,listing_id,data:{amount,terms}
      analysis: '{pricing: object|null,descriptions: string[]}'
      sync: '{mode,updated,polled}'
      review: '{url:string}'
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  notes: The business category is grounded in private source evidence. Software, interfaces, exact policies,
    users, records and provider are independent benchmark designs. No original product, service brand,
    code or private artifact is distributed.
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/listing_contract.py
- ru_id: RU-002
  name: Draft validation and persistence
  content: Editable fields are label (trimmed nonempty string up to 120 characters), property_type (house|apartment),
    bedrooms (integer 0..10), bathrooms (integer 1..10), floor_area (integer 10..2000), asking_price (integer
    1..10^12), and features (at most 20 nonempty strings up to 80 trimmed characters each). Booleans are
    not integers. Preserve first-occurrence order when deduplicating trimmed features. New features default
    to []; omitted update fields retain their values. Other required fields must exist after merging an
    update. Reject unknown/immutable submitted fields including id, owner_id, agent_id and state. Return
    field-specific validation errors and reject the whole create/update without changing any row. New
    listing ownership uses the authenticated fixture caller and its configured agent; stored listings
    always remain draft. There is no automatic publication. Who may create or modify records is a separate
    client access policy.
