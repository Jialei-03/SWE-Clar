- ru_id: RU-003
  name: Comparable pricing policy
  content: Comparable records have id (nonempty string up to 64 characters), property_type house|apartment,
    bedrooms integer 0..10, floor_area integer 10..2000, sale_price integer 1..10^12 and age_days integer
    0..36500; bool is not an integer. Ignore structurally invalid records. For duplicate IDs, retain the
    last structurally valid record before filtering eligibility; a later valid but ineligible record replaces
    the earlier eligible one. Eligible comparables match property type, differ by at most one bedroom,
    have area inclusively 0.75..1.25 times target area and age_days at most 180. Sort by age_days then
    id ascending and take at most five. Compute each adjusted price as sale_price * target_area / comparable_area
    using exact rational arithmetic. minimum/maximum are the adjusted extrema; midpoint is the median
    (average the central pair for even counts). Round monetary outputs only at the final result, to nearest
    integer with half values rounded upward. confidence is the number selected divided by five. Return
    null when none qualify. Output selected comparable_ids in selection order and corresponding adjusted_prices,
    along with minimum, midpoint, maximum, confidence. Display actual computed prices in the browser.
    No proprietary AI-model accuracy claim is involved.
  requirement_category: refinement
