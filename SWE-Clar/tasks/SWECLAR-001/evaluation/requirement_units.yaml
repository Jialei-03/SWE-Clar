- ru_id: RU-006
  name: Workspace authorization
  content: Sellers read and update only their own listings and create drafts owned by themselves. Agents
    read and update only listings assigned to them and cannot create. Administrators read all listings
    but cannot create or update them. Reads include listing detail, analysis, related offers, related
    notices and opening external review. Every single-record route enforces the listing scope, returning
    404 outside it, rather than exposing a redacted record. Collection results omit all unauthorized records.
    Admin read-only restrictions apply to listing mutation; opening a permitted external review and its
    idempotent review notice is allowed for any actor who can read the listing. An unknown actor or unsupported
    role returns 401. Service sync/callback endpoints are separately simulated infrastructure paths, not
    user-role inputs. On identity change the browser clears the previous detail, analysis, offers and
    notices; old asynchronous responses must not repopulate another identity's view. Ownership or assignment
    cannot be forged via submitted draft fields.
  requirement_category: refinement
  source_visibility: hidden
