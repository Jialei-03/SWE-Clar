- ru_id: RU-005
  name: Actual offer ingestion and synchronization
  content: First successful sync reads the provider capabilities. For webhook support register the current
    application /api/offer-events callback once per callback URL, do not poll, and re-register if restart
    changes that URL. The single-consumer fixture replaces the old URL. Otherwise first sync immediately
    GETs /offers?after=0; later polls occur only when now minus last successful poll time is at least
    120 seconds. now is an integer 0..10^12; earlier values simply are not due. Persist mode, provider
    cursor and last successful poll time. Response events must have increasing unique cursors greater
    than the previous cursor, bounded above by the response cursor, which cannot decrease. Validate the
    whole response and event batch before committing. Events require cursor integer 1..10^12, external_id
    and listing_id nonempty strings up to 64 chars, revision integer 1..10^9, amount integer 1..10^12
    and terms nonempty string up to 2000 chars; reject booleans in integer fields. Unknown listing, malformed
    event or changing an existing external ID to another listing invalidates the whole batch. Apply events
    in received order. Each strictly newer revision per external ID updates its stored current value and
    creates exactly one update notice for the listing owner, with offer ID, revision, amount and terms.
    Thus multiple advancing revisions within a batch each create a notice. Repeated or older revisions
    are no-ops; concurrent duplicates commit once. Direct invalid callback batches return 400. Failed
    HTTP operations, malformed responses or invalid polled batches return 502 and do not advance cursor/success
    time or create partial offers/notices; the next due tick can retry. Sync returns mode webhook|poll,
    updated (number of advancing revisions) and polled boolean; callbacks return updated. Actual HTTP
    traffic, not a declared action list, implements these policies.
