- ru_id: RU-004
  name: Grounded description variants
  content: Analysis accepts an object with comparables (list of at most 1000 records), count (integer
    2 or 3, not bool), and tone (warm|concise); invalid analysis options return 400. For a valid authorized
    listing, return exactly count distinct, readable description strings in stable order, with the same
    input yielding the same strings. Each description contains the listing label, property type, bedrooms,
    bathrooms, floor area, asking price, selected tone and all supplied feature strings. Use only that
    listing's facts; features from other records or comparables and unsupported amenity/school/investment
    claims must not appear. Templates and equivalent wording are allowed; descriptions must be readable
    prose rather than serialized JSON. No remote language model is needed.
