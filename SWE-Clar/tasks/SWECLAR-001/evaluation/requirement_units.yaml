- ru_id: RU-007
  name: External offer review boundary
  content: Opening review returns the prepared provider base URL plus /review/<percent-encoded external
    ID> and provides a usable browser link to the real synthetic offer HTML. It never changes offer amount,
    terms or revision, never posts offer mutations, and never trusts an arbitrary URL from an event. For
    each actor, external offer ID and revision create one persistent review notice with amount/terms;
    repeated opens, including across restart, add no duplicate. A newer version can produce a new review
    notice. Review requires access to the associated listing. Inline accept/counter or other offer resolution
    is not an application operation; it is left to the separate synthetic provider review workflow.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
