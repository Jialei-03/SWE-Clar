- ru_id: RU-005
  name: Termination, results, replay and atomicity
  content: After each tick, finish with winner A/B or draw for zero survivors when at most one living
    team remains and no projectiles remain. Pending shots keep the battle running even after one side
    has no living units. If this terminal condition has not occurred when max_ticks is reached, finish
    with draw and reason tick_limit; otherwise reason elimination. Stop a multi-tick step at the first
    finished tick. Keep every unit (including hp=0) and the ordered log, completed tick count, actual
    damage_dealt and per-team result rows. Reset restores the exact unchanged setup; a repeated battle
    from the same config yields the same states/events/results. Persist current config and battle across
    server restart. Invalid commands use HTTP 400/error objects and leave all stored data unchanged, including
    partial edits/steps. Concurrent step operations serialize without dropping ticks.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: What are the rules for termination, results, replay and atomicity?
  matching_keywords:
  - winner
  - draw
  - results
  - replay
  - reset
  - persistence
  - atomic
