  - 3D
  - render
  - camera
  - placement
  - workshop
  - controls
  test_interface:
    type: api
    entry:
      command: python server.py --port 0 --db <isolated database>
      protocol: HTTP/JSON plus actual software-WebGL controls in README
    inputs: Synthetic unit templates, placements, fixed tick commands and browser inputs
    output: Real 3D scene/interaction, movement/projectiles, event records and persisted replay results
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  notes: Source establishes a customizable 3D auto-battler prototype. Host, geometric models, exact rules
    and fixtures are independently designed; no original engine/assets or later production-feature compatibility
    claim.
  tests:
