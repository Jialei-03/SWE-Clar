- ru_id: RU-003
  name: Deterministic movement, targets and melee
  content: Use a 100ms fixed tick and units ordered lexicographically by instance ID. Each tick first
    advances old projectiles, then lets each still-living unit act once in ID order. Choose the nearest
    living enemy by Euclidean x/z center distance, rounding distance to 9 decimal places only for tie
    comparison, then ID. If outside range, move straight toward it by min(speed*0.1,distance-range); skip
    that movement if its resulting center is within 0.8 of another living unit, and do not attack on the
    same tick as this movement branch. If in range and tick>=next_attack, attack and set next_attack=tick+cooldown.
    First attacks can occur at tick 1. A melee hit applies min(current target hp,max(1,attack-defense));
    record actual post-mitigation health loss in damage_dealt/event damage, and clamp hp at zero. Dead
    units cannot move or begin attacks. Killing a target never bypasses cooldown; select a new nearest
    living target on subsequent ticks. No randomness or cumulative stat/movement boosts across replays.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: What are the rules for deterministic movement, targets and melee?
  matching_keywords:
  - movement
  - target
  - range
  - cooldown
  - melee
  - damage
  - determinism
