    file: evaluation/tests/arena_contract.py
- ru_id: RU-002
  name: Editable shared unit catalog and setup
  content: Implement the README template and placement schemas/ranges, save/update/delete behavior, two-team
    legal placement, occupied checks, setup clearing and tick limit. Both teams instantiate the same selected
    templates with independent battle copies. Editing a template changes the next battle for its placements
    and does not mutate earlier stored base stats through simulation. Preserve setup across restart. Reject
    in-use template deletion, unknown targets, non-finite values, booleans as numbers, overlapping/out-of-bounds
    centers and edits while a battle exists. Clear removes placements only; reset removes battle only.
  requirement_category: core
