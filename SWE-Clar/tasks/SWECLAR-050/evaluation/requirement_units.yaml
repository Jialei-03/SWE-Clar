- ru_id: RU-001
  name: Playable 3D workshop and camera
  content: Preserve the public running workshop and HTTP/UI contracts in README. Render actual depth-tested
    3D arena geometry, visually distinct melee/ranged models, per-unit health bars and names. Prebattle
    mouse placement and right-drag/wheel/other-side camera controls must work in the real scene. Names
    can be toggled without mutating game data. Show both teams. Start/play/pause/step/reset must connect
    the rendered scene to actual server tick state; rendered changes cannot be replaced by a status field.
    Combat projectile rendering and finished-battle retention/result details are clarifiable with the
    client.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: What are the rules for playable 3d workshop and camera?
