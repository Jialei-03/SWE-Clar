- ru_id: RU-004
  name: Ranged projectile travel and ordering
  content: 'An eligible ranged attack launches a separate projectile from the shooter at its current position
    with captured attack and projectile_speed; it does not deal immediate damage. Assign increasing projectile
    IDs in launch order. At the beginning of each later tick, process existing projectiles in creation
    order: discard one whose target is dead, otherwise move toward the target''s current position by speed*0.1,
    applying the same mitigation/clamped-damage rule on arrival. Projectile motion homes on the current
    target position. A projectile already launched remains effective after its shooter dies; dead shooters
    cannot launch more. New projectiles do not move during their launch tick. Show their actual moving
    3D geometry. Damage/launch logs are ordered by this tick-phase and unit order. Movement/arrival comparisons
    allow 1e-9 tolerance.'
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
