- ru_id: RU-003
  name: Context-grounded advice without transcript contamination
  content: 'Coach the selected owned conversation using the current stored profile and complete current
    transcript at the accepted request''s start. Require at least one transcript message. Send exactly
    the configured synthetic system prompt `Offer clear and respectful communication suggestions.`, the
    profile''s tone and goal, the messages in stored order and the trimmed question. Never include profile
    revision, user IDs, session/provider credentials, advice history, another conversation or any uploaded
    image in this text-only call. Caller-supplied profile, transcript, prompt and advice are ignored.


    Require provider advice to be a string trimmed to1..4000 characters. On success store that exact trimmed
    advice, question and the transcript revision used, separately from messages; creating advice does
    not advance transcript revision or append to transcript. Each provider-generated successful advice
    is shown in the advice panel. Transport/status/JSON/type/empty/oversized response failure creates
    no advice and leaves prior messages/advice intact. Profile/selected conversation changes must affect
    the next distinct coaching request''s context. This verifies integration and scoping, not subjective
    advice quality.'
