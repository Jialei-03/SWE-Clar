- ru_id: RU-004
  name: Owned preferences with optimistic revision
  content: Trim tone and goal at both ends, preserve their internal whitespace and case, and store only
    these two fields plus revision. The authenticated user's profile alone is updated; ignore caller-supplied
    actor or owner. Require the supplied revision to match the current stored revision, then replace both
    strings and increment revision exactly once in a transaction. A mismatch returns409 without changing
    either field/revision or calling OCR/provider. Both fields must validate before writing. The browser
    submits the revision it last read, shows a conflict as an error, refreshes authoritative preferences,
    and permits a deliberate new save. Preference editing does not alter conversations, advice or rankings.
    No biometric identity inference or matching is part of this independent task.
