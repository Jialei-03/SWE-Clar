- ru_id: RU-005
  name: Actual image-byte review and deterministic ranking
  content: 'Validate ownership/kind/uniqueness and read all requested canonical PNG files before calling
    the provider. Require valid stored files; a missing/corrupt member rejects the entire action before
    any provider request. Send current owned preferences and every selected image''s exact canonical bytes,
    with only asset_id, MIME type and Base64 in each image record. Preserve requested image order in that
    provider request. Ignore caller scores/reasons/anchors and do not include transcript/advice, credentials
    or unrelated images.


    Provider scores must have exactly one row for each requested asset ID, no missing/extra/duplicate
    rows. Each score is a finite nonboolean number in0..100 inclusive. Reasons is a list of strings; preserve
    their exact text/order, including an empty list. Sort stored/returned items by descending numeric
    score and then ascending asset ID for ties. Ranking uses provider-returned values, not local caller
    values or hardcoded fixture scores. Display the actual ordered image IDs, scores and literal reasons.
    A provider failure or any invalid response row creates no ranking and preserves prior results. Successful
    rankings persist across restart and are owned by the requester.'
