- ru_id: RU-002
  name: Real screenshot extraction into selected conversation
  content: Read the owned canonical screenshot PNG and execute actual Tesseract recognition. Parse all
    recognized nonempty labeled lines under the public format and append those messages, in order, to
    only the selected owned conversation. An extraction advances that conversation's revision by exactly
    one regardless of line count. Do not call the provider, produce advice, rank images or append caller-supplied
    OCR/text. Reject wrong-kind, foreign, corrupt or unparseable images with no partial transcript/revision
    update. Render the appended transcript and keep advice separate. New screenshot contents must produce
    the corresponding new extracted text.
