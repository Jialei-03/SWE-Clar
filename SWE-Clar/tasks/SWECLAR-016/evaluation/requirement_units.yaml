- ru_id: RU-006
  name: Atomic workflow replay and current UI state
  content: 'Extract, coach and rank share a request_id namespace within one authenticated user. Commit
    the workflow mutation and its replay record atomically. A previously successful identical request
    returns its saved result without repeating OCR/provider calls or appending messages/advice/rankings.
    Equality compares operation plus canonical semantic fields: selected IDs in their specified order
    and trimmed question; ignored extra request fields do not affect equality. Reusing the same key for
    a different operation or changed semantic payload returns409 with no side effects. Different users
    may independently use the same key. Failed requests do not reserve the key and may later succeed with
    that key. Concurrent identical requests commit once. Successful records survive server restart; key
    identity is the stable user ID, not a transient session token.


    The UI generates one key per intent and retains it across a lost reply when retrying the same action.
    The retry''s originally selected IDs/question remain the same, even if newer state is refreshed. An
    explicitly different action/payload abandons the old retry intent. While an action is pending, double
    clicks must not launch competing copies. A successful reply clears retry state; errors remain visible.
    Logout, switching the selected conversation or a newer login prevents old pending responses from replacing
    the current user''s/conversation''s rendered data. Stored successful results remain available through
    ordinary refresh/history. Do not let a delayed old reply show foreign or previous-conversation content
    in the current screen.'
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
