- ru_id: RU-003
  name: Direct RTMP stream lifecycle
  content: 'A scheduled event starts once with its matching private stream key. Open actual direct RTMP
    ingest with publisher authentication and expose a working HLS endpoint; an incorrect key must fail
    both the application start request and the actual publisher handshake. Receive synthetic H.264 frames,
    not a restreamed third-party URL. Ending before start or starting the same live event twice is invalid.
    The ingest_url is an opaque publisher URL: a derived unguessable path/query capability is allowed
    instead of the literal configured key. Invalid/tampered publisher credentials and arbitrary unauthenticated
    paths must be rejected.'
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
