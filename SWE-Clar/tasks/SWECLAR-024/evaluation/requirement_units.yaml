- ru_id: RU-005
  name: Idempotent view counting
  content: Count a published video at most once per server-issued anonymous viewer/session pair, including
    concurrent duplicate requests. Different browser sessions count separately. Missing and private recordings
    never count; ignore caller-invented viewer/session IDs. The page records a view on actual playback.
    Cookie identity and exact deduplication semantics are disclosed benchmark conventions, not a claim
    to identify real people.
  requirement_category: refinement
