  notes: Independently rewritten from the existing task and requirement unit, checked against private
    source material. Source conversations, identities and mappings are excluded. Detailed runtime, authentication
    and anonymous-session semantics are benchmark conventions.
- ru_id: RU-002
  name: Upcoming event calendar
  content: Require an event ID configured by the host, a nonempty title and timezone-aware start/end values
    with end strictly later. Store normalized UTC instants, list future scheduled events chronologically
    with ID tie-breaking, and omit cancelled or already-started events. Reject invalid edits without partial
    records. An event may only be cancelled while scheduled.
  requirement_category: core
