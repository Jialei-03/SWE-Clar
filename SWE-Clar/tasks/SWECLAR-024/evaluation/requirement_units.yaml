requirement_units:
- ru_id: RU-001
  name: Streaming workflow entry point
  content: Repair the supplied Python/SQLite/MediaMTX component so it handles real synthetic video bytes
    and preserves existing event/calendar behavior. Start only owned loopback media listeners and clean
    up child processes. Protect administration and ingest credentials. Do not accept caller-provided playback
    URLs, stored flags or invented archive metadata as evidence of a recording. The README defines the
    independently reconstructed runtime boundary.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for streaming workflow entry point.
  test_interface:
    type: command
    entry:
      language: Python and JavaScript
      file: server.py
      command: STREAM_CONFIG=config.json STREAM_DATABASE=events.sqlite python server.py
    inputs:
      transport: Loopback HTTP, direct RTMP synthetic media and browser playback
      contract: README.md
    output:
      type: event_video_service
      meaning: Streaming workflow entry point
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
