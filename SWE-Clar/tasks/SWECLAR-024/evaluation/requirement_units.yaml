- ru_id: RU-004
  name: Durable searchable archive
  content: Ending a live event finalizes a nonempty decodable MP4 and saves exactly one initially private
    archive record with measured bytes, SHA-256, duration and frame count. An empty/failed stream cannot
    be published. Publish only existing unchanged media with nonempty index terms. Published title/term/date
    searches are stable, date range is inclusive-start/exclusive-end, and the website loads actual playable
    MP4 bytes with HTTP range support. Preserve archives across restart; do not expose private recordings
    or runtime files.
  requirement_category: refinement
  source_visibility: hidden
