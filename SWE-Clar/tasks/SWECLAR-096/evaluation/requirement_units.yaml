schema_version: 1
task_id: SWECLAR-096
registry_version: swe-clar
registry_status: annotation_complete
disclosure_design: controlled_requirement_disclosure
selected_scope: Server-side area calculator with responsive form and actual PDF report
requirement_units:
- ru_id: RU-001
  name: Calculation entry point
  content: Complete the supplied responsive browser calculator and Python backend. calculate(values) returns
    a new JSON-compatible result with deterministic calculation fields (optional metadata may vary) without
    changing inputs. POST /calculate and POST /report process each request independently, including concurrent
    requests. Browser assets display server results; calculation code and original source files are not
    served by public routes.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for calculation entry point.
  test_interface:
    type: function
    entry:
      language: python
      file: calculator.py
      function: calculate
      signature: calculate(values) -> dict
    inputs:
      values: land_area_sqft,site_area_sqft,plot_ratio numeric fields
    output:
      type: dict
      meaning: Independent computed result; actual PDF bytes are produced by report_pdf and /report.
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/calculator_contract.py
  notes: Independently rebuilt area-calculation component. The relation has explicit earlier client confirmation;
    final commercial revision selection is not asserted. Layout, conversion precision and PDF presentation
    are synthetic benchmark choices. Full financial model, source spreadsheet and customer/project identifiers
    are excluded.
- ru_id: RU-002
  name: Area conversion
  content: Accept numeric nonnegative finite land_area_sqft,site_area_sqft,plot_ratio values. Convert
    each area to square metres using benchmark factor 0.092903 and display converted values to two decimal
    places with half-up rounding. Return converted.land_area_sqm and converted.site_area_sqm. This factor/rounding
    convention is a disclosed benchmark choice.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
