- ru_id: RU-005
  name: Reset and validation
  content: Reset first warns the user; cancellation preserves inputs/results, confirmation clears them
    and disables report access until another successful calculation. Reject missing,negative,bool,non-numeric
    or non-finite inputs and unrepresentable outputs with HTTP 400 / invalid_input and no partial result/PDF.
    A failed form submission must hide stale results. Do not expose backend Python files, source spreadsheets
    or another request’s data through HTTP.
  requirement_category: refinement
