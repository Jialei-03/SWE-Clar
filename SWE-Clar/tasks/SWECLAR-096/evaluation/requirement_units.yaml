  name: Report summary
  content: Return inputs,converted,result and summary containing the converted/result fields. Render the
    summary in the responsive page. POST /report must return a valid PDF with original inputs, converted
    areas and the calculated floor area as readable text, using matching values and units. The browser
    Download PDF action downloads those actual PDF bytes, not a manifest or pdf_ready flag.
