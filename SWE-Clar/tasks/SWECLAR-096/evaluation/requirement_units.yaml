- ru_id: RU-003
  name: Gross floor area formula
  content: 'Use the selected area-calculation snapshot: gross_floor_area_sqft = (land_area_sqft + site_area_sqft)
    * plot_ratio, rounded half-up to two decimal places. Compute on the backend from each request’s current
    inputs, never a fixed cached value or only one area. This relation is supported by an explicitly discussed
    and client-confirmed earlier version; it does not represent the full later valuation model.'
  requirement_category: refinement
  source_visibility: hidden
