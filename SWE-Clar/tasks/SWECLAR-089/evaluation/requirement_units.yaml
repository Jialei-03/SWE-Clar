- ru_id: RU-003
  name: Idempotent package and credit ledger
  content: purchase_package must GET provider_url/payments/<URL-encoded payment_event_id> with the configured
    provider Bearer credential. Require a paid receipt with matching event_id and student_id and a known
    package_id in the server-side packages catalog; derive the credit amount from that catalog, never
    caller paid/credits/card fields. Exact receipt replay adds credits once; conflicting reuse of an event
    ID is rejected. Persist the purchase ledger reason and retain no raw card fields or provider credentials
    in workflow state/API output. The API allows the student, linked parent or admin to request this check.
    Catalog maps package_id to positive integer credit amount; record verified event_id,student_id,package_id
    and derived credits only, not arbitrary receipt fields. Receipt replays still query provider so changed
    package identity is a conflict even if its amount matches. Provider errors/unknown package/mismatched
    or unpaid receipt reject with no state change. Authorization precedes receipt lookup.
  requirement_category: refinement
