- ru_id: RU-005
  name: Meeting delivery and privacy audit
  content: Before committing a booking, POST {booking_id,student_id,instructor_id,slot} to provider_url/meetings
    with Idempotency-Key=meeting:<booking_id>. Require matching booking_id and a valid HTTP(S) join_url
    from the provider. Then POST {event_id,kind,booking_id,student_id,meeting_link} to provider_url/emails
    using event_id/Idempotency-Key=confirmation:<booking_id>, kind=booking_confirmation and a matching
    accepted acknowledgement. Failure commits no local booking; retries reuse keys and the synthetic provider
    deduplicates deliveries. portal exposes only the selected booking status/link/credit balance to the
    student, linked parent, assigned instructor or admin; audit instructor/admin views. API responses
    must not expose other users, ledger, sessions, provider tokens or internal state. StudioClient meeting
    returns validated join URL; email returns successful acknowledgement or raises. Provider metadata
    beyond required fields is allowed. Confirmation payload includes event_id=confirmation:<booking_id>.
    portal request includes booking_id,student_id; require matching selected student; return booking_id,status,meeting_link,credit_balance,
    with optional nonsecret metadata. No user maps, ledgers, sessions or credentials in API results. HTTP
    errors indicate failure semantics; exact non-auth status codes/messages are not fixed.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
