requirement_units:
- ru_id: RU-001
  name: Studio workflow entry point
  content: Complete the supplied HTTP/SQLite backend and StudioClient adapter. process_music_action(state,action,service=None)
    is an internal immutable workflow function; POST /actions authenticates a synthetic Bearer session
    from STUDIO_CONFIG, overrides caller actor_id/viewer_id with the authenticated user and returns only
    {result} or {error}. Persist successful state changes in STUDIO_DB across restart. Serialize concurrent
    actions so booking/payment checks and commits cannot race. Unknown/invalid sessions get HTTP 401 without
    data. The server owns SQLite/config/session credentials; source code must execute as ordinary user.
    Config sessions map opaque synthetic tokens to known user IDs; tokens/provider credentials never enter
    persisted workflow state. Invalid actions preserve business state. Result/error wording and extra
    nonsecret metadata are unconstrained. This is a local HTTP component; no live payment, video room
    or email delivery is claimed.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for studio workflow entry point.
  test_interface:
    type: function
    entry:
      language: python
      file: solution.py
      function: process_music_action
      signature: process_music_action(state,action,service=None) -> dict
    inputs:
      state: Private backend state; not returned by HTTP API
      action: Supported workflow action
      service: StudioClient(base_url,token=None)
    output:
      type: dict
      meaning: Internal next state; HTTP adapter returns scoped result/error and persists successful state
        changes.
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/test_solution.py
  notes: Reconstructed backend component with real local HTTP/SQLite behavior. Normalized provider protocol
    and timezone interval representation are benchmark choices. No original service account, wireframe,
    family/student identity or customer code is included.
- ru_id: RU-002
  name: Role-scoped availability and booking
  content: An assigned instructor or administrator may set availability; a student or linked parent may
    book an open interval for that student with a positive credit balance. Slots are start/end ISO timestamps
    with explicit timezone offsets and start before end. Reject active overlapping intervals for the same
    instructor even if slot strings differ; adjacent half-open intervals are allowed. Reject duplicate
    booking IDs. Cancellation by an authorized viewer frees the interval without deducting a credit. Validate
    permissions and availability before provider side effects. Availability is a list of trimmed start/end
    strings separated by '/', each timestamp explicit Z or numeric timezone offset. Compare instants for
    overlap; overlap uses start<other_end and other_start<end, including completed bookings (cancelled
    excluded). Booking slot must match one configured string after trim, IDs nonempty/unique. Credits
    are nonnegative integers excluding bool; book requires >=1 but debits only on completion. Admins can
    set availability/cancel/view/complete; booking is student or linked parent only. Cancellation permits
    booked status only.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
