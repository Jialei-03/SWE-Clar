- ru_id: RU-004
  name: Completion deduction and low-credit email
  content: An assigned instructor or administrator may complete a booked lesson. Deduct exactly one credit
    once and record a lesson_completed ledger reason. At or below low_credit_threshold (default 1), POST
    an email notification to provider_url/emails with event_id=low_credit:<booking_id>, corresponding
    kind/student_id/balance/booking_id and the same Idempotency-Key. Require accepted=true and matching
    event_id before committing local completion. Failure preserves local credit/lesson state; retry reuses
    the provider idempotency key. Repeated completion does not send another notification or debit. Completion
    is idempotent for an already completed booking; an authorized repeat returns current completion status/balance
    with no provider call. Require integer balance>=1 and nonnegative integer threshold. Notification
    payload kind=low_credit and event_id as specified. A provider may accept remotely then return failure;
    local retry must reuse the key rather than assuming delivery failed. Commit credit,booking,ledger
    only after all required acknowledgements.
  requirement_category: refinement
