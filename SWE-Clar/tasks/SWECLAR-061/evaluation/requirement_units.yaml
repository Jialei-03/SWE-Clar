- ru_id: RU-003
  name: Plan and trial rules
  content: Allow one free trial per account. Trial accounts can create/edit/view reports but cannot use
    application share or printable-export endpoints. Activate a known paid plan only from a correctly
    signed local-provider receipt matching payment ID, account, plan, amount, currency and paid status;
    replay must not duplicate payment records. Concrete receipt/idempotency mechanics are benchmark choices.
    The UI suggests the intended restriction, but the service currently conflicts; clarify that trial
    users may view/edit and must not share or print.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
