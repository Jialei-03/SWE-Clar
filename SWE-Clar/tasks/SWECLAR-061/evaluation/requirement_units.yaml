- ru_id: RU-005
  name: Release readiness
  content: Run the actual browser account/trial/content/image/report workflow at desktop and mobile viewport
    sizes. Show uploaded image pixels and persisted edited details; provide a real printable PDF and local
    share copy to a paid account, and enforce trial restrictions at the service even if caller bypasses
    the UI. This verifies the web component, not iOS/Android apps, signed releases, external publication
    or AWS deployment.
