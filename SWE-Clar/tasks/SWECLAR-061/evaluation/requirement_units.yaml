- ru_id: RU-004
  name: Organized content and receipts
  content: Create a room before its content, then attach one or more real image/receipt files to existing
    owned content. Require title/details and valid image bytes; decode, respect orientation, re-encode
    as JPEG and omit metadata. Preserve image pixels and their content association. Completed reports
    remain editable and accept new images. The detailed capture chain is a reconstruction convention informed
    by a source proposal; its mechanics are not claimed as client-confirmed.
  requirement_category: refinement
  source_visibility: hidden
