selected_scope: Local web account, subscription and content-report repair with real HTTP/SQLite images
  and PDF export
requirement_units:
- ru_id: RU-001
  name: Release workflow entry point
  content: Repair the actual web SaaS service and browser workflow. Retain authenticated accounts, room/content
    relationships and stored images/receipts across restart; render actual content and assets rather than
    reporting feature-state flags. No real customer data, identity, cloud account or payment credentials
    are required.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for release workflow entry point.
  test_interface:
    type: function
    entry:
      language: python
      file: server.py
      function: Store.act
      signature: Store.act(authenticated_user,path,action) -> record
    inputs:
      path: documented HTTP action
      action: synthetic request data
      authenticated_user: server-owned account
    output:
      type: dict
      meaning: persisted SaaS action result
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/test_solution.py
  notes: Authentication, receipt processing, image normalization, completed-report edits and browser controls
    are supplied regression context. Local protocols are reconstruction conventions; original-platform
    release is outside scope.
- ru_id: RU-002
  name: Cross-platform account access
  content: Normalize account email by trimming whitespace and lowercasing. Registration rejects duplicates;
    login verifies salted scrypt credentials. Sessions identify the account on the server and logout revokes
    access. A user may only read or modify their own rooms, content, reports and binary assets. The exact
    local auth protocol is a disclosed reconstruction choice.
  requirement_category: core
  source_visibility: visible
