<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Network</title><link rel="stylesheet" href="/style.css"></head>
<body><header><h1>Local Network</h1><p>Discover shared interests. Build local connections.</p><p>Synthetic accounts and coordinates · Offline demonstration</p></header>
<main><form id="login"><h2>Sign in</h2><label>Account <input id="username" required value="u1"></label><label>Password <input id="password" type="password" required value="demo-u1"></label><button>Sign in</button></form>
<p id="feedback" role="status" aria-live="polite"></p>
<div id="workspace" hidden><section class="identity"><h2 id="identity"></h2><span id="plan"></span><button id="logout">Sign out</button></section>
<div class="columns"><section><h2>Your interests</h2><form id="profile"><label>Interest tokens, comma separated <input id="interests"></label><div class="coordinates"><label>X (km) <input id="x" type="number" step="any" required></label><label>Y (km) <input id="y" type="number" step="any" required></label></div><button>Save profile</button></form></section>
<section><h2>Discover</h2><form id="discover"><label>Radius (km) <input id="radius" type="number" min="0" max="3000" step="any" value="10" required></label><label>Account type <select id="role"><option value="all">All</option><option value="user">People</option><option value="business">Businesses</option></select></label><button>Find matches</button></form><div id="results"></div></section>
<section><h2>Connections and messages</h2><label>Account <select id="target"></select></label><div class="actions"><button id="request">Request</button><button id="accept">Accept</button><button id="block">Block</button><button id="unblock">Unblock</button></div><ul id="connections"></ul><form id="message-form"><label>Message <textarea id="message" required maxlength="2000"></textarea></label><button>Send message</button></form><div id="messages"></div></section>
<section><h2>Groups</h2><form id="group-form"><label>New group <input id="group-name" required maxlength="80"></label><button>Create group</button></form><label>Selected group <select id="group-select"></select></label><button id="invite">Invite selected account</button><form id="post-form"><label>Post <textarea id="content" required maxlength="2000"></textarea></label><label class="check"><input id="featured" type="checkbox"> Featured</label><button>Publish post</button></form><div id="posts"></div></section>
<section><h2>Membership</h2><p>Redeem a benchmark-issued demo receipt. No payment is collected.</p><form id="subscribe"><label>Receipt ID <input id="receipt" required></label><button>Redeem</button></form></section></div></div></main><script src="/ui.js"></script></body></html>
