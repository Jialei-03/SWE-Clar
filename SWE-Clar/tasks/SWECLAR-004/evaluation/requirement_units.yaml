- ru_id: RU-001
  name: Persistent offline application
  content: Complete the supplied independent browser/HTTP/SQLite application using the public README command
    and API/page contracts. Preserve real login, per-token sessions, profile editing, HTTP operations
    and SQLite persistence. Initialize synthetic fixtures only on a new database; a restart with the same
    database preserves accounts, profiles, sessions and stored business activity. All new sessions have
    distinct opaque tokens. Logout invalidates only that token. Every protected API requires the authenticated
    server-side identity, never a client-supplied actor override. Do not expose password/hash/token data
    or arbitrary local files. No original platform, customer account, external network or dependency installation
    is required. Input validation, error shapes and browser observation IDs are public engineering requirements.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: What rules govern persistent offline application?
