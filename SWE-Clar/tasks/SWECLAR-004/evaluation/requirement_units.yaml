- ru_id: RU-003
  name: Interest and relationship ranking
  content: For each candidate calculate Euclidean distance from current x/y coordinates, shared distinct-interest
    count, and shortest path through accepted undirected connections. Remove an edge if either endpoint
    blocks the other. Only paths of up to six edges count; disconnected or longer paths have degree 7.
    Exclude the actor, any candidate blocked in either direction, candidates farther than the radius (equal
    distance is included), and candidates failing the requested role filter. Zero shared interests remain
    eligible. Sort by descending shared count, ascending degree, ascending full unrounded distance, then
    ascending ID in ordinary string order. Return full numeric distance and exact integer counts; do not
    use a user-supplied degree field, pending requests, rounded distances or a fixed account list. Profile
    updates, accepted connections, block/unblock and changed radius/filter affect the next query. These
    exact scoring and graph rules are independently chosen, not original customer statements.
  requirement_category: refinement
