- ru_id: RU-005
  name: Membership receipt redemption and featured posts
  content: 'Receipts come only from the preissued fixture catalog and are identified by receipt_id. An
    account may redeem only its own receipt and an allowed exact plan: user accounts permit free/plus;
    business accounts permit free/local/regional/global. Unknown receipts, another account''s receipt
    and a plan not allowed for the account''s role return HTTP 403 with error.code=denied, without recording consumption or changing
    plan. Every account starts free and has exactly one active plan. First redemption atomically records
    that receipt and replaces the active plan. Replaying a previously consumed receipt is successful but
    does not restore its old plan, including after a later downgrade or upgrade and under concurrent identical
    redemption. Plan and consumption survive process restart. Public client fields cannot substitute another
    plan or subject.


    A featured post requires normal group posting permission and a currently paid business plan (local,
    regional or global). Free business accounts and all user accounts, including plus, cannot create featured
    posts. Nonfeatured posts remain allowed under group permissions. Downgrade prevents future featured
    creation but does not rewrite or remove already published posts. The browser reflects the returned
    current plan and the actual published featured flag. This is a synthetic offline membership workflow,
    not real payment processing or original commercial pricing.'
