- ru_id: RU-002
  name: Editable profiles and discovery interface
  content: Profile edits apply only to the logged-in account; enforce the README interest/coordinate/role/radius
    schemas with no mutation after invalid requests. The actual browser edits profiles, requests matching,
    renders server-ordered cards and exposes the connection, message, group, post and membership controls
    defined in the README. Display text literally and keep controls usable at narrow and wide viewports.
    Message/post failures preserve the entered content; successful submission clears it. Logout clears
    private lists and session state. These browser/HTTP interfaces and the synthetic plane coordinate
    system are independent benchmark choices.
