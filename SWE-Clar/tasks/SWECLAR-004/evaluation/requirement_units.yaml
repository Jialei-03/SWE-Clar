- ru_id: RU-004
  name: Connections and group permissions
  content: 'There is at most one connection record per unordered pair. Request creates a pending connection
    without accepting it; re-request by either side leaves its state unchanged. Only the opposite recipient
    of the original request may accept it. Requester self-approval or acceptance without a request is
    denied; re-acceptance by that recipient is idempotent. Both directions of blocking deny new requests/acceptance
    and messages. Only accepted unblocked pairs may exchange messages, whose sender comes from the session
    and whose trimmed content is stored. Messages are visible only to sender/recipient and hidden from
    both while either blocks the other. Unblocking restores visibility of retained messages and existing
    connections; block never deletes the relationship or messages.


    Creating a group makes the actor its owner and first member. Only that owner may invite any existing
    account, without a connection prerequisite, provided owner and target do not block each other. Repeated
    invitation is idempotent. Only members unblocked with the owner may post. Only such members may like
    a visible post, and neither liker nor author may block the other. One like per account/post, including
    retries. Denied writes leave all stored objects/counts unchanged. A dashboard includes only that account''s
    connections without blocked counterparts, groups in which it is a member and unblocked with the owner,
    posts of those groups whose authors are unblocked with it, and its own unblocked messages. All these
    policies are enforced server-side even for hand-written HTTP requests. Multiple distinct messages/posts
    remain distinct. Permissions and visibility change immediately after block/unblock; no duplicate invitations
    or likes are created by retries. These are independent business conventions.'
  requirement_category: refinement
