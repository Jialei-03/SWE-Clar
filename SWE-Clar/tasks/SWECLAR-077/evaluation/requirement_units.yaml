selected_scope: Actual responsive PHP content pages and text-PDF to editable DOCX workflow
requirement_units:
- ru_id: RU-001
  name: Site workflow entry point
  content: Complete the supplied PHP website and Python content/document workflow. process_site_action(state,action,output_root,source_root)
    returns a new state without mutating caller inputs or performing network access; it writes actual
    page data and editable documents locally. web/index.php reads DATA_ROOT/<page_id>.json to serve the
    page. Use the supplied synthetic files and isolated roots.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for site workflow entry point.
  test_interface:
    type: function
    entry:
      language: python
      file: solution.py
      function: process_site_action
      signature: process_site_action(state,action,output_root,source_root) -> dict
    inputs:
      state: Local page, asset, PDF and template registry
      action: upsert_page/set_seo/convert_pdf
      output_root: Writable output directory
      source_root: Synthetic file directory
    output:
      type: dict
      meaning: Next state or error with actual persisted PHP page data or editable DOCX output.
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/docsite_contract.py
  notes: Real PHP rendering and file conversion are reconstructed from the site/document workflow. Synthetic
    layout breakpoints, JSON adapter and plain-text PDF scope are benchmark choices. No customer template,
    code, logo or document is distributed.
- ru_id: RU-002
  name: Responsive page content
  content: upsert_page creates or updates a page with title,body,ordered sections and asset IDs. Read
    the registered PNG bytes under source_root and render them in the PHP page, preserving visible text
    and section order. The actual section grid has one column below 600 CSS pixels, two from 600 through
    1023, and three at 1024 or wider; resizing the browser updates layout without a new action. Preserve
    the existing site content and metadata during updates. Escape supplied text so markup is displayed
    literally. Return page_id and the written JSON filename.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for responsive page content.
