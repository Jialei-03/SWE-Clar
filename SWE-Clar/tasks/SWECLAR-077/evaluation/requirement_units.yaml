- ru_id: RU-005
  name: Deterministic local behavior
  content: Reject unsupported/encrypted/empty-text PDF inputs, missing files, unknown letterheads, invalid
    or duplicate document IDs (including an existing output file), invalid viewport widths (including
    bool/NaN/infinity), unknown assets and paths escaping source_root. Unknown SEO pages are invalid_seo;
    bad page actions are invalid_page; bad conversions are invalid_document. A failed action preserves
    prior state/content and existing output files without leaving partial output. IDs use ASCII letters,digits,underscore,hyphen.
    Unknown actions return unknown_action.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
