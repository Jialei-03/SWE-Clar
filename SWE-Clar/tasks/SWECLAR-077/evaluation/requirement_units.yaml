- ru_id: RU-004
  name: Editable document conversion
  content: convert_pdf reads the registered local PDF file rather than pre-extracted input blocks and
    writes <document_id>.docx based on the registered DOCX letterhead template. Extract nonempty text
    lines in page/line order into editable Word paragraphs, preserve repeated body lines and retain the
    template content/header exactly once. Do not embed PDF page screenshots in place of editable text.
    Clear personal core metadata from the output. Return file,letterhead_id,editable=true after the file
    exists. The benchmark uses text-only PDFs with unambiguous reading order; complex layout reconstruction
    and OCR are outside scope.
  requirement_category: refinement
  source_visibility: hidden
