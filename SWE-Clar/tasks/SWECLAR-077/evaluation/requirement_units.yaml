  name: SEO metadata
  content: set_seo applies only to an existing page. Trim nonempty string title and description; require
    canonical_path beginning with a single slash and without backslashes or newlines. Persist title,description,canonical_path,indexable=true
    and render them as the PHP page title, meta description, canonical link and index/follow robots metadata.
    Keep body and section content unchanged.
