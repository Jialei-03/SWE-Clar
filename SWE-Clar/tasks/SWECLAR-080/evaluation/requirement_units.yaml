- ru_id: RU-004
  name: Member data normalization
  content: Normalize numeric group_code identifiers 0 through 9 to two digits while preserving zero as
    00 and multi-digit identifiers. Keep missing/null/empty meeting counts distinct from a genuine numeric
    zero; render missing values as Unavailable and zero as 0. Reject negative, boolean and nonnumeric
    counts/identifiers rather than silently coercing them. Original jurisdiction/member data is excluded;
    these are synthetic directory fields.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
