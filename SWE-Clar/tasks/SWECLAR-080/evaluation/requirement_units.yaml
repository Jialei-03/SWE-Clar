- ru_id: RU-005
  name: Performance readiness
  content: Observe actual browser LCP, INP and CLS via the supplied web-vitals library and evaluate LCP
    <=2500 ms, INP <=200 ms and CLS <=0.1. Return failed metric names and report missing, invalid, negative
    or nonfinite values as missing; never infer performance from cache state. These are controlled lab
    observations with disclosed benchmark thresholds, not a certification of production field performance.
  requirement_category: refinement
