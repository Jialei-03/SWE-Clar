- ru_id: RU-003
  name: CSS and JavaScript delivery
  content: Load only component assets needed by the requested page through native WordPress enqueue APIs.
    Deduplicate the base stylesheet, place styles before scripts and defer noncritical scripts without
    breaking dependencies or the working member-filter control. The about page does not load the member
    filter. Core WordPress resources are outside this component-specific asset budget.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for css and javascript delivery.
