schema_version: 1
task_id: SWECLAR-080
registry_version: swe-clar
registry_status: annotation_complete
disclosure_design: controlled_requirement_disclosure
selected_scope: Actual WordPress directory plugin rendering, component transient cache, native asset enqueue
  and observed lab Web Vitals
requirement_units:
- ru_id: RU-001
  name: Site request entry point
  content: Repair the supplied independent WordPress plugin while preserving its pages, hooks and member
    records. Render actual HTML through WordPress with escaped synthetic field values. Only the members/about
    component pages are accepted; unknown pages must fail. The README defines the runtime/options boundary;
    real WordPress/PHP/database execution is required, not a returned page manifest.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for site request entry point.
  test_interface:
    type: function
    entry:
      language: php
      file: directory.php
      function: directory_normalize_member
      signature: 'directory_normalize_member(array $raw): array'
    inputs:
      raw: synthetic member fields
    output:
      type: dict
      meaning: normalized member
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/wordpress_contract.py
  notes: Independent WordPress component and synthetic records. Cache/assets/data normalization have source
    support; exact keys, API and lab performance tests are benchmark conventions. No original customer
    site or member information is included.
- ru_id: RU-002
  name: Cold and warm page caching
  content: Cache anonymous rendered component HTML using a key that includes page, content version and
    member data. A warm identical request returns the same component without another render. Content/version
    changes rebuild and pages must not share cached markup. Logged-in or preview requests bypass the public
    cache, and user-specific markup must not enter anonymous responses. Render count measures actual cold
    component rendering.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for cold and warm page caching.
  test_interface:
    type: function
    entry:
      language: php
      file: directory.php
