selected_scope: Playable minimal three-dimensional WebGL escape room
requirement_units:
- ru_id: RU-001
  name: Puzzle state transition
  content: Preserve a real playable WebGL three-dimensional room with perspective/depth, synthetic geometric
    clues, two answer-entry locks and an exit. apply_escape_room_action(state,action) returns a new state
    without mutating either input. solve requires a known puzzle ID and a string answer equal to its configured
    answer after trimming surrounding whitespace. Only a correct submitted answer adds that puzzle once
    to solved; wrong/unknown/malformed answers reject without changing gameplay state. Repeated correct
    submissions are safe. The browser must obtain submitted answers from actual controls and visibly update
    each lock; a solved flag alone is insufficient. Extra metadata and alternate nonempty error codes
    are permitted.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Describe the required behavior for puzzle state transition.
  test_interface:
    type: function
    entry:
      language: python
      file: solution.py
      function: apply_escape_room_action
      signature: apply_escape_room_action(state,action) -> dict
    inputs:
      state: Synthetic room scenario
      action: Public operation schema in README
    output:
      type: dict
      meaning: New state with actual WebGL/browser actions and observations
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/test_solution.py
- ru_id: RU-002
  name: Exit gating
  content: exit_open is true exactly when every required_puzzles ID is in solved. A correct solve recalculates
    this gate, without counting duplicate/unknown IDs as missing requirements. exit action succeeds only
    while every required puzzle is solved, sets escaped=true and produces an observable room completion;
    before that it rejects atomically. Actual browser interaction must solve both geometry puzzles and
    activate the exit. HTTP /state and subsequent browser state must agree. No original assets or full
    commercial game are required.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
