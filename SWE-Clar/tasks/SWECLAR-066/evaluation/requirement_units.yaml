- ru_id: RU-004
  name: Standalone and embedded presentation
  content: presentation(mode) accepts only standalone and embedded; other values reject without changing
    state. /game serves standalone play. /embed serves a real local iframe of the same playable game;
    the child uses embedded mode, stays within the host frame, and retains working puzzle/exit controls.
    The two presentations use the same rules. Tests observe actual frame context and interaction, not
    only presentation state. No external host or service is needed.
  requirement_category: refinement
