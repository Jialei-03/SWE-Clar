- ru_id: RU-005
  name: Localization fallback
  content: text(locale,key) looks up a string in texts[locale][key], otherwise the English string in texts.en[key],
    otherwise the key itself. Empty strings count as available translations. Non-string locale/key values
    reject. Lookups preserve dictionaries and gameplay state; returned text is in top-level text. The
    actual locale selector refreshes visible puzzle/title/exit text using the backend lookup, including
    English/key fallback for missing translations. Geometry, puzzles and progress remain unchanged. All
    source strings/translations in this component are independently synthetic.
  requirement_category: refinement
