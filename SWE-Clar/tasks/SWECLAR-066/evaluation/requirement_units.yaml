- ru_id: RU-003
  name: Orientation behavior
  content: viewport(width,height) requires positive finite numeric dimensions excluding booleans. rotate_prompt
    is true iff height>width. aspect_supported is true iff abs(width/height-16/9)<=0.02. Landscape/square
    non-16:9 views may letterbox without blocking play. The actual page sends viewport updates when resized,
    presents a rotation prompt that blocks puzzle/exit interaction in portrait, and restores play in landscape
    without losing solved progress. The room canvas keeps a16:9 display area.
  requirement_category: refinement
