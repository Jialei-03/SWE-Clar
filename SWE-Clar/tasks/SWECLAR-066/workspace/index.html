<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geometry escape room</title>
<style>body{margin:0;background:#15191e;color:#e7edec;font:16px system-ui}main{max-width:980px;margin:auto;padding:12px}h1{font-size:26px;margin:8px 0}.bar{display:flex;gap:12px;align-items:center}canvas{width:100%;aspect-ratio:16/9;display:block;background:#283841}.locks{display:flex;gap:16px;margin:12px 0}.lock{flex:1;padding:10px;background:#263039}.lock[data-solved=true]{outline:2px solid #85dca1}input{width:65px}button,input,select{font:inherit;padding:6px}#rotate{position:fixed;inset:0;z-index:10;background:#15191ef2;display:grid;place-items:center;font-size:28px}#rotate[hidden]{display:none}#completion{color:#9fecb2;font-weight:bold}#room[data-escaped=true] canvas{outline:3px solid #85dca1}small{color:#afc3c7}</style>
<main><div class="bar"><h1 data-text="title">Geometry chamber</h1><select id="locale" aria-label="Language"><option value="en">English</option><option value="es">Español</option><option value="zz">Fallback</option></select></div><small>Independent 3D geometry puzzle. Count the objects, unlock both seals, then leave.</small>
<div id="room"><canvas id="scene" width="960" height="540" aria-label="Three-dimensional puzzle chamber"></canvas><div class="locks"><div class="lock" id="lock-cubes"><label for="answer-cubes" data-text="cubes">Count all gold and blue cubes</label><br><input id="answer-cubes" autocomplete="off"><button id="solve-cubes">Unlock cube seal</button><span id="mark-cubes">Locked</span></div><div class="lock" id="lock-tetra"><label for="answer-tetra" data-text="tetra">Count the tetrahedron vertices</label><br><input id="answer-tetra" autocomplete="off"><button id="solve-tetra">Unlock tetrahedron seal</button><span id="mark-tetra">Locked</span></div></div><button id="exit" data-text="exit" disabled>Leave the room</button><p id="completion" hidden>Room escaped</p></div><p id="status">Loading</p></main><div id="rotate" hidden><span data-text="rotate">Rotate to landscape</span></div>
<script>
const el=id=>document.getElementById(id);let state={solved:[]},ready=false;
const canvas=el('scene'),gl=canvas.getContext('webgl',{preserveDrawingBuffer:true});
if(!gl)throw Error('WebGL unavailable');
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,'attribute vec3 position;attribute vec3 color;varying vec3 c;void main(){vec3 p=position-vec3(0.0,1.4,6.0);float f=1.73;gl_Position=vec4(p.x*f/(16.0/9.0),p.y*f,-1.02*p.z-0.202,-p.z);c=color;}'));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,'precision mediump float;varying vec3 c;void main(){gl_FragColor=vec4(c,1.0);}'));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error('Shader link failed');gl.useProgram(program);gl.enable(gl.DEPTH_TEST);let vertices=[];
function tri(a,b,c,color){for(const p of [a,b,c])vertices.push(...p,...color);}
function quad(a,b,c,d,color){tri(a,b,c,color);tri(a,c,d,color);}
function cube(x,y,z,size,color){const a=size/2,v=[[x-a,y-a,z-a],[x+a,y-a,z-a],[x+a,y+a,z-a],[x-a,y+a,z-a],[x-a,y-a,z+a],[x+a,y-a,z+a],[x+a,y+a,z+a],[x-a,y+a,z+a]];[[0,1,2,3],[4,7,6,5],[0,4,5,1],[3,2,6,7],[0,3,7,4],[1,5,6,2]].forEach((f,i)=>quad(...f.map(n=>v[n]),color.map(n=>n*(.65+i*.06))));}
function draw(){vertices=[];quad([-3,0,-3],[3,0,-3],[3,0,3],[-3,0,3],[.24,.3,.31]);quad([-3,0,-3],[-3,3,-3],[3,3,-3],[3,0,-3],[.33,.4,.42]);quad([-3,0,3],[-3,3,3],[-3,3,-3],[-3,0,-3],[.23,.31,.35]);quad([3,0,-3],[3,3,-3],[3,3,3],[3,0,3],[.29,.34,.38]);
 if(!state.escaped)quad([-.55,0,-2.96],[.55,0,-2.96],[.55,2,-2.96],[-.55,2,-2.96],state.exit_open?[.24,.72,.45]:[.39,.23,.14]);else quad([-.55,0,-2.95],[.55,0,-2.95],[.55,2,-2.95],[-.55,2,-2.95],[.75,.96,.85]);
 for(let i=0;i<3;i++)cube(-1.95+i*.5,.3,.35,.36,[.98,.74,.23]);for(let i=0;i<4;i++)cube(-2.2+i*.48,.8,-.55,.34,[.3,.67,.94]);
 const v=[[1.8,1.1,.2],[1.2,.12,.5],[2.35,.12,.5],[1.8,.12,-.55]];[[0,1,2],[0,2,3],[0,3,1],[1,3,2]].forEach((f,i)=>tri(...f.map(n=>v[n]),[.85-i*.13,.39+i*.06,.54]));
 for(const [i,p] of ['cubes','tetra'].entries())cube(i?1.3:-1.3,1.4,-2.8,.22,(state.solved||[]).includes(p)?[.3,.9,.5]:[.9,.3,.2]);
 const solids=vertices.length/6;for(const edge of [[0,1],[0,2],[0,3],[1,2],[1,3],[2,3]])for(const n of edge)vertices.push(...v[n],.95,.9,.95);
 const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(vertices),gl.STATIC_DRAW);for(const [name,offset] of [['position',0],['color',12]]){const loc=gl.getAttribLocation(program,name);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,3,gl.FLOAT,false,24,offset);}gl.viewport(0,0,960,540);gl.clearColor(.12,.16,.19,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.drawArrays(gl.TRIANGLES,0,solids);gl.disable(gl.DEPTH_TEST);gl.drawArrays(gl.LINES,solids,12);gl.enable(gl.DEPTH_TEST);gl.deleteBuffer(buffer);canvas.dataset.renderer='webgl';}
function render(){for(const p of ['cubes','tetra']){const solved=(state.solved||[]).includes(p);el('lock-'+p).dataset.solved=solved;el('mark-'+p).textContent=solved?'Unlocked':'Locked';}el('exit').disabled=!state.exit_open;el('completion').hidden=!state.escaped;el('room').dataset.escaped=!!state.escaped;el('rotate').hidden=!state.rotate_prompt;el('room').inert=!!state.rotate_prompt;document.body.dataset.presentation=state.presentation||'standalone';draw();}
async function action(a){const r=await fetch('/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(a)});const out=await r.json();if(out.puzzles)state=out;el('status').textContent=out.error?'Action rejected':JSON.stringify(out.result||{ready:true});render();return out;}
for(const p of ['cubes','tetra'])el('solve-'+p).onclick=()=>action({type:'solve',puzzle:p,answer:el('answer-'+p).value});el('exit').onclick=()=>action({type:'exit'});
async function localize(){for(const node of document.querySelectorAll('[data-text]')){const out=await action({type:'text',locale:el('locale').value,key:node.dataset.text});if(typeof out.text==='string')node.textContent=out.text;}}
el('locale').onchange=()=>{document.body.dataset.localized='false';localize().then(()=>document.body.dataset.localized='true');};let resizeTimer;window.onresize=()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>action({type:'viewport',width:innerWidth,height:innerHeight}),50);};
(async()=>{try{state=await(await fetch('/state')).json();render();await action({type:'presentation',mode:new URLSearchParams(location.search).get('mode')||'standalone'});await action({type:'viewport',width:innerWidth,height:innerHeight});await localize();}catch(e){el('status').textContent=String(e);}finally{ready=true;document.body.dataset.ready='true';document.body.dataset.localized='true';}})();
</script></html>
