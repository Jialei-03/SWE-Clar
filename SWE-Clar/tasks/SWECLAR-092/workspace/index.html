<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fleet Dashboard</title><link rel="stylesheet" href="vendor/bootstrap.min.css"><link rel="stylesheet" href="dashboard.css"><script src="data.js" defer></script><script src="dashboard.js" defer></script></head><body>
<main class="container-fluid p-4"><h1 class="h2">Fleet overview</h1><p class="text-secondary">Drivers, vehicles, and current fleet totals.</p><div id="error" class="alert alert-danger" role="alert" hidden></div><section aria-label="Summary" id="summary" class="summary-grid mb-4"></section>
<div class="fleet-grid"><section id="drivers-section" class="card"><div class="card-header d-flex justify-content-between align-items-center"><h2 class="h5 mb-0">Drivers</h2><button class="btn btn-outline-primary btn-sm" id="view-drivers">View all drivers</button></div><div class="card-body"><ul id="drivers" class="list-group list-group-flush"></ul></div></section>
<section id="vehicles-section" class="card"><div class="card-header d-flex justify-content-between align-items-center"><h2 class="h5 mb-0">Vehicles</h2><button class="btn btn-outline-primary btn-sm" id="view-vehicles">View all vehicles</button></div><div class="card-body"><ul id="vehicles" class="list-group list-group-flush"></ul></div></section></div></main>
<aside id="sidebar" aria-labelledby="sidebar-title" hidden><div class="d-flex justify-content-between align-items-center mb-3"><h2 class="h4" id="sidebar-title"></h2><button class="btn btn-outline-secondary" id="close-sidebar" aria-label="Close sidebar">Close</button></div><ul id="sidebar-items" class="list-group"></ul></aside></body></html>
