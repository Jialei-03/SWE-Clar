- ru_id: RU-005
  name: Static offline behavior
  content: The static dashboard must work using only its supplied local files and fleet data, without
    remote HTTP requests. Unknown dispatch actions return an error object whose code is unknown_action;
    they must not partially change the current fleet content or open sidebar. Display text as text rather
    than executable markup. Local static HTTP serving is permitted; only page-local resource URLs may
    be requested. Unknown includes unsupported type/target or malformed action; return {error:{code:unknown_action}}
    with optional metadata, preserve current fleet/panel state and input. Render labels/names with text
    semantics, including apparent HTML strings; no injected element/event execution.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
