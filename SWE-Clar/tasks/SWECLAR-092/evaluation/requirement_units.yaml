- ru_id: RU-003
  name: JSON data projection
  content: Render summary, driver and vehicle values only from the supplied fleet JSON. If summary, drivers
    or vehicles is missing, render an accessible error identifying missing_data and the missing fields
    instead of inventing records. Missing means absent own property among summary,drivers,vehicles; fixtures
    otherwise use valid types. Error has an accessible alert and names all missing fields; do not fabricate
    default records or show partial records for missing data. Additional JSON keys are allowed. Rendering
    and local actions must preserve the supplied data object.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
