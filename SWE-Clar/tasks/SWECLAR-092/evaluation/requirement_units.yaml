schema_version: 1
task_id: SWECLAR-092
registry_version: swe-clar
registry_status: annotation_complete
disclosure_design: controlled_requirement_disclosure
selected_scope: Responsive HTML/CSS/Bootstrap dashboard with local JSON data and browser interactions
requirement_units:
- ru_id: RU-001
  name: Dashboard delivery
  content: Repair and complete the supplied HTML/CSS/Bootstrap dashboard. Render the existing fleet overview,
    summary, driver and vehicle sections in the browser from the supplied window.FLEET_DATA object, without
    mutating it. Preserve the local assets and controls. This is a page-local dashboard component, excluding
    the surrounding site's global header/navigation sidebar. Its independently specified driver/vehicle
    detail panel is local content, not reinstatement of global navigation. Input object is supplied before
    data.js loads; valid summary is a scalar-valued object and drivers/vehicles are arrays of {id,name}
    records. Additional fields may be ignored, no original assets or fleet identities.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for dashboard delivery.
  test_interface:
    type: web_ui
    entry:
      language: html_css_javascript
      pages:
      - index.html
    inputs:
      fleet_data: 'window.FLEET_DATA: {summary: object, drivers: array<{id,name}>, vehicles: array<{id,name}>}'
      viewport_width_px: integer
      interaction_entry: window.dashboard.dispatch(action)
    output:
      type: rendered_page
      meaning: Observable dashboard layout, supplied record text, error messages and sidebar interactions
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/test_solution.py
  notes: The page and JSON injection interface are independently reconstructed. The original Figma is
    unavailable; original-design equivalence remains unverified.
- ru_id: RU-002
  name: Responsive layout
  content: Use a desktop composition at widths of at least 1024, a tablet composition from 600 through
    1023, and a mobile composition below 600. Driver and vehicle sections appear in columns on larger
    layouts and stack vertically on mobile; their content remains visible within the viewport without
    horizontal page overflow. Test viewport widths include320,599,600,1023,1024 and1280. Larger means
    >=600 for the two section columns. Keep labels and long text readable with wrapping, section rectangles
    inside viewport; exact spacing, colors and DOM implementation are not scoring requirements.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
