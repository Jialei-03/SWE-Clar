- ru_id: RU-004
  name: Contextual sidebars
  content: Clicking View all drivers opens a visible sidebar containing the supplied drivers, and View
    all vehicles opens the corresponding vehicle sidebar. Clicking Close closes either sidebar. The local
    dispatch entry point accepts view_all with target drivers or vehicles and close_sidebar. Preserve
    existing View all drivers/View all vehicles/Close controls and window.dashboard.dispatch(action).
    Open only the requested local panel, containing all names in source order, close hides it, switching
    replaces content. Standard local markup/style may vary. No global page menu or remote navigation is
    requested.
  requirement_category: refinement
  source_visibility: hidden
