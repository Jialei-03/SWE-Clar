disclosure_design: controlled_requirement_disclosure
selected_scope: Event-credit accounting, refund and synchronization-ledger module
requirement_units:
- ru_id: RU-001
  name: Cashless workflow entry point
  content: Process one registration, card, payment, synchronization, or report action into a new state
    without mutating inputs. Preserve the supplied JSON console, HTTP transport and local SQLite synchronization
    service. Public README defines data and invocation formats. Errors preserve all state fields and inputs;
    successful actions clear stale error/result fields.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for cashless workflow entry point.
  test_interface:
    type: function
    entry:
      language: python
      file: solution.py
      function: process_cashless_action
      signature: 'process_cashless_action(state: dict, action: dict, upload_events=None) -> dict'
    inputs:
      state: JSON-compatible workflow state; an empty dict is a valid initial state.
      action:
        discriminator: type
        variants:
          register_terminal:
            required_fields:
              imei: string
              name: string
          create_customer:
            required_fields:
              customer_id: string
              name: string
          activate_card:
            required_fields:
              card_id: string
              customer_id: string
    output:
      type: dict
      meaning: New state with public README collections, or unchanged state plus error.code; any nonempty
        code and extra nonconflicting metadata are allowed.
    operations:
    - register_terminal
    - create_customer
    - activate_card
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/test_solution.py
  notes: Independent stored-credit ledger. Exact refund, event replay, cent arithmetic and acknowledgement
    semantics are synthetic benchmark conventions grounded in the source problem, not customer quotations.
    Local service is real HTTP/SQLite; no NFC hardware or bank transfer is claimed.
- ru_id: RU-002
  name: Customers, terminals, and cards
  content: Register terminals by unique non-empty IMEI, create customers with unique IDs, and activate
    one unique NFC card for a known customer with zero balance. Reject empty or duplicate identifiers,
    unknown customers and a second active card for the same customer. IMEI is a synthetic terminal identifier;
    no physical device is required.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
