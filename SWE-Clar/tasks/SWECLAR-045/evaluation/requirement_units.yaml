- ru_id: RU-003
  name: Top-ups, sales, and refunds
  content: Accept positive cash or card top-ups, debit purchases only when the card has sufficient credit,
    and refund a prior sale at most once using cash or card while restoring the card balance. Monetary
    actions require known terminal/card and positive finite amounts with at most two decimal places (booleans
    are invalid). Topups and refunds require cash/card. Refunds must match the original sale card and
    full amount. An identical repeated event ID is a no-op; a reused ID with different monetary fields
    is rejected. Balance and pending queue must not change on rejection. Sale product must be a nonempty
    string.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for top-ups, sales, and refunds.
  matching_keywords: []
  test_interface:
    type: function
    entry:
      language: python
      file: solution.py
      function: process_cashless_action
      signature: 'process_cashless_action(state: dict, action: dict, upload_events=None) -> dict'
    inputs:
      state: State returned by a previous process_cashless_action call.
      action:
        discriminator: type
        variants:
          topup:
            required_fields:
              card_id: string
              terminal_imei: string
              event_id: string
              amount: positive number
              payment_method: cash or card
          sale:
            required_fields:
              card_id: string
              terminal_imei: string
              event_id: string
              amount: positive number
              product: string
              timestamp: number or string
          refund:
            required_fields:
              card_id: string
              terminal_imei: string
              event_id: string
              sale_event_id: string
              amount: positive number
              payment_method: cash or card
    output:
      type: dict
      meaning: New state with public README collections, or unchanged state plus error.code; any nonempty
        code and extra nonconflicting metadata are allowed.
    operations:
    - topup
    - sale
    - refund
  evaluation: executable
  pass_rule: all_tests_pass
  tests:
  - test_id: RU-003-T01
    file: evaluation/tests/test_solution.py
  notes: Independent stored-credit ledger. Exact refund, event replay, cent arithmetic and acknowledgement
    semantics are synthetic benchmark conventions grounded in the source problem, not customer quotations.
    Local service is real HTTP/SQLite; no NFC hardware or bank transfer is claimed.
- ru_id: RU-004
  name: Offline terminal synchronization
  content: Every monetary action records a unique local event on its terminal; synchronization copies
    each pending event to the server ledger exactly once and clears only successfully synchronized events.
    Sync uses the supplied upload callback or real HTTP transport. Only explicitly acknowledged IDs from
    that terminal pending batch move to server_ledger; unacknowledged events remain pending. Transport
    failure returns an error and preserves the entire state. Unknown acknowledgement IDs do not create
    records. Repeated acknowledgements never duplicate server records. Other terminals remain unchanged.
    No upload is required for an empty batch.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for offline terminal synchronization.
  matching_keywords: []
  test_interface:
    type: function
    entry:
      language: python
      file: solution.py
      function: process_cashless_action
      signature: 'process_cashless_action(state: dict, action: dict, upload_events=None) -> dict'
    inputs:
      state: State containing per-terminal pending events and a server ledger.
      action:
        discriminator: type
        variants:
          sync:
            required_fields:
              terminal_imei: string
    output:
      type: dict
      meaning: New state with public README collections, or unchanged state plus error.code; any nonempty
        code and extra nonconflicting metadata are allowed.
    operations:
    - sync
  evaluation: executable
  pass_rule: all_tests_pass
  tests:
  - test_id: RU-004-T01
    file: evaluation/tests/test_solution.py
  notes: Independent stored-credit ledger. Exact refund, event replay, cent arithmetic and acknowledgement
    semantics are synthetic benchmark conventions grounded in the source problem, not customer quotations.
    Local service is real HTTP/SQLite; no NFC hardware or bank transfer is claimed.
- ru_id: RU-005
  name: Event reports
  content: Report purchased credit, total sales, refunds by payment method, and product sales with terminal
    and timestamp from synchronized records only. Totals preserve cents, include zero cash/card refund
    totals when absent, and do not subtract refunds from gross total_sales. Product sales retain server-ledger
    order; pending events are excluded.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for event reports.
