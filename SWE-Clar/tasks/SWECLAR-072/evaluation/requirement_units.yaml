- ru_id: RU-005
  name: Passwordless login rate limit
  content: Normalize email by trimming whitespace and lowercasing. Accept at most three requests per normalized
    email in a rolling 900-second window. A limited response is exactly accepted=false plus retry_after_seconds
    until the oldest in-window attempt expires; an accepted response is exactly accepted=true and omits
    retry_after_seconds.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for passwordless login rate limit.
  test_interface:
    type: function
    entry:
      language: python
      file: solution.py
      function: process_backend_command
      signature: 'process_backend_command(state: dict, command: dict) -> dict'
    inputs:
      arguments:
      - state
      - command
      action_variants:
        passwordless:
          fields:
          - email
          - now
          - type
      protocol_fields:
      - email
      - now
      - type
    output:
      type: dict
      meaning: A deterministic JSON-compatible result; input objects are not mutated.
      asserted_field_paths:
      - login_result
      - login_result.accepted
      - login_result.retry_after_seconds
      required_tokens:
        login_result.accepted:
        - false
        - true
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-005-T01
    file: evaluation/tests/test_solution.py
  notes: Freelancer described these backend modules and client confirmed broader API completion. Exact
    schema, no-op handling, cycle rules and 3-per-900 limits are synthetic conventions. Pending refund
    records do not execute external money movement; rate limiting sends no email.
