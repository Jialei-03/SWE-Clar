- ru_id: RU-004
  name: Multi-level comments
  content: comments is a top-level array in insertion order. A comment may have no parent_id or target
    an existing comment. Reject a missing parent with missing_parent, reject any insertion that would
    complete a parent cycle with comment_cycle, and leave the array unchanged on rejection. Do not reorder
    by created_at.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for multi-level comments.
  test_interface:
    type: function
    entry:
      language: python
      file: solution.py
      function: process_backend_command
      signature: 'process_backend_command(state: dict, command: dict) -> dict'
    inputs:
      arguments:
      - state
      - command
      action_variants:
        comment:
          fields:
          - body
          - created_at
          - id
          - parent_id
          - type
      protocol_fields:
      - body
      - comments
      - created_at
      - id
      - parent_id
      - type
    output:
      type: dict
      meaning: A deterministic JSON-compatible result; input objects are not mutated.
      asserted_field_paths:
      - comments
      - comments.<index>.id
      - error
      - error.code
      required_tokens:
        error.code:
        - comment_cycle
        - missing_parent
      field_schemas:
        comments:
          type: array
          items:
            type: object
        comments.<index>.id:
          type: string
        error.code:
          type: string
    operations: []
  evaluation: executable
