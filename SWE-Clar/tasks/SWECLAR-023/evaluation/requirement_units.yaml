- ru_id: RU-004
  name: Reachability and legitimate traversal order
  content: 'BFS/DFS begin with an existing start node, follow only outgoing edges in directed graphs and
    either direction in undirected graphs. Self-loops/cycles never repeat a node. Disconnected nodes are
    excluded. Return number of IDs actually written, at mostcapacity. Missing start, NULL graph, NULL
    out or capacity0 returns0 and writes nothing. Never write beyond the returned prefix/capacity. Traversal
    does not mutate graph. For capacity smaller than reachable count, return a legal traversal prefix;
    do not substitute a set of IDs.


    BFS visits nondecreasing shortest-path distance from start. Order within the same layer is unconstrained
    provided a valid queue-based BFS with some neighbor ordering could produce it. DFS is a valid recursive
    depth-first preorder with some neighbor ordering: descend to an unvisited neighbor when available,
    and backtrack only when the current node has no unvisited neighbor. A different correct neighbor order
    is accepted. Evaluation must not demand the reference''s particular tie order or numeric ID sequence.
    Use iterative work stacks if needed to stay safe on the official chain length of10000nodes. All reachable
    nodes must be returned when capacity suffices.'
  requirement_category: refinement
