- ru_id: RU-003
  name: Relationship CRUD and directedness
  content: Both endpoints must be live. A directed ordered pair has at most one edge; (a,b) differs from
    (b,a). In an undirected graph, (a,b) and (b,a) refer to one edge and either order reads/updates/removes
    it. Self-loops are allowed once and count as one edge. Duplicate add fails and preserves previous
    label; missing endpoint, NULL/oversized label, unknown update/remove fail without changes. Labels
    have the same copied/borrowed ownership guarantees as node values. Node removal also removes every
    incident edge (incoming, outgoing and self-loop), exactly once; other edges remain. Starter provides
    real relationships and cleanup.
  requirement_category: core
