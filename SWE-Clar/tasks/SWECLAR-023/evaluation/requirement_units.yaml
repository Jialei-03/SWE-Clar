- ru_id: RU-006
  name: Actual reproducible CRUD measurement and CSV
  content: 'For N requested runs, measure four phases in order create,read,update,delete on a fresh directed
    graph through public functions. Generate N distinct synthetic node values as `record-<index>` for
    indices0..N-1. Create phase calls add_node N times and records returned IDs; read verifies exact initial
    strings; update replaces with `updated-<index>` and verifies success; delete removes each stored ID
    and verifies success. Check graph counts after create=N, update=N, delete=0 and exact updated values
    before delete. On any failed operation/inconsistent result, return nonzero without reporting success.
    The benchmark must actually perform the operations; a formula/timer-only/no-op loop is not measurement.


    For each phase, take a CLOCK_MONOTONIC timestamp immediately before and after each measured API call;
    allocate per-run arrays, generate strings and do result-validation outside the timed interval. Average/min/max
    are computed from these N measured durations, converted to microseconds as real values. Separately
    record per-phase process CPU delta with CLOCK_PROCESS_CPUTIME_ID around the phase and process peak
    resident memory via getrusage(RUSAGE_SELF).ru_maxrss after it; Linux ru_maxrss is KiB. Values must
    be finite/nonnegative and min<=average<=max. No hardcoded source performance numbers, speed threshold,
    required ratio, fixed memory delta or claim of commercial database superiority. System scheduler/measurement
    noise and timer quantization are expected; a valid zero reading is accepted.


    Write UTF-8 CSV with header exactly these names in this order: `operation,runs,avg_us,min_us,max_us,cpu_seconds,peak_rss_kib`.
    Four rows in create/read/update/delete order; runs exactlyN, peak_rss_kib a nonnegative integer; other
    numeric cells finite nonnegative decimal/scientific notation. CSV quoting and LF/CRLF are free. On
    success print one JSON object `{ok:true,runs:N,rows:4}` to stdout and exit0; extra harmless metadata
    allowed. The actual CSV file is authoritative, not an in-memory summary. An output write/close failure
    is an unsuccessful run. Do not unlink/overwrite an unrelated file merely for cleanup. Resource/time
    measurements must execute locally in the prepared container.


    Tests may link an instrumented substitute implementing the same public graph ABI to count calls and
    introduce a known short delay inside an operation. This validates that the benchmark calls the interface
    and measures work, without inspecting private graph implementation. The build exposes benchmark source
    as `tools/graph_bench.c` and library calls may not be duplicated/inlined into it. All other internal
    file decomposition is free. No external DB or network client is required.'
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the requirements for actual reproducible crud measurement and csv.
