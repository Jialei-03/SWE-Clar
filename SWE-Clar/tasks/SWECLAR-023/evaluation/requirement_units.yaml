- ru_id: RU-005
  name: Actual durable graph roundtrip and input rejection
  content: 'Save writes an actual local file containing all current nodes/values, edge endpoints/labels
    and directedness. Load opens this file and creates an independent graph preserving IDs, bytes, topology
    and counts. New insertions into the loaded graph cannot collide with its live IDs. Saved state is
    a snapshot: subsequent mutations/destruction of the original do not change the loaded graph/file.
    Empty graphs, undirected graphs, self-loops, deleted-ID gaps and empty/newline/Unicode strings roundtrip.
    Restoring after a fresh process start must work, not an in-memory path cache.


    Format is candidate-defined; tests use candidate save/load together and do not compare file bytes
    to a reference format. NULL/empty/unreadable path or invalid/incomplete file returnsNULL. Save to
    an unopenable destination returnsfalse and does not change graph state. Load must validate its own
    format/lengths/references, reject partial files instead of exposing partial graphs, and free temporary
    storage on failure. Official malformed probes include zero-length files, random non-format bytes and
    truncations of the implementation''s own successful save. Files are at most64MiB; graph/string bounds
    above still apply. No mmap/shared-memory/process-private pointer serialization. Successful loaded
    graph owns its memory independently of file lifetime. Endianness portability between architectures,
    crash-atomic replacement, fsync durability and recovery from injected hardware faults are outside
    this task.'
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
