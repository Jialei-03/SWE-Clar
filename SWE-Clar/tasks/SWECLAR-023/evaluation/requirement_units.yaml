- ru_id: RU-002
  name: Node storage and ownership
  content: Implement add/get/update/remove/count with common ID/string/error contracts. Add creates a
    live node with a copied string; update copies replacement and preserves ID/count. Unknown remove/update
    returnsfalse. Removing one node does not remove unrelated nodes; recreating nodes must not alias another
    live ID. Getters expose exact current bytes. Empty strings, punctuation, newline and UTF-8 work. Updates
    with the borrowed current string work. Starter includes real heap-owned node CRUD, not an empty placeholder.
