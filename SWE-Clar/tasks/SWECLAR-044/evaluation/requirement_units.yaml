- ru_id: RU-003
  name: Single-category trend view
  content: Selecting exactly one known category returns every trend in that category in descending growth
    then keyword order; multiple or unknown categories are rejected. Unknown growth is placed last. Ties
    use case-insensitive keyword order, then trend ID. Return full trend records.
