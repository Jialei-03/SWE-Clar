- ru_id: RU-004
  name: Watch list and discovery
  content: Users may idempotently add or remove known trends from a watch list, and discovery returns
    supplied case-insensitive long-tail suggestions for a seed keyword without duplicates. Preserve insertion
    order for watches and first-occurrence spelling/order for suggestions. Trim and casefold the seed
    and deduplication keys; unknown seeds return an empty list. Keep different users isolated and reject
    empty user IDs or unknown trend IDs.
  requirement_category: refinement
