- ru_id: RU-005
  name: Monthly unique keyword generation
  content: Once per category and month, accept at most 25 supplied candidate keywords, normalize and skip
    duplicates already in that category, and return the IDs that were added. Allocate new IDs without
    overwriting any existing trend record. Trim candidate strings and compare case-insensitively within
    the selected category; skip blank/non-string candidates. Process in supplied order. Even an empty
    successful generation records that month. New records have empty history, null growth and insufficient_baseline
    classification. Distinct categories and months have independent quotas.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
