- ru_id: RU-005
  name: Non-refundable ledger and idempotency
  content: Every grant and debit creates an immutable ledger entry keyed by its external ID; replaying
    an identical event is idempotent, conflicting reuse of an ID is rejected, a job cannot be unlocked
    twice under a new ID, and completed debits are not refunded by later failures. This applies to failed
    later unlock attempts in this local component; broader disputes, refunds and chargebacks are outside
    scope.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for non-refundable ledger and idempotency.
  test_interface:
    type: function
    entry:
      language: python
      file: solution.py
      function: process_marketplace_action
      signature: 'process_marketplace_action(state: dict, action: dict) -> dict'
    inputs:
      arguments:
      - state
      - action
      action_variants:
        create_user:
          fields:
          - categories
          - role
          - type
          - user_id
        subscribe:
          fields:
          - credit_grant
          - payment_id
          - period
          - type
          - user_id
        unlock_job:
          fields:
          - event_id
          - job_id
          - type
          - user_id
      protocol_fields:
      - categories
      - credit_grant
      - event_id
      - job_id
      - jobs
      - ledger
      - payment_id
      - period
      - processed_ids
      - role
      - type
      - user_id
      - users
    output:
      type: dict
      meaning: A deterministic JSON-compatible result; input objects are not mutated.
      asserted_field_paths:
      - error
      - error.code
      - jobs
      - jobs.<id>
      - jobs.<id>.credit_cost
      - ledger
      - result
      - result.replayed
      - users
      - users.<id>
      - users.<id>.credits
      required_tokens:
        error.code:
        - event_conflict
        - job_already_unlocked
        result.replayed:
        - true
      field_schemas:
        error.code:
          type: string
        ledger:
          type: array
          items:
            type: object
        result.replayed:
          type: boolean
        users.<id>.credits:
          type: integer
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-005-T01
    file: evaluation/tests/test_solution.py
  notes: Credits, user roles, category limits and subscription periods are source-grounded. Exact IDs,
    retries/conflicts and completed-debit behavior are local component conventions. Non-refund here does
    not decide all commercial dispute, cancellation or chargeback workflows.
