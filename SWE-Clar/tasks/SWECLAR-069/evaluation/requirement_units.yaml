selected_scope: Transactional SQLite credits ledger and lead entitlement CLI
requirement_units:
- ru_id: RU-001
  name: Marketplace action entry point
  content: Process one marketplace action into a new state without mutating the supplied state or action.
    Retain the supplied transactional SQLite/CLI adapter; grants, debits and entitlement state must survive
    fresh processes, with concurrent actions serialized atomically. Extra result metadata is allowed.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for marketplace action entry point.
  test_interface:
    type: function
    entry:
      language: python
      file: solution.py
      function: process_marketplace_action
      signature: 'process_marketplace_action(state: dict, action: dict) -> dict'
    inputs:
      arguments:
      - state
      - action
      action_variants:
        create_user:
          fields:
          - categories
          - role
          - type
          - user_id
      protocol_fields:
      - categories
      - role
      - type
      - user_id
      - users
    output:
      type: dict
      meaning: A deterministic JSON-compatible result; input objects are not mutated.
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/test_solution.py
  notes: Credits, user roles, category limits and subscription periods are source-grounded. Exact IDs,
    retries/conflicts and completed-debit behavior are local component conventions. Non-refund here does
    not decide all commercial dispute, cancellation or chargeback workflows.
