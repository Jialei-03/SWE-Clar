- ru_id: RU-004
  name: Cart operations
  content: Cart add/remove actions take a known product_id and positive safe integer quantity. Merge repeated
    additions, subtract removals without going below zero and remove zero-quantity lines. Prices come
    only from server products.price_cents, ignoring caller price fields. Return lines (product_id,quantity,price_cents,line_total_cents)
    and total_cents, with no unsafe integer overflow. Flutter renders the returned line quantities and
    totals after actual cart requests and preserves the current cart if an update fails.
  requirement_category: refinement
