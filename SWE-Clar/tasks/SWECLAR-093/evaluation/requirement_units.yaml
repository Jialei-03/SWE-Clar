selected_scope: Actual Flutter inbox/cart widgets with authenticated HTTP/WebSocket backend
requirement_units:
- ru_id: RU-001
  name: Mobile workflow entry point
  content: Complete the supplied Flutter UI and Node backend. HttpShopApi must use real GET /catalog,/inbox,/cart,
    POST /actions and authenticated WebSocket /events. The initial screen loads catalog, existing inbox
    and cart. Authenticate Bearer tokens through the provided session fixture and scope user operations
    to that identity. Configured initial records and caller objects are not mutated by the UI controller.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for mobile workflow entry point.
  test_interface:
    type: function
    entry:
      language: dart
      file: lib/controller.dart
      function: ShopController
      signature: ShopController(ShopApi api)
    inputs:
      api: HttpShopApi(base,token)
      actions: load/channel/change and realtime stream events
    output:
      type: dict
      meaning: Actual HTTP/WebSocket effects and rendered Flutter inbox/cart state.
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/flutter_contract.py
  notes: The source explicitly requests realtime mobile delivery without refresh and Flutter cart repair.
    Flutter widgets and actual WebSockets preserve that task type. The Node service, JSON contract, cents
    representation and synthetic fixtures are reconstruction choices; no original Laravel/Vue code, credentials
    or client identifiers are included.
- ru_id: RU-002
  name: Realtime subscriptions
  content: subscribe and unsubscribe accept a nonempty channel string for the authenticated known user.
    Subscription replay is idempotent; removing one subscription preserves other channels and other users.
    Deliver only to users subscribed at publication time. The Flutter subscribe/unsubscribe controls call
    the backend.
  requirement_category: core
  source_visibility: visible
