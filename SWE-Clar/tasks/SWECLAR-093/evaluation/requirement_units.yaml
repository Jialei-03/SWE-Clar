- ru_id: RU-003
  name: Push without refresh
  content: A manager publish action with a unique nonempty notification ID, channel and title immediately
    appends one record to each subscribed inbox and sends it over every active authenticated WebSocket
    for that user. The Flutter inbox displays incoming records and unread count without manual refresh
    or polling. Exact replay is idempotent; conflicting ID reuse is rejected. Duplicate stream records
    do not duplicate the Flutter inbox. Nonmanagers may not publish.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
