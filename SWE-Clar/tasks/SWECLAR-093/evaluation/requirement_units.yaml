- ru_id: RU-005
  name: Safe failures
  content: Reject invalid authentication, unknown products, empty channels, invalid quantities (including
    bool,fraction,zero,negative or unsafe integer) and unsupported actions with structured errors and
    no partial cart/subscription changes. Unknown users cannot connect to /events or use HTTP APIs. Invalid
    Flutter actions show an error without changing prior successful cart data; channel/user isolation
    must remain intact.
