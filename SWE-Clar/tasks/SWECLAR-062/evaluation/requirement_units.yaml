- ru_id: RU-005
  name: Three-level categories and admin routes
  content: add_category accepts a unique nonempty category_id and optional parent_id. Roots have depth1;
    parents must exist and ancestry must be acyclic. At most three levels are permitted, computing actual
    ancestry rather than trusting a supplied depth. Reject duplicate IDs, invalid parents/cycles and a
    fourth level without mutation. admin_tabs accepts a trusted upstream role value; only role=admin receives
    Moderator and Agents tabs, each with name and a route under /admin/. Others reject. Tab order and
    additional metadata are free. This CLI module does not provide network authentication or a full admin
    web UI.
