- ru_id: RU-003
  name: Monthly invitation and order
  content: invite_monthly requires known client/tasker, unique nonempty invitation_id, positive finite
    monthly_amount and positive integer months (not boolean). Keep the fixed agreed amount; recurring
    quote discount is not applied. Accept only for the invited client, with nonnegative integer first_due
    and nonempty order_id. An invitation can create at most one order; an order ID cannot overwrite another
    order; at most one active order exists per client/tasker pair. Accepted order has status=active, the
    invited IDs, monthly_amount, months and first_due. A repeat acceptance may reject or return the existing
    same order without creating another. Other invitations may exist for an active pair but cannot be
    accepted into another active order.
  requirement_category: refinement
