- ru_id: RU-004
  name: Monthly invoice and payment lifecycle
  content: Each issue_invoice for a known active order creates one due invoice, in sequence from1 through
    agreed months. The one-based sequence n is due at first_due+(n-1)*30*86400; now must be a nonnegative
    integer. Catch-up still issues only one next invoice per action; cannot skip sequences or exceed duration.
    Invoice ID is order_id+':'+sequence; fields include order_id, sequence, amount equal to the fixed
    monthly amount, status=due. Payment ingestion requires known due invoice and nonempty event_id; sets
    status=paid and records the event ID once in payments. Replaying the same event for the same invoice
    is successful with no duplicated business effects; reusing it for another invoice or sending a new
    event for an already paid invoice rejects. Maintain enough internal association to detect conflicts;
    its format is free. These are synthetic internal invoice/payment records, not external charges or
    settlement.
  requirement_category: refinement
