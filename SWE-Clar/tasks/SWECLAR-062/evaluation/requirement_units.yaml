- ru_id: RU-001
  name: Web workflow entry point
  content: 'Implement process_tasker_action(state,action) as a new JSON-compatible state without mutating
    either input. Preserve supplied SQLite CLI: init creates one state, show reads it, act runs one action
    transactionally. Business rejection returns a nonempty error.code and preserves business collections;
    CLI rejection does not persist error/result metadata over stored state. Unknown/malformed actions
    reject and the CLI remains usable. Successful state survives separate CLI invocations. Numeric amounts/rates
    are finite and exclude booleans. Required fields are tested semantically; extra metadata and alternative
    error strings are allowed.'
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for web workflow entry point.
  test_interface:
    type: function
    entry:
      language: python
      file: solution.py
      function: process_tasker_action
      signature: process_tasker_action(state,action) -> dict
    inputs:
      state: Synthetic records described in README
      action: One public operation object
    output:
      type: dict
      meaning: New state with result or error; persisted by SQLite CLI on success
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/test_solution.py
  notes: Bounded backend module with real local SQLite CLI; synthetic payment input does not prove external
    settlement.
- ru_id: RU-002
  name: Recurring-client discount
  content: A quote requires known client/tasker and a nonnegative numeric amount. Apply taskers[tasker_id].recurring_discount,
    a decimal rate in [0,1], only when clients[client_id].completed_orders[tasker_id]>=1. Missing history
    means zero; another tasker's history does not qualify. Return amount=original*(1-rate), discount_rate
    (zero if ineligible), recurring eligibility boolean and subscription=false. Do not treat an active
    monthly agreement or action flags as completed-order history. This recurring discount is distinct
    from subscribe-and-save.
  requirement_category: core
