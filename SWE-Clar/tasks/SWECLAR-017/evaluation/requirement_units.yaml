- ru_id: RU-003
  name: Live deterministic listing labels
  content: 'Compute labels on every catalog/detail or mutation listing response from persisted values
    and the current provided clock. Sold listings have no labels. For active listings, return `great_value`
    when reference_price_cents is non-null and `price_cents * 100 <= reference_price_cents * 90`; return
    `recently_listed` when `0 <= now - created_at <= 604800`; return `just_reduced` when previous_price_cents
    is non-null and greater than current price. Fixed order: great_value, recently_listed, just_reduced;
    no duplicates. Null optional prices do not trigger their label, and future creation times do not count
    as recent. Use exact integer arithmetic at the threshold. Clock movement or price changes affect the
    next response without server restart; do not use caller labels/age or a stale cached result. Actual
    catalog and selected-listing UI show the returned codes through the declared data-label elements;
    repeated refresh removes obsolete labels.'
