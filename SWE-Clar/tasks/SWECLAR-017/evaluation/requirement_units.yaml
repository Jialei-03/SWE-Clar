requirement_units:
- ru_id: RU-001
  name: Existing authenticated persistent catalog
  content: 'Preserve working login/logout, synthetic fixture initialization, current-clock catalog/detail
    responses, listing selection and durable SQLite storage. Session identity determines the user and
    role; ignore caller actor/owner fields. Catalog/listing summaries expose public synthetic listing
    data, but offer and agreement visibility is restricted to their buyer and listing seller. Foreign
    offers return404 before mutation; wrong-role operations on visible resources return403. No passwords,
    credentials or foreign private offer/agreements appear in responses or rendered UI. Restart preserves
    domain data; a new database starts only the declared fixture. Actual browser renders selectable listings,
    prices/status and owned offers/questions. Fresh page/logout/401 clears private state. Initial project
    is runnable with this foundation.


    Public delivery and interface contract:


    Extend the supplied working Python HTTP/SQLite/browser application. Its existing foundation includes
    synthetic account login, catalog/detail rendering, buyer questions and initial buyer offers. Complete
    live listing labels, seller price edits/counteroffers and buyer counteroffer acceptance, including
    their real controls and transactional behavior.


    The prepared `python-web` Linux AMD64 profile supplies Python 3.12, SQLite, Chromium 140 and Playwright
    1.55. It supplies the synthetic account/listing fixture and read-only clock file before the coding
    budget. No remote API, original platform, package installation, account signup, dependency repair
    or wall-clock synchronization is required. Candidate code and Chromium run as UID1000 with no capabilities;
    public support files and evaluator files are protected. Resources: 2 CPUs, 2048 MiB memory, 256 PIDs,
    512 MiB workspace and 1024 MiB temporary storage; network access is loopback only.


    Working directory `/workspace`. Build `python -m compileall -q server.py store.py`. Start `python
    server.py --host 0.0.0.0 --port 8080 --db /workspace/data/marketplace.sqlite3 --fixture /public_tests/catalog.json
    --clock /public_tests/clock.json`. Open port8080. Public regression command `python /public_tests/test_public.py`.
    The application writes ordinary logs to its terminal; optional redirection goes under `/workspace`
    or `/tmp`. Stop/restart preserves durable data. Stop the process and remove `/workspace/data` before
    restarting to reset fixture data. Each benchmark attempt has a fresh workspace/database; preflight
    verifies the runtime, SQLite transactions, supplied clock/fixture readability and real browser interaction
    before candidate work. Public tests use a disposable application copy and do not reset the interactive
    development database.


    `catalog.json` contains `users:[{id,username,password,role}]` and `listings:[{id,seller_id,title,price_cents,reference_price_cents,previous_price_cents,created_at}]`.
    Fixture identities are unique nonempty strings; role is `buyer` or `seller`. Each seller_id refers
    to a seller. Listing title is a nonempty string, prices are valid positive integer cents (optional
    reference/previous values may be null), and created_at is a nonnegative integer Unix timestamp in
    seconds. The fixture is valid, synthetic and provided by the benchmark. A fresh database creates these
    accounts and active listings with revision0, no questions, no offers and no agreements. Never reset
    an initialized database on restart. Sessions may be reset by process restart.


    `clock.json` contains `{now: nonnegative_integer_seconds}`. The benchmark provides it read-only and
    may advance it between operations to exercise time-dependent behavior. Read its current value when
    constructing listing output; do not use local machine time, a caller-supplied age or a cached startup
    value. The public developer clock remains fixed unless the developer deliberately launches a separate
    local test with another valid clock file. Money is integer cents, not binary floating-point dollars.
    All amount fields are JSON integers from1 to10000000 inclusive, excluding booleans. The UI accepts
    integer cents in numeric inputs; formatting may vary without rounding the underlying amount.


    ## Public HTTP and data contracts


    JSON request bodies are UTF-8 objects with Content-Length1..16384 bytes. Invalid JSON, wrong types,
    missing required fields or out-of-range values return400 `{error:"invalid_request"}`. Invalid/missing
    Bearer session returns401 `{error:"unauthenticated"}`. An authenticated user with the wrong role for
    an otherwise accessible action gets403 `{error:"forbidden"}`. Unknown routes/methods, unknown records
    and offers belonging to unrelated users return404 `{error:"not_found"}`. A valid request conflicting
    with current business state/revision returns409 `{error:"conflict"}`. Extra request fields are ignored
    and cannot select the actor, owner, timestamps, computed labels, output records or revisions. Harmless
    additional response fields are allowed. IDs are opaque nonempty strings; no UUID/sequence spelling
    is required. Every successful mutation is durable, and failure preserves existing domain state.


    `GET /health` ->200 `{ok:true}`. `POST /api/login {username,password}` ->200 `{token,user:{id,username,role}}`.
    Use an unpredictable session token derived from at least32 random bytes and keep sessions in memory.
    `POST /api/logout {}` invalidates only the presented session. Authenticated endpoints:


    - `GET /api/catalog` ->`{user,now,listings:[listing]}`. All authenticated users see the same listings
    in fixture/insertion order. A listing summary has `{id,seller_id,title,price_cents,reference_price_cents,previous_price_cents,created_at,revision,status,labels}`.
    status is `active` or `sold`; labels is an array of strings. User objects never expose passwords or
    session tokens.

    - `GET /api/listings/{id}` ->`{listing,questions:[question],offers:[offer]}`. Questions are public
    to authenticated users and remain in append order. The listing owner sees every offer for that listing;
    a buyer sees only their own offers; unrelated sellers see no offers. Offer content never leaks through
    caller owner/actor fields or another listing.

    - `POST /api/listings/{id}/questions {text}` ->201 `{question}`. Buyers may ask questions on an active
    listing. Trim text at both ends to1..500 characters; preserve internal whitespace/case. The stored
    question is `{id,listing_id,author:{id,username},text}`. Derive the author from the session. No HTML
    execution or original personal content.

    - `POST /api/listings/{id}/offers {amount_cents}` ->201 `{offer}`. A buyer may place an initial offer
    on an active listing; amount must be positive and at most the current asking price. Offer has `{id,listing_id,buyer_id,amount_cents,counter_amount_cents,status,version}`.
    New status=`pending`, counter_amount_cents=null, version0. Multiple distinct offers are permitted;
    independent submissions are not silently deduplicated.

    - `PATCH /api/listings/{id}/price {price_cents,revision}` ->`{listing}`. Accessible to the listing
    owner. Validate cents and nonnegative integer revision (booleans excluded). Price history/version
    and conflict policies are clarified.

    - `POST /api/offers/{id}/counter {amount_cents,version}` ->`{offer}`. Accessible to the listing seller,
    with offer visibility/role rules above. Validate cents and nonnegative integer offer version. Counteroffer
    lifecycle and amount policy are clarified.

    - `POST /api/offers/{id}/accept {version}` ->`{agreement,listing,offer}`. Accessible to the offer''s
    buyer. Validate nonnegative integer version; acceptance/replay/competing-offer policy is clarified.

    - `GET /api/agreements` ->`{agreements:[agreement]}` in creation order, filtered to the current buyer
    or seller. Agreement has `{id,listing_id,offer_id,buyer_id,seller_id,amount_cents}`. It records local
    agreement only; no payment/notification/shipping side effect is claimed.


    No mutation endpoint accepts user-supplied state snapshots. SQL schema and module organization are
    unrestricted. Stored questions/offers/agreements must come from actual authenticated operations, not
    static expected arrays or output intents.


    ## Public browser interface


    Serve `/`, `/app.js`, `/style.css`. Export `MarketplaceClient` with `login(username,password)`, `logout()`,
    `refresh()`, `openListing(id)`, `ask(text)`, `offer(amountCents)`, `changePrice(priceCents)`, `counter(offerId,amountCents)`,
    `accept(offerId)`, `dispose()`. Observable fields: `catalog`, `detail`, `agreements`, `error`. Internal
    structures are unrestricted. Methods call real endpoints and render through exported `MarketplaceView(client,document)`
    with `dispose()`. The actual page boots through these classes.


    DOM IDs: `login-form`, `username`, `password`, `login`, `logout`, `workspace`, `error`, `catalog`,
    `listing-detail`, `listing-title`, `listing-price`, `listing-status`, `listing-labels`, `questions`,
    `question-text`, `ask`, `offer-amount`, `place-offer`, `new-price`, `save-price`, `offers`, `agreements`.
    Listing selection controls have `data-listing-id`. Every displayed label has `data-label` containing
    its label code. Offer rows have `data-offer-id`; within a row the counter input uses `data-counter-amount`,
    counter button `data-counter`, accept button `data-accept`. Questions display literal author username/text;
    offer rows display actual amount, counter amount when present and status; agreements display listing
    ID and amount. Required controls may be hidden/disabled where inapplicable, with understandable errors
    on rejected actions. Styling, labels, harmless extra metadata and layout choices are free. Content
    is literal text, not injected HTML. Layout fits390x844 and1280x900 without horizontal page overflow.


    UI money inputs represent integer cents; input labels make this clear. The UI sends the last-read
    listing/offer version with the relevant action, refreshes authoritative state after successful changes
    and conflicts, and preserves an understandable conflict error until a deliberate new action. Errors
    must not be displayed as success. Selection/login/logout controls remain usable while requests are
    pending; a reply initiated for a previous account or listing cannot replace current displayed data.
    Session tokens and private workspace data are not automatically restored from persistent browser storage.
    A fresh page starts logged out; logout/session invalidation clears current user data. Do not require
    a particular internal busy flag, exact prose or numeric text spelling beyond the stated amounts.


    '
