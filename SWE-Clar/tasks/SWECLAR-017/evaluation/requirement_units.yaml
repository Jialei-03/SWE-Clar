- ru_id: RU-002
  name: Buyer questions and initial offers
  content: Buyers can append trimmed nonempty questions to active listings, with immutable session-derived
    author and correct listing linkage. Keep internal whitespace, case, append order and literal rendering.
    Other users see those questions through that listing's real detail view. Buyers can submit valid initial
    offers on active listings; enforce the public money range and current asking-price cap. Each submission
    stores a distinct pending offer with no counter value and version0. Sellers cannot masquerade as buyers.
    Unknown listings, invalid input and wrong-role/conflicting state produce specified errors without
    partial state changes. Real question and initial-offer controls call the service and show stored results.
    No external payment or generated response substitutes for these operations.
