- ru_id: RU-006
  name: Buyer acceptance and atomic single sale
  content: 'Only the offer''s buyer can accept their countered offer while its listing is active, using
    the current offer version. Seller attempts return403; unrelated users404. Pending/closed offers or
    stale versions return409. On acceptance, atomically create one agreement for the stored counter amount,
    set that offer to `accepted` and increment its version once, mark the listing `sold` and increment
    listing revision once, and set all other pending/countered offers for that listing to `closed` with
    one version increment each. Questions and unrelated listings/offers remain unchanged. Accepted amount
    is the previously issued counter amount even if the asking price changed afterward. No caller amount,
    owner or agreement record can override it. Both parties can read the agreement; unrelated users cannot.


    A repeated accept by the same buyer of that already accepted offer returns the same persisted agreement/listing/offer
    without another mutation, regardless of a stale nonnegative supplied version. This success replay
    survives process restart; malformed version still400. Replays do not grant visibility to another buyer.
    Competing accepts for two countered offers on one listing cannot both succeed: exactly one agreement
    and one accepted offer are committed, the other receives409 and ends closed. A failure leaves no partial
    sold listing, agreement, offer transition or revision. New offers/questions, price edits and counters
    on sold listings conflict.


    The real buyer Accept control completes this workflow and refreshes current listing/status, owned
    offers and agreements. UI sends the last-read offer version; successful retries show one agreement.
    After a conflict it refreshes authoritative data before another attempt. A delayed response cannot
    overwrite a newer selected listing or logged-in account. Verify both durable database behavior and
    actual browser workflows; do not equate a client-only sold label or a fabricated agreement object
    with an atomic committed sale.'
  requirement_category: refinement
