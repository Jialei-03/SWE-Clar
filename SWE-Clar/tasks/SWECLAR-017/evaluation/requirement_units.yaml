- ru_id: RU-004
  name: Owned price edits and price history
  content: 'Only the listing seller may change an active listing''s asking price. First validate the amount/revision
    and authorization; require exact current revision, otherwise409 with no mutation. If the amount differs,
    atomically set previous_price_cents to the old current price, replace current price and increment
    listing revision by one. If the amount equals the current price, it is a successful no-op: preserve
    both previous_price_cents and revision, while still enforcing the revision match. Ignore caller previous/reference
    price, status, owner and timestamps. Existing questions/offers and unrelated listings are unchanged;
    counter amounts already issued are not rewritten by price edits. Recompute labels from new persisted
    values. The browser refreshes current detail/catalog after success and refreshes authoritative price/revision
    on409, displaying the conflict and allowing an intentional retry.'
