- ru_id: RU-005
  name: Seller counteroffer lifecycle and visibility
  content: Only the seller owning the offer's listing can counter it. The listing must be active and the
    offer must be pending; require exact current offer version. The counter amount may be any positive
    allowed amount no greater than the current listing price, including equal to or below the buyer's
    initial offer. Validate against current persisted asking price, not the price at offer creation. Atomically
    change only that offer to `countered`, set counter_amount_cents and increment offer version by one.
    A second counter, stale version or non-active listing returns409; wrong-role buyer returns403, unrelated
    user404. A failed request changes no amount/status/version. Ignore caller buyer/owner/status/counter
    fields; use the actual amount_cents input. The relevant buyer and seller see the countered offer with
    real amount/status; other users cannot see it. Actual seller counter controls send the last-read version
    and refresh to show the persisted result. A conflict refreshes authoritative data and remains visible
    as an error.
