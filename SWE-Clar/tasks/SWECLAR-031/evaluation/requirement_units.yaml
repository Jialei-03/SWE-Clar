- ru_id: RU-005
  name: Current-score MIDI/PDF export
  content: Export real MIDI and PDF files from the current accepted score. The MIDI must preserve note
    timing/duration while reflecting the accepted pitch change; the PDF must contain the rendered staff
    and matching readable pitch labels. Use local pinned dependencies and actual browser execution.
  requirement_category: refinement
