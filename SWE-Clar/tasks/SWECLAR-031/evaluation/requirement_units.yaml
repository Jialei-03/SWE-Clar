requirement_units:
- ru_id: RU-001
  name: Chart workflow entry point
  content: Repair the real browser practice-chart project. Parse binary local MIDI files and play a corresponding
    synthetic recording. Preserve source notes and timing for subsequent edits, rendering and exports.
    Actual decoding, media and generated files are required; chart dictionaries or capability flags alone
    are insufficient.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for chart workflow entry point.
  test_interface:
    type: function
    entry:
      language: javascript
      file: app.js
      function: loadChart
      signature: loadChart(id) -> Promise<void>
    inputs:
      id: local config chart ID
    output:
      type: object
      meaning: actual DOM/media and generated binary exports
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/notation_contract.py
  notes: Independent reconstruction using synthetic MIDI/WebM. Source supports practice playback, transposition
    and current-view export; exact component/interface choices are benchmark conventions. No original
    music, platform code or native packaging is required.
- ru_id: RU-002
  name: Responsive chart layout
  content: Keep the recording and rendered staff centered without horizontal overflow at mobile, tablet
    and desktop widths, including either side of the 600 and 1024 CSS-pixel boundaries. Render note heads
    at correct treble-staff pitch positions and show the corresponding pitch names. This is a timed staff
    preview, not full professional rhythmic engraving; exact responsive thresholds are independent conventions.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
