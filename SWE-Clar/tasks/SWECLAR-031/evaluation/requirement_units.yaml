- ru_id: RU-003
  name: Consistent notation transposition
  content: Apply a signed integer semitone transposition to immutable source notes, using the same pitch
    in the displayed staff/name, synthesized frequency and exported MIDI/PDF. Repeated changes are absolute
    offsets from source, not accumulated deltas. Reject invalid offsets or out-of-range MIDI notes before
    changing the accepted score.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
