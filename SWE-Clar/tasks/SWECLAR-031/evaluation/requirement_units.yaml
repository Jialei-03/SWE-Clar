- ru_id: RU-004
  name: Playback state
  content: Play, pause, resume and seek the actual recording; clamp finite seek positions to its real
    duration. The active note highlight follows recording time. Switching between recording and synthesized
    audio, or seeking while playing synth, must stop old oscillators and schedule the current score from
    the new recording position. Paused media must not advance, and synthesizer output must contain the
    expected notes rather than an asserted playing state.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
