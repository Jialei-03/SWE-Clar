  content: Known admins create rooms with unique nonempty string room IDs, a boolean private flag and
    a positive finite numeric turn_limit in seconds (booleans excluded). Private rooms require a nonempty
    string access_token. Return result.room_id. Invalid creation preserves existing rooms. This supplied
    behavior is a public regression requirement.
