- ru_id: RU-004
  name: Server-timed turn rotation
  content: advance selects the next joined unlocked participant in circular join order, starting with
    the first on a new room. Return result.current and deadline; set deadline=server_time+that room turn_limit.
    Preserve the cursor across released turns. When all participants are locked or none have joined, current/deadline
    are null. pass may be requested only by the current speaker and advances; timeout advances only when
    a current turn exists and server_time >= deadline. Reject premature timeout and invalid finite numeric
    server_time (including booleans) without changes. After a selected speaker is locked, subsequent advance
    skips it. Times are supplied by the deterministic local caller.
  requirement_category: refinement
  source_visibility: hidden
