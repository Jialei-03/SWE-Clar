- ru_id: RU-003
  name: Joining and pass lock
  content: Join an existing room using a nonempty user ID; private rooms require the exact room token.
    Preserve unique participants in stable join order and return result.participants. Rejoining is idempotent.
    Only joined participants may lock_pass or unlock_pass; return result.locked as a boolean for the requesting
    participant (true after lock_pass, false after unlock_pass), not the room's locked-participant list.
    Locking preserves membership and excludes the user from future speaking turns. Locking the current
    speaker releases that turn (current and deadline become null); the next advance resumes after that
    participant. Unlocking does not automatically start or replace a turn. Invalid requests leave room
    data unchanged.
  requirement_category: refinement
