requirement_units:
- ru_id: RU-001
  name: Voice workflow entry point
  content: Complete the supplied local HTTP/browser voice-room application and process_voice_event(state,event)
    without mutating either input. Preserve working room creation, GET /health, generated /demo.wav and
    browser controls. POST /events applies actions; valid actions return 200 and invalid actions 400 with
    a nonempty error.code. Unknown or malformed events must not stop the server. Received audio must be
    actual unchanged WAV bytes in playable browser audio elements, not just packet metadata. Additional
    metadata and alternative nonempty error codes are permitted.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for voice workflow entry point.
  test_interface:
    type: function
    entry:
      language: python
      file: solution.py
      function: process_voice_event
      signature: process_voice_event(state,event) -> dict
    inputs:
      state: Synthetic admins and rooms
      event: Documented room, participant, turn or actual WAV audio event
    output:
      type: dict
      meaning: New state with result or error.code, plus observed HTTP audio deliveries
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/test_solution.py
  notes: Original voice-chat scene independently reconstructed with synthetic audio and loopback services;
    no original assets, platform or customer identity.
