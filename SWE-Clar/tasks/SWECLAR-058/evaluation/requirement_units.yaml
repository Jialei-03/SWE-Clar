- ru_id: RU-005
  name: No-echo audio routing
  content: 'Accept audio only from the current unlocked speaker with finite numeric server_time strictly
    before deadline. Require a nonempty packet_id and valid base64 containing a complete nonempty WAV:
    uncompressed mono signed 16-bit PCM at 8000 Hz, at most 1 MiB. Return packet_id, unchanged audio_base64
    bytes and recipients containing every other joined participant once in join order, including listeners
    who locked pass; never the speaker or another room. Keep a per-room packet-ID record: exact replay
    by the same sender with identical bytes has empty recipients; reuse with different sender or content
    rejects. Invalid audio leaves room data and inboxes unchanged. Actual HTTP delivery queues those bytes;
    inbox retrieval drains each recipient queue exactly once. The browser renders the received audio with
    working playback controls.'
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
