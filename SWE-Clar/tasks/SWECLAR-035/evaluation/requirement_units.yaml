- ru_id: RU-004
  name: Idempotent zero-TL and paid checkout
  content: Checkout snapshots the existing cart into a pending order. For free-user TL orders an active
    coupon reduces total by amount_tl, clamped at zero; inactive/unknown coupons have no effect. Paid
    credit orders ignore coupons. Route a coupon-reduced-to-zero TL order to coupon, otherwise kind membership
    to membership, otherwise credits to credit, otherwise regular. payment_required is true only for a
    positive TL total. Checkout of an existing order ID preserves its order and returns its established
    route. Settlement marks the order settled and writes exactly one settlement ledger entry. A settled
    order cannot be applied again even under another event ID; reuse of a processed settlement event on
    another order is a no-op. Positive TL settlement creates one regular_payment record; zero-TL settlement
    creates none. Replays do not change business records.
  requirement_category: refinement
  source_visibility: hidden
