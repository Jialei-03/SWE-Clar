- ru_id: RU-005
  name: Membership rollover and insufficient-credit charge
  content: Renewal expires the old credit balance when credit_expiry is equal to or earlier than date,
    otherwise keeps it; then adds package_credits, sets membership paid and credit_expiry to new_expiry,
    and records one renewal entry. Replaying a renewal event is a business-state no-op. Credit-order settlement
    deducts the order total; if balance is insufficient, emit exactly one saved_payment_topup record for
    the shortfall and leave balance at zero. Sufficient balances create no payment record. Replays never
    charge or deduct again.
  requirement_category: refinement
