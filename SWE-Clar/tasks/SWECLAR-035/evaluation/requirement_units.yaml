- ru_id: RU-001
  name: Membership workflow entry point
  content: Provide the documented function and JSON CLI. Return deterministic JSON without mutating inputs,
    preserve unrelated state and replace transient result/error envelopes. Ignore accidental card data
    on account creation. Follow the public README schemas and rejection protocol. Missing empty containers
    may be initialized. Reject invalid commerce users, unavailable products, nonpositive quantities, missing
    carts and unknown orders without changing business state.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for membership workflow entry point.
  test_interface:
    type: function
    entry:
      language: python
      file: solution.py
      function: process_membership_action
      signature: 'process_membership_action(state: dict, action: dict) -> dict'
