- ru_id: RU-003
  name: Backend-priced role-aware cart
  content: Cart quantities are multiplied by prices read from state.products. Free users use price_tl
    and currency TL, with coupon_visible true; paid users use credits and currency credits, with coupon_visible
    false. Missing product.active means available, false means unavailable. Ignore client-provided item
    price fields. Preserve required product_id and quantity in result.items and carts[user_id].
  requirement_category: refinement
