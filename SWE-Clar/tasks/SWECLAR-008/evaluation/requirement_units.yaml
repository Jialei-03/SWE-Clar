requirement_units:
- ru_id: RU-001
  name: Actual local application, ingestion and persistence
  content: 'Maintain the independently reconstructed household-monitoring web application. Use the public
    server command, SQLite file and HTTP/JSON interfaces in the README. Real browser pages, persisted
    sensor observations and actual HTTP ingestion are required. The benchmark provides Python, SQLite
    and Chromium before work; no devices, cloud credentials, model downloads or account provisioning are
    required. Initialize synthetic fixtures only for a new database; reopening an existing database preserves
    observations and configuration. Login checks the seeded account password and returns an opaque session
    token; invalid credentials and invalid/revoked sessions return 401. Logout revokes that session. Never
    include passwords, password hashes, feed tokens or other users'' session tokens in API responses.
    Only the separately configured feed bearer token can POST an observation to /api/ingest; user sessions
    confer no feed authority. Each event has household_id, event_id, sensor_id, timestamp_ms and a boolean
    value. IDs use the public identifier alphabet; timestamps and as_of are integer Unix milliseconds
    in [0,253402300799999], excluding booleans; this is the shared SQLite/browser calendar range. Require
    a real configured sensor in the specified household. Reject malformed events atomically with 400,
    unknown feed targets with 404 and wrong feed authority with 401. An event ID is unique within its
    household: an identical replay is accepted without another stored event; reuse with different sensor/time/value
    returns 409 and preserves the earlier event. Out-of-order and future observations may be ingested;
    query time controls their visibility. Use real database transactions so concurrent identical replays
    cannot create duplicates. All these foundation and regression obligations are initially disclosed.'
