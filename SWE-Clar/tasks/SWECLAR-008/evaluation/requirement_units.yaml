- ru_id: RU-003
  name: Usable live room view and current observations
  content: Preserve actual login, logout, household selection, evaluation-time input, refresh, room view,
    rule editor, alert panel and CSV-report controls identified by the public README. After login load
    only the authorized household choices. A room view displays every configured room as a labelled SVG
    zone or visually distinct room card; show its sensors with literal ID/name, latest boolean state,
    observation timestamp and stale indicator. Return and display the latest event at or before as_of
    for each configured sensor. For equal timestamps the lexicographically greatest event ID wins. A sensor
    without a qualifying observation has null value/timestamp and stale=true. Otherwise stale means as_of
    minus latest timestamp is strictly greater than the household freshness_minutes multiplied by 60000;
    equality is fresh. Ignore future events; sort rooms and sensors by ID. Never mutate stored data while
    reading. Update the selected household at the entered evaluation time on refresh and by polling at
    an interval of at most two seconds; changes sent through the real ingestion API must appear without
    a page reload. Discard late responses for an old household, evaluation time or authenticated account.
    Show an empty state for empty data and a visible failure state for failed requests; permit retry without
    presenting failure as an empty successful result. Controls and records must be usable at 390x844 and
    1280x900, without horizontal overflow or script errors; scrolling is allowed. Render all fixture names
    and explanations as literal text. Exact styling and non-contract wording are free. Rule semantics,
    alert decisions and report contents are available through clarification.
