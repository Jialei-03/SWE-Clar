- ru_id: RU-005
  name: Duration, time-window and current-alert behavior
  content: Interpret each sensor history chronologically using only observations at or before as_of, collapsing
    timestamp ties to the lexicographically greatest event ID. Consecutive observations with the same
    boolean value belong to one state interval and do not restart its onset. The first known observation
    starts the first interval; a later opposite state ends it at that timestamp, with no inferred earlier
    history. Fridge, bathroom and exterior rules require true; no_occupancy requires false. A current
    alert requires that the sensor is presently in the required state, is fresh under the public snapshot
    rule, and its continuous interval duration is at least threshold_minutes*60000. Equality qualifies.
    Fridge/no_occupancy have no clock window; bathroom_occupied_day is eligible outside the household
    night window, and bathroom_occupied_night/exterior_open_night are eligible inside it. Window minutes
    are UTC minute-of-day with start inclusive and end exclusive; a start greater than end wraps midnight,
    and equal endpoints define an empty night window (the daytime complement is all day). Evaluate current
    window eligibility at as_of. Duration includes state time before a window opens; entering a window
    does not restart the state interval. For each rule and state interval emit at most one current alert,
    even after repeated polling or same-value events. Return household_id, room_id, kind, sensor_id, start_ms,
    trigger_ms, severity, a stable nonblank alert_id and a nonblank human-readable explanation. trigger_ms
    is the earliest instant at or after the duration threshold within that state interval when its clock
    window is eligible; a closed interval excludes its ending instant. Stable identity depends on household/room/rule/sensor/interval
    onset, not query time or repeated observations; the concrete ID encoding is free. Sort by room_id,
    kind, sensor_id and start_ms. The UI displays real alerts and literal explanations. These are synthetic
    activity rules, not a learned predictor or reconstructed customer algorithm.
