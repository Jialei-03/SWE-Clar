- ru_id: RU-006
  name: Rolling activity report and historical alert episodes
  content: GET /api/report and the downloadable CSV summarize the selected authorized household over the
    closed interval [as_of-86400000, as_of]. Include one row per configured room, sorted by room ID, with
    household_id, room_id, event_count, sleep_event_count and alert_count, plus report-level as_of and
    window_start in JSON. event_count counts stored distinct event IDs for sensors in that room whose
    timestamps fall in the closed interval; tied observations and repeated states remain separate events
    for this count. Exclude older/future events. sleep_event_count further requires timestamp minute-of-day
    within the configured household sleep window, using the same UTC inclusive-start/exclusive-end/wrapping/empty-window
    convention. alert_count counts distinct qualifying state intervals for currently enabled room rules
    whose first eligible trigger_ms is inside the closed report interval. Reconstruct intervals using
    older observations as needed; include intervals that have since ended and current intervals, but count
    an interval only once even if it spans several eligible night windows. A transition ending an interval
    at the exact threshold/eligible instant prevents that interval from triggering. Evaluate historical
    duration/window behavior from the recorded held state; later snapshot staleness does not erase an
    already qualifying historical episode, and this report does not infer physical device health. Current
    rule settings apply to the historical calculation; versioned past configuration is outside scope.
    A rule whose threshold or enabled value changes is reevaluated accordingly. Freshness suppresses current
    alerts as described separately; report episodes use their historical threshold/window crossing. CSV
    has exactly the public header and one corresponding numeric row per room, uses proper CSV escaping
    and is generated from the same authorized report data. Counts persist through restart because they
    derive from real stored observations/configuration. Show a working download action and visible error
    on failure. All windows, count definitions and report choices are independently authored; retrieved
    report explanations are not treated as client-confirmed specifications.
