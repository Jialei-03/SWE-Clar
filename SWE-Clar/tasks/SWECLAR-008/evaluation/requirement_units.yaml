- ru_id: RU-004
  name: Scoped rule editing and validation
  content: A caregiver may create or replace a rule only within an assigned household and a room in that
    household. An individual may read rules for their household but may not edit them; disallowed editing
    returns 403 without changing data. A rule is identified by household_id, room_id and kind. The supported
    kinds are fridge_open, bathroom_occupied_day, bathroom_occupied_night, no_occupancy and exterior_open_night.
    Store enabled as an actual boolean, threshold_minutes as a finite number in [0,1440], severity as
    info, warning or critical, and sensor_id naming a sensor in the same household and room. Fridge/exterior
    rules require a contact sensor; bathroom/no-occupancy rules require a presence sensor. Unknown kinds,
    incompatible/foreign sensors, invalid ranges/types or invalid severity return 400 and preserve the
    previous rule. Zero and fractional minute thresholds are valid; booleans are not numbers. A successful
    replacement persists across server restart, changes only that exact rule, and takes effect on subsequent
    evaluation. Rules from another room or household never apply implicitly. Disabled rules produce no
    current alert or historical episode count. GET rules returns stored rows sorted by kind; harmless
    extra metadata is permitted. The UI exposes saved values, saves real changes, reports server rejection,
    preserves prior saved values after rejection, and allows retry. Hide or disable save for users without
    edit authority, while enforcing the same rule on the server. These exact permission, validation and
    rule-family decisions are independent benchmark conventions.
