- ru_id: RU-002
  name: Trusted household access and isolated responses
  content: Derive the actor from a validated server-side session, never from caller-supplied user/role/household
    claims. An individual sees only their own configured household; a caregiver sees exactly their explicit
    household assignments. An unknown account or invalid session receives no household, room, sensor,
    event, rule, alert or report data. GET /api/homes returns only accessible households and their public
    display/configuration fields. Every household-scoped snapshot, rule, alert and report request checks
    access before looking up its data; unauthorized or unassigned household IDs return 403 without revealing
    its names or records. Room and sensor IDs may repeat in different households, so every lookup and
    update remains household-scoped. Public user data contain only the current actor's ID, display label
    and role. Write permissions for rule editing are separately clarifiable; ingestion uses the distinct
    feed authority. Login/logout and switching the authenticated account clear old page data and pending
    responses. No previous account's data may remain in rendered content or be restored by a late earlier
    request. The task uses only synthetic identities and records.
