- ru_id: RU-004
  name: Versioned publication and device sync
  content: Publishing a unique change ID saves a complete immutable catalogue snapshot and advances its
    integer version once; retrying the same ID returns that publication. Browser sync must fetch the actual
    snapshot and every referenced image, verify their SHA-256 bytes, and replace persisted content only
    after all succeed. Offline reload or a failed sync retains the previous working content. Ignore an
    in-flight sync when the access session changes. Versioning, checksum and localStorage are reconstructed
    protocol choices supporting content distribution, not verbatim source requirements.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
