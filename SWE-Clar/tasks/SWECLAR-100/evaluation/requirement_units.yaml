- ru_id: RU-003
  name: Logo and back navigation
  content: On a product page the logo returns to the selected category; Back restores the immediately
    preceding page. Preserve navigation history through language changes. Responsive layouts must keep
    product text and controls usable without horizontal overflow. Synthetic artwork and design are independent
    of the original client interface.
