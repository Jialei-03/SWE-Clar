requirement_units:
- ru_id: RU-001
  name: Kiosk workflow entry point
  content: Repair the supplied Python/SQLite HTTP service and browser application. Runtime identities
    and SVG asset paths come from private config, never from actor or role fields in the request. Preserve
    caller inputs and unrelated records. The page must display actual catalogue text/images using the
    documented HTTP schema; source code and runtime credentials must not be publicly served.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for kiosk workflow entry point.
  test_interface:
    type: function
    entry:
      language: python
      file: store.py
      function: Store.edit
      signature: Store.edit(actor,action) -> dict
    inputs:
      actor: trusted runtime identity
      action: catalogue edit
    output:
      type: dict
      meaning: stored catalogue record
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/kiosk_contract.py
  notes: Independent web/SQLite reconstruction with synthetic catalogue, artwork and device identities.
    Local HTTP bridge tests do not certify Android kiosk mode. Precise storage/version/checksum rules
    are benchmark conventions.
- ru_id: RU-002
  name: Bilingual ordered catalogue
  content: Only editors/admins can edit the draft catalogue. Require nonempty English and Spanish text,
    an integer order, and existing category/asset references for products. Render categories and products
    by configured order (ID breaks ties), switch language for every displayed label, and show actual decoded
    images and full wrapping text. Reject invalid edits without changing the draft.
  requirement_category: core
