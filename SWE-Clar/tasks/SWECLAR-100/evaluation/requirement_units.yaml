- ru_id: RU-005
  name: Managed settings and analytics
  content: Only an authenticated admin may request network settings for a known device, and success requires
    a matching actual HTTP bridge acknowledgement. A device cannot gain permission using actor/role fields.
    Analytics events must target a published page/category/product, use the authenticated device identity,
    deduplicate an identical event ID and reject conflicting reuse. Editors/admins can retrieve persisted
    events. The test bridge is synthetic and does not establish actual Android Wi-Fi control.
  requirement_category: refinement
  source_visibility: hidden
