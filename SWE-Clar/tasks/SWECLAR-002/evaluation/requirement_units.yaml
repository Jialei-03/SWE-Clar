- ru_id: RU-002
  name: Signed subscription transaction policy
  content: 'Accept only configured products and alpha/beta channels. A successful receipt must have exactly
    the documented payload fields and signature, validate under the public canonical HMAC protocol, and
    match transaction ID, authenticated user, requested product, channel and paid status. Never activate
    from request assertions alone. Transaction ID is the global idempotency key: an already committed
    identical user/product/channel returns its original activation record without another provider request,
    even when the provider is unavailable. Conflicting reuse by any user/product/channel returns 409.
    Concurrent identical requests commit one record; distinct transactions for the same product remain
    distinct. Provider 404 means missing receipt (400); other non-2xx responses, connection failures or
    timeout mean operational failure (502). A 200 response with malformed JSON/shape/signature/mismatched
    fields is 400. No failure commits a subscription. List only the current user''s subscriptions, sorted
    by transaction ID. This local signing/payment convention is independently designed.'
  requirement_category: refinement
