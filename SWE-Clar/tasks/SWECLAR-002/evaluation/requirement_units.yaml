- ru_id: RU-003
  name: Real browser audio interaction
  content: List only tracks belonging to at least one playlist, in configured order. Unknown/orphan tracks
    are 404, unauthenticated audio is 401; do not serve files outside configured media. Return actual
    original WAV bytes and the public range protocol. Starting a new track immediately stops and unloads
    the old track and invalidates older pending loads; the new track starts at zero. Last play request
    wins even when fetches finish out of order. Pause stops media advancement at the current position
    and invalidates pending loads. Resume continues a loaded paused track; with no loaded track it is
    a harmless no-op. Logout immediately stops/unloads audio, revokes allocated blob URLs and invalidates
    pending loads. A stale fetch failure must not appear as an error in the current session. Switching
    between this application's tabs preserves active playback; this does not assert operating-system background
    or lock-screen behavior. Play real audio through the HTML media element and show its actual position/state;
    timer-only status simulation is not sufficient.
