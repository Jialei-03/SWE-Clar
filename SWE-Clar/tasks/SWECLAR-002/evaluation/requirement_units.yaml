- ru_id: RU-004
  name: Independent goals and questionnaire reports
  content: Apply the public goal ID/title syntax, trim titles, and scope goal ID uniqueness to each user.
    Another user may create the same ID; duplicate creation for the same user is 409 without overwrite.
    Completion requires only ownership, not a questionnaire; repeated completion succeeds idempotently.
    Unknown/other-user goals are 404 without leaking existence. Goal lists are sorted by ID. A questionnaire
    must contain exactly the six configured question IDs with finite JSON numbers in the inclusive interval
    0..10; booleans, strings, null, extra/missing answers and nonfinite values are invalid (400), with
    no partial submission. Every valid submission counts independently, including identical answers. Submission
    order is the persisted monotonic commit sequence. Latest contains each question's value in the last
    submission; Overall contains the arithmetic mean per question across this user’s submissions. Return
    numbers and use two-decimal display with proportional bars. With no submissions, return count=0, latest={},
    overall={} and show a no-data message instead of invented zero-score bars. Goals and questionnaires
    have independent lifecycles. Never include other users' submissions in counts or aggregates.
  requirement_category: refinement
