- ru_id: RU-001
  name: Runnable browser practice application
  content: Complete the existing React Native Web, HTTP and SQLite application according to the public
    starter README. Preserve actual login, track browsing, goals, questionnaires, reports and subscription
    views. Use the manager-prepared dependencies, media, configuration and local receipt provider; no
    installation, customer credentials or external service is needed. Initialize configured users only
    when creating the initial user store, and retain committed records across process restart. Keep public
    response schemas, input limits, routes, statuses, media range protocol and browser selectors. Only
    index.html and app.js are public static resources; source, configuration, database and arbitrary workspace
    files must not be served. An unsupported method on a known route is 405; an unknown route is 404.
    All JSON requests are objects with exactly their documented fields and have a 65536-byte limit. Every
    rejection is atomic. This is a browser application, with no mobile lock-screen, native SDK, real store
    purchase or medical-effect claim.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: What rules govern runnable browser practice application?
