- ru_id: RU-005
  name: Session and asynchronous UI isolation
  content: Use server-issued authenticated sessions, not client-supplied user identity. Unknown credentials
    or tokens and revoked tokens fail with 401; malformed credential fields follow the public 400 rules.
    Business responses never reveal passwords, verifiers, signing keys, other sessions or local paths.
    Logout revokes only the current token; other valid tokens for the same account survive. Revocation
    survives restart. Clear current-user tracks/playback, goals, unsubmitted answers, report, receipt
    input and feedback on logout or identity change; clear the password after successful login. Old in-flight
    reads must not restore previous-user data or errors after a session switch, and old media loads must
    not resume. Bind asynchronous response application to the originating session. Failed operations must
    not mutate existing goals, submissions or subscriptions and must show an appropriate current-session
    error instead of false success. UI clearing occurs immediately when logout begins, including while
    its server response is delayed.
  requirement_category: refinement
