- ru_id: RU-004
  name: Image output and exterior preservation
  content: 'Save exactly one image at width/height of 1024x1536 or1536x2048. sample_width/sample_height
    describe lower-resolution diffusion, separately from the final output resize; do not claim native
    high-resolution generation. Composite the generated image through edit_box over the template resized
    with nearest-exact sampling: pixels outside that rectangle retain the template background and wings.
    Generated pixels inside must actually contribute. Subjective facial fidelity and seam quality are
    outside scoring. Reject unsupported output dimensions with a nonempty error code and no runnable prompt.'
  requirement_category: refinement
