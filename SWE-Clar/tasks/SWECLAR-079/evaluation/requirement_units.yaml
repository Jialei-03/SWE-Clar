- ru_id: RU-003
  name: Template and face conditioning
  content: Use the prepared Canny ControlNet preset to condition sampling from the template image. Crop
    the face source using face_crop and pass that crop through the provided Plus-Face IPAdapter and CLIP
    Vision model to the actual sampler MODEL. Both ControlNet and identity conditioning must have positive
    strength and act during sampling. These are real conditioning paths, not a subjective guarantee of
    likeness or pose accuracy. The provided preset contains Canny, not an invented depth node/fallback
    vocabulary.
  requirement_category: refinement
