disclosure_design: controlled_requirement_disclosure
selected_scope: Native ComfyUI portrait API graph construction and real offline integration; no subjective
  identity-quality score
requirement_units:
- ru_id: RU-001
  name: Native API workflow
  content: 'Return a fresh JSON-compatible object with prompt holding a native ComfyUI API graph: arbitrary
    string node IDs map to class_type and inputs. Links use native [node_id, output_index] values. Do
    not mutate configuration. The graph must validate and execute in the provided real local ComfyUI runtime;
    descriptive flags, invented nodes and fixed IDs are not substitutes.'
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the required behavior for native api workflow.
  test_interface:
    type: function
    entry:
      language: python
      file: solution.py
      function: build_portrait_workflow
      signature: 'build_portrait_workflow(config: dict) -> dict'
    inputs:
      arguments:
      - config
    output:
      type: dict
      meaning: Native ComfyUI prompt wrapper, or a structured nonempty error; extra metadata and arbitrary
        node IDs are allowed.
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/test_solution.py
  notes: Source supports a local two-image portrait workflow. API config/schema, crop/edit rectangles,
    exact output sizes, low-resolution integration and GPU-hint threshold are explicit reconstruction
    conventions. Real conditioning execution does not establish subjective identity quality.
- ru_id: RU-002
  name: Local images and prompts
  content: Use the configured local template_asset and face_asset, plus positive prompt and negative_prompt
    text. Both image branches and both text conditionings must reach sampling or its conditioning path.
    Reject absent local image assets with a nonempty error code and no runnable prompt. No network image,
    model or account dependency is allowed.
