- ru_id: RU-005
  name: Prepared local execution and decode
  content: Use only real classes from available_nodes and model names from available_models. Reject missing
    required nodes/models with a nonempty error code and no runnable prompt. Select real VAEDecodeTiled
    below the synthetic vram_gb hint of24, otherwise VAEDecode; connect the sampled latent and checkpoint
    VAE. The prepared CPU integration uses pinned pretrained models and short-step sampling. This GPU
    hint convention does not imply the container has24GiB; the real execution budget is documented separately.
  requirement_category: refinement
