    phase/date/selection/notification rules, text, code and browser adaptation are independently authored.
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/cycle_contract.py
- ru_id: RU-002
  name: Cycle dates and phase allocation
  content: Treat canonical dates as UTC calendar days and use floor division for repeating cycles. The
    timeline is the whole cycle containing asOf, even when asOf is before periodStart. cycleStart = periodStart
    + floor((asOf-periodStart)/cycleLength)*cycleLength days; currentDay is 1-based from that anchor.
    There is exactly one chronological timeline record per day and exactly one current phase. Allocate
    menstrual length=periodLength, ovulatory length=2, and let rest=cycleLength-periodLength-2; follicular
    length=floor(rest/2), luteal length=rest-follicular. Phases occur in menstrual, follicular, ovulatory,
    luteal order. Handle negative date offsets, leap days, month/year crossings, allowed minimum/maximum
    lengths and cycle-boundary days. Browser local timezone and daylight-saving changes must not alter
    these UTC results. These precise arithmetic lengths are synthetic benchmark conventions.
