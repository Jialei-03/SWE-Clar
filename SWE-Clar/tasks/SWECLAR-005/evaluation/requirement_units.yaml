- ru_id: RU-003
  name: Deterministic phase prompt rotation
  content: Select only from the current phase's pool. With n entries, select index ((seed+epochDay)%n+n)%n,
    where epochDay is the integer number of UTC days since 1970-01-01 and seed defaults to 0. Return the
    literal selected string, preserving its whitespace and treating any markup as text in the page. Omitted/null
    pools, missing phase arrays and an empty current-phase pool return null; never borrow another phase's
    message. The same input/seed returns the same result, while day or seed changes rotate through the
    available pool according to this exact index rule, including negative seeds. Multiple prompts and
    singleton pools are supported. All example prompts are independently authored and contain no original
    customer content.
