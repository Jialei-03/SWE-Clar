- ru_id: RU-001
  name: Working local calendar application
  content: Complete the supplied independent browser journal and its exported buildCyclePlan ES module.
    Preserve the README input/result shapes, strict validation, deterministic nonmutating function, runtime
    commands, actual form/timeline interfaces and local journal creation. Use the preprovided full Chromium
    notification capability, local HTTP assets and browser storage. No customer account, original file,
    native mobile SDK or external download is needed. Keep one unique ID per new journal and preserve
    other journals when creating one. Valid labels are trimmed 1..60-character text. New-journal defaults
    and the published storage contract are public. The benchmark independently defines this schedule for
    software tests; phase labels do not claim clinical accuracy.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
