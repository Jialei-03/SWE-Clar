- ru_id: RU-004
  name: Manual correction and persistent journal UI
  content: The actual browser uses the same plan function for the active journal and today's UTC date.
    A successful form submission atomically validates and stores the complete settings, recomputes all
    dates/current day/timeline/prompt, and displays saved. Invalid form input displays invalid_input without
    changing stored settings or displayed results, retaining entered values for correction. Changing the
    period start, lengths, seed or pools must not leave stale results. A reload restores the active journal
    and its saved settings; switching journals immediately renders that journal's state and never mixes
    another journal's settings/history. Absent or malformed local storage behaves as an empty journal
    list, and creating a valid journal repairs it. Display literal labels/prompts, exact per-day attributes
    and today's marker, with the README observation interfaces and narrow/wide usability. Refresh date/plan
    after UTC midnight while open. These are public regression obligations, not hidden infrastructure
    puzzles.
