- ru_id: RU-005
  name: Actual daily browser reminder delivery
  content: 'While the page is open, check at least once each second. Only the active journal can notify,
    only when remindersEnabled is true, browser notification permission is granted, and the current UTC
    time is at or after reminderTime. Select the current UTC day''s phase prompt using the same planning
    policy; if it is null, send nothing and do not mark the day delivered. Notification title/body/tag/data
    use the public README interface and must exist in the real browser notification service.


    Deliver at most once per journal per UTC date, even after closing the displayed notification, reloading,
    changing settings/period dates/time/seed/pools or switching away and back. Record a day in notifiedDays
    only after showNotification succeeds. Failed/denied permission does not consume that day''s delivery;
    a later permission grant or successful retry may deliver once. On opening the page or enabling reminders
    after today''s due time, deliver today''s one reminder immediately; never replay previous missed days.
    Disabling reminders suppresses future sends without deleting prior history or notifications. Updating
    settings before delivery affects the due time/prompt; after delivery it cannot create another notification
    that date. Two different journals have independent delivery histories. At UTC midnight the next date
    becomes eligible under its own due time. Timers and actual browser notifications are part of the task,
    rather than a synthetic returned schedule array. These exact delivery decisions are independently
    designed.'
  requirement_category: refinement
