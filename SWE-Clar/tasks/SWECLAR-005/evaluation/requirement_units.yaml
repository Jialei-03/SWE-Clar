    entry:
      command: python -m http.server 8000 --bind 127.0.0.1 --directory .
      runtime: Prepared Python and full Chromium channel chromium; no external network
    inputs:
      planner: ES module buildCyclePlan(input), complete schema in README
      browser: Local journal form, storage and controlled UTC browser clock
    output:
      planner: Current day/phase, current cycle timeline and selected recommendation
      browser: Real DOM, persistent journal changes and actual Service Worker notifications
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
