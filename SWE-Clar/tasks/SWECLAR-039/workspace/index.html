<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Framed device monitor</title>
<style>body{font:16px system-ui;color:#233746;max-width:1050px;margin:24px auto;padding:0 16px}#workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}section{min-width:0;border:1px solid #cbd5df;border-radius:8px;padding:16px}label{display:block;margin:10px 0}input,select{max-width:100%;box-sizing:border-box;padding:6px}button{margin:5px 4px 5px 0;padding:7px}#telemetry{padding-left:20px}#telemetry li{overflow-wrap:anywhere;white-space:pre-wrap;margin:12px 0}#device-list{display:flex;flex-direction:column;align-items:start}#status,#command-result{overflow-wrap:anywhere}</style>
<h1>Framed device monitor</h1><p>Discover synthetic local devices, pair, connect and inspect their telemetry.</p><p id="status" role="status"></p>
<div id="workspace"><section id="device-panel"><h2>Devices</h2><label>Service <input id="service" value="capture.v1"></label><button id="scan">Scan</button><div id="device-list"></div><label>Selected device <input id="device" readonly></label><label>Demo pairing code <input id="pair-code" type="password"></label><button id="pair">Pair</button><button id="connect">Connect</button><button id="disconnect">Disconnect</button><p id="connection">Disconnected</p></section>
<section id="telemetry-panel"><h2>Commands and telemetry</h2><label>Command ID <input id="command-id" value="demo-command"></label><label>Command <select id="command-name"><option>status</option><option>start</option><option>stop</option><option>calibrate</option></select></label><button id="send">Send command</button><p id="command-result"></p><ul id="telemetry"></ul></section></div>
<script>
const $=s=>document.querySelector(s);let selected='';
async function api(path,body){const r=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const value=await r.json();if(!r.ok)throw Error(value.error);return value;}
function render(state){$('#device-list').replaceChildren();for(const device of state.devices){const button=document.createElement('button');button.dataset.device=device.device_id;button.textContent=device.name+' ('+device.device_id+')';button.onclick=()=>{selected=device.device_id;$('#device').value=selected};$('#device-list').append(button)}$('#connection').textContent=state.connected??'Disconnected';$('#telemetry').replaceChildren();for(const p of state.telemetry){const row=document.createElement('li');row.dataset.device=p.device_id;row.dataset.packet=p.packet_id;row.textContent=p.device_id+' / '+p.packet_id+'\n'+JSON.stringify(p.data);$('#telemetry').append(row)}}
async function action(path,body){try{const result=await api(path,body);if(path==='/api/command')$('#command-result').textContent=JSON.stringify(result.result);render(await api('/api/state'));$('#status').textContent='Operation complete';}catch(error){$('#status').textContent=error.message;render(await api('/api/state'));}}
$('#scan').onclick=()=>action('/api/scan',{service:$('#service').value});$('#pair').onclick=()=>action('/api/pair',{device_id:selected,code:$('#pair-code').value});$('#connect').onclick=()=>action('/api/connect',{device_id:selected});$('#disconnect').onclick=()=>action('/api/disconnect',{});$('#send').onclick=()=>action('/api/command',{device_id:selected,command_id:$('#command-id').value,name:$('#command-name').value});api('/api/state').then(render);
</script></html>
