- ru_id: RU-005
  name: Actual phone and tablet layout
  content: At viewport widths below 768 CSS pixels, stack the device panel above the command/telemetry
    panel in one column. At 768 pixels and above, show the device panel on the left and telemetry panel
    on the right in two columns. At widths from 320 through 1024 keep controls and text readable without
    page-level horizontal overflow. Resizing preserves selected device, live connection, visible telemetry
    and stored history and must not trigger a new scan, pairing, connection or command. Judge actual rendered
    panel positions and browser state, not a reported layout-mode field.
  requirement_category: refinement
  source_visibility: hidden
