requirement_units:
- ru_id: RU-001
  name: Working device dashboard
  content: Preserve the actual HTTP/browser dashboard, prepared local-peer startup and strict framed TCP
    transport documented in README. Keep the public field/route/control contracts, render discovered names
    and telemetry safely as text, and use the selected SQLite state. The normal starter must launch and
    scan without setup work. Do not require a physical device or caller-supplied scan/telemetry results.
    Stop automatically launched peer processes with the app.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: What are the rules for working device dashboard?
  matching_keywords:
  - application
  - dashboard
  - protocol
  - interface
  test_interface:
    type: api
    entry:
      command: python server.py --port 0 --db <isolated database> --peer-port <prepared peer>
      protocol: HTTP/browser and framed TCP interfaces in starter README
    inputs: Synthetic device peer responses, pairing codes, commands and viewport sizes
    output: Observed peer exchanges, persisted state, actual telemetry and rendered layout
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  notes: Protocol, device identifiers, exact workflow and screen breakpoint are independent benchmark
    conventions; no original radio or mobile-platform compatibility claim.
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/devices_contract.py
- ru_id: RU-002
  name: Filtered discovery from peer
  content: 'On each scan send the service request to the actual prepared peer. Validate every advertisement:
    device_id follows the published ID pattern, name is a string and services is a list of strings. Deduplicate
    by ID with latest fields winning while preserving first-seen ID order, then filter using exact service
    membership of that latest record. Replace previous discoveries on success. Do not sort or merge old
    scans. Invalid response shapes or framing are peer failures and must not replace the last valid discovery
    list.'
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
