- ru_id: RU-003
  name: Peer-backed pairing and lifecycle
  content: This application has one local operator. Pair only a currently discovered target device, using
    the submitted nonempty code in a real peer pair request. Add the device to paired only after ok:true;
    the peer consumes its one-time code. Pairing an already paired, still discovered device is idempotent
    and must not resend or consume another code. Connect only a discovered, paired device, after real
    peer confirmation. Connecting the current device is idempotent; reject switching to another device
    while connected with 409 already_connected. An unpaired connection is 409 not_paired and an undiscovered
    pair/connect is 409 not_discovered. Disconnect the current peer before clearing connected; repeated
    disconnect is a no-op. Preserve paired and all command/telemetry history on disconnect or app restart.
    On app restart clear discoveries and connected, requiring a fresh scan/connect. A successful scan
    clears connected if that device no longer appears; otherwise keep it. Never store or expose submitted
    pairing codes in app state/history. Lifecycle malformed IDs/codes are 400. Peer denial is 403 without
    adding pairing/connection; a transport/protocol failure is 502 and clears connected while retaining
    pairing and histories.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: What are the rules for peer-backed pairing and lifecycle?
  matching_keywords:
