- ru_id: RU-004
  name: Real commands and telemetry history
  content: Allow only start, stop, calibrate and status commands with valid IDs, only for the currently
    connected device. Malformed command names/IDs return 400; a different or absent connection returns
    409 not_connected, without a peer request. Command IDs are global within this local database. An identical
    device/ID/name retry while connected returns its cached result without a new peer command or new telemetry;
    reusing an ID for different device/name returns 409 command_conflict. Send actual commands and require
    a matching response command_id, object result and all declared well-formed packet frames before changing
    command/telemetry history. A malformed response or packet yields 502 and clears connected, retaining
    all prior histories; do not cache the failed command. Preserve the peer result object and accepted
    packet data exactly. Discard valid packets for other devices. Deduplicate telemetry by (device_id,packet_id),
    including duplicates within a batch and across commands; first data wins. Keep first-arrival order
    and accept only packets belonging to the connected device. Valid peer denial is 403 and does not clear
    connected or change histories. Serialized concurrent identical retries produce one peer command. Histories
    and ID deduplication persist across app restarts.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
