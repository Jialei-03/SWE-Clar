- ru_id: RU-005
  name: Actual printable PDF
  content: Write a valid PDF with one cover page and each selected article beginning on a new page. Preserve
    all article body text; long articles may continue onto additional pages rather than being truncated.
    Use A4 pages, 20 mm content margins, sequential visible page numbers and a deterministic safe filename
    ending in .pdf. Include selected titles, dates, publication, bodies and any requested supplied summaries
    in the rendered document. Repeating identical input produces identical bytes.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for print-ready manifest.
