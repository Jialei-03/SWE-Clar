- ru_id: RU-003
  name: Deterministic article ordering
  content: Reject duplicate or missing article IDs and invalid article dates with invalid_archive; invalid
    input must not produce a new PDF. Extract nested visible title/body text, decode HTML entities and
    exclude script/style content. Normalize whitespace and order selected articles by date then article
    ID.
  requirement_category: refinement
  source_visibility: hidden
