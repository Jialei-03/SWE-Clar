- ru_id: RU-004
  name: Save and unsave behavior
  content: Allow save/unsave of a visible other user’s post idempotently, restrict saved state to the
    active user, and update the displayed control after success. Own posts have no save control and direct
    own-post save calls reject. The precise save behavior adapts agency-reported behavior, not a verified
    client quotation.
