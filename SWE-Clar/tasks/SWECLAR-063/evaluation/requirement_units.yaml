- ru_id: RU-005
  name: Personal and friends maps
  content: Draw one actual Leaflet point per visible post at its stored venue coordinates. Personal mode
    contains only the active user’s posts; friends mode contains only followed users’ posts, excluding
    the active user and unrelated users. Changing mode updates geometry, and resizing preserves visible
    points without horizontal overflow. The map is synthetic local geometry, not a claim to have integrated
    Google Maps tiles or Places.
  requirement_category: refinement
