- ru_id: RU-003
  name: Chronological friend feed
  content: Return only the viewer’s posts and followed users’ posts, ordered by descending stored creation
    instant then ascending post ID. Display the actual authorized images and text. An unrelated user cannot
    retrieve image bytes simply by knowing an image ID; unpublished foreign images are also private. Late
    requests from a previous access session must not replace the current feed or images.
  requirement_category: refinement
