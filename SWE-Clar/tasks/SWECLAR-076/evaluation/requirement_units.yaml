requirement_units:
- ru_id: RU-001
  name: Portal game event entry point
  content: Preserve a playable native WebGL perspective3D scene and real controls/animation for portal
    transition, moving asteroids and combat. process_portal_event(state,event) returns a new state without
    mutating either input. Every accepted event has finite numeric timestamp (not boolean) >= state.timestamp
    (default0), and stores that timestamp; smaller timestamps reject. Invalid/unknown events return nonempty
    error.code and preserve gameplay state and timestamp. Extra metadata/error wording is allowed. This
    independent browser adaptation is not original Unity/Quest/AR tracking execution.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for portal game event entry point.
  test_interface:
    type: function
    entry:
      language: python
      file: solution.py
      function: process_portal_event
      signature: process_portal_event(state,event) -> dict
    inputs:
      state: Synthetic scenario
      event: Public schema in README
    output:
      type: dict
      meaning: New state and actual3D browser effects
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/test_solution.py
- ru_id: RU-002
  name: AR/VR portal transition
  content: transition requires an existing active=true portal and target_mode equal to the other mode
    among room/cockpit. Store top-level mode and return result.mode/result.lives, preserving remaining
    lives. Unknown/inactive portal, invalid mode or same-mode transition reject atomically. Actual browser
    portal control switches the rendered3D environment between room and cockpit and back without resetting
    lives or other gameplay.
