- ru_id: RU-003
  name: Asteroid portal and wall behavior
  content: move_asteroid requires a known asteroid with finite position/velocity x,y,z and finite positive
    bounds for all axes. For each axis add velocity once; only if the new coordinate exceeds +bound/-bound
    clamp there and negate that velocity component. Equality does not bounce. Other asteroids remain unchanged.
    If through_portal=true, require finite angle and append one portal_ripple event with asteroid_id and
    angle; false/omitted does not add a ripple. Return result.position/result.velocity. Actual step and
    running simulation controls move the3D asteroid, visibly reflect at boundaries, and show a geometric
    portal ripple.
