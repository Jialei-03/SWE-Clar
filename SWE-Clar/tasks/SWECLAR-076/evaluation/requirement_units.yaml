- ru_id: RU-005
  name: Increasing enemy waves and restart
  content: 'spawn_wave accepts a positive integer wave strictly greater than current wave(default0). It
    replaces enemies with wave+1 synthetic enemies each having wave+1 hp, sets wave and returns count/health;
    deterministic positions may be chosen by implementation. These increasing count/health parameters
    are reconstruction conventions. A hit exhausting lives restarts the current level: restore initial_lives,
    shield0, asteroids from level_asteroids, and current-wave enemies to full health, while preserving
    mode/equipped/current wave. Increment restart_count and append level_restart event; result.lives is
    restored count. Browser HUD and scene must show the current wave, enemy changes, lives and restart.
    No headset, original assets or full commercial game is required.'
  requirement_category: refinement
