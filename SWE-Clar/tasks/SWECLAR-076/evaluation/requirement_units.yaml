- ru_id: RU-004
  name: Weapons, shield, and enemy combat
  content: Equip only supplied weapon IDs, at most two distinct IDs; unavailable, duplicate or third weapon
    rejects. activate_shield accepts finite nonnegative energy. hit accepts finite nonnegative damage,
    consumes shield energy first and reports absorbed,shield_energy,lives; any positive remainder consumes
    exactly one life, clamped at zero before restart policy. fire requires an equipped weapon with positive
    finite power and a known living enemy; subtract power from enemy hp clamped0 and append one shot event
    with weapon_id/enemy_id. Invalid hits/fire/equipment reject atomically. Browser controls and actual3D
    shield/enemy/shot visuals must follow these effects.
  requirement_category: refinement
