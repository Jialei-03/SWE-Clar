<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal training arena</title><style>body{margin:0;background:#101a23;color:#e6ecee;font:16px system-ui}main{max-width:980px;margin:auto;padding:12px}canvas{display:block;width:100%;aspect-ratio:16/9;background:#182a36}.bar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}button,select{font:inherit;padding:7px}h1{font-size:26px}#hud{display:flex;gap:20px;background:#22323e;padding:10px}#status{min-height:1.5em;color:#b6d9ef}</style><main><h1>Portal training arena</h1><p>Independent browser3D adaptation. Move the asteroid, enter the cockpit and defend against waves.</p><div id="hud"><span id="mode"></span><span id="lives"></span><span id="shield"></span><span id="wave"></span><span id="enemy-count"></span><span id="restart"></span></div><canvas id="scene" width="960" height="540" aria-label="Three-dimensional portal arena"></canvas><div class="bar"><button id="portal">Enter cockpit</button><button id="step">Step asteroid</button><button id="play">Run asteroid</button><button id="ripple">Portal ripple</button></div><div class="bar"><select id="weapon" aria-label="Weapon"><option>g1</option><option>g2</option><option>g3</option></select><button id="equip">Equip</button><span id="equipped"></span><button id="activate">Shield4</button><button id="hit">Enemy hit3</button><button id="spawn">Next wave</button><select id="target" aria-label="Target"></select><button id="fire">Fire</button></div><p id="status">Loading</p></main><script>
const el=id=>document.getElementById(id),canvas=el('scene'),gl=canvas.getContext('webgl',{preserveDrawingBuffer:true});if(!gl)throw Error('WebGL unavailable');let state={},running=false,queue=Promise.resolve(),rippleUntil=0,shotUntil=0,lastShot=null;
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,'attribute vec3 position;attribute vec3 color;varying vec3 c;void main(){vec3 p=position-vec3(0.0,0.0,7.0);float f=1.73;gl_Position=vec4(p.x*f/(16.0/9.0),p.y*f,-1.02*p.z-0.202,-p.z);c=color;}'));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,'precision mediump float;varying vec3 c;void main(){gl_FragColor=vec4(c,1.0);}'));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error('Shader link failed');gl.useProgram(program);gl.enable(gl.DEPTH_TEST);let vertices=[];
function tri(a,b,c,color){for(const p of [a,b,c])vertices.push(...p,...color);}
function quad(a,b,c,d,color){tri(a,b,c,color);tri(a,c,d,color);}
function cube(x,y,z,size,color){const a=size/2,v=[[x-a,y-a,z-a],[x+a,y-a,z-a],[x+a,y+a,z-a],[x-a,y+a,z-a],[x-a,y-a,z+a],[x+a,y-a,z+a],[x+a,y+a,z+a],[x-a,y+a,z+a]];[[0,1,2,3],[4,7,6,5],[0,4,5,1],[3,2,6,7],[0,3,7,4],[1,5,6,2]].forEach((f,i)=>quad(...f.map(n=>v[n]),color.map(n=>n*(.65+i*.06))));}

function draw(){vertices=[];const room=state.mode!=='cockpit';quad([-3,-2,-3],[3,-2,-3],[3,-2,3],[-3,-2,3],room?[.26,.33,.35]:[.05,.08,.16]);quad([-3,-2,-3],[-3,2,-3],[3,2,-3],[3,-2,-3],room?[.3,.4,.44]:[.025,.035,.09]);if(room){quad([-3,-2,3],[-3,2,3],[-3,2,-3],[-3,-2,-3],[.18,.29,.34]);quad([3,-2,-3],[3,2,-3],[3,2,3],[3,-2,3],[.2,.27,.36]);}else{quad([-3,-1.5,2.5],[3,-1.5,2.5],[2,-.85,2],[-2,-.85,2],[.2,.26,.3]);}
 for(const x of [-.65,.65])cube(x,0,-2.8,.12,[.1,.9,.85]);quad([-.65,-1,-2.85],[.65,-1,-2.85],[.65,1,-2.85],[-.65,1,-2.85],room?[.07,.37,.4]:[.45,.22,.7]);
 for(const asteroid of Object.values(state.asteroids||{})){const p=asteroid.position;cube(p.x,p.y,p.z,.42,[.95,.58,.2]);}
 for(const enemy of Object.values(state.enemies||{})){if(enemy.hp<=0)continue;const p=enemy.position;cube(p.x,p.y,p.z,.38,[.95,.25,.32]);cube(p.x,p.y+.35,p.z,.08,[.4,1,.4]);}
 const lines=[];if((state.shield_energy||0)>0){for(let i=0;i<16;i++){let a=i*Math.PI/8,b=(i+1)*Math.PI/8;lines.push([[Math.cos(a)*1.3,Math.sin(a)*.9,2],[Math.cos(b)*1.3,Math.sin(b)*.9,2],[.2,.8,1]]);}}
 const now=performance.now();if(now<rippleUntil){const radius=.8+(1-(rippleUntil-now)/500)*.5;for(let i=0;i<20;i++){const a=i*Math.PI/10,b=(i+1)*Math.PI/10;lines.push([[Math.cos(a)*radius,Math.sin(a)*radius,-2.7],[Math.cos(b)*radius,Math.sin(b)*radius,-2.7],[.4,1,.8]]);}}
 if(now<shotUntil&&lastShot&&state.enemies?.[lastShot]){const p=state.enemies[lastShot].position;lines.push([[0,-.7,2.5],[p.x,p.y,p.z],[1,.95,.3]]);}
 const solids=vertices.length/6;for(const [a,b,c] of lines)for(const point of [a,b])vertices.push(...point,...c);const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(vertices),gl.STATIC_DRAW);for(const [name,offset] of [['position',0],['color',12]]){const loc=gl.getAttribLocation(program,name);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,3,gl.FLOAT,false,24,offset);}gl.viewport(0,0,960,540);gl.clearColor(.04,.08,.12,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.drawArrays(gl.TRIANGLES,0,solids);gl.drawArrays(gl.LINES,solids,lines.length*2);gl.deleteBuffer(buffer);canvas.dataset.renderer='webgl';requestAnimationFrame(draw);}
function render(){el('mode').textContent=state.mode||'room';el('lives').textContent='Lives '+state.lives;el('shield').textContent='Shield '+(state.shield_energy||0);el('wave').textContent='Wave '+(state.wave||0);el('enemy-count').textContent='Enemies '+Object.values(state.enemies||{}).filter(e=>e.hp>0).length;el('restart').textContent='Restarts '+(state.restart_count||0);el('equipped').textContent=(state.equipped||[]).join(', ');el('portal').textContent=state.mode==='cockpit'?'Return to room':'Enter cockpit';const selected=el('target').value;el('target').replaceChildren();for(const [id,row] of Object.entries(state.enemies||{})){if(row.hp<=0)continue;const o=document.createElement('option');o.value=id;o.textContent=id+' HP'+row.hp;el('target').append(o);}if([...el('target').options].some(o=>o.value===selected))el('target').value=selected;}
function action(event){queue=queue.then(async()=>{const response=await fetch('/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...event,timestamp:(state.timestamp||0)+1})});const out=await response.json();if(out.mode)state=out;if(!out.error&&event.type==='move_asteroid'&&event.through_portal)rippleUntil=performance.now()+500;if(!out.error&&event.type==='fire'){lastShot=event.enemy_id;shotUntil=performance.now()+500;}el('status').textContent=out.error?'Action rejected':JSON.stringify(out.result||{});render();return out;});return queue;}
function movement(portal=false){return {type:'move_asteroid',asteroid_id:'a',bounds:{x:3,y:2,z:3},through_portal:portal,angle:30};}
el('portal').onclick=()=>action({type:'transition',portal_id:'p',target_mode:state.mode==='cockpit'?'room':'cockpit'});el('step').onclick=()=>action(movement());el('ripple').onclick=()=>action(movement(true));el('play').onclick=()=>{running=!running;el('play').textContent=running?'Pause asteroid':'Run asteroid';};setInterval(()=>{if(running)action(movement());},180);
el('equip').onclick=()=>action({type:'equip',weapon_id:el('weapon').value});el('activate').onclick=()=>action({type:'activate_shield',energy:4});el('hit').onclick=()=>action({type:'hit',damage:3});el('spawn').onclick=()=>action({type:'spawn_wave',wave:(state.wave||0)+1});el('fire').onclick=()=>action({type:'fire',weapon_id:el('weapon').value,enemy_id:el('target').value});
(async()=>{state=await(await fetch('/state')).json();render();el('status').textContent='Ready';document.body.dataset.ready='true';draw();})();
</script></html>
