schema_version: 1
task_id: SWECLAR-074
registry_version: swe-clar
registry_status: annotation_complete
disclosure_design: controlled_requirement_disclosure
selected_scope: Actual local Cesium console, first offline login, panel/map geometry, local search and
  supplied track rewind
requirement_units:
- ru_id: RU-001
  name: Offline map console
  content: Repair the supplied Python/SQLite/Cesium web component. It must start and complete the first
    local login without Internet access, using only loopback HTTP and local public Cesium assets. Preserve
    source fixture values, protect private user configuration and require a session for location/track
    APIs. Display a real Cesium scene; state flags do not establish map rendering.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for offline map console.
  test_interface:
    type: function
    entry:
      language: python
      file: store.py
      function: Store.rewind
      signature: Store.rewind(track_id,instant) -> dict
    inputs:
      track_id: synthetic track identifier
      instant: timezone-aware timestamp
    output:
      type: dict
      meaning: selected historical sample
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-001-T01
    file: evaluation/tests/test_solution.py
  notes: Offline login, Cesium map, menu compensation, search and timeline have source support. Credential/schema/grid
    details and synthetic local geometry are independently reconstructed; no customer imagery or device-control
    functions are included.
- ru_id: RU-002
  name: Local authentication
  content: Verify the supplied local salted scrypt credential record, issue a fresh HttpOnly session cookie,
    store only a token hash in SQLite and restore valid sessions after process/browser reload. Wrong passwords
    and unknown users do not open the console; sign-out revokes the server session. Never expose password
    hashes/salts through public APIs or static file traversal.
  requirement_category: core
  source_visibility: visible
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for local authentication.
  test_interface:
    type: function
    entry:
      language: python
      file: store.py
