    inputs:
      track_id: synthetic track identifier
      instant: timezone-aware timestamp
    output:
      type: dict
      meaning: selected historical sample
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
