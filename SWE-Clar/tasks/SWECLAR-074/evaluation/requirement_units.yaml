- ru_id: RU-005
  name: Track timeline
  content: Select a known track and show its name/description. For a timezone-aware requested instant,
    find the latest supplied sample at or before it and render that sample’s point; sort logically by
    time without changing the fixture. Unknown tracks or times before the first sample return not_found
    and clear a misleading previous sample. Metadata and coordinates must agree with the selected sample.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for track timeline.
