- ru_id: RU-003
  name: Sliding panels and map compensation
  content: Opening either location or track-history panel allocates its actual width beside the map so
    the selected geographic point remains centered in the visible map area. Closing it restores that space.
    The other panel state is independent. Resize the actual Cesium canvas and preserve the selected world
    coordinate; do not add arbitrary offsets to longitude/state fields. Verify at desktop widths 960 through
    1440 pixels.
  requirement_category: refinement
  source_visibility: hidden
  benchmark_visibility: hidden
  benchmark_visibility_reason: No requirement or delivery-interface intake injection; existing source
    remains inspectable. Client supplies relevant agreements through clarification.
  audit_question: Explain the exact required behavior for sliding panels and map compensation.
  test_interface:
    type: function
    entry:
      language: python
      file: store.py
      function: Store.rewind
      signature: Store.rewind(track_id,instant) -> dict
    inputs:
      track_id: synthetic track identifier
      instant: timezone-aware timestamp
    output:
      type: dict
      meaning: selected historical sample
    operations: []
  evaluation: executable
  pass_rule: all_tests_pass
  matching_keywords: []
  tests:
  - test_id: RU-003-T01
    file: evaluation/tests/test_solution.py
  notes: Source asks to keep the geographic focus visible while panels open; the original also says map
    size stays unchanged. Allocated-width canvas resizing is an explicit benchmark adaptation, not a verbatim
    client requirement.
- ru_id: RU-004
  name: Offline location search
  content: Search independent local locations by case-insensitive name and draw/center the selected result
    at its geographic coordinates. Neither search nor viewer setup may query an external location, tile
    or account service. The synthetic ellipsoid/point display is a reconstruction boundary, not a recreation
    of client map imagery.
  requirement_category: refinement
  source_visibility: visible
