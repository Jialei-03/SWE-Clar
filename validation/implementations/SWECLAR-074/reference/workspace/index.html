<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Local map console</title><link rel="stylesheet" href="/cesium/Widgets/widgets.css"><link rel="stylesheet" href="/style.css"><main><section id="login-panel"><h1>Local map console</h1><p>Sign in to this device.</p><form id="login"><label>Username <input id="username" required autocomplete="username"></label><label>Password <input id="password" type="password" required autocomplete="current-password"></label><button type="submit">Sign in</button></form><p id="login-error" role="alert"></p></section><section id="console" hidden><header><h1>Map console</h1><p id="user"></p><button id="logout" type="button">Sign out</button></header><nav><button id="main-toggle" type="button" aria-expanded="false" aria-controls="main-panel">Locations panel</button><button id="camera-toggle" type="button" aria-expanded="false" aria-controls="camera-panel">Track panel</button></nav><div id="workspace"><aside id="main-panel" hidden><h2>Locations</h2><form id="search"><label>Search local locations <input id="query" type="search"></label><button type="submit">Search</button></form><div id="results"></div></aside><div id="map" aria-label="Offline three-dimensional map"></div><aside id="camera-panel" hidden><h2>Track history</h2><form id="rewind"><label>Track <select id="track"></select></label><label>UTC time <input id="at" type="datetime-local" step="1" required></label><button type="submit">Rewind</button></form><p id="track-info"></p><p id="metadata"></p></aside></div><p id="status" role="status"></p></section></main><script>window.CESIUM_BASE_URL='/cesium/';</script><script src="/cesium/Cesium.js"></script><script src="/app.js"></script></html>
