<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Capture desk</title><link rel="stylesheet" href="/style.css"></head><body>
<header id="controls"><strong>Capture desk</strong><button id="scan">Refresh sources</button><select id="device" aria-label="Video source"></select><select id="resolution" aria-label="Output resolution"><option>640x480</option><option>1280x720</option><option>1920x1080</option></select><select id="display-input" aria-label="Display input"><option value="preview">Camera preview</option><option value="auxiliary">Auxiliary input</option></select><div id="controller" aria-label="Virtual controller"><button data-button="0">Select</button><button data-button="1">Back</button><button data-button="4">Zoom +</button><button data-button="5">Zoom −</button></div></header>
<main id="monitor"><canvas id="video" aria-label="Live video"></canvas><p id="status" role="status">Connecting…</p></main><script src="/viewer.js" type="module"></script></body></html>
