<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Area calculator</title>
    <link rel="stylesheet" href="/style.css">
  </head>
  <body>
    <main>
      <p class="eyebrow">Sample planning tool</p>
      <h1>Area calculator</h1>
      <form id="calculator">
        <label>
          Land area in square feet
          <input name="land_area_sqft" type="number" min="0" step="any" required>
        </label>
        <label>
          Site area in square feet
          <input name="site_area_sqft" type="number" min="0" step="any" required>
        </label>
        <label>
          Plot ratio
          <input name="plot_ratio" type="number" min="0" step="any" required>
        </label>
        <div class="actions">
          <button type="submit">Calculate</button>
          <button type="button" id="reset">Reset</button>
        </div>
      </form>
      <p id="error" role="alert" aria-live="polite"></p>
      <section id="results" hidden>
        <h2>Calculation summary</h2>
        <dl id="summary"></dl>
        <button type="button" id="download" disabled>Download PDF</button>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
