<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Content reports</title><link rel="stylesheet" href="/style.css"><main><header><h1>Content reports</h1></header><p id="error" role="alert"></p><section id="auth"><h2>Account</h2><label>Email<input id="email" type="email"></label><label>Password<input id="password" type="password"></label><button id="signin">Sign in</button><button id="register">Create account</button></section><section id="workspace" hidden><div class="bar"><p id="plan"></p><button id="logout">Sign out</button></div><section><h2>Access</h2><p id="entitlement-note" class="hint"></p><button id="trial">Start trial</button><label>Local payment receipt<input id="payment"></label><button id="activate">Activate plan</button></section><div class="columns"><section><h2>Rooms and content</h2><form id="create-room"><label>Room name<input id="room-name" required></label><button>Create room</button></form><form id="create-content"><label>Room<select id="room-options"></select></label><label>Title<input id="title" required></label><label>Details<textarea id="details" required></textarea></label><button>Create content</button></form><nav id="items" aria-label="Content records"></nav></section><section id="report" hidden><h2 id="report-title"></h2><p id="report-details"></p><p id="complete-status"></p><div id="images"></div><form id="upload"><label>Kind<select id="kind"><option value="image">Image</option><option value="receipt">Receipt</option></select></label><label>Image file<input id="file" type="file" accept="image/*" required></label><button>Upload image</button></form><form id="edit"><label>Report title<input id="edit-title" required></label><label>Report details<textarea id="edit-details" required></textarea></label><button>Save report</button></form><button id="complete">Mark complete</button><div class="bar"><button id="export">Download printable PDF</button><button id="share">Create share copy</button></div><pre id="share-copy"></pre></section></div></section></main><script src="/app.js"></script></html>
