<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cycle Calendar</title><link rel="stylesheet" href="/style.css"></head>
<body><header><h1>Cycle Calendar</h1><p>A local journal with a daily timeline and reminders.</p><small>Independent demonstration schedule · Synthetic examples</small></header>
<main><section class="journals"><h2>Your local journals</h2><form id="create-form" novalidate><label>Journal label <input id="label" maxlength="60" required></label><button>Create journal</button></form><label>Active journal <select id="profile-select"></select></label></section>
<p id="feedback" role="status" aria-live="polite"></p><div id="workspace" hidden><section class="summary"><div><small>UTC date <span id="today"></span></small><h2 id="journal-title"></h2><p><strong id="current-phase"></strong> · Day <span id="current-day"></span></p></div><button id="enable-notifications">Enable browser notifications</button><p id="permission"></p></section>
<div class="columns"><section><h2>Update the calendar</h2><form id="settings-form" novalidate><label>Period start <input id="period-start" type="date" required></label><div class="row"><label>Cycle days <input id="cycle-length" type="number" required></label><label>Period days <input id="period-length" type="number" required></label></div><label>Prompt seed <input id="seed" type="number" required></label><label>Daily reminder (UTC) <input id="reminder-time" type="time" required></label><label class="check"><input id="reminders-enabled" type="checkbox"> Reminders enabled</label><label>Phase prompt pools (JSON) <textarea id="prompt-pools" spellcheck="false" required></textarea></label><button>Save calendar</button></form></section>
<section><h2>Daily prompt</h2><p id="recommendation"></p><h2>Current cycle</h2><p>Beginning <span id="cycle-start"></span></p><div id="timeline" aria-label="Cycle timeline"></div><h2>Reminder history</h2><ul id="reminder-history"></ul></section></div></div></main><script type="module" src="/src/app.js"></script></body></html>
