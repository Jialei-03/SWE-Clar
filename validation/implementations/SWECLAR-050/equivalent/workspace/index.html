<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arena workshop</title><link rel="stylesheet" href="/style.css"></head><body>
<header><strong>Arena workshop</strong><button id="start">Start battle</button><button id="pause">Pause / play</button><button id="step">Step</button><button id="reset">Reset battle</button><button id="camera-side">Other side</button><label><input id="names" type="checkbox" checked>Names</label><span id="status" role="status">Loading</span></header>
<main><aside><h2>Unit templates</h2><select id="catalog" aria-label="Template to edit"></select><form id="template-form">
<label>ID<input id="template-id" required></label><label>Name<input id="template-name" required></label><label>Kind<select id="template-kind"><option value="melee">Melee</option><option value="ranged">Ranged</option></select></label>
<div id="stat-fields"></div><button type="submit">Save template</button><button id="delete-template" type="button">Delete template</button></form>
<h2>Placement</h2><label>Template<select id="placement-template"></select></label><label>Team<select id="team"><option>A</option><option>B</option></select></label><label>Unit ID<input id="placement-id" value="UNIT-1"></label><p>Click the arena to place or move this ID. Right-drag to orbit; scroll to zoom.</p><button id="clear">Clear arena</button><label>Tick limit<input id="limit" type="number" value="300" min="1" max="1000"></label><button id="save-limit">Set limit</button><div id="placements"></div></aside>
<section id="game"><div id="viewport"><canvas id="arena" aria-label="3D battle arena"></canvas><div id="labels"></div></div><section id="results" hidden><h2 id="outcome"></h2><div id="team-results"></div></section></section></main><script type="module" src="/app.js"></script></body></html>
