<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Property workspace</title><link rel="stylesheet" href="/style.css"></head><body><header><h1>Property workspace</h1><label>Workspace <select id="actor"></select></label></header><p id="message" role="status"></p><main><aside><h2>Draft listings</h2><button id="new">New draft</button><div id="listings"></div><label>Simulation time <input id="now" type="number" value="0" min="0"></label><button id="sync">Sync offers</button></aside><section><h2 id="title">Select a listing</h2><form id="draft-form"><label>Label <input name="label" required></label><label>Type <select name="property_type"><option>house</option><option>apartment</option></select></label><label>Bedrooms <input name="bedrooms" type="number" value="3" required></label><label>Bathrooms <input name="bathrooms" type="number" value="2" required></label><label>Floor area <input name="floor_area" type="number" value="100" required></label><label>Asking price <input name="asking_price" type="number" value="200000" required></label><label>Features, one per line <textarea name="features"></textarea></label><button>Save draft</button></form><h2>Listing analysis</h2><label>Comparable records (JSON)<textarea id="comparables">[]</textarea></label><label>Variants <select id="count"><option>2</option><option>3</option></select></label><label>Tone <select id="tone"><option>warm</option><option>concise</option></select></label><button id="analyze">Analyze listing</button><div id="analysis"></div><h2>Offers</h2><div id="offers"></div><h2>Notifications</h2><div id="notifications"></div></section></main><script src="/app.js"></script></body></html>
