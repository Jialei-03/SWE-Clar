<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Practice chart</title><link rel="stylesheet" href="style.css"><main><header><h1 id="title">Practice chart</h1><label>Chart<select id="chart"></select></label></header><p id="error" role="alert"></p><section class="stage"><video id="recording" playsinline preload="metadata"></video><svg id="score" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" role="img" aria-label="Rendered music staff"></svg></section><p id="pitch-list"></p><section class="controls"><button id="play">Play</button><button id="pause">Pause</button><label>Playback mode<select id="mode"><option value="recording">Recording</option><option value="synth">Synthesizer</option></select></label><label>Position<input id="seek" type="number" value="0" min="0" step="0.1"></label><output id="position">0.00</output><label>Transpose semitones<input id="transpose" type="number" value="0"></label><button id="midi-export">Download MIDI</button><button id="pdf-export">Download PDF</button></section></main><script src="app.js"></script></html>
