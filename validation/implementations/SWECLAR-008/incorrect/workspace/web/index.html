<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Household activity</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div><small>LOCAL DEMONSTRATION</small><h1>Household activity</h1></div><div id="identity"></div><button id="logout" hidden>Sign out</button></header>
<main><section id="login-panel"><h2>Sign in</h2><form id="login-form"><label>Account<input id="account" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form><p id="login-status" role="status"></p></section>
<div id="application" hidden><section class="toolbar"><label>Household<select id="household"></select></label><label>Evaluation time (UTC)<input id="as-of" type="text" aria-label="Evaluation time UTC"></label><button id="refresh">Refresh</button><button id="download">Download report</button></section><p id="status" role="status"></p><p id="download-status" role="status"></p>
<section><h2>Rooms</h2><div id="rooms" class="rooms"></div></section>
<div class="columns"><section><h2>Activity alerts</h2><div id="alerts"></div></section><section><h2>Room rules</h2><label>Room<select id="rule-room"></select></label><div id="saved-rules"></div><form id="rule-form" novalidate><label>Rule<select id="rule-kind"><option>fridge_open</option><option>bathroom_occupied_day</option><option>bathroom_occupied_night</option><option>no_occupancy</option><option>exterior_open_night</option></select></label><label>Sensor<select id="rule-sensor"></select></label><label>Threshold (minutes)<input id="rule-threshold" type="number" step="any" value="10"></label><label>Severity<select id="rule-severity"><option>info</option><option selected>warning</option><option>critical</option></select></label><label class="check"><input id="rule-enabled" type="checkbox" checked>Enabled</label><button id="save-rule" type="submit">Save rule</button></form><p id="rule-status" role="status"></p></section></div></div></main><script type="module" src="/ui.js"></script></body></html>
