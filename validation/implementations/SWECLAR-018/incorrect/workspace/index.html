<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Optical target replay</title>
<style>body{font:16px system-ui;max-width:960px;margin:40px auto;padding:0 20px;color:#182833}section{margin:24px 0;padding:20px;border:1px solid #ccd6de;border-radius:8px}label{display:block;margin:12px 0}button,a{margin-right:12px}canvas{image-rendering:pixelated;max-width:100%;border:1px solid #999}td,th{text-align:left;padding:8px}table{border-collapse:collapse}tr{border-bottom:1px solid #ddd}#message{white-space:pre-wrap}</style>
<h1>Optical target replay</h1><p>Inspect synthetic grayscale frames and analyze a local capture sequence.</p>
<section><h2>Frame preview</h2><label>PGM image <input id="preview-file" type="file" accept=".pgm,text/plain"></label><p id="dimensions"></p><canvas id="frame" width="1" height="1"></canvas></section>
<section><h2>Capture</h2><label>Capture JSON <input id="capture-file" type="file" accept=".json,application/json"></label><button id="analyze">Analyze capture</button><a id="download" href="/api/report" download="measurement.json">Download report</a><p id="message" role="status"></p><h3 id="verdict"></h3><table><thead><tr><th>Time (ms)</th><th>Phase</th><th>Area (px)</th><th>Center X</th><th>Center Y</th><th>Target error (px)</th></tr></thead><tbody id="measurements"></tbody></table></section>
<script>
const $ = selector => document.querySelector(selector);
async function post(path, body) {const response = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)}); const result = await response.json(); if(!response.ok) throw new Error(result.error); return result;}
async function preview(pgm) {const image = await post('/api/preview', {pgm}); const canvas = $('#frame'); canvas.width=image.width; canvas.height=image.height; canvas.style.width=(image.width*8)+'px';const ctx=canvas.getContext('2d');const data=ctx.createImageData(image.width,image.height);image.pixels.forEach((v,i)=>{data.data.set([v,v,v,255],4*i)});ctx.putImageData(data,0,0);$('#dimensions').textContent=`${image.width} × ${image.height}`;}
function display(report) {$('#verdict').textContent=report.verdict;$('#message').textContent=report.reason;$('#measurements').replaceChildren();for(const row of report.measurements){const tr=document.createElement('tr');for(const key of ['t_ms','phase','area','cx','cy','gaze_error']){const td=document.createElement('td');td.textContent=row[key]??'—';tr.append(td);}$('#measurements').append(tr);}}
$('#preview-file').addEventListener('change',async event=>{try{await preview(await event.target.files[0].text());$('#message').textContent='Preview loaded';}catch(error){$('#message').textContent=error.message;}});
$('#analyze').addEventListener('click',async()=>{try{const file=$('#capture-file').files[0];if(!file) throw new Error('Choose a capture JSON file');const document=JSON.parse(await file.text());const report=await post('/api/analyze',document);display(report);if(document.frames.length) await preview(document.frames[0].pgm);}catch(error){$('#message').textContent=error.message;}});
</script></html>
