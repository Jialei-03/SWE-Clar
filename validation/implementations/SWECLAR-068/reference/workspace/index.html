<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Supplied signal viewer</title><style>*{box-sizing:border-box}body{font:16px system-ui;margin:0;background:#f5f6fa;color:#17243b}main{max-width:900px;margin:auto;padding:20px}textarea{display:block;width:100%;min-height:100px;margin:8px 0;font:14px monospace}button{padding:10px;font:inherit}svg{width:100%;height:230px;background:white}line{stroke-width:3}#menu{padding:12px;background:white;overflow-wrap:anywhere}#error{color:#a11}</style><main><h1>Supplied signal viewer</h1><p>Synthetic observations; no live prices or trade execution.</p><label>Configuration<textarea id="config">{"triggers":{"standard":true,"momentum":false},"tf2_enabled":true,"blackout_enabled":false,"blackout_times":["09:30"]}</textarea></label><label>Context<textarea id="context">{"trigger_states":{"standard":true,"momentum":true},"htf1":"bull","htf2":"bear","time":"09:30"}</textarea></label><label><input id="menu-toggle" type="checkbox" checked>Show information menu</label> <button id="evaluate">Evaluate</button><p id="error" role="alert"></p><svg id="chart" viewBox="0 0 600 230" role="img" aria-label="Synthetic trend display"><line id="htf1" x1="20" y1="160" x2="580" y2="50"/><line id="htf2" x1="20" y1="60" x2="580" y2="160"/><line id="regression" x1="20" y1="130" x2="580" y2="100"/><g id="labels"></g></svg><aside id="menu" hidden></aside></main><script>
const q=s=>document.querySelector(s);q('#evaluate').onclick=async()=>{try{q('#error').textContent='';const config=JSON.parse(q('#config').value),context=JSON.parse(q('#context').value);config.menu_visible=q('#menu-toggle').checked;context.viewport_width=innerWidth;const response=await fetch('/evaluate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({config,context})});if(!response.ok)throw Error('Evaluation unavailable');const result=await response.json();for(const name of ['htf1','htf2','regression'])q('#'+name).style.stroke=result.styles[name];q('#labels').replaceChildren();if(result.labels_visible)result.active_signals.forEach((signal,i)=>{const label=document.createElementNS('http://www.w3.org/2000/svg','text');label.setAttribute('x',20);label.setAttribute('y',20+i*20);label.textContent=signal;q('#labels').append(label)});q('#menu').hidden=!result.menu.visible;q('#menu').textContent='Classification: '+result.classification;q('#menu').dataset.size=result.menu.size;}catch(error){q('#error').textContent=error.message}};
</script></html>
