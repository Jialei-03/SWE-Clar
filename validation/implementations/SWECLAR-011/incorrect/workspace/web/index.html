<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sample document workspace</title><link rel="stylesheet" href="/style.css"></head><body>
<header><h1>Sample document workspace</h1><p>Synthetic profiles · bilingual sample PDFs</p><span id="identity"></span><button id="logout" hidden>Log out</button></header>
<p id="status" role="status" aria-live="polite"></p>
<form id="login"><h2>Sign in</h2><label>Username<input name="username" autocomplete="username" required value="admin-a"></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign in</button><p>Demo users: admin-a, admin-b, editor-a. Password: demo-pass.</p></form>
<main id="workspace" hidden>
<section><h2>Profiles</h2><label for="profilePicker">Saved profile</label><select id="profilePicker"></select><button id="newProfile">New profile</button>
<form id="profileForm"><label>Profile ID<input name="id" required pattern="[a-z][a-z0-9-]{0,39}"></label>
<label>Document identifier<input name="document_id" required></label><label>Full name<input name="name" required></label><label>Group<input name="group" required></label><label>Contact<input name="contact" required></label><label>Reviewer<input name="reviewer" required></label><label>Reference<input name="reference" required></label><button>Save profile</button></form></section>
<section><h2>Generate a sample PDF</h2><form id="renderForm"><label for="control-kind">Document kind</label><select name="kind" id="control-kind"><option value="sample_card">Sample card</option><option value="sample_pass">Sample pass</option></select><label>PDF filename<input name="filename" required value="sample.pdf" pattern="[A-Za-z0-9_-]{1,64}\.pdf"></label><button>Generate PDF</button></form><h3>Saved documents</h3><ul id="documents"></ul></section>
<section><h2>Field settings</h2><p id="revision"></p><form id="styleForm"><label for="control-field">Field</label><select name="field" id="control-field"></select><label>Text color<input name="color" value="#000000"></label><label>Background color (blank for transparent)<input name="background"></label><label>Font size<input name="font_size" type="number" value="10"></label><label for="control-weight">Weight</label><select name="weight" id="control-weight"><option value="normal">Normal</option><option value="bold">Bold</option></select><label><input name="border" type="checkbox"> Border</label><label><input name="visible" type="checkbox" checked> Visible</label><button>Save field settings</button></form></section>
<section><h2>Image library</h2><form id="uploadForm"><label>PNG image<input name="image" type="file" accept="image/png" required></label><button>Upload image</button></form><ul id="assets"></ul>
<form id="placementForm"><label for="control-slot">Image slot</label><select name="slot" id="control-slot"><option value="front_left">Front left</option><option value="front_right">Front right</option><option value="back">Back</option><option value="watermark">Watermark</option></select><label for="control-asset_id">Placed image</label><select name="asset_id" id="control-asset_id"><option value="">No image</option></select><button>Save placement</button></form></section>
<section class="wide"><h2>Audit</h2><button id="refresh">Refresh saved state</button><table><thead><tr><th>Event</th><th>Actor</th><th>Action</th><th>Target</th><th>Revision</th><th>UTC time</th></tr></thead><tbody id="audit"></tbody></table></section>
</main><script src="/ui.js"></script></body></html>
